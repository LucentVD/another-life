function chipsHtml(chips){ return chips.map(c=>`<span class="chip ${c[1]}">${esc(c[0])}</span>`).join(''); }
function mergeChips(chips){
  const sums = new Map(), order=[], other=[];
  for(const [t,cls] of chips){
    let m = t.match(/^([+-]\d+) (.+)$/), key, n, fmtf;
    if(m){ key=m[2]; n=+m[1]; fmtf=(k,v)=>`${v>0?'+':''}${v} ${k}`; }
    else if((m=t.match(/^(.+) ♥([+-]\d+)$/))){ key=m[1]+' ♥'; n=+m[2]; fmtf=(k,v)=>`${k}${v>0?'+':''}${v}`; }
    else if((m=t.match(/^(.+) trust ([+-]\d+)$/))){ key=m[1]+' trust '; n=+m[2]; fmtf=(k,v)=>`${k}${v>0?'+':''}${v}`; }
    if(key!=null){ if(!sums.has(key)){ sums.set(key,{n:0,f:fmtf,cls}); order.push(key); } sums.get(key).n+=n; }
    else if(!other.some(o=>o[0]===t)) other.push([t,cls]);
  }
  const out = order.map(k=>{ const s=sums.get(k); if(!s.n) return null; const cls = s.cls==='heart'||s.cls==='seed' ? (s.n>0?'heart':'down') : (s.n>0?'up':'down'); return [s.f(k,s.n), cls]; }).filter(Boolean);
  return out.concat(other);
}

/* ---------- status bar ---------- */
function bar(){
  const pct = Math.round(100*S.hp/S.maxhp);
  const place = stageOf(S.age)==='child' ? 'Mirebrook' : stageOf(S.age)==='academy' ? 'Royal Academy' : (S.path?PATH_NAME[S.path]:'Asterhold');
  return `<header class="bar">
    <div class="bar-top">
      <div class="face">${headImg(playerArt(S))}</div>
      <div class="who"><b>${esc(S.name)}</b><small>Age ${S.age} · ${place}</small>
        <div class="hp ${pct<35?'low':''}"><span class="hp-k">HP</span><div class="hp-track"><div class="hp-fill" style="width:${pct}%"></div></div><span>${S.hp}/${S.maxhp}</span></div>
      </div>
      <div class="purse"><span class="g">G ${S.gold}</span><span class="f">★ ${S.fame}</span></div>
      <button class="icon-btn" id="open-sheet" aria-label="Open character sheet">≡</button>
    </div>
  </header>`;
}

/* ---------- screens ---------- */
function render(){
  if(UI.screen==='title') return renderTitle();
  if(UI.screen==='create') return renderCreate();
  renderGame();
}
function banner(scene, seed, overlay, chars){
  const cast = chars && chars.length ? `<div class="cast n${chars.length}">${chars.map((c,i)=>sprite(c.spec, c.name, i===0?'speak':'')).join('')}</div>` : '';
  return `<div class="banner">${sceneImg(scene, seed)}${cast}${overlay?`<div class="banner-over">${overlay}</div>`:''}</div>`;
}
function resultBlock(prev){
  if(!prev) return '';
  const r = prev.roll;
  let rollHtml='';
  if(r && r.auto) rollHtml = `<div class="roll"><span class="die ok">✓</span><span>Guaranteed</span></div>`;
  else if(r){
    const parts = r.parts.map(p=>`${p[1]>=0?'+':'−'} ${Math.abs(p[1])} ${esc(p[0])}`).join(' ');
    rollHtml = `<details class="roll"><summary><span class="die ${r.ok?'ok':'no'}">${r.roll}</span><span>${r.ok?'SUCCESS':'FAILED'} · ${r.roll+r.bonus} vs ${r.dc}</span>${r.reroll?`<span class="muted"> · Absurd Luck rerolled a ${r.reroll}</span>`:''}</summary><div class="roll-parts">d20 ${r.roll} ${parts} = ${r.roll+r.bonus}, needed ${r.dc}</div></details>`;
  }
  return `<div class="result ${r? (r.ok?'ok':'no') : ''}">
    <div class="you-chose">${esc(prev.label)}</div>
    ${rollHtml}
    <div class="story">${prose(prev.text)}</div>
    ${prev.chips.length?`<div class="chips">${chipsHtml(prev.chips)}</div>`:''}
  </div>`;
}
function you(){ return [{key:'you', name:S.name, spec:playerArt(S)}]; }
function renderGame(){
  const y = S.year; let body='';
  if(S.ending) body = endingHtml();
  else if(y.phase==='open'){
    const isMain = y.leads.length===1 && ARC[y.leads[0].id].main;
    const scene = isMain ? ARC[y.leads[0].id].scene : stageScene();
    const place = STAGE_PLACE[stageOf(S.age)].replace(/^the /,'The ');
    const over = `<div class="age-box"><span class="age-k">AGE</span><span class="age-num">${S.age}</span></div><div class="age-sub">${STAGE_NAME[stageOf(S.age)]}<br>${place}</div>`;
    body = banner(scene, S.id+S.age, over, you()) + `<section class="win card">
      ${y.down?`<div class="note"><span class="note-k">Since last time</span>${esc(y.down.t)} <span class="chips inline">${chipsHtml(y.down.chips)}</span></div>`:''}
      ${y.news.length?`<ul class="news">${y.news.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
      <h2>${isMain?'This year, the story comes to you.':'What will this year be about?'}</h2>
      <div class="leads">${y.leads.map((L,i)=>leadCard(L,i)).join('')}</div>
    </section>`;
  }
  else if(y.phase==='beat'){
    const a = y.arc, arc = ARC[a.id], b = arc.beats[a.beat];
    const scene = b.scene || arc.scene || stageScene();
    const text = fmt(b.text);
    const chars = presentChars([text], a.cast, a.id);
    const step = a.path.length;
    body = banner(scene, S.id+a.id+a.beat, `<div class="arc-title">${esc(fmt(arc.title))}</div><div class="arc-step">${'■'.repeat(Math.min(step,5))}<span>${'□'.repeat(Math.max(0,4-step))}</span></div>`, chars) + `<section class="win card">
      ${resultBlock(a.prev)}
      ${a.enterChips&&a.enterChips.length?`<div class="chips">${chipsHtml(a.enterChips)}</div>`:''}
      <div class="story main-text">${prose(text)}</div>
      <div class="choices">${choices().map((c,i)=>choiceBtn(c,i)).join('')}</div>
    </section>`;
  }
  else if(y.phase==='done'){
    const a = y.arc, arc = ARC[a.id];
    const dying = S.hp<=0 && !S.finale;
    const chars = a.prev ? presentChars([a.prev.text], a.cast, a.id) : [];
    body = banner(arc.beats[a.beat].scene || arc.scene || stageScene(), S.id+a.id+'end', `<div class="arc-title">${esc(fmt(arc.title))}</div>`, chars) + `<section class="win card">
      ${resultBlock(a.prev)}
      ${dying?'<div class="story"><p>Your vision fades to white.</p></div>':''}
      <button class="btn primary" id="finish-arc">${S.finale||dying?'See how your story ends':'Close the chapter'}</button>
    </section>`;
  }
  else if(y.phase==='yearend'){
    const sum = mergeChips(y.chips.filter(c=>c[1]!=='seed'));
    const planted = y.chips.filter(c=>c[1]==='seed');
    const opts = y.opts.map(id=>DOWNTIME.find(d=>d.id===id)).filter(Boolean);
    body = banner(stageScene(), S.id+S.age+'ye', `<div class="age-box"><span class="age-k">AGE</span><span class="age-num">${S.age}</span></div><div class="age-sub">Year's end<br>${esc(y.arc.title||'')}</div>`, you()) + `<section class="win card">
      <div class="eyebrow">This year</div>
      ${sum.length?`<div class="chips">${chipsHtml(sum)}</div>`:'<div class="muted">A quiet year.</div>'}
      ${planted.length?`<div class="planted"><div class="eyebrow">Threads that will matter later</div>${planted.map(c=>`<div class="thread">${esc(c[0])}</div>`).join('')}</div>`:''}
      <h2>How do you spend the quiet months?</h2>
      <div class="downs">${opts.map(d=>`<button class="down ${d.ctx?'ctx':''}" data-down="${d.id}"><b>${esc(fmt(d.label))}</b><span>${esc(fmt(d.desc))}</span></button>`).join('')}</div>
    </section>`;
  }
  app.innerHTML = bar() + `<main id="main">${body}</main>`;
  const m = document.getElementById('main'); if(m) m.scrollTop = 0;
  bindGame();
}
function leadCard(L,i){
  const arc = ARC[L.id];
  const ctx = {cast:L.cast, vars:{}};
  const tags = [];
  if(arc.main) tags.push(['Main story','main']);
  if(arc.echo) tags.push(['Follow-up','echo']);
  for(const r in L.cast){ const n=S.npcs[L.cast[r]]; if(n && n.met && n.metAge!=null && n.metAge<S.age) tags.push([`${n.name} returns`,'echo']); }
  if(arc.tags) arc.tags(S).forEach(t=>tags.push([t,'']));
  if(arc.dream && arc.dream===S.dream) tags.push(['Your dream','dream']);
  const blurb = fmt(arc.blurb, ctx);
  let who = presentChars([blurb, fmt(arc.title, ctx)], L.cast, arc.id)[0];
  if(!who){ const r0=Object.keys(L.cast||{})[0]; const n=r0&&S.npcs[L.cast[r0]]; if(n && n.met && n.metAge<S.age) who={spec:npcArt(n)}; }
  return `<button class="lead" data-lead="${i}">
    <div class="lead-art">${sceneImg(arc.scene||stageScene(), S.id+arc.id, 'crop')}${who?`<img class="lead-who" alt="" src="${PX.portrait(who.spec)}">`:''}</div>
    <div class="lead-body"><b>${esc(fmt(arc.title, ctx))}</b><span>${blurb}</span>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag ${t[1]}">${esc(t[0])}</span>`).join('')}</div>`:''}</div>
  </button>`;
}
function choiceBtn(c,i){
  const st = choiceState(c);
  const special = !!c.show;
  let sub='';
  if(st.check){
    if(st.check.auto) sub = `<span class="pill sure">GUARANTEED</span>`;
    else { const [cls,word]=st.check.diff; const sname = st.check.stat==='combat'?'Combat':STATS[st.check.stat].name; sub = `<span class="ck">${st.check.stat==='combat'?'⚔':STATS[st.check.stat].ic} ${sname}</span><span class="pill ${cls}">${word.toUpperCase()}${S.cheat==='appraise'?' '+Math.round(st.check.p*100)+'%':''}</span>`; }
  }
  if(st.blocked) sub = `<span class="ck">${esc(c.reqText||'Not possible')}</span>`;
  if(special) sub = `<span class="pill special">✧ YOUR STORY</span>` + sub;
  return `<button class="choice ${special?'special':''}" data-choice="${i}" ${st.blocked?'disabled':''}>
    <span class="cursor">▶</span>
    <span class="choice-body"><span class="lbl">${esc(fmt(c.label))}</span>${sub?`<span class="sub">${sub}</span>`:''}</span>
  </button>`;
}
function endingHtml(){
  const e = S.ending;
  const highlights = S.log.filter(l=>l.age>0).slice(-8);
  const t = topComp();
  const chars = you().concat(t && rel(t)>=5 ? [{key:t, name:COMP[t].name, spec:CHAR_ART[t]}] : []).concat(e.kind==='peace'?[{key:'mal',name:'Mal',spec:CHAR_ART.mal}]:[]);
  return banner(e.kind==='peace'?'shrine':e.kind==='death'||e.kind==='fallen'?'office':e.kind==='stayed'?'cafe':'north', S.id+'end', `<div class="arc-title">The End</div>`, chars) + `<section class="win card">
    <div class="eyebrow">${esc(S.name)} · age ${S.age}</div>
    <h2 class="ending-title">${esc(e.title)}</h2>
    <div class="story">${prose(e.body)}</div>
    ${e.lines.length?`<div class="story epilogue">${e.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}
    <div class="rank-row"><div class="rank-box"><span class="muted small">RANK</span><span class="rank">${e.rank}</span></div><div class="muted small">Score ${e.score}<br>Fame ${S.fame} · ${S.gold} gold<br>${people().length} people met</div></div>
    ${highlights.length?`<div class="eyebrow">A life in moments</div><div class="timeline">${highlights.map(l=>`<div><b>${l.age}</b><span>${esc(l.t)}</span></div>`).join('')}</div>`:''}
    <button class="btn primary" id="again">Begin another life</button>
    <button class="btn ghost" id="to-title">Back to title</button>
  </section>`;
}
function bindGame(){
  app.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{ chooseLead(+b.dataset.lead); render(); });
  app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{ choose(+b.dataset.choice); render(); });
  app.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{ chooseDowntime(b.dataset.down); render(); });
  const f=document.getElementById('finish-arc'); if(f) f.onclick=()=>{ finishArc(); render(); };
  const s=document.getElementById('open-sheet'); if(s) s.onclick=openSheet;
  const a=document.getElementById('again'); if(a) a.onclick=()=>{ S=null; save(); startCreate(); };
  const t=document.getElementById('to-title'); if(t) t.onclick=()=>{ S=null; save(); UI.screen='title'; render(); };
}

/* ---------- creation ---------- */
function startCreate(){ UI.screen='create'; UI.create={step:0, name:'', death:null, race:null, look:Object.assign({},DEFAULT_LOOK), job:null, cheat:null}; render(); }
function previewSpec(c, age){ return playerArt({look:c.look, race:c.race||'human', path:null, age:age||16}, age||16); }
function renderCreate(){
  const c = UI.create, n=6;
  const dots = `<div class="steps">${Array.from({length:n},(_,i)=>`<span class="${i<=c.step?'on':''}"></span>`).join('')}</div>`;
  const fxText = fx => Object.entries(fx).map(([k,v])=> STATS[k] ? `${v>0?'+':''}${v} ${STATS[k].short}` : k==='maxhp' ? `+${v} Max HP` : '').filter(Boolean).join(' · ');
  const list = (obj, key, extra) => `<div class="opt-list">${Object.entries(obj).map(([k,o])=>`
      <button class="opt ${c[key]===k?'sel':''}" data-pick="${key}:${k}"><b>${o.name}</b><span>${o.desc}</span><i>${extra?extra(o):fxText(o.fx)}</i></button>`).join('')}</div>`;
  const lines = [
    `"Hiii! Welcome to the afterlife. I'm Lumi, goddess of reincarnation. So sorry about all this. Let's start your file. How did you die?"`,
    `"Oof. Okay! Good news: you're approved for reincarnation in the world of Valtheria. What will they call you there?"`,
    `"Lovely name. What do you want to be born as?"`,
    `"Ooh, and you get to pick your look! I'm very good at faces. Mostly."`,
    `"And this was your old life, right? You'll remember it. It might come in handy."`,
    `"Last thing! Everyone from your world gets one cheat skill. It's in the rules. I think. Pick one."`
  ];
  let inner = `<div class="dialog"><div class="dialog-face">${headImg(CHAR_ART.lumi)}</div><div><div class="dialog-name">LUMI</div>${prose(lines[c.step])}</div></div>`;
  if(c.step===0) inner += list(DEATHS,'death');
  if(c.step===1) inner += `<div class="field"><label class="sr" for="name">Your new name</label><input id="name" maxlength="16" placeholder="Your new name" value="${esc(c.name)}" autocomplete="off"><button class="btn ghost" id="rand" style="flex:none">Random</button></div>`;
  if(c.step===2) inner += list(RACES,'race', o=>fxText(o.fx)+` · ${o.hp} HP`);
  if(c.step===3){
    const L=c.look;
    inner += `<div class="looker">
      <div class="preview">${sprite(previewSpec(c,7),'Age 7','small')}${sprite(previewSpec(c,16),'Age 16','big')}</div>
      <div class="look-row"><div class="look-k">Hairstyle</div><div class="seg">${Object.entries(LOOK_STYLES).map(([k,v])=>`<button class="segb ${L.style===k?'on':''}" data-look="style:${k}">${v}</button>`).join('')}</div></div>
      <div class="look-row"><div class="look-k">Hair</div><div class="sw">${LOOK_HAIR.map(k=>`<button class="swb ${L.hair===k?'on':''}" data-look="hair:${k}" style="--c:${PX.HAIR[k][1]}" aria-label="${k} hair"></button>`).join('')}</div></div>
      <div class="look-row"><div class="look-k">Eyes${c.race==='demon'?' <span class="muted">(red for half-demons)</span>':''}</div><div class="sw">${LOOK_EYES.map(k=>`<button class="swb ${L.eye===k?'on':''}" data-look="eye:${k}" style="--c:${PX.EYES[k][1]}" aria-label="${k} eyes"></button>`).join('')}</div></div>
      <div class="look-row"><div class="look-k">Skin</div><div class="sw">${PX.SKIN.map((k,i)=>`<button class="swb ${L.skin===i?'on':''}" data-look="skin:${i}" style="--c:${k[1]}" aria-label="skin tone ${i+1}"></button>`).join('')}</div></div>
      <button class="btn ghost" id="shuffle">Surprise me</button>
    </div>`;
  }
  if(c.step===4) inner += list(JOBS,'job');
  if(c.step===5) inner += list(CHEATS,'cheat', o=>o.perk);
  const ready = ()=>[c.death, c.name.trim(), c.race, true, c.job, c.cheat][c.step];
  app.innerHTML = `<main>${banner('office','create', `<div class="arc-title">The White Office</div>`, [{spec:CHAR_ART.lumi, name:'Goddess Lumi'}])}<section class="win card">
    ${dots}${inner}
    <div class="row">
      <button class="btn ghost" id="back">${c.step===0?'Cancel':'Back'}</button>
      <button class="btn primary" id="next" ${ready()?'':'disabled'}>${c.step===n-1?'Be reborn':'Next ▶'}</button>
    </div>
  </section></main>`;
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.pick.split(':'); c[k]=v; renderCreate(); });
  app.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.look.split(':'); c.look[k]= k==='skin'?+v:v; const y=document.getElementById('main')?0:window.scrollY; renderCreate(); });
  const sh=document.getElementById('shuffle'); if(sh) sh.onclick=()=>{ c.look={style:pick(Object.keys(LOOK_STYLES)), hair:pick(LOOK_HAIR), eye:pick(LOOK_EYES), skin:Math.floor(Math.random()*PX.SKIN.length)}; renderCreate(); };
  const nm = document.getElementById('name');
  if(nm){ nm.oninput=()=>{ c.name=nm.value; document.getElementById('next').disabled=!c.name.trim(); };
          nm.onkeydown=e=>{ if(e.key==='Enter' && c.name.trim()){ c.step++; renderCreate(); } }; }
  const rd = document.getElementById('rand'); if(rd) rd.onclick=()=>{ c.name = pick(PLAYER_NAMES); renderCreate(); };
  document.getElementById('back').onclick=()=>{ if(c.step===0){ UI.screen='title'; render(); } else { c.step--; renderCreate(); } };
  document.getElementById('next').onclick=()=>{
    if(!ready()) return;
    if(c.step<n-1){ c.step++; renderCreate(); }
    else { UI.screen='game'; newLife({name:c.name.trim().slice(0,16), death:c.death, race:c.race, job:c.job, cheat:c.cheat, look:c.look}); render(); }
  };
}

      const mood = n.att>=4?'Devoted':n.att>=2?'Friendly':n.att>=0?'Neutral':n.att>=-2?'Wary':'Hostile';
      const cls = n.att>=2?'good':n.att<=-2?'bad':'';
      return `<div class="person">${headImg(npcArt(n))}<div class="p-main"><b>${esc(n.name)} ${esc(n.sur)}</b><span>${esc(TRAITS[n.trait].adj)} ${esc(NPC_ROLES[n.role]||n.role)} · met at ${n.metAge}</span></div><span class="mood ${cls}">${mood}</span></div>`; }).join('');
    content = `<div class="eyebrow">Companions</div>${comps||'<div class="muted small">Nobody close yet.</div>'}<div class="eyebrow">People you've met</div>${ppl||'<div class="muted small">Nobody yet.</div>'}`;
  }
  if(UI.tab==='story'){
    const threads = S.seeds.filter(x=>!x.npc || (S.npcs[x.npc]&&S.npcs[x.npc].alive!==false)).map(x=>`<div class="thread">${esc(seedLabel(x))}</div>`).join('');
    const flags = Object.keys(S.flags).filter(f=>FLAG_NAMES[f]).map(f=>`<span class="chip seed">${FLAG_NAMES[f]}</span>`).join('');
    const log = S.log.slice().reverse().map(l=>`<div><b>${l.age||'—'}</b><span>${esc(l.t)}</span></div>`).join('');
    content = `${threads?`<div class="eyebrow">Open threads</div><div class="planted">${threads}</div>`:''}${flags?`<div class="eyebrow">Along the way</div><div class="chips">${flags}</div>`:''}<div class="eyebrow">Chronicle</div><div class="timeline">${log}</div>`;
  }
  overlay(`
    <div class="sheet-head"><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" class="${UI.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><button class="icon-btn x" data-close aria-label="Close">✕</button></div>
    ${content}
    <button class="btn ghost" id="quit">Save and return to title</button>
  `);
  oroot.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ UI.tab=b.dataset.tab; openSheet(); });
  document.getElementById('quit').onclick=()=>{ closeOverlay(); UI.screen='title'; render(); };
}
function openHall(){
  const items = HALL.map(h=>`<div class="hall-item"><div><b>${esc(h.title)}</b><span>${esc(h.name)} · ${esc(h.race)} · ${esc(h.cheat)} · age ${h.age}</span></div><span class="r">${h.rank}</span></div>`).join('');
  overlay(`<div class="sheet-head"><h3>Past lives</h3><button class="icon-btn x" data-close aria-label="Close">✕</button></div>${items}`);
}
function confirmBox(title, msg, yes, fn){
  overlay(`<h3>${title}</h3><div class="muted">${msg}</div><div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="yes">${yes}</button></div>`);
  document.getElementById('yes').onclick=()=>{ closeOverlay(); fn(); };
}

/* ---------- saving: this browser, plus the account when available ---------- */
let cloudRef=null, cloudState='off', writeTimer=null, writing=false, writeAgain=false;
function cloudMsg(){ return cloudState==='on' ? 'Progress saves to your account.' : 'Progress saves on this device.'; }
function save(){
  if(S) S.ts = Date.now();
  try{ localStorage.setItem(SAVE_KEY, S?JSON.stringify(S):''); localStorage.setItem(HALL_KEY, JSON.stringify(HALL)); }catch(e){}
  if(cloudRef){ clearTimeout(writeTimer); writeTimer=setTimeout(writeCloud, 900); }
}
HOOKS.save = save;
function load(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s){ S=JSON.parse(s); if(!S||S.v!==2) S=null; } }catch(e){ S=null; }
  try{ const h=localStorage.getItem(HALL_KEY); if(h) HALL=JSON.parse(h)||[]; }catch(e){ HALL=[]; }
}
async function writeCloud(){
  if(!cloudRef) return;
  if(writing){ writeAgain=true; return; }
  writing=true;
  try{ await cloudRef.set({saveJson2: S?JSON.stringify(S):'', hallJson: JSON.stringify(HALL), ts: Date.now()}); }catch(e){}
  writing=false;
  if(writeAgain){ writeAgain=false; writeCloud(); }
}
async function initCloud(){
  try{
    let tries=0;
    while(!(window.claude && window.claude.use) && tries<20){ await new Promise(r=>setTimeout(r,150)); tries++; }
    if(!(window.claude && window.claude.use)) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.collection('data/users/'+id).doc('anotherlife');
    let d = await Promise.race([ref.get(), new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
    if(d==='timeout') return;
    if(d && typeof d.data==='function') d = d.data();
    else if(d && d.data && typeof d.data==='object' && !('hallJson' in d)) d = d.data;
    cloudRef = ref; cloudState='on';
    if(d && d.hallJson){ try{ const ch=JSON.parse(d.hallJson)||[]; const ids=new Set(HALL.map(h=>h.id+':'+h.when)); ch.forEach(h=>{ if(!ids.has(h.id+':'+h.when)) HALL.push(h); }); HALL.sort((a,b)=>b.when-a.when); HALL=HALL.slice(0,30); }catch(e){} }
    if(d && d.saveJson2 && UI.screen==='title'){ try{ const cs=JSON.parse(d.saveJson2); if(cs && cs.v===2 && (!S || (cs.ts||0)>(S.ts||0))) S=cs; }catch(e){} }
    if(UI.screen==='title') render();
    save();
  }catch(e){}
}

/* ---------- background: pixel stars and petals ---------- */
(function sky(){
  const cv=document.getElementById('sky'), cx=cv.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P=3; let w,h,stars=[],petals=[];
  function size(){ w=Math.ceil(cv.clientWidth/P); h=Math.ceil(cv.clientHeight/P); cv.width=w; cv.height=h;
    stars=Array.from({length:Math.round(w*h/220)},()=>({x:Math.floor(Math.random()*w),y:Math.floor(Math.random()*h),p:Math.random()*6.28,b:Math.random()<.2}));
    petals=Array.from({length:8},()=>np(true)); }
  function np(any){ return {x:Math.random()*w, y:any?Math.random()*h:-2, vx:Math.random()*.12+.04, vy:Math.random()*.15+.1, t:Math.random()*6}; }
  function draw(t){
    cx.clearRect(0,0,w,h);
    for(const s of stars){ const a=.3+.6*Math.abs(Math.sin(s.p+t/1400)); cx.fillStyle=`rgba(220,226,255,${a.toFixed(2)})`; cx.fillRect(s.x,s.y,1,1); if(s.b && a>.8){ cx.fillRect(s.x-1,s.y,1,1); cx.fillRect(s.x+1,s.y,1,1); cx.fillRect(s.x,s.y-1,1,1); cx.fillRect(s.x,s.y+1,1,1); } }
    for(const p of petals){ if(!reduce){ p.x+=p.vx; p.y+=p.vy; p.t+=.05; } if(p.y>h+2||p.x>w+2) Object.assign(p,np(false)); cx.fillStyle='#ff9fbf'; cx.fillRect(Math.floor(p.x),Math.floor(p.y),1,1); if(Math.sin(p.t)>0){ cx.fillStyle='#ffc8da'; cx.fillRect(Math.floor(p.x)+1,Math.floor(p.y),1,1); } }
    if(!reduce && !document.hidden) setTimeout(()=>requestAnimationFrame(draw), 60);
  }
  window.addEventListener('resize', ()=>{ size(); if(reduce) draw(0); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !reduce) requestAnimationFrame(draw); });
  size(); requestAnimationFrame(draw);
})();
let resizeT=null, lastW=0; window.addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ const w=sceneW(); if(w!==lastW && !oroot.innerHTML && !(document.activeElement && document.activeElement.tagName==='INPUT')){ lastW=w; render(); } }, 250); });

/* ---------- boot ---------- */
indexArcs();
load();
if(S && S.ending) S=null;
lastW=sceneW();
render();
initCloud();

</script>
