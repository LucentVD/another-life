        {label:`Close the book. It's hers to tell.`, t:`You close it gently and leave a sweet on top. Some things should be given, not taken. When she wakes she notices, and looks at you differently after that.`, fx:{rel:{nimue:2}, cha:1}}
      ]}
  }
});

/* ---------------------------------------------------------
   a_library — the Forbidden Section
   --------------------------------------------------------- */
ARCS.push({
  id:'a_library', stage:'academy', title:'The Forbidden Section', scene:'library', dream:'mage',
  blurb:`The Forbidden Section is behind a chained door on the library's top floor. The chain, you notice, is much newer than the door.`,
  cast:{ k:{role:'scholar'} },
  start:'a',
  beats:{
    a:{ scene:'library', text:`Midnight. The Royal Library is all moonlight and dust. On the top floor, behind a velvet rope, two signs, and a chain as thick as your wrist, is the Forbidden Section.\n\nEvery student knows the rumor: the old war records are in there. The real ones.\n\nThe chain is shiny. Someone put it there recently.`,
      choices:[
        {label:`Pick the lock with a hairpin.`, check:{stat:'wit', dc:14},
          win:{t:`Click. Every heist movie you watched in your last life finally pays off.`, fx:{wit:1}, go:'stacks'},
          lose:{t:`The lock clicks, and so does a ward. Somewhere below, a bell rings.`, fx:{set:{alarm:true}}, go:'keeper'}},
        {label:`Find the night archivist. Ask nicely.`, t:`You find the night archivist reading by a single candle in the stacks below.`, go:'keeper'},
        {label:`Borrow Nimue's master key while she naps.`, show:s=>met('nimue'),
          t:`Nimue is asleep in the staff lounge, key ring on her belt. You ease it free. As you tiptoe out, she says, eyes closed, "Third shelf. Bring it back."`, fx:{rel:{nimue:1}, luck:1}, go:'stacks'},
        {label:`Appraise the ward on the chain.`, show:s=>s.cheat==='appraise',
          t:`[Ward of Alarm · Lv 4 · Weak point: third link.] You tap the third link. The ward sighs and goes to sleep.`, fx:{wit:1}, go:'stacks'}
      ]},
    keeper:{ scene:'library', text:(s,v)=> `{k}, the night archivist, is {k.look} and {k.trait}, and has worked here for thirty years. {k.He} raises a lantern and looks at you, then at the chain.\n\n`
      + (v.alarm ? `"Students," {k.he} sighs. "Always at midnight. Always that door."` : `"The Forbidden Section," {k.he} repeats slowly. "And why would a first-year want in there?"`),
      choices:[
        {label:`Talk your way in.`, check:{stat:'cha', dc:14, npc:'k'},
          win:{t:`{k} is quiet, then unlocks the chain. "Thirty years I've waited for a student who wanted the real history. Don't make me regret it."`, fx:{cha:1, npc:{k:2}}, go:'stacks'},
          lose:{t:`Detention, and a forty-gold fine for the ward. Three nights later you try again, alone, through a window. It works.`, fx:{gold:-40, npc:{k:-1}, luck:1}, go:'stacks'}},
        {label:`"I want the real war records."`, t:`{k}'s face changes. {k.He} glances at the stairwell and lowers {k.his} voice. "Pages have been going missing. Whole ledgers. Men in grey robes, with a royal writ." {k.He} unlocks the chain. "Look at the war requisitions. Quickly."`, fx:{npc:{k:2}, set:{tip:true}}, go:'stacks'},
        {label:`Run for the stairs.`, check:{stat:'luck', dc:13},
          win:{t:`You vanish into the stacks. {k} sighs and goes back to {k.his} book, possibly on purpose.`, fx:{luck:1}, go:'stacks'},
          lose:{t:`You slip and slide down two flights on your back. You sneak back in later, bruised, through a window.`, fx:{hp:-6}, go:'stacks'}}
      ]},
    stacks:{ scene:'library', text:`The Forbidden Section smells of old leather and something like smoke. In a locked case lies a plain brown journal: *Personal account of Aldren, the First Hero.*\n\nMost of its pages are torn out. One remains, about the last day of the war:\n\n*He did not want to fight. He kept his hands open until the end. We never asked why.*`,
      choices:[
        {label:`Read every surviving page.`, check:{stat:'wit', dc:13},
          win:{t:`Between the tears you piece it together. The hero met the Demon Lord three times before the last battle, and each time the Demon Lord asked for the same thing. Grain.`, fx:{wit:2, flag:'lore'}, log:'Read the First Hero\'s journal in the Forbidden Section.', go:'out'},
          lose:{t:`The ink has faded to ghosts. You catch only one word, over and over: *winter*.`, fx:{wit:1}, go:'out'}},
        {label:`Study the torn edges.`, check:{stat:'wit', dc:14, job:{office:3}},
          win:{t:`The tears are clean and recent. Tucked into the spine is a slip: *Removed by order of the Sun.* Below, stamped in black wax, a sun that gives no light.`, fx:{wit:1, seed:'clue', set:{clue:true}}, log:'Found a Black Sun seal in the Forbidden Section.', go:'out'},
          lose:{t:`Old paper, old glue, old dust. You sneeze, loudly, three times.`, fx:{luck:1}, go:'out'}},
        {label:`Check the war requisitions, like {k} said.`, show:(s,v)=>!!v.tip,
          t:`The ledger for the last year of the war is gone. In its place is a receipt sealed in black wax: a sun that gives no light. Somebody is curating history.`, fx:{wit:1, seed:'clue', set:{clue:true}}, log:'Found a Black Sun seal in the Forbidden Section.', go:'out'}
      ]},
    out:{ scene:'library', text:`The door below creaks. Footsteps on the stairs, slow and unhurried. You kill your lantern.\n\nA figure in a grey robe enters with an empty satchel, walks straight to the case you just opened, and stops.\n\n"I know someone is here," it says pleasantly.`,
      choices:[
        {label:`Hold your breath. Watch.`, check:{stat:'luck', dc:14},
          win:{t:`The figure sweeps the journal into its satchel. As it turns, a sleeve rides up: a black sun, tattooed on the wrist. You stay in the dark long after it's gone.`, fx:(s,v)=> v.clue ? {luck:1, wit:1} : {luck:1, seed:'clue'}, log:'Saw a Black Sun tattoo on a thief of history.'},
          lose:{t:`A cold light finds you. One whispered word and your chest locks tight as a fist. By the time you can breathe, the figure and the journal are gone.`, fx:{hp:-8}}},
        {label:`Jump it.`, check:{stat:'combat', dc:15},
          win:{t:`You crash into the figure. It flees, robe torn, leaving behind a signet ring stamped with a black sun.`, fx:(s,v)=> v.clue ? {str:1, fame:1} : {str:1, fame:1, seed:'clue'}, log:'Fought off a Black Sun agent in the library.'},
          lose:{t:`It moves like smoke. Something hits your chest like a cart, and you wake on the floor at dawn. The journal is gone.`, fx:{hp:-11, str:1}}},
        {label:`Slip out the window, journal and all.`, t:`You climb out with the First Hero's journal under your shirt and read it cover to cover by candlelight. On the last surviving page, in a shaking hand: *Grain. He only asked for grain.*`, fx:{luck:1, flag:'lore'}, log:'Smuggled the First Hero\'s journal out of the library.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_dungeon — first-year practicum
   --------------------------------------------------------- */
ARCS.push({
  id:'a_dungeon', stage:'academy', title:'The Wall That Wasn\'t There', scene:'dungeon', dream:'hero',
  blurb:`The first-year dungeon practicum is famously safe. Three floors, slimes, a teacher on every stairwell. Famously.`,
  cast:{ p:{role:'student'} },
  start:'a',
  beats:{
    a:{ scene:'dungeon', text:`Floor two of the training dungeon. Your party: you, {p} (a {p.trait} classmate {p.look}), and a crowd of nervous first-years. Eleven slimes down. Morale is high.\n\nThen the north wall cracks: a wall that, according to the map, doesn't exist. It bulges, splits, and a Minotaur steps through, eight feet of bull and axe, snorting steam.\n\nSomebody screams. {p} freezes.`,
      choices:[
        {label:`Draw your weapon. Hold the line.`, t:`You step in front of the first-years. Your knees are shaking. Your hands, oddly, are not.`, go:'fight'},
        {label:`"Everyone, back to the stairs!"`, t:`Your voice comes out louder than you knew it could.`, go:'lead'},
        {label:`"That's a boss room. Find the side passage."`, show:s=>s.job==='gamer',
          t:`Ten thousand hours of dungeon crawlers scream at you: a wall that isn't on the map *always* hides a secret door. You find the seam in seconds.`, fx:{wit:1}, go:'passage'},
        {label:`Look at where it came from.`, check:{stat:'wit', dc:13},
          win:{t:`The edges of the hole are too smooth. Somebody *cut* this wall and hid it with an illusion. There's a corridor behind.`, fx:{wit:1}, go:'passage'},
          lose:{t:`You squint at the wall. The Minotaur squints at you. It charges.`, fx:{hp:-6}, go:'fight'}}
      ]},
    fight:{ scene:'dungeon', text:`The Minotaur lowers its horns. Up close, it's all wrong: its eyes glow a dull red, and there's a black brand on its shoulder that no wild monster should have.\n\nBehind you, first-years are scrambling for the stairs. Somebody has to buy them time.`,
      choices:[
        {label:`Meet the charge head-on.`, check:{stat:'combat', dc:16},
          win:{t:`You step inside the swing and strike right at the brand. It drops to one knee, and the whole floor cheers.`, fx:{str:2, fame:2}, log:'Brought down a Minotaur in the first-year practicum.', go:'aftermath'},
          lose:{t:`The axe handle catches you across the chest. You hit the wall hard enough to see Lumi waving.`, fx:{hp:-12, str:1}, go:'aftermath'}},
        {label:`Dodge, and aim for the eyes.`, check:{stat:'combat', dc:14},
          win:{t:`It's ugly, and slow, and you don't stop moving. Eventually it stops instead.`, fx:{str:1, luck:1, fame:1}, go:'aftermath'},
          lose:{t:`It's faster than it looks. You take a horn to the shoulder before the teachers finally arrive.`, fx:{hp:-9, str:1}, go:'aftermath'}},
        {label:`"Seraphine, its legs!"`, show:s=>met('sera'),
          t:`Seraphine, from the next party over, is already casting. Ice locks its hooves and your strike lands. "Don't thank me," she snaps. You hadn't.`, fx:{mag:1, rel:{sera:2}}, go:'aftermath'},
        {label:`"Rook, the horns!"`, show:s=>met('rook'),
          t:`Rook catches the horns in both hands and *holds*, boots grinding back across the stone. You finish it. Rook's paws are bleeding. He's grinning.`, fx:{str:1, rel:{rook:2}}, go:'aftermath'},
        {label:`Tamer: lower your weapon. Talk.`, show:s=>s.cheat==='tamer', check:{stat:'cha', dc:13},
          win:{t:`You hold out a hand. The red fades from its eyes. Under the brand, it was terrified. It lies down like a giant, sad cow.`, fx:{luck:2, set:{tamed:true}}, go:'aftermath'},
          lose:{t:`Whatever is in its head is too loud to hear you through. You dive aside just in time. Mostly.`, fx:{hp:-8, cha:1}, go:'aftermath'}}
      ]},
    lead:{ scene:'dungeon', text:`The stairwell is one narrow door and thirty panicking first-years. Someone has already tripped.\n\n{p} is still frozen in the middle of the room, staring at the Minotaur, which is staring back.\n\nYou have maybe ten seconds.`,
      choices:[
        {label:`"Single file! Smallest first! MOVE!"`, check:{stat:'cha', dc:13},
          win:{t:`Your voice cracks like a sergeant's and they move. You grab {p} by the collar on your way past.`, fx:{cha:2, fame:1, npc:{p:2}, seed:{k:'owed', npc:'p'}}, log:'Led the first-years out when a Minotaur broke loose.', go:'aftermath'},
          lose:{t:`Nobody listens until you start shoving. Everyone gets out, but the axe opens your shoulder on the way.`, fx:{cha:1, hp:-7}, go:'aftermath'}},
        {label:`Sprint back and carry {p} out.`, check:{stat:'str', dc:13, npc:'p'},
          win:{t:`You throw {p} over your shoulder and run. The axe bites the doorframe a hand's width behind you.`, fx:{str:1, npc:{p:3}, seed:{k:'owed', npc:'p'}}, log:'Carried {p} out of the practicum dungeon.', go:'aftermath'},
          lose:{t:`{p} is heavier than {p.he} looks. You make it, barely, with a gash down your back.`, fx:{hp:-9, npc:{p:2}, seed:{k:'owed', npc:'p'}}, go:'aftermath'}},
        {label:`Nurse: triage at the stairwell.`, show:s=>s.job==='nurse',
          t:`Airway, bleeding, panic, in that order. You sort thirty kids in ninety seconds. Someone calls you "Medic" for the next four years.`, fx:{wit:2, npc:{p:2}, seed:{k:'owed', npc:'p'}}, go:'aftermath'}
      ]},
    passage:{ scene:'ruins', text:`Behind the illusion is a corridor cut so recently the dust hasn't settled. At its end, a summoning circle still smoulders on the floor, drawn in something dark. Around it, painted with great care: a black sun.\n\nSomebody summoned that Minotaur. Into a dungeon full of children.`,
      choices:[
        {label:`Break the circle before it makes more.`, check:{stat:'mag', dc:14},
          win:{t:`You drive your mana into the lines and they shatter like glass. Out in the hall, the Minotaur bellows and dissolves into smoke.`, fx:{mag:2, fame:1, seed:'clue'}, log:'Broke a Black Sun summoning circle under the academy.', go:'aftermath'},
          lose:{t:`The circle bites back, pain lancing up your arm. A moment later the lines fade on their own, as if someone far away let go.`, fx:{hp:-9, mag:1}, go:'aftermath'}},
        {label:`Copy the sigil into your notebook.`, t:`Every line, every symbol. Your hands are steady. You're not sure they should be.`, fx:{wit:1, seed:'clue'}, log:'Copied a Black Sun sigil in the practicum dungeon.', go:'aftermath'},
        {label:`Follow the fresh footprints.`, check:{stat:'wit', dc:15},
          win:{t:`The prints lead to a ladder and a grey robe disappearing up it. You grab the hem and it tears. A scrap of grey cloth, stitched with a black sun.`, fx:{wit:2, seed:'clue'}, go:'aftermath'},
          lose:{t:`The prints end at a blank wall that bites you with a ward. When you get back, the circle has been scrubbed away.`, fx:{hp:-5, wit:1}, go:'aftermath'}}
      ]},
    aftermath:{ scene:'academy', text:`The teachers arrive ten minutes late, out of breath. By evening the official notice is posted: *a structural anomaly, now resolved. The practicum will resume next week.*\n\nNobody mentions the brand on the Minotaur. Nobody mentions the wall that wasn't on the map.\n\n{p} finds you in the hall afterward, still shaking.`,
      choices:[
        {label:`Demand an investigation.`, check:{stat:'cha', dc:15},
          win:{t:`The headmaster listens, actually listens, and the practicum dungeon is sealed pending inquiry. Half the school knows your name by morning.`, fx:{cha:1, fame:2}},
          lose:{t:`You are thanked for your "vivid imagination" and handed a pamphlet on stress.`, fx:{wit:1}}},
        {label:`Keep quiet. Keep notes.`, t:`You write everything down that night and hide the notebook under a floorboard. If someone wants this hushed up, you want to know who.`, fx:{wit:2}},
        {label:`Sit with {p} until the shaking stops.`, t:`You don't say much. You don't have to. Eventually {p} laughs, shakily, about the slimes.`, fx:{cha:1, npc:{p:2}}, log:'Sat with {p} after the Minotaur attack.'},
        {label:`"Can I keep the Minotaur?"`, show:(s,v)=>!!v.tamed,
          t:`No. It goes to the royal menagerie, where it reportedly asks for you. You visit on weekends.`, fx:{luck:1, fame:1}}
      ]}
  }
});

/* ---------------------------------------------------------
   a_festival — the school festival
   --------------------------------------------------------- */
ARCS.push({
  id:'a_festival', stage:'academy', title:'Festival of Lanterns', scene:'academy', dream:'rich',
  blurb:`The Academy Festival is in two weeks, and your class still has no booth. Your class has never agreed on anything.`,
  cast:{ g:{role:'noble'} },
  start:'a',
  beats:{
    a:{ scene:'academy', text:`Homeroom, festival planning, minute forty. On the board: MAID CAFÉ (twelve votes), MAGIC FIREWORKS (twelve votes), HAUNTED HOUSE (twelve votes), and one vote for "nap room" that nobody will admit to.\n\nEveryone turns to look at you. You have the deciding vote.`,
      choices:[
        {label:`Maid café. For culture.`, t:`Half the class cheers. The other half is already arguing about aprons.`, go:'cafe'},
        {label:`Magic fireworks. For glory.`, t:`The class mage club stands up as one and bows to you.`, go:'fireworks'},
        {label:`Haunted house. For screaming.`, t:`Someone immediately volunteers to be "the creepy doll." Nobody asks why they own one.`, go:'haunt'},
        {label:`A food stall. Trust me.`, show:s=>s.cheat==='cook'||s.job==='chef',
          t:`You describe the menu. Three people cry. It passes unanimously.`, fx:{cha:1, set:{food:true}}, go:'cafe'}
      ]},
    cafe:{ scene:'cafe', text:(s,v)=> (v.food
      ? `Festival day. Your classroom is a food stall with a hand-painted sign and a smell that pulls people up three flights of stairs.`
      : `Festival day. Your classroom is now a café with lace curtains, mismatched teacups, and a sign: WELCOME HOME, MASTER.`)
      + (met('rook') ? ` Rook is in an apron, because he lost a bet. He looks like a wardrobe someone dressed up. Customers adore him.` : ``)
      + (met('sera') ? ` Seraphine has refused to wear the uniform four times.` : ``)
      + `\n\nThe line goes out the door and down the stairs.`,
      choices:[
        {label:`Work the floor. Maximum charm.`, check:{stat:'cha', dc:14},
          win:{t:`You smile until your face hurts and draw hearts in so much omelet ketchup your wrist cramps. Tips pour in.`, fx:{cha:2, gold:60}, go:'judge'},
          lose:{t:`You say "Welcome home, Master" to the headmaster. He tips you anyway, out of pity.`, fx:{cha:1, gold:20}, go:'judge'}},
        {label:`Run the kitchen.`, check:{stat:'wit', dc:13, job:{chef:4}, cheat:{cook:6}},
          win:{t:`Orders fly, plates fly, nothing burns. By noon you've sold out twice.`, fx:{wit:1, gold:70}, go:'judge'},
          lose:{t:`The stove catches fire once. Only once. You're calling that a win.`, fx:{hp:-5, gold:25, wit:1}, go:'judge'}},
        {label:`Talk Seraphine into the uniform.`, show:s=>met('sera'), check:{stat:'cha', dc:15},
          win:{t:`"It's not like I *want* to," she says, in the uniform, serving tea with lethal grace. Your booth becomes the talk of the festival.`, fx:{rel:{sera:2}, gold:50, fame:1}, go:'judge'},
          lose:{t:`She freezes the uniform to its hanger. An hour later she quietly wears it anyway and pretends you had nothing to do with it.`, fx:{rel:{sera:1}, gold:30}, go:'judge'}}
      ]},
    fireworks:{ scene:'night', text:`Your class's show is at sunset, from the academy roof. You have a crate of spell-crystals, a bucket of water, and a safety waiver nobody read.\n\nBelow, the whole festival is looking up.`,
      choices:[
        {label:`Paint the whole sky.`, check:{stat:'mag', dc:14},
          win:{t:`Dragons of golden fire chase each other across the dusk. The crowd roars.`, fx:{mag:2, fame:2, gold:30}, go:'judge'},
          lose:{t:`The first rocket goes sideways. So do you, into the water bucket. Your eyebrows will grow back.`, fx:{hp:-6, mag:1}, go:'judge'}},
        {label:`Spell out {top}'s name in the sky.`, show:s=>!!topComp(),
          t:`Huge, golden, slightly misspelled. Somewhere below, {top} goes very red and pretends not to know you.`, fx:{relTop:3, mag:1}, log:'Wrote {top}\'s name across the festival sky.', go:'judge'},
        {label:`Safety-check every crystal first.`, t:`You find two cracked crystals that would have taken someone's hand off. The show is small, safe, and lovely.`, fx:{wit:2}, go:'judge'}
      ]},
    haunt:{ scene:'night', text:`You turn the old chemistry lab into the Haunted Classroom: bedsheet ghosts, cold-spell drafts, and a skeleton borrowed without asking from the healing department.\n\nThe first customers are two knights-in-training who swear they aren't scared of anything.`,
      choices:[
        {label:`Be the ghost.`, check:{stat:'cha', dc:13},
          win:{t:`One knight screams so loudly a crowd forms just to see what's in there. Business booms.`, fx:{cha:1, gold:45}, go:'judge'},
          lose:{t:`Your sheet snags on a nail and you fall over, revealed. Nobody screams. One of them pats you.`, fx:{gold:15, luck:1}, go:'judge'}},
        {label:`Rig it with illusion magic.`, check:{stat:'mag', dc:14},
          win:{t:`Your weeping-bride illusion is so good that the bride gets fan mail.`, fx:{mag:2, gold:50, fame:1}, go:'judge'},
          lose:{t:`Your ghost comes out looking like a sad potato. People queue to see the sad potato.`, fx:{mag:1, gold:30}, go:'judge'}},
        {label:`Half-demon: just let your eyes glow.`, show:s=>s.race==='demon',
          t:`Red light in the dark. The knights flee. Then a little kid starts crying, and you crouch down and show them it's only you, and they decide you're the coolest person alive. They come back four times.`, fx:{cha:2, fame:1, gold:30}, log:'Scared two knights and befriended one small child at the festival.', go:'judge'}
      ]},
    judge:{ scene:'academy', text:`Late afternoon. A hush moves through the halls: the Best Booth judge is coming. {g}, a {g.trait} noble {g.look}, has judged this festival for years and has never once smiled.\n\n{g.He} stops at your booth.\n\nOutside, the first lanterns are being lit along the courtyard.`,
      choices:[
        {label:`Pitch your booth with everything.`, check:{stat:'cha', dc:14, npc:'g'},
          win:{t:`{g}'s mouth twitches. That's practically a standing ovation. Best Booth goes to first-years for the first time in sixty years.`, fx:{fame:3, gold:40, npc:{g:2}}, log:'Won Best Booth at the Academy Festival.'},
          lose:{t:`{g} writes one word on a clipboard and moves on. Honorable mention. Your class throws you in the air anyway.`, fx:{fame:1, cha:1}}},
        {label:`Figure out what {g.he} actually wants.`, check:{stat:'wit', dc:14, npc:'g'},
          win:{t:`{g.He} isn't here for the booths. {g.He} misses the festival {g.he} had at your age. You give {g.him} a paper lantern and a quiet corner. {g.He} gives you Best Booth, and a card bearing {g.his} family crest.`, fx:{wit:1, fame:2, npc:{g:3}, seed:{k:'owed', npc:'g'}}, log:'Won Best Booth, and a noble\'s quiet gratitude.'},
          lose:{t:`You guess wrong. {g.He} did not want a tiny cake. {g.He} takes it anyway.`, fx:{wit:1}}},
        {label:`Skip it. Watch the lanterns with {top}.`, show:s=>!!topComp(),
          t:`You leave the booth to your class and find {top} on the roof. The lanterns rise over Asterhold, hundreds of them, and for a long while neither of you says anything at all.`, fx:{relTop:3, heal:1}, log:'Watched the festival lanterns rise with {top}.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_omen — the girl on the clocktower (Vexa)
   --------------------------------------------------------- */
ARCS.push({
  id:'a_omen', stage:'academy', title:'The Girl on the Clocktower', scene:'night',
  blurb:`For a week, black mist has pooled around the academy clocktower at midnight. Tonight, someone is standing in it.`,
  start:'a',
  beats:{
    a:{ scene:'night', text:`Midnight. You can't sleep, so you're on the dorm roof, and that's how you see her.\n\nAt the very top of the clocktower, a slim figure balances on the minute hand, wrapped in black mist. A bone-white mask. Two curved horns.\n\nShe isn't watching the city. She's looking north, and she hasn't moved in an hour.`,
      choices:[
        {label:`Climb the tower and say hello.`, t:`Three hundred steps. You're wheezing when you reach the top. She doesn't turn around.`, fx:{str:1}, go:'top'},
        {label:`Sneak up behind her.`, check:{stat:'luck', dc:14},
          win:{t:`You get within arm's reach. Without turning, she says, "You breathe very loudly."`, fx:{luck:1}, go:'top'},
          lose:{t:`A loose tile. She spins, and a blade of black mist is at your throat.`, go:'fight'}},
        {label:`Ring the alarm bell.`, t:`The bell booms across the city. She turns, finds you, and is standing in front of you before the second toll.`, go:'fight'},
        {label:`Call to her in the old demon tongue.`, show:s=>s.race==='demon',
          t:`The words come from somewhere in your blood. She goes still, then drops down beside you like a falling leaf. "Half-blood," she says. "Here? Of all places?"`, fx:{mag:1}, go:'top'}
      ]},
    fight:{ scene:'night', text:`Up close she's smaller than you thought, and her blade of mist is very, very sharp.\n\n"Go back to bed, human," she says, voice muffled by the mask. "I'm not here for you. Don't make me be."`,
      choices:[
        {label:`Fight her.`, check:{stat:'combat', dc:15},
          win:{t:`You knock the blade wide and your counter clips her mask. It cracks, and slips.`, fx:{str:1, mag:1}, go:'mask'},
          lose:{t:`She moves like the mist does. You're on your back before you see it. She stands over you, blade raised, and then, for some reason, doesn't.`, fx:{hp:-10, str:1}, go:'mask'}},
        {label:`Lower your hands. "Okay."`, t:`She tilts her head. Behind the mask, you're fairly sure she's surprised.`, fx:{cha:1}, go:'mask'},
        {label:`"Puru, go say hi."`, show:s=>!!s.flags.puru,
          t:`Puru bounces up and nuzzles her ankle. She stares down at it. A strangled noise escapes the mask, and you realize she is trying very hard not to giggle.`, fx:{luck:1}, go:'mask'}
      ]},
    top:{ scene:'night', text:`Up close, the mist smells like snow. She sits on the edge of the clock face, legs dangling over a long drop.\n\n"Your city is very bright," she says, not looking at you. "Up north the lights went out years ago. Nobody could afford the oil."\n\nHer stomach growls, loudly. She glares at it.`,
      choices:[
        {label:`Offer her the sweet bun in your pocket.`, t:`She hesitates, then lifts the mask just enough to eat it in three bites. You glimpse a sharp chin and a smear of icing. "That," she says, "was not bad."`, fx:{cha:1}, go:'mask'},
        {label:`"What are you looking for?"`, check:{stat:'cha', dc:14},
          win:{t:`A long silence. "Home," she says. "Making sure it's still there."`, fx:{cha:1, wit:1}, go:'mask'},
          lose:{t:`"None of your business, human." But she doesn't leave.`, fx:{wit:1}, go:'mask'}},
        {label:`"I know Pia. I helped her once."`, show:s=>!!s.flags.demonKid,
          t:`The mask snaps toward you. "You're the one," she whispers. "She talks about you. The human who didn't run."`, fx:{set:{pia:true}}, go:'mask'}
      ]},
    mask:{ scene:'night', text:(s,v)=> `The clock begins to strike one. She stands, and the mist gathers around her like a cloak.\n\n`
      + (v.pia ? `"For Pia's sake," she says, and lifts the mask away.` : `Then, as if deciding something, she lifts the mask away.`)
      + ` Underneath she's barely older than you, with tired amber eyes.\n\n"I'm Vexa. Remember it." She glances north. "Something is waking up. When it does, I'll be on the other side. I'd rather not see you there."`,
      choices:[
        {label:`"Then I hope we never meet again."`, t:`"Me too," Vexa says, and almost smiles. Then she is mist, and the bell finishes striking.`, fx:{flag:'metVexa', omen:1, cha:1}, log:'Met a horned girl called Vexa on the clocktower.'},
        {label:`"They were starving. Your people. I know."`, show:s=>!!s.flags.lore,
          t:`Vexa stares at you. "Humans *know*?" "Some of us," you say. "Not enough." She's quiet. "Then learn faster," she says, and is gone.`, fx:{flag:'metVexa', omen:1, wit:2}, log:'Told Vexa that some humans remember the famine.'},
        {label:`Grab her wrist. "Who sent you?"`, check:{stat:'combat', dc:15},
          win:{t:`Your grip holds for one second. "Nobody *sends* me," she hisses. "He's waking. Can't you feel it?" Then she's smoke between your fingers.`, fx:{flag:'metVexa', omen:1, str:1}, log:'Caught Vexa, a demon scout, for one second.'},
          lose:{t:`Your hand closes on mist, and something cold bites your palm. The cut heals into a crescent scar that aches whenever the wind blows from the north.`, fx:{flag:'metVexa', omen:1, hp:-7}, log:'Vexa, a demon scout, left a scar on your palm.'}},
        {label:`Let her go. Tell no one.`, t:`She nods once and becomes a ribbon of black mist sliding north over the rooftops. You never tell anyone. You think of her every time it snows.`, fx:{flag:'metVexa', omen:1, luck:1}, log:'Met a horned girl called Vexa, and kept her secret.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_rival — the self-declared rival
   --------------------------------------------------------- */
ARCS.push({
  id:'a_rival', stage:'academy', title:'My Eternal Rival (Self-Declared)', scene:'academy', dream:'hero',
  blurb:`{r.full}, a {r.trait} classmate {r.look}, has declared you {r.his} Eternal Rival. You were not consulted.`,
  cast:{ r:{role:'student'} },
  start:'a',
  beats:{
    a:{ scene:'academy', text:`"{name}!" The hallway goes quiet. {r.full} is pointing at you, finger trembling with destiny.\n\n"Ever since entrance day, everyone talks about *you*. Well, no more! From today, I am your Eternal Rival!" {r.He} has clearly practiced this. There are cue cards.\n\n"Choose the battlefield. I'll crush you on any of them!"`,
      choices:[
        {label:`"Midterm exams. Highest score wins."`, t:`"Done!" {r} produces a study schedule. It is color-coded.`, go:'exam'},
        {label:`"The spring tournament."`, t:`"Done!" {r} is already doing push-ups in the hallway.`, go:'tourney'},
        {label:`"Whoever the professor picks as apprentice."`, t:`"Done!" {r} sprints off, presumably to start sucking up.`, go:'mentor'},
        {label:`"No thanks."`, show:(s,v,c)=>['hotheaded','proud'].includes(c.r.trait),
          t:`{r} turns crimson. "You don't get to say NO to DESTINY!" {r.He} drags you to the tournament sign-up sheet by the sleeve.`, fx:{luck:1}, go:'tourney'}
      ]},
    exam:{ scene:'library', text:`Midterms. {r} has turned {r.his} library desk to face yours, so that you can watch {r.him} study. {r.He} highlights things aggressively. {r.He} sleeps four hours a night.\n\nThe exam is in three days. The textbook is eleven hundred pages.`,
      choices:[
        {label:`Study all night, every night.`, check:{stat:'wit', dc:14},
          win:{t:`You answer everything, including the trick question about mana tides. Top score.`, fx:{wit:2, set:{won:true}}, go:'result'},
          lose:{t:`You sleep through the first hour of the exam. Second place, by one point.`, fx:{wit:1, set:{lost:true}}, go:'result'}},
        {label:`Suggest studying together.`, check:{stat:'cha', dc:13, npc:'r'},
          win:{t:`{r} says no four times, then shows up with snacks. You tie for first. {r.He} pretends to be furious about it.`, fx:{wit:1, npc:{r:2}, set:{tie:true}}, go:'result'},
          lose:{t:`Ten minutes in, you're arguing about footnotes. You both do worse than you would have alone. {r} wins by a point.`, fx:{wit:1, set:{lost:true}}, go:'result'}},
        {label:`Appraise the professor's habits.`, show:s=>s.cheat==='appraise',
          t:`Appraisal can't read the exam, but it can read the professor: [Favorite topic: mana tides. Hates: footnotes.] Top score.`, fx:{wit:2, set:{won:true}}, go:'result'}
      ]},
    tourney:{ scene:'academy', text:`The spring tournament: a sand ring, wooden weapons, the whole school on the bleachers. You and {r} cut through the brackets and meet in the final, as if the universe loves a cliché.\n\n{r} salutes with {r.his} practice sword. "Today the Eternal Rivalry ends!"\n\n"It started last week," you point out.`,
      choices:[
        {label:`Fight clean.`, check:{stat:'combat', dc:15},
          win:{t:`It's long, and fair, and the best fight you've ever had. You win on the last exchange.`, fx:{str:2, fame:2, set:{won:true}}, go:'result'},
          lose:{t:`{r} is better than {r.he} looks. You lose by an inch and a bruise.`, fx:{hp:-8, str:1, set:{lost:true}}, go:'result'}},
        {label:`Feint high, sweep the legs.`, check:{stat:'wit', dc:13, npc:'r'},
          win:{t:`{r} falls for it completely. You win. The crowd boos a little. So does {r}.`, fx:{wit:1, npc:{r:-2}, set:{won:true}}, go:'result'},
          lose:{t:`{r} saw it coming a mile off. {r.He} sweeps *you*.`, fx:{hp:-6, wit:1, set:{lost:true}}, go:'result'}},
        {label:`Sword Saint: one real stroke.`, show:s=>s.cheat==='sword',
          t:`For one breath your wooden sword moves like it remembers a thousand battles. {r}'s blade spins out of the ring. Silence, then a roar.`, fx:{str:1, fame:2, set:{won:true}}, go:'result'}
      ]},
    mentor:{ scene:'academy', text:s=> (met('nimue')
      ? `Rumor says Professor Nimue is taking one apprentice this year, her first in a century. {r} has already brought her a cake the size of a cartwheel. She is asleep on it.`
      : `Rumor says old Archmage Halvorsen is taking one apprentice this year. {r} has already submitted a forty-page essay bound in leather. The archmage uses it to level a table.`)
      + `\n\nThe trial: show the most impressive thing you can do. You go second, right after {r}.`,
      choices:[
        {label:`Show your best spell.`, check:{stat:'mag', dc:14},
          win:{t:`Your spell fills the hall with slow-falling light. Even {r} forgets to be jealous for a second.`, fx:{mag:2, set:{won:true}}, go:'result'},
          lose:{t:`Your spell sputters, sparks, and sets {r}'s notes on fire. Accidentally. Mostly.`, fx:{mag:1, set:{lost:true}}, go:'result'}},
        {label:`Bring Nimue a better cake.`, show:s=>met('nimue'),
          t:`One perfect strawberry tart. Nimue wakes, eats it, points at you, and goes back to sleep. That, apparently, is the verdict.`, fx:{rel:{nimue:2}, cha:1, set:{won:true}}, go:'result'},
        {label:`Save {r} when {r.his} spell misfires.`, t:`{r}'s spell goes wild. You catch it, barely, and fold it into something beautiful. You get no credit. {r} stares at you like {r.he}'s never seen you before.`, fx:{mag:1, npc:{r:3}, set:{tie:true}}, go:'result'}
      ]},
    result:{ scene:'academy', text:(s,v)=> (v.won
      ? `{r} stands in front of you, fists clenched, eyes shining. "This isn't over," {r.he} says. "This is *chapter one*."`
      : v.lost
      ? `{r} wins. {r.He} holds the victory a long moment, like it might break. Then {r.he} looks at you, suddenly uncertain, as if {r.he} didn't expect to.`
      : `Neither of you won. {r} doesn't know what to do with that. "A draw," {r.he} says. "A *draw*. That's worse than losing."`)
      + `\n\nThe whole class is watching to see what you do next.`,
      choices:[
        {label:`Offer a handshake.`, check:{stat:'cha', dc:13, npc:'r'},
          win:{t:`{r} stares at your hand, then grips it hard. "Rivals," {r.he} says. "Friendly ones. Don't get used to it."`, fx:{cha:1, npc:{r:2}, seed:{k:'rival', npc:'r'}}, log:'Became {r}\'s Eternal Rival, and sort of friends.'},
          lose:{t:`{r} slaps your hand away. "Don't patronize me." But {r.he} shows up to every contest after that.`, fx:{luck:1, npc:{r:-1}, seed:{k:'rival', npc:'r'}}, log:'Became {r}\'s bitter Eternal Rival.'}},
        {label:`Gloat. Loudly.`, show:(s,v)=>!!v.won,
          t:`You do a little dance. {r} goes white, then red. "I will *end* you," {r.he} whispers, and means it for years.`, fx:{cha:1, npc:{r:-3}, seed:{k:'rival', npc:'r'}}, log:'Gloated at {r}, who swore eternal vengeance.'},
        {label:`Congratulate {r.him}. Mean it.`, show:(s,v)=>!v.won,
          t:`{r} blinks. Then, horrifyingly, {r.his} eyes fill up. "Nobody ever..." {r.He} wipes them furiously. "This doesn't make us friends." It does, a little.`, fx:{cha:1, npc:{r:3}, seed:{k:'rival', npc:'r'}}, log:'Made {r} cry, in a good way.'},
        {label:`"Same time next year?"`, t:`"*Every* year," {r} says. "Until one of us dies." {r.He} is grinning.`, fx:{luck:1, npc:{r:1}, seed:{k:'rival', npc:'r'}}, log:'Agreed to an annual contest with {r}, forever.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_beach — summer trip to the coast
   --------------------------------------------------------- */
ARCS.push({
  id:'a_beach', stage:'academy', title:'Summer at Saltmere', scene:'coast', dream:'love',
  blurb:`The academy's summer trip goes to Saltmere Coast. Watermelons, fireworks, and a lifeguard who insists sea serpents are a myth.`,
  cast:{ f:{role:'fisher'} },
  start:'a',
  beats:{
    a:{ scene:'coast', text:s=> `Saltmere Coast: white sand, blue water, and two hundred students released from exams like startled pigeons.`
      + (met('rook') ? ` Rook is buried up to the neck in sand and seems content.` : ``)
      + (met('sera') ? ` Seraphine sits under three parasols, insisting she doesn't tan, she *glows*.` : ``)
      + (met('nimue') ? ` Nimue, your "chaperone," is asleep on a float drifting gently out to sea.` : ``)
      + `\n\nThe sun is high. The whole day is yours.`,
      choices:[
        {label:`Watermelon split, blindfolded.`, check:{stat:'luck', dc:13},
          win:{t:`One swing, a perfect split. Everyone gets a slice. You are a beach legend.`, fx:{luck:1, relAll:1}, go:'shout'},
          lose:{t:`You miss the melon, hit the sand, then a cooler, then, gently, the vice-principal. People laugh until they cry.`, fx:{cha:1}, go:'shout'}},
        {label:`Swim out past the buoys.`, t:`The water is cold and clean. Out past the buoys you float, looking up at a sky with no smog in it, thinking about how far you've come.`, fx:{str:1, set:{far:true}}, go:'shout'},
        {label:`Race Lina to the rocks and back.`, show:s=>met('lina'),
          t:`Lina rode down from {home} on a hay cart just for today. She beats you by a body length, like always, and crows about it, like always.`, fx:{str:1, rel:{lina:2}}, go:'shout'},
        {label:`Help Seraphine with sunscreen (she insists).`, show:s=>met('sera'),
          t:`"It's purely practical," she says, very red. "Ice mages burn. Don't make it weird." You don't make it weird. She does, by forgetting to breathe.`, fx:{rel:{sera:2}, cha:1}, go:'shout'}
      ]},
    shout:{ scene:'coast', text:`A scream from the water's edge. A fisher, {f}, is pointing past the breakers: a little kid on a driftwood plank is being dragged out fast by the riptide.\n\nThen the water beyond the kid *heaves*. Something long and glittering rolls under the surface, big as a boat.\n\nThe lifeguard faints.`,
      choices:[
        {label:`Swim for the kid.`, t:`You're in the water before you've thought about it.`, go:'rescue'},
        {label:`Go for the thing in the water.`, t:`Someone has to keep it away from the kid. You wade in, toward the glitter.`, go:'serpent'},
        {label:`Tamer: "Wait. It isn't hunting."`, show:s=>s.cheat==='tamer',
          t:`You know that roll. That's not a hunting monster. That's a lonely one, following the only warm thing in the water.`, fx:{set:{tame:true}}, go:'serpent'}
      ]},
    rescue:{ scene:'coast', text:(s,v)=> `The riptide grabs you like a hand. ` + (v.far ? `You're already out past the buoys, already close. ` : ``)
      + `The kid is clinging to the plank, lips blue, too scared to cry.\n\nOn the shore, {f} is wading in up to {f.his} chest, screaming a name over and over.`,
      choices:[
        {label:`Swim the kid back to shore.`, check:{stat:'str', dc:14, extra:(s,v)=> v.far ? [['Already past the buoys',3]] : []},
          win:{t:`You swim sideways out of the rip, the way they teach you. The kid is breathing. {f} falls to {f.his} knees in the surf.`, fx:{str:2, npc:{f:3}, seed:{k:'owed', npc:'f'}}, log:'Pulled a fisher\'s child out of a riptide at Saltmere.', go:'fireworks'},
          lose:{t:`The rip drags you both under twice. You make it, coughing up seawater, the kid in a death grip around your neck.`, fx:{hp:-9, str:1, npc:{f:3}, seed:{k:'owed', npc:'f'}}, log:'Pulled a fisher\'s child out of a riptide at Saltmere.', go:'fireworks'}},
        {label:`Freeze a path across the water.`, check:{stat:'mag', dc:14},
          win:{t:`You slap the sea and a bridge of ice shoots out to the kid. Someone on the beach starts clapping and doesn't stop.`, fx:{mag:2, npc:{f:3}, seed:{k:'owed', npc:'f'}}, log:'Froze the sea to reach a drowning child at Saltmere.', go:'fireworks'},
          lose:{t:`The ice cracks under you halfway. You swim the rest, freezing, and make it.`, fx:{hp:-7, mag:1, npc:{f:2}, seed:{k:'owed', npc:'f'}}, go:'fireworks'}},
        {label:`Nurse: get the kid breathing.`, show:s=>s.job==='nurse',
          t:`On the sand, the kid isn't breathing. Your hands remember before you do: tilt, check, compress. Thirty, two. The kid coughs up half the ocean, and {f} grabs you and sobs.`, fx:{wit:2, npc:{f:4}, seed:{k:'owed', npc:'f'}}, log:'Brought a drowned child back to life on the sand at Saltmere.', go:'fireworks'}
      ]},
    serpent:{ scene:'coast', text:(s,v)=> `It surfaces between you and the open sea: a serpent with scales like stained glass and eyes the size of cartwheels. `
      + (v.tame ? `It is, you realize, very young. And very lost.` : `It opens a mouth full of glass-bright teeth.`)
      + `\n\nBehind you, {f} is hauling the kid into a rowboat. In front of you is roughly a ton of confused sea monster.`,
      choices:[
        {label:`Fight it off.`, check:{stat:'combat', dc:15},
          win:{t:`You smack it on the nose, hard. It sneezes, sulks, and swims off in a huff. The beach goes wild.`, fx:{str:2, fame:2, npc:{f:2}}, log:'Drove off a sea serpent at Saltmere.', go:'fireworks'},
          lose:{t:`It flicks you with its tail. You skip across the water like a stone, three times.`, fx:{hp:-12, str:1}, go:'fireworks'}},
        {label:`Sing to it.`, show:(s,v)=>!!v.tame || s.cheat==='tamer',
          t:`You hum a lullaby from your first life. The serpent lays its huge head on the water and closes its eyes. You guide it out to the deep, and it waves its tail at the beach before it dives.`, fx:{luck:2, fame:1, relAll:1}, log:'Sang a lost baby sea serpent back to deep water.', go:'fireworks'},
        {label:`Throw the watermelon. Run.`, check:{stat:'luck', dc:13},
          win:{t:`It catches the watermelon, delighted, and forgets you exist.`, fx:{luck:1, wit:1}, go:'fireworks'},
          lose:{t:`It ignores the melon and chases you up the beach. It's mostly playful. Mostly.`, fx:{hp:-6, luck:1}, go:'fireworks'}}
      ]},
    fireworks:{ scene:'night', text:s=> `That night, Saltmere launches fireworks off the old pier. The sand is still warm. Somebody is playing a fiddle, badly.\n\n`
      + (topComp() ? `{top} finds you at the end of the pier and sits down, close enough that your shoulders touch.` : `You find a spot at the end of the pier, alone, which is its own kind of nice.`)
      + `\n\nA red chrysanthemum blooms over the water. Then a gold one.`,
      choices:[
        {label:`Watch quietly with {top}.`, show:s=>!!topComp(),
          t:`Neither of you says anything. You don't need to. Later, you'll remember this as the night you stopped feeling like a visitor in this world.`, fx:{relTop:3, heal:1}, log:'Watched the fireworks at Saltmere with {top}.'},
        {label:`Tell {top} about your first life.`, show:s=>!!topComp(),
          t:`The city, the fluorescent lights, the last train home. {top} listens to every word and doesn't laugh once. "I'm glad you ended up here," {top} says.`, fx:{relTop:2, cha:1}, log:'Told {top} about the life before this one.'},
        {label:`Launch a firework of your own.`, check:{stat:'mag', dc:13},
          win:{t:`Your firework blooms into a giant cat face. The whole beach cheers.`, fx:{mag:1, fame:1, relAll:1}},
          lose:{t:`Your firework chases the vice-principal up the beach. Somehow this is even more popular.`, fx:{luck:1, fame:1}}},
        {label:`Think of everyone back on Earth.`, t:`You wonder if anyone back there remembers you. Then a firework bursts, and someone here calls your name, and that's enough.`, fx:{heal:1, wit:1}}
      ]}
  }
});

/* ---------------------------------------------------------
   a_sponsor (echo) — the merchant you rescued as a child
   --------------------------------------------------------- */
ARCS.push({
  id:'a_sponsor', stage:'academy', title:'A Sponsor at the Gates', scene:'capital', echo:true, dream:'rich',
  blurb:`A carriage with gilded wheels stops at the academy gates. Out steps {m}, the merchant you rescued as a kid. {m.He} has brought a contract.`,
  cond:s=>hasSeed('owed', (x,n)=>n&&n.role==='merchant'),
  cast:{ m:{seed:'owed', where:(x,n)=>n&&n.role==='merchant', role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'capital', text:(s,v,c)=> `A carriage with gilded wheels stops at the academy gates. Out steps {m}, the merchant you helped when you were a kid, now in a velvet coat and {m.look}.\n\n`
      + (c.m.att>=3 ? `{m.He} hugs you off the ground. "Look at you! A *Royal Academy* student! I tell everyone I knew you when."`
        : c.m.att<=-1 ? `{m.He} shakes your hand stiffly. Owing a child a favor for years has clearly been eating at {m.him}.`
        : `{m.He} shakes your hand warmly, a little nervous.`)
      + `\n\n"I'd like to sponsor you," {m.he} says. "Tuition, books, everything. In my company's name, of course."`,
      choices:[
        {label:`Accept gratefully.`, t:`{m} beams and produces a contract from {m.his} coat. It is a very long contract.`, go:'deal'},
        {label:`"Tell me what you really need."`, check:{stat:'wit', dc:13, npc:'m'},
          win:{t:`{m}'s smile slips. "You were always sharp." The sponsorship is real. So is the trouble behind it.`, fx:{wit:1}, go:'request'},
          lose:{t:`{m} laughs it off a little too quickly. "Need? Nothing! Now, the contract..."`, go:'deal'}},
        {label:`Office worker: ask to see the ledgers.`, show:s=>s.job==='office',
          t:`"Due diligence," you say. {m} hands over the account books, puzzled. Your old life's spreadsheets light up behind your eyes.`, fx:{wit:1}, go:'ledger'}
      ]},
    deal:{ scene:'capital', text:`The contract has forty-one clauses. In exchange for tuition money, you'll wear the {m.sur} Trading Company crest on your uniform, appear at {m.his} gala, and "endorse select products." One of the products is a hair tonic.\n\n{m} holds out a quill, beaming.`,
      choices:[
        {label:`Sign without reading.`, t:`Ink, flourish, done. {m} pays you eighty gold on the spot. You'll find out about the hair tonic later.`, fx:{gold:80, set:{blind:true}}, go:'gala'},
        {label:`Negotiate the terms.`, check:{stat:'wit', dc:14, npc:'m'},
          win:{t:`You strike the tonic, add a stipend, and get {m} to throw in books. {m} looks proud of you, and somewhat poorer.`, fx:{wit:2, gold:100}, go:'gala'},
          lose:{t:`{m} has haggled with goblins. {m.He} haggles you down to sixty gold and the tonic.`, fx:{wit:1, gold:60, set:{blind:true}}, go:'gala'}},
        {label:`Offer to cater the gala instead.`, show:s=>s.cheat==='cook'||s.job==='chef',
          t:`{m} tastes one canapé and tears up the contract. "New deal. You cook, I pay."`, fx:{cha:1, gold:60, set:{cater:true}}, go:'gala'}
      ]},
    request:{ scene:'capital', text:`{m} sits on the carriage step and lets the smile go. "The academy quartermaster buys all its supplies. Last year from me. This year he wants a 'personal fee' of three hundred gold, or he ruins my name with every noble house that sends children here."\n\n{m.He} rubs {m.his} face. "I didn't come to call in your debt. I came because I didn't know who else to ask."`,
      choices:[
        {label:`"Leave it to me. No charge."`, t:`{m} stares. "You already saved me once." "Then this is the sequel," you say.`, fx:{cha:1, npc:{m:1}}, go:'quarter'},
        {label:`"Show me your books first."`, t:`If you're going to fight for {m}, you want to know everything. {m} hesitates, then hands them over.`, go:'ledger'},
        {label:`Tell {m} to pay the fee and move on.`, t:`"Three hundred now beats ruin later." {m} nods, deflated, and insists on sponsoring you anyway, with the gala to win the money back.`, fx:{wit:1, npc:{m:-1}, gold:40}, go:'gala'}
      ]},
    ledger:{ scene:'capital', text:`{m}'s books are a mess, and the mess tells a story: three bad caravans, one robbery, and a loan from a moneylender at a rate that should be illegal. The gala, the sponsorship, the poster: it's all a last gamble to win new investors.\n\n{m} watches you read, ashen. "Please don't tell anyone."`,
      choices:[
        {label:`Restructure the debt on the spot.`, check:{stat:'wit', dc:14, job:{office:4}},
          win:{t:`Two errors, a refinancing option, and a clause that voids the loan entirely. {m} cries. You go to the gala as a guest, not a gimmick.`, fx:{wit:2, npc:{m:3}, seed:{k:'secret', npc:'m'}}, log:'Saved {m}\'s company from ruin with a ledger and a quill.', go:'gala'},
          lose:{t:`You make it better, not good. "Better is a lot," {m} says, gripping your hand.`, fx:{wit:1, npc:{m:1}}, go:'gala'}},
        {label:`Take the sponsorship anyway. It's business.`, t:`You pocket sixty gold. {m}'s smile doesn't quite reach {m.his} eyes.`, fx:{gold:60, npc:{m:-2}, set:{blind:true}}, go:'gala'},
        {label:`Keep the secret. Refuse the money.`, t:`"You still owe me," you say. "Just not money." {m} laughs, shakily, and wipes {m.his} eyes.`, fx:{cha:1, npc:{m:2}, seed:{k:'secret', npc:'m'}}, go:'gala'}
      ]},
    gala:{ scene:'palace', text:(s,v)=> `{m}'s gala fills a rented ballroom with investors in fur collars. `
      + (v.blind ? `There is a poster of you, three meters tall, holding a bottle of hair tonic. Your hair in the poster is excellent. ` : ``)
      + `{m} takes the stage and sweeps a hand toward you: "My protégé will now demonstrate the magic of the future!"\n\nYou did not agree to a demonstration.`,
      choices:[
        {label:`Improvise a magic show.`, check:{stat:'mag', dc:14},
          win:{t:`Light, color, a small polite thunderstorm. The investors sign everything in reach. "We're even," {m} whispers. "No. We're *partners*."`, fx:{mag:2, fame:1, npc:{m:2}, useSeed:{k:'owed', npc:'m'}, seed:{k:'friend', npc:'m'}}, log:'Saved {m}\'s gala with an improvised magic show.'},
          lose:{t:`The chandelier comes down. Nobody is hurt except you, a bit, and {m}'s bank balance, a lot. "Well," {m} says faintly. "I suppose we're even."`, fx:{hp:-7, mag:1, npc:{m:-2}, useSeed:{k:'owed', npc:'m'}}}},
        {label:`Charm the investors one by one.`, check:{stat:'cha', dc:14},
          win:{t:`By midnight you've shaken a hundred hands and remembered every name. {m} hugs you. "Consider my debt paid, partner."`, fx:{cha:2, npc:{m:2}, useSeed:{k:'owed', npc:'m'}, seed:{k:'friend', npc:'m'}}},
          lose:{t:`You call a duke "Grandpa." {m} sighs. "Well. We're even now, I suppose."`, fx:{cha:1, useSeed:{k:'owed', npc:'m'}}}},
        {label:`Serve the food. Let it talk.`, show:(s,v)=>!!v.cater,
          t:`One bite and a duke weeps into his napkin. {m} closes six deals before dessert.`, fx:{cha:1, gold:40, npc:{m:3}, useSeed:{k:'owed', npc:'m'}, seed:{k:'friend', npc:'m'}}, log:'Catered {m}\'s gala. A duke wept.'},
        {label:`Bow, and walk out the side door.`, t:`{m} has to improvise the demonstration alone, badly. {m.He} still owes you. {m.He} is now also annoyed.`, fx:{luck:1, npc:{m:-2}}}
      ]},
    quarter:{ scene:'academy', text:`The quartermaster's office is in the academy basement, warm and well furnished for a man on a clerk's salary. He's a soft, smiling man with a ledger he keeps very close.\n\n"A student," he says. "Here about a *merchant*? How sweet."`,
      choices:[
        {label:`Catch him in the act.`, check:{stat:'wit', dc:15},
          win:{t:`You return with a hidden witness and a scribe, and let him repeat his fee. He's dismissed by Friday. {m} gets the contract back, and still insists {m.he} owes you.`, fx:{wit:2, npc:{m:3}, seed:{k:'friend', npc:'m'}}, log:'Exposed a corrupt quartermaster to help {m}.'},
          lose:{t:`He sees you coming. Your dorm room fails inspection three weeks running, and {m} loses the contract anyway.`, fx:{wit:1, gold:-20, npc:{m:1}}}},
        {label:`Loom in his doorway until he cracks.`, check:{stat:'str', dc:14},
          win:{t:`You don't say anything. You just stand there, getting taller. He renews {m}'s contract, fee-free, and asks you to please leave.`, fx:{str:2, npc:{m:2}}},
          lose:{t:`He calls the guards. You spend a night in the academy lockup and {m} pays your fine, which feels backwards.`, fx:{hp:-5, str:1, gold:-20}}},
        {label:`Call in {m}'s favor instead: let it go.`, t:`"Pay him once," you tell {m}, "then never sell here again. You owe me nothing." {m} hugs you, owes you nothing, and sends cake every month anyway.`, fx:{cha:1, npc:{m:2}, useSeed:{k:'owed', npc:'m'}}}
      ]}
  }
});

/* ---------------------------------------------------------
   a_business (echo) — your childhood business, now copied
   --------------------------------------------------------- */
ARCS.push({
  id:'a_business', stage:'academy', title:'Knockoffs on Copper Street', scene:'market', echo:true, dream:'rich',
  blurb:`Your little business from {home} has reached the capital. So, unfortunately, have the knockoffs.`,
  cond:s=>hasSeed('business'),
  cast:{ c:{role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'academy', text:`A letter from {home} arrives with your morning porridge: business is booming. A second letter arrives at lunch: a shop on Copper Street is selling your exact product, at half the price, under the name of {c}.\n\nYour dorm room is now technically a corporate headquarters. Your roommate is unamused.`,
      choices:[
        {label:`Go see this copycat yourself.`, t:`You skip Alchemy. For business reasons.`, go:'copy'},
        {label:`Out-grow them. Open a capital branch.`, t:`Why fight a knockoff when you can bury it?`, fx:{luck:1}, go:'expand'},
        {label:`Office worker: write a real business plan.`, show:s=>s.job==='office',
          t:`Projections, cost analysis, a five-year plan on the back of a potions worksheet. Your old instincts purr like an engine.`, fx:{wit:1, set:{plan:true}}, go:'expand'}
      ]},
    copy:{ scene:'market', text:`{c}'s shop is narrow and busy. {c.He} is {c.look}, {c.trait}, and selling your invention with a straight face, right down to the little logo you drew as a kid.\n\n"Ah," {c.he} says, recognizing you. "The original. I suppose you've come to complain."`,
      choices:[
        {label:`Threaten {c.him} with the Guild courts.`, check:{stat:'wit', dc:14, npc:'c'},
          win:{t:`You quote the Guild Charter on prior invention until {c} goes pale. {c.He} agrees to pay you royalties.`, fx:{wit:2, income:10, npc:{c:-1}}, go:'final'},
          lose:{t:`{c} has better lawyers than you. {c} has *any* lawyers. You leave with nothing but a grudge, and so does {c.he}.`, fx:{wit:1, npc:{c:-3}, seed:{k:'grudge', npc:'c'}}, go:'final'}},
        {label:`Propose a partnership.`, check:{stat:'cha', dc:14, npc:'c'},
          win:{t:`Licensing, a shared logo, a cut of every sale. {c} shakes your hand like {c.he} can't believe {c.his} luck.`, fx:{cha:2, income:15, npc:{c:3}, seed:{k:'owed', npc:'c'}}, log:'Turned a copycat, {c}, into a business partner.', go:'final'},
          lose:{t:`{c} laughs in your face. "Partner with a *student*?"`, fx:{cha:1, npc:{c:-1}}, go:'final'}},
        {label:`Buy {c.him} out.`, show:(s,v,c)=>c.c.trait==='greedy', req:s=>s.gold>=60, reqText:'Needs 60 gold',
          t:`{c}'s eyes light up at the gold. Ten minutes later, you own two shops.`, fx:{gold:-60, income:20, wit:1}, go:'final'},
        {label:`Build a better version.`, check:{stat:'mag', dc:15},
          win:{t:`You add an enchantment {c} can't copy. Within a month, the knockoffs are gathering dust.`, fx:{mag:2, income:10, fame:1}, go:'final'},
          lose:{t:`Your upgrade explodes during the demonstration. On the bright side, people remember the name.`, fx:{hp:-6, fame:1, mag:1}, go:'final'}}
      ]},
    expand:{ scene:'market', text:`You rent a corner shop near the academy, cheap because the last tenant was "probably" a necromancer. It needs staff, stock, and a sign.\n\nYou also need to attend classes, which is becoming a scheduling problem.`,
      choices:[
        {label:`Hire carefully and delegate.`, check:{stat:'cha', dc:13},
          win:{t:`A retired adventurer who terrifies shoplifters, and a student who loves bookkeeping. It runs without you.`, fx:{cha:2, income:10}, go:'final'},
          lose:{t:`Your first hire steals the till. Your second hire catches him. You promote the second hire.`, fx:{cha:1, income:5, gold:-20}, go:'final'}},
        {label:`Follow your business plan to the letter.`, show:(s,v)=>!!v.plan,
          t:`Margins, foot traffic, seasonal stock. The shop is profitable in six weeks. Somewhere in another world, your old boss feels a chill.`, fx:{wit:2, income:15}, go:'final'},
        {label:`Recruit {top} to work weekends.`, show:s=>!!topComp(),
          t:`{top} complains about it constantly and is secretly brilliant at the counter. Customers come back just to be insulted a little.`, fx:{relTop:2, income:10}, go:'final'},
        {label:`Run it yourself between classes.`, t:`Four hours of sleep a night for a month. The shop thrives. Your grades do not.`, fx:{income:10, hp:-5, wit:1}, go:'final'}
      ]},
    final:{ scene:'academy', text:`A month later, a letter with a gold seal: a trading house wants to buy your business outright. The name, the shops, the notebook you started as a kid. The number at the bottom has a lot of zeroes.\n\nYou think of {home}, and the kitchen table where it all started.`,
      choices:[
        {label:`Sell. Take the money.`, t:`You sign. The number becomes a very heavy purse, and you feel light and strange, like setting down a bag you didn't know you were carrying.`, fx:s=>({gold:100, income:-s.income, useSeed:'business', luck:1}), log:'Sold your childhood business to a trading house.'},
        {label:`Refuse. It isn't for sale.`, t:`You write back: *Not for sale. Not now, not ever.* Then you frame their letter and hang it over your desk.`, fx:{income:5, cha:1}, log:'Refused to sell your business. It stays yours.'},
        {label:`Counter-offer: license it, keep it.`, check:{stat:'wit', dc:15, job:{office:3}},
          win:{t:`They get a license, you get a fee and keep everything else. The trading house's lawyer looks at you with professional hatred.`, fx:{wit:2, gold:50, income:10}, log:'Out-negotiated a trading house at fifteen.'},
          lose:{t:`They withdraw the offer politely and you never hear from them again. Probably for the best.`, fx:{wit:1}}},
        {label:`Give your family back home a bigger share.`, t:`Half of everything goes to the people who believed in it first. The reply from {home} is mostly tear stains.`, fx:{luck:2}, log:'Gave your family half of your business.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_spared (echo) — the bandit kid, now a pickpocket
   --------------------------------------------------------- */
ARCS.push({
  id:'a_spared', stage:'academy', title:'A Familiar Hand in Your Pocket', scene:'market', echo:true,
  blurb:`A hand slips into your coat in the capital market. When you catch the wrist, you know the face: {b}, the young bandit you once let go.`,
  cond:s=>hasSeed('spared'),
  cast:{ b:{seed:'spared', role:'thief'} },
  start:'a',
  beats:{
    a:{ scene:'market', text:(s,v,c)=> `Market day in {capital}. A light touch at your coat, your purse is gone, and you're already turning, already catching a thin wrist.\n\n{b}. Older, thinner, {b.look}, but you'd know that face anywhere: the young bandit you let walk away, years ago.\n\n`
      + (c.b.att>=2 ? `{b.His} eyes go wide. Then, unbelievably, {b.he} grins. "Oh, it's *you*. Of all the pockets."`
        : c.b.att<=-2 ? `{b.His} lip curls. "You. Should've known. Going to finish what you started?"`
        : `{b.He} goes very still, like a cornered cat, and says nothing at all.`),
      choices:[
        {label:`Let go. "Buy you lunch?"`, t:`{b} stares at you like you've grown a second head. Then {b.his} stomach answers for {b.him}.`, fx:{npc:{b:1}}, go:'talk'},
        {label:`Haul {b.him} toward the guardhouse.`, t:`{b} doesn't fight you. Halfway there, {b.he} starts talking, fast and low.`, fx:{str:1}, go:'talk'},
        {label:`Let go, and follow when {b.he} runs.`, t:`The moment your grip loosens, {b} is gone into the crowd, purse and all. You follow.`, go:'chase'}
      ]},
    talk:{ scene:'capital', text:(s,v,c)=> `You end up on a rooftop above the market, sharing skewers. {b} eats like someone who isn't sure when the next meal is.\n\n"The old band broke up," {b.he} says. "Got hungry. Came to the city. Now I owe a fence called Old Varn more than I'll make in a year." {b.He} looks at {b.his} hands. `
      + (c.b.att>=2 ? `"I think about that day a lot. You didn't have to let me go."` : `"Don't look at me like that. I never asked you to let me go."`),
      choices:[
        {label:`Offer to find {b.him} honest work.`, check:{stat:'cha', dc:14, npc:'b'},
          win:{t:`There's a stable by the academy that needs hands. {b} stares at you a long time. "Why do you keep *doing* this?" But {b.he} goes.`, fx:{cha:1, npc:{b:3}, npcSet:{b:{role:'stablehand'}}, useSeed:{k:'spared', npc:'b'}, seed:{k:'friend', npc:'b'}, set:{honest:true}}, log:'Found honest work for {b}, the bandit you once spared.', go:'boss'},
          lose:{t:`"Charity," {b} says flatly. "Keep it." But {b.he} doesn't leave either.`, fx:{npc:{b:-1}, wit:1}, go:'boss'}},
        {label:`Pay off {b.his} debt to Varn.`, req:s=>s.gold>=50, reqText:'Needs 50 gold',
          t:`You count fifty gold into {b}'s hand. {b.He} doesn't say thank you. {b.He} says, "I'll pay you back," which is better.`, fx:{gold:-50, npc:{b:3}, seed:{k:'owed', npc:'b'}, set:{paid:true}}, go:'boss'},
        {label:`Finish the walk to the guardhouse.`, t:`Lunch first, you'd decided. Then duty. {b} realizes where you're going two streets before you get there.`, go:'guard'}
      ]},
    chase:{ scene:'capital', text:`{b} runs like smoke: over a fruit cart, under a wagon, up a drainpipe. You keep losing {b.him} and finding {b.him} again.\n\nThe trail ends at a riverside warehouse. Through a cracked shutter you see {b} handing your purse to a huge man with a ledger and a heavy black ring.`,
      choices:[
        {label:`Kick the door in.`, t:`The door is stronger than it looks. So, it turns out, are you. Every head in the warehouse turns.`, fx:{str:1}, go:'boss'},
        {label:`Listen at the shutter first.`, check:{stat:'wit', dc:14},
          win:{t:`"...the robed ones pay double for scholars' satchels," the big man is saying. "Academy kids especially." Robed ones?`, fx:{wit:1, set:{heard:true}}, go:'boss'},
          lose:{t:`A dog inside starts barking. The shutter slams open into your face.`, fx:{hp:-5}, go:'boss'}},
        {label:`Beastkin nose: circle round the back.`, show:s=>s.race==='beast',
          t:`Your nose tells you where the back door is, how many are inside (four), and what they had for lunch (fish).`, fx:{luck:1, set:{heard:true}}, go:'boss'}
      ]},
    boss:{ scene:'tavern', text:(s,v)=> `Old Varn the fence is enormous, soft-spoken, and wearing a ring stamped with a black sun. He doesn't look surprised to see you.\n\n"{b} owes me," he says mildly. "Debts get paid. In coin, or in other ways."`
      + (v.paid ? ` You drop the coins on his table. He counts them twice, then shrugs. "Paid."` : ``)
      + `\n\n{b} glances at you, then away.`,
      choices:[
        {label:`Grab {b} and fight your way out.`, check:{stat:'combat', dc:15},
          win:{t:`You flip the table and run, dragging {b} by the sleeve. In the alley {b} is laughing, wild and young. "You're insane," {b.he} gasps. "Okay. I'm in."`, fx:(s,v)=> v.honest ? {str:2, npc:{b:2}} : {str:2, npc:{b:3}, useSeed:{k:'spared', npc:'b'}, seed:{k:'friend', npc:'b'}}, log:'Broke {b} out of Old Varn\'s debt the hard way.'},
          lose:{t:`Varn's men are bigger than you. {b} ends up dragging *you* out, bleeding, and patches you up in an alley with a stolen shirt.`, fx:{hp:-11, npc:{b:2}}}},
        {label:`Ask Varn about that ring.`, check:{stat:'wit', dc:15, extra:(s,v)=> v.heard ? [['You overheard him',3]] : []},
          win:{t:`"A gift from generous friends," Varn says, "who would like the old war to have a rematch." He smiles. "Run along, scholar." You run along, and you remember every word.`, fx:{wit:2, seed:'clue'}, log:'Learned a fence in the capital works for the Black Sun.'},
          lose:{t:`Varn just smiles and folds his hands over the ring. The interview is over.`, fx:{wit:1}}},
        {label:`Leave together, debt paid.`, show:(s,v)=>!!v.paid,
          t:`Varn waves you both out. On the street {b} walks beside you a whole block before saying, "I *will* pay you back."`, fx:{cha:1, npc:{b:1}}},
        {label:`Walk away. {b} made {b.his} choice.`, t:`You turn and go. {b} doesn't call after you. Later, you wonder if you should have stayed.`, fx:{npc:{b:-2}, luck:1}}
      ]},
    guard:{ scene:'capital', text:`The guardhouse smells of old coffee. The sergeant looks at {b}, then at you. "Pickpocket? A month in the cells. Or the mines, if there are priors."\n\nThere are priors.\n\n{b} won't look at you.`,
      choices:[
        {label:`Press charges.`, t:`{b} is led away. At the door {b.he} looks back once, and whatever was in {b.his} face the day you spared {b.him} is gone.`, fx:{gold:30, fame:1, npc:{b:-4}, useSeed:{k:'spared', npc:'b'}, seed:{k:'grudge', npc:'b'}}, log:'Turned {b} over to the city guard.'},
        {label:`"Actually, I gave {b.him} that purse."`, check:{stat:'cha', dc:14},
          win:{t:`The sergeant doesn't believe a word, and lets {b} go anyway. Outside, {b} says, very quietly, "Twice now."`, fx:{cha:2, npc:{b:3}, seed:{k:'owed', npc:'b'}}, log:'Lied to the guard to save {b}. Twice now.'},
          lose:{t:`The sergeant fines you both for wasting his time. {b} pays half, which surprises everyone, {b.him} most of all.`, fx:{gold:-20, cha:1, npc:{b:2}}}},
        {label:`Ask the temple to take {b.him} instead.`, show:s=>s.job==='nurse'||s.dream==='love',
          t:`You argue for an hour. {b} is released to the Temple of Dawn's work-house: meals, a bed, and supervision. {b.He} calls it prison with soup. {b.He} goes anyway.`, fx:{wit:1, npc:{b:2}, useSeed:{k:'spared', npc:'b'}, seed:{k:'promise', npc:'b'}}}
      ]}
  }

ARCS.push({
  id:'a_oddjob', stage:'academy', title:'The Odd Jobs Board', scene:'academy', filler:true, repeat:true, dream:'free',
  blurb:`Money's tight. The Student Odd Jobs board has three postings, all from the same very stressed innkeeper.`,
  cast:{ q:{role:'innkeeper'} },
  start:'a',
  beats:{
    a:{ scene:'academy', text:`The Student Odd Jobs board in the east hall is a blizzard of notices. Most are terrible. Three are possible, and all three are signed by {q}, who runs the Gilded Goose and is clearly having a very bad week:\n\n*CAT ON BELL TOWER. Reward.*\n*TUTOR for hopeless nephew.*\n*RATS in cellar. Large. Very large.*`,
      choices:[
        {label:`Rescue the cat.`, t:`How hard can a cat be?`, go:'cat'},
        {label:`Tutor the nephew.`, t:`How hopeless can one nephew be?`, go:'tutor'},
        {label:`Deal with the rats.`, t:`How large can a rat be?`, go:'rats'}
      ]},
    cat:{ scene:'academy', text:`{q}'s cat, Sir Reginald Fluffington, is sitting on the very tip of the academy bell tower, looking down at all of you with contempt.\n\nHe has been there for two days. He seems fine. {q} is not fine.`,
      choices:[
        {label:`Climb up and grab him.`, check:{stat:'str', dc:12},
          win:{t:`You scale the tower, scoop him up, and climb down one-handed. He bites you once, on principle.`, fx:{str:1}, go:'pay'},
          lose:{t:`You slip, catch a gargoyle, and dangle. Sir Reginald strolls down past you on his own.`, fx:{hp:-5, str:1}, go:'pay'}},
        {label:`Lure him down with fish.`, check:{stat:'luck', dc:12},
          win:{t:`One sniff and he descends like royalty accepting tribute.`, fx:{luck:1}, go:'pay'},
          lose:{t:`Six seagulls arrive for the fish. The cat watches the fight with interest, then comes down to supervise.`, fx:{wit:1}, go:'pay'}},
        {label:`Tamer: just ask him nicely.`, show:s=>s.cheat==='tamer',
          t:`You ask. He considers it. He comes down and sits on your head, which is apparently the deal.`, fx:{luck:1, cha:1}, go:'pay'}
      ]},
    tutor:{ scene:'library', text:`{q}'s nephew is eleven, wants to be a dragon, and has failed basic arithmetic three times. He's staring at you with the flat hostility of a child who has outlasted four tutors.\n\n"Numbers are fake," he informs you.`,
      choices:[
        {label:`Patience. Lots of patience.`, check:{stat:'cha', dc:13},
          win:{t:`It takes three afternoons, but he gets fractions, and then he gets *excited* about fractions. You did that.`, fx:{cha:1, wit:1}, go:'pay'},
          lose:{t:`He wins. Numbers remain fake. You learn a great deal about dragons.`, fx:{wit:1}, go:'pay'}},
        {label:`Turn it into a game.`, check:{stat:'wit', dc:12, job:{gamer:4, student:3}},
          win:{t:`Damage numbers, hit points, critical rolls. He's doing multiplication to kill goblins and doesn't even notice.`, fx:{wit:2}, go:'pay'},
          lose:{t:`He likes the game. He likes it so much he ignores the math. Progress, of a kind.`, fx:{luck:1}, go:'pay'}},
        {label:`"Dragons can't count, you know."`, show:s=>s.race==='dragon',
          t:`You show him your little horns. He gasps. "Dragons *can* count," he says. "I'll prove it." He does.`, fx:{cha:2}, go:'pay'}
      ]},
    rats:{ scene:'tavern', text:`The Gilded Goose's cellar is dark, damp, and full of rats the size of dogs. They have organized. One of them is wearing a thimble as a helmet.\n\n{q} hands you a lantern and a broom and closes the cellar door behind you very quickly.`,
      choices:[
        {label:`Broom. Charge.`, check:{stat:'combat', dc:13},
          win:{t:`You sweep them out of the cellar drain with the fury of a thousand housekeepers. The thimble rat salutes on his way out.`, fx:{str:1}, go:'pay'},
          lose:{t:`They counterattack in formation. You win eventually, bitten in several places.`, fx:{hp:-7, str:1}, go:'pay'}},
        {label:`Find where they're getting in.`, check:{stat:'wit', dc:13},
          win:{t:`A cracked drain behind the wine racks. You plug it and smoke them out. Clean, clever, done.`, fx:{wit:1}, go:'pay'},
          lose:{t:`You find three holes. There are four. It takes all night.`, fx:{hp:-5, wit:1}, go:'pay'}},
        {label:`Cook them something better upstairs.`, show:s=>s.cheat==='cook',
          t:`You leave a trail of divine crumbs out the back door. The rats follow it, in single file, into the river district, forever.`, fx:{cha:1}, go:'pay'}
      ]},
    pay:{ scene:'tavern', text:`Back at the Gilded Goose, {q} ({q.look}, {q.trait}, and visibly relieved) slaps a small purse on the counter.\n\n"Thirty gold," {q.he} says. "As posted. And not a copper more, so don't start."`,
      choices:[
        {label:`Take the money. Fair's fair.`, t:`{q} nods, satisfied. "You're welcome back anytime, student."`, fx:{gold:30, npc:{q:1}}},
        {label:`Haggle for more.`, check:{stat:'cha', dc:13, npc:'q'},
          win:{t:`"Fine! Fifty, and a pie, and get out of my inn." {q.He} is almost smiling.`, fx:{gold:50, cha:1}},
          lose:{t:`{q} takes ten back. "For the attitude."`, fx:{gold:20, npc:{q:-1}}}},
        {label:`Ask for a free dinner for you and {top}.`, show:s=>!!topComp(),
          t:`{q} feeds you both until you can't move. {top} declares it the best night of the term.`, fx:{relTop:1, heal:1, npc:{q:2}}}
      ]}
  }
});

const He = n => n.g==='f' ? 'She' : 'He';

const MINE = [

/* ---------------- 1. LINA ---------------- */
{
  id:'d_lina', stage:'adult', title:'The Girl from Mirebrook',
  blurb:'A familiar voice yells your name across the capital market. Lina has come to Asterhold with a bow, a sack of apples, and no plan.',
  scene:'market', minAge:17, dream:'love',
  cond: s=>rel('lina')>=4,
  cast:{ m:{role:'hunter'} },
  start:'a',
  beats:{
    a:{ scene:'market', text:`"{name}! *{name}!*" Someone vaults a fruit stall and tackles you into a pile of cabbages. Freckles. A bow. A sack of apples, slightly crushed now.\n\nLina grins down at you. "Surprise. The Royal Rangers hold tryouts next week, and I'm going to win them. Also I'm lost. Also your mother sent socks."\n\nShe smells like {home}: hay, woodsmoke, river water. Something in your chest unclenches.`, choices:[
      {label:'Show her the city first.', t:`She pretends to be unimpressed by everything, and fails every single time.`, fx:{rel:{lina:1}}, go:'tour'},
      {label:'"Tryouts? Then we train. Now."', t:`You drag her straight to the practice fields. She out-shoots you before lunch and is unbearable about it.`, fx:{str:1}, go:'trial'},
      {label:'Feed her at the café.', show:s=>s.path==='shop', t:`She eats four plates and declares it "almost as good as home," which in Mirebrook is the highest honor there is.`, fx:{rel:{lina:2}, cha:1}, go:'tour'},
      {label:'Let Puru say hello.', show:s=>s.flags.puru, t:`Puru leaps onto Lina's head and refuses to leave. She wears it like a hat for the rest of the day.`, fx:{rel:{lina:1}, luck:1}, go:'tour'}
    ]},
    tour:{ scene:'night', text:`You show her the glass bridges, the street of lanterns, the bakery that sells bread shaped like the king.\n\nLater, on a rooftop, she goes quiet. "The old oak by the river came down in a storm. The one we carved our names in." She picks at her bowstring. "Everything's changing back home. I didn't want you to change too."`, choices:[
      {label:'Tell her the truth about your past life.', t:`You tell her about the other world, about being {jobA}, about how you died. Lina listens without laughing once. "So I'm your second shot at a best friend," she says. "Good. I hate losing."`, fx:{rel:{lina:2}, cha:1}, log:'Told Lina the truth about your first life.', go:'trial'},
      {label:'Bet her you can still outshoot her.', check:{stat:'luck', dc:16},
        win:{t:`One wild shot spins the weathervane on the bell tower. Lina is furious. Lina is delighted. Lina demands a rematch.`, fx:{luck:1, rel:{lina:1}}, go:'trial'},
        lose:{t:`She shoots the weathervane, a chimney, and your hat. "Some things never change," she says, deeply satisfied.`, fx:{rel:{lina:1}}, go:'trial'}},
      {label:'"Then let\'s carve our names somewhere new."', show:s=>s.dream==='love'||s.dream==='free', t:`You carve both names into the rooftop beam, badly. She adds a little drawing of you falling in the river at age seven.`, fx:{rel:{lina:2}, luck:1}, go:'trial'}
    ]},
    trial:{ scene:'fields', text:`The Ranger tryouts are held outside the walls. Lina's arrows find the center of every target, which is why it's so obvious when the examiner, {m}, {m.look}, scores her below a noble's son who missed twice.\n\n{m} is {m.trait} and very interested in the purse the boy's father keeps jingling. Lina's jaw is set like a bear trap. You know that face. She is about to punch an official.`, choices:[
      {label:'Call out the rigged scoring.', check:{stat:'cha', dc:17, npc:'m'},
        win:{t:`The crowd takes your side, loudly. {m} rescores the round with a sickly smile, and Lina's name goes up first.`, fx:{cha:1, rel:{lina:1}, npc:{m:-2}, set:{passed:1}}, go:'home'},
        lose:{t:`{m} has you escorted off the field. Lina shoots the noble boy's hat off on her way out, which ends her tryout too.`, fx:{rel:{lina:1}, npc:{m:-2}}, go:'home'}},
      {label:'Demand a sudden-death shootout.', check:{stat:'luck', dc:15},
        win:{t:`The wind drops at the perfect moment. Lina splits the noble boy's arrow down the middle. Nobody can argue with that.`, fx:{luck:1, set:{passed:1}}, go:'home'},
        lose:{t:`A gust of wind ruins Lina's last shot. She stares at the sky like she's going to fight it.`, fx:{rel:{lina:1}}, go:'home'}},
      {label:'Appraise the noble boy\'s bow.', show:s=>s.cheat==='appraise', t:`[Enchanted Bow of Guaranteed Accuracy +5. Illegal in competition.] You hold it up for everyone to see. The boy is disqualified. So, quietly, is {m}.`, fx:{wit:1, rel:{lina:1}, set:{passed:1}}, go:'home'},
      {label:'Let Lina punch him.', t:`She does. It is a beautiful punch, the kind they will talk about in {home} for years. She's disqualified, and laughing about it.`, fx:{str:1, rel:{lina:2}}, log:'Watched Lina punch a corrupt examiner. Worth it.', go:'home'}
    ]},
    home:{ scene:'night', text:(s,v)=>`${v.passed?`Lina has a Ranger's badge now. She keeps touching it like it might fly away.`:`Lina is not a Ranger. She shrugs. "Next year. Or never. {home} needs a hunter anyway."`}\n\nYou sit on the city wall, watching the sun go down over the road home. She bumps your shoulder. "Hey. When all this is over, the demon stuff, the hero stuff... will you come home?"`, choices:[
      {label:'Kiss her before she can win this too.', show:s=>rel('lina')>=5, t:`For once, Lina has nothing to say. Then: "I was going to do that first." "Sure you were." "I *was*."`, fx:{flag:'linaRomance', rel:{lina:3}}, log:'Kissed Lina on the city wall. She claims she won.', go:'END'},
      {label:'"Home is wherever you\'re annoying me."', t:`She laughs so hard she nearly falls off the wall. Then she leans on you until the stars come out.`, fx:{rel:{lina:2}, cha:1}, go:'END'},
      {label:'"Stay. Fight beside me when it comes."', t:`"Obviously," she says. "Someone has to cover your back. You've never once looked behind you."`, fx:(s,v)=>({rel:{lina:2}, str:1, gold:v.passed?60:0}), log:'Lina vowed to fight at your side.', go:'END'}
    ]}
  }
},

/* ---------------- 2. SERAPHINE ---------------- */
{
  id:'d_sera', stage:'adult', title:'The Villainess Ball',
  blurb:'Seraphine sends a frost-sealed invitation to the Winter Ball. "As a witness. NOT as my date." Her fiancé is planning something.',
  scene:'palace', minAge:17,
  cond: s=>rel('sera')>=4,
  cast:{ f:{role:'noble', g:'m'} },
  start:'a',
  beats:{
    a:{ scene:'palace', text:`At the Winter Ball you learn why Seraphine wanted a witness. Her arranged fiancé, Lord {f.full}, {f.look}, has been telling everyone that tonight he'll "free himself from a cruel woman." On his arm clings a wide-eyed baron's daughter who keeps practicing her fainting.\n\nYou have read this light novel. You know exactly how this chapter goes: public accusation, broken engagement, villainess exiled to a convent. Not tonight.`, choices:[
      {label:'Warn Seraphine.', t:`You slip away from the dance floor to find her.`, go:'warn'},
      {label:'Quietly start gathering receipts.', t:`You smile, take a glass of something sparkling, and start counting exits and liars.`, fx:{wit:1}, go:'dig'},
      {label:'Ask Seraphine to dance. Rattle him.', check:{stat:'cha', dc:16},
        win:{t:`You waltz her past {f} three times. Every eye follows. He starts to sweat through his collar.`, fx:{cha:1, rel:{sera:2}}, go:'warn'},
        lose:{t:`You step on her foot twice. "Idiot," she says, almost fondly. Then she steers you onto the balcony.`, fx:{rel:{sera:1}}, go:'warn'}}
    ]},
