      {label:'Befriend whatever is behind the barrels.', show:s=>s.cheat==='tamer'||s.flags.puru, t:`It's a lost sewer slime, terrified and hungry. You lead it out to the river, rats following it like a parade.`, fx:{cha:1, luck:1}, go:'pay'}
    ]},
    poet:{ scene:'tavern', text:`{m}'s first public reading is at the noisiest tavern in town. {m} is {m.trait} and shaking like a leaf.\n\nTwo lines into the first poem, a drunk in the corner starts heckling. {m} freezes. The room goes quiet in the worst possible way.`, choices:[
      {label:'Shut down the heckler.', check:{stat:'cha', dc:15},
        win:{t:`One perfectly timed line, and the whole tavern laughs at the heckler instead. {m} finishes the poem to applause.`, fx:{cha:1, npc:{m:2}}, go:'pay'},
        lose:{t:`Your comeback lands flat. The heckler gets a bigger laugh. {m} finishes anyway, voice shaking.`, fx:{set:{half:1}}, go:'pay'}},
      {label:'Talk {m} through the panic.', check:{stat:'wit', dc:14, npc:'m', job:{nurse:5}},
        win:{t:`"Breathe in for four. Hold. Out for four." {m}'s hands stop shaking. The second poem is beautiful.`, fx:{wit:1, npc:{m:2}}, go:'pay'},
        lose:{t:`{m} breathes, panics, breathes, and finishes the reading at triple speed.`, fx:{set:{half:1}}, go:'pay'}},
      {label:'Read the next poem with {m}.', t:`You have no talent. It doesn't matter. The two of you get through it together, and the room ends up clapping out of sheer goodwill.`, fx:{npc:{m:3}, cha:1}, go:'pay'}
    ]},
    pay:{ scene:'market', text:(s,v)=>`${v.half?`It's not a flawless job, but it's done.`:`Job done, and done well.`} ${v.job==='cat'?`Lord Fluffington's owner, a duchess in tears, presses a purse into your hands.`:v.job==='cellar'?`The innkeeper pours you a drink and counts out coins.`:`{m} hugs you and tries to pay you in poems before remembering money exists.`}\n\nOn your way home you pass the notice board. Three new jobs have already gone up. Some things never change.`, choices:[
      {label:'Take the gold.', t:(s,v)=>v.half?`Half pay. Still, it's honest money.`:`Full pay, plus a tip.`, fx:(s,v)=>({gold:v.half?50:90}), go:'END'},
      {label:'Ask for a lesson instead of pay.', t:`The client teaches you a trick of their trade. You'll use it again.`, fx:(s,v)=>v.job==='cat'?{luck:1, cha:1}:v.job==='cellar'?{str:1, maxhp:2}:{cha:2}, go:'END'},
      {label:'"Don\'t pay me. Just remember me."', t:`They will. Word gets around about the one who works for free.`, fx:(s,v)=>({fame:2, npc:{m:1}}), go:'END'},
      {label:'"Owe me one, {m}."', show:(s,v)=>v.job==='poet', t:`{m} solemnly swears to write you an epic someday, and to come if you ever need a voice.`, fx:{seed:{k:'owed', npc:'m'}, npc:{m:1}}, go:'END'}
    ]}
  }
}

];
const withCast = f => typeof f==='function' ? (s,v)=>f(s,v,castObj()) : f;
MINE.forEach(a=>{ for(const b of Object.values(a.beats)){ b.text = withCast(b.text); (b.choices||[]).forEach(ch=>{ ch.label = withCast(ch.label); [ch, ch.win, ch.lose].forEach(br=>{ if(br) br.t = withCast(br.t); }); }); } });
ARCS.push(...MINE);
})();

(function(){
  // path flavor: pick a line by S.path, falling back to `none` then `adv`

  const useOwed = ()=>{ const n = seedNpc('owed'); return n ? {useSeed:{k:'owed', npc:n.id}, set:{owedName:n.name}} : {}; };

/* ---------------------------------------------------------
   1. THE DRAGON OF ASHPEAK
   --------------------------------------------------------- */
{
  id:'w_dragon', stage:'adult', minAge:17, maxAge:24,
  title:'The Cattle Thief of Ashpeak',
  blurb:'Twelve cows gone in a month near Ashpeak, and a pasture scorched in a perfect circle. Farmer {f} swears it was a dragon. A young one.',
  scene:'mountains', dream:'hero',
  cast:{ f:{role:'farmer'} },
  start:'a',
  beats:{
    a:{ scene:'fields', text:(s)=>PF(s,{
        adv:`The guild board has a new notice in panicked capitals: DRAGON. CATTLE. PLEASE. The reward is decent. The handwriting is worse.`,
        shop:`Your beef supplier, {f}, bursts into {place} smelling of smoke. "No more brisket," {f.he} gasps. "Not until someone deals with the dragon."`,
        crown:`A writ lands on your desk under the Order's seal: *Investigate draconic livestock losses, Ashpeak.* Someone has drawn a small, sad cow in the margin.`
      })+`\n\nAt the foot of Ashpeak, {f} {f.look} points at a scorched pasture. "Red as a forge. Size of a barn. Young, I think. It misses half its swoops."`,
      choices:[
        {label:'Track it up the mountain.', check:{stat:'wit', dc:15},
          win:{t:'Claw-marks on the scree, a trail of very well-chewed bones. You find the cave by noon.', fx:{wit:1}, go:'lair'},
          lose:{t:'You lose the trail in the rocks. Then something large blots out the sun behind you.', fx:{hp:-8}, go:'sky'}},
        {label:'Bait a trap with the fattest cow.', check:{stat:'wit', dc:16},
          win:{t:'At dusk a red shape drops onto the cow and straight into your net. The cow is fine. The cow is unbothered.', fx:{luck:1, set:{how:'net'}}, go:'wounded'},
          lose:{t:'The dragon takes the cow, the net and half the fence, then comes back for you.', fx:{hp:-10}, go:'sky'}},
        {label:'Sniff the smoke. That smells like family.', show:s=>s.race==='dragon',
          t:'The smoke smells the way your own blood feels when you are angry. Somewhere up this mountain is kin.', fx:{set:{kin:true}}, go:'lair'},
        {label:'Whistle the way monsters like.', show:s=>s.cheat==='tamer',
          t:'A raven lands on your shoulder, listens, sighs, and leads you straight to a cave.', fx:{cha:1, set:{kin:true}}, go:'lair'}
      ]},
    lair:{ scene:'mountains', text:(s,v)=>`The cave smells of smoke and loneliness. The dragon is young: a gangly red adolescent, all wings and elbows, curled around a pile of bones. An old arrow is still lodged in her torn left wing.\n\nBehind her, half buried in ash, lies a far larger skull. She bares her teeth at you, and her teeth are shaking.`+(v.kin?`\n\nShe sniffs, startled. "You smell like *us*," she rumbles.`:''),
      choices:[
        {label:'Fight her.', check:{stat:'combat', dc:19},
          win:{t:'It is ugly and hot, and in the end she is on her side in the ash, panting.', fx:{str:2, set:{how:'fight'}}, go:'wounded'},
          lose:{t:'She fights like something with nothing left to lose. You leave the cave partly on fire, and she takes another cow that night.', fx:{hp:-16}, go:'END'}},
        {label:'"We can work this out."', check:{stat:'cha', dc:17},
          win:{t:'She hesitates. Nobody has talked to her in a long time. She lowers her head, just slightly.', fx:{cha:1}, go:'deal'},
          lose:{t:'She does not trust talking things. The last talking things had arrows.', fx:{hp:-10}, go:'sky'}},
        {label:'Hold out your hand. Slowly.', show:(s,v)=>v.kin || s.cheat==='tamer', check:{stat:'cha', dc:14, cheat:{tamer:6}, race:{dragon:5}},
          win:{t:'A long, smoky sniff. Then her snout touches your palm, warm as a kettle.', fx:{cha:1}, go:'friend'},
          lose:{t:'She singes your sleeve, but she does not leave. She is listening.', fx:{hp:-8}, go:'deal'}},
        {label:'Cook her something better than raw cow.', show:s=>s.cheat==='cook'||s.job==='chef', check:{stat:'cha', dc:15, cheat:{cook:6}, job:{chef:4}},
          win:{t:'Seared, seasoned, glazed with mountain honey. She eats it in one bite, then looks at you like you are a miracle.', fx:{cha:1}, go:'friend'},
          lose:{t:'She eats it, pan included, then studies you as if you might be dessert.', fx:{hp:-8}, go:'deal'}}
      ]},
    sky:{ scene:'mountains', text:`A shadow, a roar, a wall of heat. The dragon drops out of the sky between you and everything you would like to run toward.\n\nUp close she is young and thin, one wing torn, eyes far too frightened for something that big. She draws a breath. The air begins to shimmer.`,
      choices:[
        {label:'Stand your ground.', check:{stat:'combat', dc:18},
          win:{t:'You duck the flame and hit hard. She crashes into the pasture in a spray of turf.', fx:{str:1, set:{how:'fight'}}, go:'wounded'},
          lose:{t:'The flame clips you. When the smoke clears she is gone, and so is another cow.', fx:{hp:-14}, log:'Lost a cow, and your eyebrows, to the Ashpeak dragon.', go:'END'}},
        {label:'"Wait! I just want to talk!"', check:{stat:'cha', dc:17},
          win:{t:'The flame dies in her throat with a confused hiccup. "...Talk?"', fx:{cha:1}, go:'deal'},
          lose:{t:'She does not want to talk. She wants the cow. She gets both the cow and your hat.', fx:{hp:-12}, go:'END'}},
        {label:'Throw her your lunch.', check:{stat:'luck', dc:15},
          win:{t:'She catches the sandwich out of reflex, chews, and blinks. Ham. She has never had ham.', fx:{luck:1}, go:'deal'},
          lose:{t:'She eats the lunch, then the lunchbox, then sets your coat on fire for good measure.', fx:{hp:-8}, go:'END'}}
      ]},
    wounded:{ scene:'fields', text:(s,v)=>(v.how==='net'?`She thrashes in the net, then gives up and just lies there, sides heaving.`:`She lies in the scorched grass, too tired to rise.`)+`\n\nUp close, the arrow in her wing is old and the wound around it angry. She cannot fly properly. She cannot hunt goats on the cliffs. Cows are slow.\n\nShe is not a monster. She is a teenager who has been hungry for a very long time.`,
      choices:[
        {label:'Finish it. A bounty is a bounty.', t:'It is quick. {f} pays the bounty and does not meet your eyes. Neither does anyone at the tavern, for a while.', fx:{gold:200, fame:2, str:1}, log:'Slew the young red dragon of Ashpeak.', go:'END'},
        {label:'Pull the arrow and bind the wing.', check:{stat:'wit', dc:15, job:{nurse:5}},
          win:{t:'Clean and fast. She shrieks once, then goes very still, staring at you.', fx:{wit:1}, go:'friend'},
          lose:{t:'She bites. Not hard, for a dragon. Then she lets you try again.', fx:{hp:-8}, go:'friend'}},
        {label:'Cut her loose. Let her go.', t:'She flees north, wing dragging. The cattle stop vanishing. You hope she finds somewhere kinder.', fx:{luck:1}, go:'END'}
      ]},
    deal:{ scene:'mountains', text:`She listens. Her name, she says, is Cinder. The big skull was her mother. Knights, three winters back.\n\n"I don't *like* taking cows," she says, very quietly for a dragon. "I just don't like being hungry more."\n\n{f} has followed you up the mountain, pitchfork shaking.`,
      choices:[
        {label:'"{f}, a dragon is cheap security."', check:{stat:'cha', dc:16, npc:'f'},
          win:{t:'One cow a month, and no wolf, bandit or tax collector ever troubles {f}\'s valley again. {f} shakes a claw, then your hand.', fx:{cha:2, gold:80, npc:{f:2}, seed:{k:'owed', npc:'f'}, flag:'dragonFriend'}, log:'Brokered a cattle treaty between a farmer and a dragon.', go:'END'},
          lose:{t:'{f} refuses to "pay rent to a lizard." Cinder flies north, hungry. You did your best.', fx:{npc:{f:-1}}, go:'END'}},
        {label:'"Let me look at that wing."', t:'She holds very still while you climb up beside the old arrow.', go:'friend'}
      ]},
    friend:{ scene:'mountains', text:`By evening the arrow is out and Cinder is lying with her enormous head in your lap. She is very warm and very heavy.\n\n"Nobody has touched me since Mama," she says. "Will you come back? Not for anything. Just to come back."`,
      choices:[
        {label:'"Every spring. I promise."', t:'She makes a sound like a kettle having feelings. You make it back down the mountain smelling of smoke and very happy.', fx:{cha:1, luck:1, flag:'dragonFriend'}, log:'Befriended Cinder, a young red dragon.', go:'END'},
        {label:'"Can I... ride you?"', check:{stat:'luck', dc:14},
          win:{t:'She cannot fly far yet, but far enough. Ashpeak spins below you and you scream the whole way, happily.', fx:{fame:2, luck:1, flag:'dragonFriend'}, log:'Rode a red dragon over Ashpeak.', go:'END'},
          lose:{t:'She tries. You both land in a lake. She laughs so hard she sneezes fire.', fx:{hp:-8, flag:'dragonFriend'}, log:'Befriended Cinder, a young red dragon.', go:'END'}},
        {label:'"{f}, I\'ll pay for the cows."', req:s=>s.gold>=100, reqText:'Needs 100 gold',
          t:'You count out a hundred gold. {f} stares, then laughs. "For that, she can have Tuesdays too."', fx:{gold:-100, npc:{f:3}, seed:{k:'friend', npc:'f'}, flag:'dragonFriend', cha:1}, log:'Paid off a dragon\'s debts. Made two friends.', go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   2. THE GIRL WITH THE DIAMOND
   --------------------------------------------------------- */
{
  id:'w_princess', stage:'adult', minAge:17, maxAge:24,
  title:'The Girl with the Diamond',
  blurb:'A girl in a far-too-nice cloak is trying to pay for an apple with a diamond. A man in grey is watching her very closely.',
  scene:'market', dream:'love',
  cast:{ m:{role:'merchant'}, x:{role:'thief'} },
  start:'a',
  beats:{
    a:{ scene:'market', text:(s)=>`At {m}'s fruit stall, a girl in a cloak far too nice for this street (velvet, gold thread, a royal lion embroidered right on the hood) holds out a diamond the size of a quail's egg.\n\n"For the apple," she says brightly. "Keep the change."\n\n{m}'s eyes go round, then greedy. Across the square, a man in grey stops pretending to read a poster.`+(s.path==='crown'?`\n\nYou know that face. It hangs in the Order's mess hall. That is Princess Aria, and she should not be here.`:''),
      choices:[
        {label:'Pay for her apple myself.', t:'You flip {m} a copper. The girl stares as if you did a magic trick. "Is *that* what money looks like?"', fx:{cha:1}, go:'tour'},
        {label:'Appraise the girl.', show:s=>s.cheat==='appraise', t:'*Aria Valcrest. Princess. Status: Runaway (3 hours). Warning: Targeted.* Oh no.', fx:{wit:1, set:{warned:true, knows:true}}, go:'tour'},
        {label:'"Your Highness, put that away."', check:{stat:'wit', dc:14}, auto:s=>s.path==='crown',
          win:{t:'She goes pale, then pink. "I\'m *Ari*," she hisses. "A perfectly normal commoner. Please."', fx:{wit:1, set:{knows:true}}, go:'tour'},
          lose:{t:'"What diamond?" She hides it, and you are, apparently, now her accomplice.', go:'tour'}},
        {label:'Not my business. Walk on.', t:'Ten steps later the man in grey slides past you, toward the girl. Not your business. Your feet turn around anyway.', go:'alley'}
      ]},
    tour:{ scene:'capital', text:`She introduces herself as "Ari, a commoner, from the common... street." She has never held money, never queued, never eaten anything off a stick.\n\nShe would like to do all of those things. Right now. Please.\n\nEvery time you turn around, the man in grey is three stalls back.`,
      choices:[
        {label:'Take her to {place}.', t:s=>s.path==='shop'?'She insists on working the counter. She is terrible at it. Your regulars adore her.':'She orders "whatever the brave people drink," chokes on it, and is delighted.', fx:{cha:1}, go:'alley'},
        {label:'Show her the real city.', t:'The Low Ward: the soup line, the barefoot kids, the wells nobody fixes. She is quiet for a long time. "None of this is in my lessons."', fx:{wit:1, set:{slums:true}}, go:'alley'},
        {label:'Teach her to haggle with {m}.', check:{stat:'cha', dc:15, npc:'m'},
          win:{t:'Together you get {m} down to two apples for a copper and a compliment. Aria is radiant.', fx:{cha:1, npc:{m:1}}, go:'alley'},
          lose:{t:'{m} wins. Aria pays a silver for one apple and calls it "a valuable lesson in economics."', fx:{luck:1}, go:'alley'}}
      ]},
    alley:{ scene:'night', text:(s,v)=>`Dusk, a shortcut, an empty lane. The man in grey drops from a roof without a sound: {x} {x.look}, a long knife already moving toward Aria's throat.`+(v.warned?`\n\nYou were ready for this. Appraisal said *Targeted*, and you believed it.`:`\n\nThere is no time to think.`),
      choices:[
        {label:'Throw myself between them.', check:{stat:'combat', dc:17, npc:'x', extra:(s,v)=>v.warned?[['Forewarned',3]]:[]},
          win:{t:'Steel rings on steel. {x} hits the cobbles and stays there.', fx:{str:1, set:{caught:true}}, go:'after'},
          lose:{t:'The knife meant for her finds your arm instead. {x} flees over the rooftops.', fx:{hp:-14}, go:'after'}},
        {label:'Drag her into the crowd.', check:{stat:'luck', dc:16},
          win:{t:'You dive into the evening market, all lanterns and noise. {x} does not dare follow.', fx:{luck:1}, go:'after'},
          lose:{t:'You make it. Mostly. {x}\'s knife opens your side on the way.', fx:{hp:-10}, go:'after'}},
        {label:'Freeze the cobbles under him.', show:s=>s.st.mag>=8||s.cheat==='mana', check:{stat:'mag', dc:17, npc:'x'},
          win:{t:'{x} skids, flails, and meets the wall face first.', fx:{mag:1, set:{caught:true}}, go:'after'},
          lose:{t:'The ice forms under *you*. You still get in the way of the knife, which is something.', fx:{hp:-12}, go:'after'}},
        {label:(s,v)=>`Shout for ${owedName(v)}. Favor's due.`, show:s=>hasSeed('owed'),
          t:(s,v)=>`${owedName(v)} happens to be two streets away, and comes running with friends. {x} takes one look and is captured trying to leave.`, fx:s=>merge(useOwed(), {set:{caught:true, owedName:owedName()}}), go:'after'}
      ]},
    after:{ scene:'capital', text:(s,v)=>`It is over. Aria sits on a crate, apple still in her hand, shaking.\n\n"Everyone at the palace smiles at me like a contract," she says. `+(v.knows?`"You knew who I was, and you still just bought me an apple."`:`"You bought me an apple. You didn't even know who I was."`)+` She laughs, wetly. "Sorry. I'm Aria. The princess. Obviously."`,
      choices:[
        {label:'Walk her home to the palace.', t:s=>s.path==='crown'?'The Captain of the Order meets you at the gate, looks at the princess, looks at you, and quietly rewrites your future for the better.':'The palace guards nearly arrest you until Aria stamps her foot. You leave with a royal favor and an invitation to tea.',
          fx:s=>({flag:'princess', fame:s.path==='crown'?4:3, cha:1}), log:'Saved Princess Aria from an assassin. Became her friend.', go:'END'},
        {label:'Question the assassin.', show:(s,v)=>v.caught, check:{stat:'wit', dc:16, npc:'x'},
          win:{t:'{x} talks, eventually. The gold came from a robed broker with a black sun on his ring. Aria hears every word.', fx:{wit:1, flag:'princess', seed:'clue'}, log:'Saved Princess Aria. Her assassin was paid by the Black Sun.', go:'END'},
          lose:{t:'{x} just smiles. By morning {x.he} has escaped the cells. Someone let {x.him} out. Aria sends you a note: *Thank you. Be careful.*', fx:{flag:'princess', seed:{k:'grudge', npc:'x'}}, log:'Saved Princess Aria from an assassin.', go:'END'}},
        {label:'Let the assassin go.', show:(s,v)=>v.caught, t:'{x} is barely older than you and all ribs. "It was a job," {x.he} mutters. You step aside. {x.He} runs. Aria watches and says nothing, and later, at tea, says thank you.', fx:{luck:1, flag:'princess', seed:{k:'spared', npc:'x'}, npc:{x:2}}, log:'Saved Princess Aria, and let her assassin go.', go:'END'},
        {label:'Slip away before the guards come.', t:'You leave her with a patrol and vanish. Royals mean paperwork. Still, you catch yourself watching the palace balconies for weeks.', fx:{luck:1}, go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   3. THE PROTAGONIST
   --------------------------------------------------------- */
{
  id:'w_kenji', stage:'adult', minAge:17, maxAge:22,
  title:'The Protagonist',
  blurb:'The kingdom has summoned an official Hero from Earth. His name is Kenji, he is seventeen, and he would like you to know he is the main character.',
  scene:'palace', dream:'hero',
  start:'a',
  beats:{
    a:{ scene:'palace', text:(s)=>`Trumpets, confetti, a crowd. On the palace steps stands the kingdom's freshly summoned Hero: Kenji, seventeen, backwards cap, holy sword in a scabbard that still has the price tag on.\n\n"Stand back, NPCs," he announces. "I'm the protagonist."\n\n`+PF(s,{
        adv:`Then he cuts the guild queue. In front of you.`,
        shop:`Then he strolls into {place}, orders "the strongest coffee in this medieval dump," and does not pay.`,
        crown:`Then your captain points at you. You are his official escort. For a year.`}),
      choices:[
        {label:'Challenge him to a duel.', t:'"A duel? With a side character?" He grins. "Sure. Tutorial fight."', go:'duel'},
        {label:'"...Konbini no onigiri ga koishii na."', t:'Kenji freezes mid-swagger. His mouth opens. Nothing comes out. That night, he finds you alone.', go:'home'},
        {label:'Appraise the Hero.', show:s=>s.cheat==='appraise', t:'*Kenji Takahashi. Lv 4. Title: Hero (Provisional). Status: Homesick, Terrified, Pretending.* Huh.', fx:{wit:1}, go:'home'},
        {label:'Ignore him. Wait.', t:'Some lessons teach themselves. You go back to your day.', go:'fail'}
      ]},
    duel:{ scene:'palace', text:`The palace yard. Kenji plays to the crowd, spinning his sword. He is fast, cheat-skill fast, but he fights like someone who learned from anime openings: huge wind-ups, a pose after every swing.\n\nHe points his blade at you. "Prepare yourself, first boss!"`,
      choices:[
        {label:'Fight seriously.', check:{stat:'combat', dc:18},
          win:{t:'Two exchanges. On the third he is on his back, cap in the dirt, staring at the sky like it lied to him.', fx:{str:2, fame:2}, go:'humbled'},
          lose:{t:'He wins, then just stands there, waiting for a victory jingle that never plays.', fx:{hp:-12, set:{lost:true}}, go:'humbled'}},
        {label:'Read his tells like a tutorial boss.', show:s=>s.job==='gamer', check:{stat:'wit', dc:15, job:{gamer:5}},
          win:{t:'Wind-up, pose, swing. Wind-up, pose, swing. You sidestep four times and tap him on the head.', fx:{wit:2, fame:1}, go:'humbled'},
          lose:{t:'He has a second phase. Of course he has a second phase.', fx:{hp:-10, set:{lost:true}}, go:'humbled'}},
        {label:'"Who taught you to swing like that?"', check:{stat:'cha', dc:16},
          win:{t:'"...Nobody," he says, and lowers the sword. The crowd boos. He does not hear them.', fx:{cha:1}, go:'home'},
          lose:{t:'He does not want to talk. He wants to win, and does.', fx:{hp:-10, set:{lost:true}}, go:'humbled'}}
      ]},
    fail:{ scene:'dungeon', text:`Three days later a guild runner finds you, out of breath. The Hero went into the Goblin Warrens alone, "for the tutorial dungeon," and has not come out.\n\nYou find him in a pit, holy sword wedged in the ceiling, surrounded by goblins who mostly seem confused about what to do with him.`,
      choices:[
        {label:'Jump in swinging.', check:{stat:'combat', dc:16},
          win:{t:'Goblins scatter. You haul Kenji out by the collar like a wet cat.', fx:{str:1}, go:'humbled'},
          lose:{t:'You get him out, but the goblins get a few licks in.', fx:{hp:-12}, go:'humbled'}},
        {label:'Negotiate with the goblins.', check:{stat:'cha', dc:15},
          win:{t:'They accept two loaves and an apology. Kenji has never been so humiliated in either life.', fx:{cha:1}, go:'humbled'},
          lose:{t:'They accept the bread, then throw rocks anyway. On principle.', fx:{hp:-8}, go:'humbled'}},
        {label:'Ask the goblins nicely to leave.', show:s=>s.cheat==='tamer', t:'The goblins take one look at you, coo, and wander off holding hands. Kenji stares. "What *is* your cheat?"', fx:{cha:1}, go:'humbled'}
      ]},
    home:{ scene:'night', text:`A rooftop, late. Kenji sits on the edge with his cap in his hands. Without the swagger he looks fifteen.\n\n"Back home I was nobody," he says. "Back row. Games all night. Then a magic circle, and suddenly everyone calls me a hero." He swallows. "The Demon Lord's real, isn't he. Like, actually real."\n\nBelow you, Asterhold glows. Not a single convenience store in sight.`,
      choices:[
        {label:'Tell him what you miss most.', t:s=>({chef:'You talk about the yakitori stand behind your old restaurant. He talks about his mom\'s curry. You both get very hungry.', nurse:'You tell him about vending-machine coffee at 4 a.m. on the ward. He tells you about his little sister. He has not said her name out loud since he got here.', office:'You tell him about the last train home. He laughs, then stops laughing, and tells you about the window seat he always took.', gamer:'You argue about your favorite RPG for an hour. He is wrong about all of it. It is the best hour he has had here.', student:'You trade the endings of light novels neither of you will ever get to finish. He takes it harder than you expect.'})[s.job]||'You talk until the stars move.',
          fx:{cha:1, flag:'kenjiAlly'}, log:'Bonded with Hero Kenji over everything you both left behind.', go:'END'},
        {label:'Tell him how you died.', t:'He stares. Then he laughs until he cries, and then he just cries. "Okay," he says. "Second chances. I can do second chances."', fx:{wit:1, flag:'kenjiAlly'}, log:'Told Hero Kenji how you died. He told you how scared he was.', go:'END'},
        {label:'"Toughen up. You\'re the Hero."', t:'"Right," he says, flat. "Protagonist. Got it." He does not come looking for you again.', fx:{str:1}, go:'END'}
      ]},
    humbled:{ scene:'capital', text:(s,v)=>(v.lost?`Kenji won, but he does not look like it.`:`Kenji sits in the dirt, fishing his cap out of a puddle.`)+` "This isn't how it goes," he mutters. "The protagonist doesn't... the protagonist always..."\n\nHe trails off. For the first time, he looks at you like you might be a person instead of a side character.`,
      choices:[
        {label:'"Train with me. Properly."', check:{stat:'str', dc:15},
          win:{t:'Footwork at dawn, every day for a month. He complains constantly. He also gets good.', fx:{str:1, flag:'kenjiAlly'}, log:'Trained the summoned Hero, Kenji. He got good.', go:'END'},
          lose:{t:'You both get very good at falling down. It counts as bonding.', fx:{hp:-8, flag:'kenjiAlly'}, log:'Trained the summoned Hero, Kenji, mostly by falling over.', go:'END'}},
        {label:'Rub it in. Strike a pose.', t:'You do a little victory pose of your own. The crowd loves it. Kenji requests a different escort, and a different city.', fx:{fame:3}, go:'END'},
        {label:'"Come on. I\'ll buy you dinner."', t:'"There\'s no ramen here," you warn him. "I know," he says miserably. You find the closest thing, and then a roof to eat it on.', go:'home'}
      ]}
  }
},

/* ---------------------------------------------------------
   4. THE STRANGER IN THE CORNER (Mal)
   --------------------------------------------------------- */
{
  id:'w_stranger', stage:'adult', minAge:17, maxAge:24,
  title:'The Stranger in the Corner',
  blurb:'A pale, hooded man has been sitting in the corner of {place} for hours with nothing in front of him. Nobody remembers him coming in.',
  scene:'night', dream:'love',
  weight:s=>s.path==='shop'?1.6:1,
  start:'a',
  beats:{
    a:{ scene:'night', text:(s)=>(s.path==='shop'?`Closing time at {place}. Rain on the windows, chairs up on the tables, and one customer you cannot remember letting in.`:`Late at the tavern. Rain on the shutters, the fire burning low, and one customer nobody remembers letting in.`)+`\n\nHe sits in the corner: pale, hooded, very still, nothing in front of him. When you finally ask if he wants anything, he looks up with eyes the color of old frost.\n\n"I haven't eaten in three hundred years," he says politely. "I've forgotten how to begin."`,
      choices:[
        {label:'"Then let me cook for you."', check:{stat:'cha', dc:15, cheat:{cook:6}, job:{chef:4}},
          win:{t:'You make the simplest thing you know, the way someone once made it for you, long ago and far away.', fx:{cha:1}, go:'meal'},
          lose:{t:'It burns a little at the edges. You serve it anyway, apologizing.', fx:{set:{burnt:true}}, go:'meal'}},
        {label:'Sit down across from him.', t:'You pull out a chair. He looks at it as though no one has ever done this before.', fx:{set:{sat:true}}, go:'talk'},
        {label:'Appraise him.', show:s=>s.cheat==='appraise', t:'The window flickers. *Name: Mal—* The rest is smudged, as if the world itself is embarrassed. Only one line is clear. *Status: Lonely.*', fx:{wit:1, set:{appraised:true}}, go:'talk'},
        {label:'"Sorry, we\'re closing."', t:'He nods as if he expected nothing else, stands, and walks out into the rain.', go:'rain'}
      ]},
    meal:{ scene:'cafe', text:(s,v)=>`He holds the spoon like a foreign artifact. After the first bite he just sits there. After the second, his shoulders begin to shake.\n\n"Warm," he says. "I'd forgotten warm." He wipes his face with a very pale hand.`+(v.burnt?` "And a little burnt. My sister always burnt it too."`:` "My sister made something like this. Before the winter that didn't end."`)+`\n\nHe eats the rest slowly, like someone memorizing it.`,
      choices:[
        {label:'"What happened that winter?"', t:'He sets the spoon down very carefully.', fx:{set:{asked:true}}, go:'talk'},
        {label:'Let him eat. Refill his cup.', t:'You do not ask. You refill his cup, then yours, and sit with him while the rain does the talking.', fx:{luck:1}, go:'dawn'}
      ]},
    talk:{ scene:'tavern', text:(s,v)=>`He tells you about a country in the far north where the snow forgot to stop. Three harvests failed. The children went first, then the old.\n\n"I wrote to the southern king. Eleven letters. I asked for grain." He smiles without humor. "He sent soldiers. After that I did things I'm told were very bad. I suppose they were."\n\nHe looks at you. "What would you have done?"`+(v.appraised?`\n\n*Status: Lonely* flickers at the edge of your sight.`:''),
      choices:[
        {label:'"I\'d have been furious too."', t:'He blinks, as if you handed him something heavy he did not expect to be allowed to put down.', fx:{cha:1, set:{talked:true}}, go:'dawn'},
        {label:'"Anger doesn\'t make a war right."', t:'"No," he agrees quietly. "It doesn\'t. Thank you for not pretending."', fx:{wit:1, set:{talked:true}}, go:'dawn'},
        {label:'"The northern famine. I\'ve read about it."', show:s=>!!s.flags.lore, t:'His cup stops halfway to his mouth. "Someone remembers," he whispers. "Someone actually remembers."', fx:{wit:1, cha:1, set:{talked:true}}, go:'dawn'},
        {label:'"I met a demon girl once. Pia."', show:s=>!!s.flags.demonKid, t:'For the first time, he truly smiles. "Pia," he says, "is a menace. I\'m so glad she met you."', fx:{cha:1, set:{talked:true}}, go:'dawn'}
      ]},
    dawn:{ scene:'cafe', text:`The rain stops. Grey light creeps across the floor. He stands, and for a moment he seems taller than the room ought to allow.\n\nHe sets a coin on the table: gold, stamped with a king three centuries dead. "For the meal. And the chair." He hesitates at the door. "Might I come back? I find I'd like to."`,
      choices:[
        {label:'"Same table\'s yours. Anytime."', t:'He bows, a little stiffly, like a man remembering how. The bell above the door does not ring when he leaves, but the room stays warm.', fx:{cha:2, gold:60, flag:'malBond'}, log:'Shared a long, rainy night with a pale stranger named Mal.', go:'END'},
        {label:'"Next time, bring dessert."', t:'He laughs: a rusty, startled sound, like a door unopened for centuries. "Dessert," he repeats. "Yes. I can manage dessert."', fx:{luck:2, gold:60, flag:'malBond'}, log:'Told a pale stranger named Mal to bring dessert next time.', go:'END'},
        {label:'"Wait. Who *are* you?"', check:{stat:'wit', dc:17},
          win:{t:'You see it: the frost in his eyes, the hush in the air, the three hundred years. He sees you see it. "Malgrave," he says softly. "But Mal, to people who feed me. Will you scream?" You do not. He looks almost grateful.',
            fx:(s,v)=>({wit:2, flag:v.talked?['malBond','lore']:'malBond'}), log:'Realized the pale stranger was the Demon Lord. Did not scream.', go:'END'},
          lose:{t:'He only smiles. "Someone who was hungry for a very long time." Then he is gone, and the bell has not rung.', fx:{gold:60, flag:'malBond'}, log:'Fed a pale stranger named Mal. He promised to come back.', go:'END'}}
      ]},
    rain:{ scene:'night', text:`Through the window you watch him walk away toward the north gate, hood down, letting the rain soak him as though he cannot feel it.\n\nOn his table he has left a coin: gold, very old, and cold as ice to the touch.`,
      choices:[
        {label:'Run after him with an umbrella.', t:'You catch him at the corner. He stares at the umbrella like it is a miracle. "Come back inside," you say. "Kitchen\'s still warm."', fx:{luck:1, set:{sat:true}}, go:'talk'},
        {label:'Let him go.', t:'You lock up. Over the next months the frost in the north thickens. You never quite forget his face.', fx:{gold:50, omen:1}, log:'Turned away a pale stranger on a rainy night.', go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   5. HORNS AND BREAD (Pia)
   --------------------------------------------------------- */
{
  id:'w_pia', stage:'adult', minAge:17, maxAge:24,
  title:'Horns and Bread',
  blurb:'Torches in Tanner\'s Square. A mob has cornered a little girl with stubby horns and a stolen loaf of bread.',
  scene:'night', dream:'love',
  cast:{ m:{role:'smith'} },
  start:'a',
  beats:{
    a:{ scene:'night', text:`Torches in Tanner's Square. At the center of a crowd, a little girl is backed against the fountain, clutching a loaf of bread to her chest. Stubby horns poke through her hair. Her eyes are red and enormous and trying very hard not to cry.\n\n"Demon spawn!" roars {m} {m.look}, at the front. "Thief! Spy! Probably both!"\n\nSomeone picks up a rock.`,
      choices:[
        {label:'Step in front of her.', t:'You do not think about it. You are just suddenly standing there, between a child and a rock.', go:'mob'},
        {label:'Lower your hood. Let them see.', show:s=>s.race==='demon', check:{stat:'cha', dc:16, npc:'m', race:{demon:4}},
          win:{t:'Red eyes, like hers. "She\'s a child," you say. "Want to try me instead?" Nobody does.', fx:{cha:2}, go:'pia'},
          lose:{t:'"There\'s two of them!" The rock comes anyway.', fx:{hp:-10}, go:'mob'}},
        {label:'Pay for the bread. Loudly.', req:s=>s.gold>=50, reqText:'Needs 50 gold', check:{stat:'cha', dc:15, npc:'m'},
          win:{t:'You slap fifty gold on the baker\'s cart. "That\'s a lot of bread," someone mutters. The fury goes out of the crowd like air from a bladder.', fx:{gold:-50, cha:1}, go:'pia'},
          lose:{t:'"It\'s not about the bread!" says {m}, though it clearly was a minute ago.', fx:{gold:-50}, go:'mob'}},
        {label:'Kick over a torch. Grab her.', check:{stat:'luck', dc:16},
          win:{t:'Smoke, shouting, and you are three alleys away with a horned child under one arm.', fx:{luck:1}, go:'pia'},
          lose:{t:'You get her out, but {m} gets a good look at your face, and a good swing.', fx:{hp:-10, seed:{k:'grudge', npc:'m'}, npc:{m:-2}}, go:'pia'}}
      ]},
    mob:{ scene:'night', text:`{m} squares up to you, torch high. The crowd shifts behind {m.him}: scared, angry, waiting for someone to tell them what to feel.\n\n"Demons burned my grandfather's village," {m} says. "Step aside."\n\nBehind you, the girl has grabbed a fistful of your coat and is holding on.`,
      choices:[
        {label:'"She\'s a child. Look at her."', check:{stat:'cha', dc:17, npc:'m'},
          win:{t:'{m} looks. Really looks. The torch lowers. "...She\'s so small," {m.he} mutters, and the crowd melts away.', fx:{cha:1, npc:{m:2}}, go:'pia'},
          lose:{t:'A rock clips your temple. You get her out anyway, bleeding, and {m} will not forget your face.', fx:{hp:-10, seed:{k:'grudge', npc:'m'}, npc:{m:-2}}, go:'pia'}},
        {label:'Make them back off.', check:{stat:'str', dc:15, npc:'m'},
          win:{t:'You do not draw. You do not need to. {m} looks at you and decides to be somewhere else.', fx:{str:1, npc:{m:-2}, seed:{k:'grudge', npc:'m'}}, go:'pia'},
          lose:{t:'It turns into a brawl. You carry her out of it, but not cleanly.', fx:{hp:-12}, go:'pia'}},
        {label:'"Royal Order. Disperse. Now."', show:s=>s.path==='crown', t:'The crest on your coat does what words cannot. The crowd scatters, grumbling.', fx:{fame:1}, go:'pia'},
        {label:'Rook steps out of the dark.', show:s=>met('rook'), t:'Rook looms up beside you, all seven feet of growling wolf. The mob reconsiders its entire evening.', fx:{rel:{rook:1}}, go:'pia'}
      ]},
    pia:{ scene:'night', text:(s)=>`Behind a rain barrel, the girl eats the bread in tiny, careful bites, watching you over it.\n\n"I'm Pia," she says. "I followed a caravan south because Auntie says southern bread is soft. It IS soft." Her lip wobbles. "Auntie is a General. She's very scary. She's going to be *so* cross."`+(s.flags.metVexa?`\n\nHorns. A general. Scary. Somewhere in your memory, a masked demon scout girl scowls at you.`:''),
      choices:[
        {label:'"I\'ll take you home myself."', t:'Pia looks at you for a long moment, then puts her sticky hand in yours.', go:'north'},
        {label:'"Hide with me until it\'s safe."', t:'You smuggle her home under your coat. She is asleep before you get there.', go:'hide'},
        {label:'"First, real food."', show:s=>s.cheat==='cook'||s.job==='chef', t:'You make her pancakes. She eats nine, says "southern food is a *crime*," and falls asleep on the counter.', fx:{cha:1}, go:'hide'}
      ]},
    north:{ scene:'north', text:(s)=>`Two weeks north, the snow starts. Three, and you reach the border stones. Pia rides on your shoulders and names every cloud.\n\nThen spears. A dozen demon soldiers rise from the drifts, and behind them a tall woman with sweeping horns and a general's red cloak: Vexa.`+(s.flags.metVexa?` Her eyes narrow. "You. The one from the clocktower."`:'')+`\n\n"Pia," she says. "Here. Now." Pia does not let go of your hand.`,
      choices:[
        {label:'Kneel, and let her go.', t:'Pia hugs you hard, then runs. Vexa scoops her up and studies you for a long moment. "I owe a human," she says, like it tastes strange. "I will remember."', fx:{cha:1, flag:['demonKid','metVexa']}, log:'Carried Pia, General Vexa\'s niece, home through the snow.', go:'END'},
        {label:'"Not every human wants war."', check:{stat:'cha', dc:18},
          win:{t:'"Not every human," Vexa repeats. She looks at Pia, sticky with southern bread. "...Perhaps not." It is not peace. It is a crack in the ice.', fx:{cha:2, omen:-1, flag:['demonKid','metVexa']}, log:'Brought Pia home. General Vexa almost smiled.', go:'END'},
          lose:{t:'"Tell that to the soldiers on my border," she says. But she lets you leave alive, and Pia waves until you are out of sight.', fx:{flag:['demonKid','metVexa']}, log:'Carried Pia, General Vexa\'s niece, home through the snow.', go:'END'}},
        {label:'Greet her in the old tongue.', show:s=>s.race==='demon', t:'Your mother\'s language, rusty. Vexa\'s eyebrows climb. "Half-blood," she says. "And they let you live down there?" Something in her face goes soft, and stays that way.', fx:{wit:1, mag:1, flag:['demonKid','metVexa']}, log:'Brought Pia home and spoke with General Vexa in the old tongue.', go:'END'}
      ]},
    hide:{ scene:'cafe', text:(s)=>`For a week Pia lives in `+(s.path==='shop'?`your café's back room`:`your rented room`)+`. She sweeps, badly. She sings demon lullabies to the mice. Guards knock on doors two streets over.\n\nYou need to get her north, past the gate inspectors, without anybody looking inside the turnip barrel.`,
      choices:[
        {label:'Smuggle her out in a turnip barrel.', check:{stat:'luck', dc:15},
          win:{t:'The inspector pokes the turnips. The turnips say nothing. Pia, heroically, says nothing either. A caravan takes her the rest of the way north.', fx:{luck:1, flag:'demonKid'}, log:'Smuggled Pia, a demon child, home in a turnip barrel.', go:'END'},
          lose:{t:'A turnip sneezes. You fight your way through the gate and run a mile with a barrel on your back.', fx:{hp:-12, str:1, flag:'demonKid'}, log:'Smuggled Pia home. It involved running with a barrel.', go:'END'}},
        {label:'Forge her travel papers.', check:{stat:'wit', dc:16, job:{office:5}},
          win:{t:'Your past life\'s paperwork skills finally pay off. A demon child becomes "Pia, aged 8, decorative goat." Stamped. Approved.', fx:{wit:2, flag:'demonKid'}, log:'Forged papers to send Pia, a demon child, home.', go:'END'},
          lose:{t:'The papers fool nobody, but the guard has a daughter Pia\'s age. He looks away.', fx:{flag:'demonKid'}, log:'Sent Pia, a demon child, home to the north.', go:'END'}},
        {label:(s,v)=>`Ask ${owedName(v)} for a wagon north.`, show:s=>hasSeed('owed'),
          t:(s,v)=>`${owedName(v)} asks no questions, provides a wagon and a blanket, and says you are even. Pia leaves you a drawing of a very scary auntie.`, fx:s=>merge(useOwed(), {cha:1, flag:'demonKid'}), log:'Called in a favor to send Pia home.', go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   6. THE ROYAL TOURNAMENT
   --------------------------------------------------------- */
{
  id:'w_tournament', stage:'adult', minAge:17, maxAge:24,
  title:'The Royal Tournament',
  blurb:s=>hasSeed('rival')?'The Royal Tournament bracket is up. Knights, battlemages, a horse, and a name you know far too well.':'The Royal Tournament bracket is up: knights, battlemages, and one entrant who is, on inspection, just a very large horse.',
  scene:'capital', dream:'hero',
  cast:{ r:{seed:'rival', role:'knight'} },
  init:(s,v,c)=>{ v.rival = hasSeed('rival', x=>x.npc===c.r.id); },
  start:'a',
  beats:{
    a:{ scene:'capital', text:(s,v)=>PF(s,{
        adv:`The guild has entered you on its own coin and will be very disappointed if you lose.`,
        shop:`Lantern Street has hung banners with your face on them. Your regulars have made a chant. It does not rhyme.`,
        crown:`The Royal Order expects its own to win the Royal Tournament. This has been made very clear.`})+`\n\nThree days of steel and spells in the great arena. The bracket hangs on the palace gate: knights, battlemages, and a "Ser Horace," who is a very large horse in a helmet. Nobody has been brave enough to tell him.`+(v.rival?`\n\nAnd in the other half of the bracket, a name you know: {r}. Of course.`:''),
      choices:[
        {label:'Study the bracket.', check:{stat:'wit', dc:15},
          win:{t:'You know every opponent\'s habits by sunset. The final will hold no surprises.', fx:{wit:1, set:{scouted:true}}, go:'horse'},
          lose:{t:'The bracket is a maze of crossed-out names and one hoofprint.', go:'horse'}},
        {label:'Warm up. Trust your arm.', t:'A hundred swings in the practice yard. Your hands remember.', fx:{str:1}, go:'horse'},
        {label:'Spot the bracket exploit.', show:s=>s.job==='gamer', t:'Two withdrawals and a scheduling clash: you get a bye straight to the final. Classic speedrun route.', fx:{wit:1, set:{scouted:true}}, go:'final'}
      ]},
    horse:{ scene:'battlefield', text:`Round one. Trumpets, the gate opens, and out trots Ser Horace in full barding, tossing his mane. The crowd goes absolutely wild. He has clearly won several rounds already. Nobody is sure how.\n\nHe paws the sand and snorts at you.`,
      choices:[
        {label:'Fight the horse. Honorably.', check:{stat:'combat', dc:15},
          win:{t:'A fair bout. You catch his bridle, and he snorts, impressed, and walks off to great applause.', fx:{str:1}, go:'final'},
          lose:{t:'He kicks you across the arena, then wanders off to eat a judge\'s hat and is disqualified.', fx:{hp:-10}, go:'final'}},
        {label:'Offer Ser Horace an apple.', check:{stat:'cha', dc:14, cheat:{tamer:6}},
          win:{t:'He accepts the apple, nuzzles your hair, and lies down. The judges call it a surrender. The crowd calls it love.', fx:{cha:1, fame:1}, go:'final'},
          lose:{t:'He takes the apple, then your hat, then a running start. You still advance, technically.', fx:{hp:-8}, go:'final'}}
      ]},
    final:{ scene:'battlefield', text:(s,v,c)=>(v.rival?`The final. Across the sand, {r} is already grinning. "Took you long enough," {r.he} calls. "Try not to embarrass yourself in front of the king."`+(c.r.att>=2?` You grin back. Some fights are a kind of conversation.`:` There is no warmth in it. {r} wants this badly.`):`The final. Your opponent is {r} {r.look}, a {r.trait} {r.role} who has won three provincial tournaments and looks bored about it.`)+`\n\nThe whole city is watching. In the royal box, the king leans forward.`,
      choices:[
        {label:'Fight all-out.', check:{stat:'combat', dc:19, npc:'r', extra:(s,v)=>v.scouted?[['Scouted',3]]:[]},
          win:{t:'Everything you have, in one exchange. {r}\'s blade spins away across the sand.', fx:{str:1}, go:'victory'},
          lose:{t:'{r} reads you perfectly. You hit the sand hard enough to hear it.', fx:{hp:-14}, go:'defeat'}},
        {label:'Fight clever: feints and footwork.', check:{stat:'wit', dc:18, npc:'r', extra:(s,v)=>v.scouted?[['Scouted',3]]:[]},
          win:{t:'Three feints, a step left, and {r} is off balance for exactly as long as you need.', fx:{wit:1}, go:'victory'},
          lose:{t:'{r} does not fall for a single feint. Not one.', fx:{hp:-12}, go:'defeat'}},
        {label:'"Let\'s give them a show."', show:(s,v)=>v.rival, check:{stat:'luck', dc:15},
          win:{t:'Twenty minutes of the best fighting the arena has seen in a generation. At the end, you are the one standing, barely.', fx:{luck:1, fame:2}, go:'victory'},
          lose:{t:'Twenty glorious minutes, and then {r} finds the one opening you left. The crowd is on its feet anyway.', fx:{hp:-10, fame:2}, go:'defeat'}}
      ]},
    victory:{ scene:'capital', fx:{gold:150, fame:3}, text:(s)=>`The last blow lands, the arena erupts, and the king himself sets a laurel on your head. Gold, a silver cup, and your name in the tournament roll forever.\n\n{r} is still on the sand, catching {r.his} breath.`+(s.flags.princess?`\n\nIn the royal box, Princess Aria is waving both arms in total violation of protocol.`:''),
      choices:[
        {label:'Help {r} up.', t:(s,v)=>v.rival?'{r} takes your hand and holds it a beat too long. "Fine," {r.he} admits. "You\'re good. Don\'t let it go to your head." Somewhere along the way, a rivalry became a friendship.':'{r} takes your hand. "Next year," {r.he} says, "that cup is mine." But {r.he} is smiling.',
          fx:(s,v)=>v.rival?{cha:1, npc:{r:2}, useSeed:{k:'rival', npc:'r'}, seed:{k:'friend', npc:'r'}}:{cha:1, npc:{r:3}, seed:{k:'friend', npc:'r'}}, log:'Won the Royal Tournament. Helped {r} off the sand.', go:'END'},
        {label:'Raise the cup to the crowd.', t:'The roar goes on so long the horse joins in. Ballads are already being written, most of them inaccurate.', fx:{fame:3, str:1}, log:'Won the Royal Tournament in front of the whole city.', go:'END'},
        {label:'Bow to Princess Aria.', show:s=>!!s.flags.princess, t:'Aria curtsies back from the royal box. Every gossip in Asterhold notices, and has opinions.', fx:{fame:2, cha:1}, log:'Won the Royal Tournament and bowed to the princess.', go:'END'}
      ]},
    defeat:{ scene:'capital', fx:{gold:50, fame:1}, text:`{r} wins. The laurel goes on {r.his} head, and the crowd roars for somebody else.\n\nStill, second place in the Royal Tournament comes with gold, a very nice ribbon, and more respect than you expected. A few children ask for your autograph. One asks for the horse's.`,
      choices:[
        {label:'Congratulate {r}. Mean it.', t:'{r} blinks, then grips your arm. "You made me work for it," {r.he} says. That means something.', fx:{cha:1, npc:{r:2}}, go:'END'},
        {label:'"Next year, you\'re mine."', t:'{r} laughs. "Looking forward to it." You can tell {r.he} means that too.', fx:(s,v)=>v.rival?{str:1, npc:{r:1}}:{str:1, seed:{k:'rival', npc:'r'}}, log:'Lost the Royal Tournament final to {r}. Swore a rematch.', go:'END'},
        {label:'Drink with Ser Horace.', t:'You share a bucket of cider with the horse. He is an excellent listener. You feel much better.', fx:{luck:1, heal:1}, go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   7. THE GREY SICKNESS
   --------------------------------------------------------- */
{
  id:'w_plague', stage:'adult', minAge:17, maxAge:24,
  title:'The Grey Sickness',
  blurb:'In the Low Ward, people are turning to stone from the fingertips up. Father {p} says it is a demon curse, and the crowd is starting to believe him.',
  scene:'capital',
  cast:{ p:{role:'priest'} },
  start:'a',
  beats:{
    a:{ scene:'capital', text:`It starts at the fingertips: grey, then stiff, then stone. In the Low Ward people sit in doorways with arms like statues, afraid to cry because the tears leave grey tracks.\n\nOn the chapel steps, Father {p} {p.look} preaches to a growing crowd. "A demon curse! There is a half-blood cobbler on Wick Lane. Ask yourselves why *he* isn't sick!"\n\nThe crowd is starting to ask.`,
      choices:[
        {label:'"Triage. Sickest first. Now."', show:s=>s.job==='nurse', t:'Old habits. You sort the sick by stage in minutes, and the pattern jumps out: every case drinks from the same street.', fx:{wit:1, maxhp:2}, go:'cause'},
        {label:'Examine the sick.', check:{stat:'wit', dc:16},
          win:{t:'It is not magic. It is *growing*: fine grey threads under the skin, like mold on bread.', fx:{wit:1}, go:'cause'},
          lose:{t:'You lean too close. Your own fingertip greys and goes numb, and you still have no idea why.', fx:{hp:-10}, go:'church'}},
        {label:'Confront Father {p}.', t:'You push through the crowd toward the chapel steps.', go:'church'},
        {label:'Burn it out with purification.', check:{stat:'mag', dc:18},
          win:{t:'White light floods the street. A dozen people uncurl their stony fingers, gasping. And you learn something: it fought back like a living thing, not a curse.', fx:{mag:2, hp:-8}, go:'cause'},
          lose:{t:'The light fizzles. The grey keeps spreading, unbothered, and Father {p} points at you as proof of "dark arts."', fx:{hp:-10}, go:'church'}}
      ]},
    church:{ scene:'shrine', text:`Father {p} sees you coming and raises his voice. "And here comes one of the cobbler's friends, to defend the cursed!"\n\nThe crowd turns toward you, hungry for someone to blame. At its back, people are passing out torches and looking toward Wick Lane, where a frightened cobbler is nailing his shutters closed.`,
      choices:[
        {label:'Out-argue him. Publicly.', check:{stat:'cha', dc:17, npc:'p'},
          win:{t:'"If it\'s a curse, Father, why does it strike only one street? Show me a curse that reads a map." The crowd laughs. {p} goes red, then thoughtful. "...Show me," {p.he} says.', fx:{cha:1, npc:{p:2}, set:{converted:true}}, go:'cause'},
          lose:{t:'{p} has a better voice and a bigger crowd. You are shoved off the steps, and go looking for the truth alone.', fx:{hp:-8, npc:{p:-2}, seed:{k:'grudge', npc:'p'}}, go:'cause'}},
        {label:'Appraise the "curse."', show:s=>s.cheat==='appraise', t:'*Grey Rot (fungal). Not a curse. Source: contaminated water.* You read it aloud. {p} has no answer for a floating window.', fx:{wit:1, npc:{p:1}, set:{converted:true}}, go:'cause'},
        {label:'"Do I look cursed to you?"', show:s=>s.race==='demon', check:{stat:'cha', dc:16, npc:'p', race:{demon:3}},
          win:{t:'You stand bare-headed on the steps, red eyes and all, perfectly healthy. "Well?" The crowd wavers. The torches go out one by one.', fx:{cha:2}, go:'cause'},
          lose:{t:'"Behold! The proof!" A thrown bottle catches your shoulder. You leave, but now you have to be right.', fx:{hp:-10, seed:{k:'grudge', npc:'p'}}, go:'cause'}}
      ]},
    cause:{ scene:'capital', text:(s,v)=>`Every sick house draws water from the old well on Tanner's Row. You lower a lantern: the walls are furred with grey mold, thick as velvet, breathing out a fine dust.\n\nAnd caught on a bracket halfway down, something that is not mold: a cracked clay jar, sealed with black wax.`+(v.converted?`\n\nBehind you, Father {p} whispers a prayer that sounds a lot like an apology.`:''),
      choices:[
        {label:'Climb down for the jar.', check:{stat:'str', dc:15},
          win:{t:'The jar is stamped with a black sun. Inside, the dregs of a grey powder. Someone did this on purpose.', fx:{str:1, seed:'clue', set:{clue:true}}, log:'Found Black Sun poison in a Low Ward well.', go:'cure'},
          lose:{t:'The rope snaps. You hit the water, the jar shatters, and you climb out coughing grey.', fx:{hp:-12}, go:'cure'}},
        {label:'Seal the well. Right now.', t:'You and three neighbors roll a millstone over the mouth. Whatever is down there stays down there.', fx:{str:1}, go:'cure'}
      ]},
    cure:{ scene:'capital', text:(s,v)=>`The source is sealed, but the Low Ward is still full of people turning to stone, and the chapel still has a crowd.\n\nYou have tonight, maybe tomorrow, before the worst cases are past saving.`+(v.clue?` And now you know someone *wanted* this.`:''),
      choices:[
        {label:'Organize the whole ward.', check:{stat:'cha', dc:16},
          win:{t:'Boil everything. Burn the bedding. Scrub with vinegar. By week\'s end the Low Ward is chanting your name, or at least your instructions.', fx:(s,v)=>merge({cha:2, fame:3}, v.converted?{seed:{k:'owed', npc:'p'}, npc:{p:2}}:{}), log:'Stopped the grey sickness in the Low Ward.', go:'END'},
          lose:{t:'It is chaos, but chaos with boiled water. Most recover. Not all.', fx:{cha:1, fame:1}, log:'Fought the grey sickness. Not everyone made it.', go:'END'}},
        {label:'Purify them, one by one.', check:{stat:'mag', dc:17},
          win:{t:'All night, house to house, light from your hands. By dawn you can barely stand, and nobody on Tanner\'s Row is grey.', fx:(s,v)=>merge({mag:2, hp:-8, fame:3}, v.converted?{seed:{k:'owed', npc:'p'}, npc:{p:2}}:{}), log:'Healed the Low Ward of the grey sickness by hand.', go:'END'},
          lose:{t:'You save who you can. It is not everyone. You will remember the ones you could not.', fx:{mag:1, hp:-12}, log:'Fought the grey sickness. Not everyone made it.', go:'END'}},
        {label:'Brew a cure-all broth.', show:s=>s.cheat==='cook'||s.job==='chef', t:'Garlic, ginger, and a mushroom that eats mold for breakfast. The ward smells of soup and hope for a week, and the grey retreats.', fx:(s,v)=>merge({cha:1, fame:3}, v.converted?{seed:{k:'owed', npc:'p'}, npc:{p:2}}:{}), log:'Cured a plague with soup.', go:'END'},
        {label:'Fund an alchemist\'s cure.', req:s=>s.gold>=120, reqText:'Needs 120 gold', t:'Your gold buys every vial of antifungal tincture in the capital. It is not glamorous. It works.', fx:(s,v)=>merge({gold:-120, fame:3, luck:1}, v.converted?{seed:{k:'owed', npc:'p'}, npc:{p:2}}:{}), log:'Paid for the cure to the grey sickness.', go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   8. THE ABYSS BENEATH THE CATHEDRAL
   --------------------------------------------------------- */
{
  id:'w_abyss', stage:'adult', minAge:17, maxAge:24,
  title:'The Abyss Beneath the Cathedral',
  blurb:'An earthquake cracked open the old cathedral crypt, and the stairs beneath go down forever. The guild stamped it S-rank. Someone is already selling "Excalibur" at the gate.',
  scene:'dungeon', dream:'hero',
  cast:{ m:{role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'ruins', text:(s)=>`An earthquake cracked the crypt of the old cathedral, and beneath it there are stairs. They go down a very long way. The guild has stamped it S-RANK: DO NOT. Three parties ignored the stamp. One came back, babbling about white light and a sword.\n\nAt the crypt gate, {m} {m.look} has set up a stall: *EXCALIBUR, SLIGHTLY USED. 120 GOLD. NO REFUNDS.*`+(s.path==='adv'?`\n\nAs a registered adventurer, you are legally obligated to be tempted.`:''),
      choices:[
        {label:'Descend. Carefully.', t:'You light a torch and start counting stairs. You stop counting at four hundred.', go:'deep'},
        {label:'Browse {m}\'s "Excaliburs."', t:'"A discerning customer!" {m} cries.', go:'shop'},
        {label:'Early final dungeon? Save first.', show:s=>s.job==='gamer', t:'You leave a note, a will and a sandwich at the gate. Then you go down checking every wall for secrets, like a professional.', fx:{wit:1, set:{gamer:true}}, go:'deep'}
      ]},
    shop:{ scene:'market', text:`{m} spreads {m.his} arms over a rack of swords. "Excalibur," {m.he} says, pointing. "Also Excalibur. That one's Excalibur's cousin. All pulled out of the Abyss, scout's honor."\n\nThey are tin, mostly. One is a painted broom handle. In the back, an umbrella stand holds a dull, ugly blade wrapped in rags.`,
      choices:[
        {label:'Appraise every blade.', show:s=>s.cheat==='appraise', t:'*Tin. Tin. Broom. Tin (mildly cursed).* Then the umbrella stand: *[ERROR: ITEM TOO HOLY TO DISPLAY]*. You keep your face very, very still. "How much for the old one?" "That? Fifteen gold."', fx:{wit:1}, go:'claim'},
        {label:'Haggle for the shiniest Excalibur.', check:{stat:'cha', dc:16, npc:'m'},
          win:{t:'Down to fifty gold! It is tin. You knew it was tin. You own a tin sword now, and go down the stairs anyway.', fx:{gold:-50, cha:1}, go:'deep'},
          lose:{t:'A hundred gold, and {m} throws in a certificate of authenticity written in crayon.', fx:{gold:-100}, go:'deep'}},
        {label:'Something about that umbrella stand...', check:{stat:'wit', dc:19, npc:'m'},
          win:{t:'The dust around the rags never settles. It hovers, waiting. "That old thing?" {m} says. "Fifteen gold. It\'s taking up space."', fx:{wit:1}, go:'claim'},
          lose:{t:'{m} steers you firmly back toward the tin, and you end up going down without any sword at all.', go:'deep'}}
      ]},
    claim:{ scene:'market', text:`You unwrap the rags. The blade is plain steel, nicked and dull, until your fingers close on the hilt.\n\nThen it is not. White light pours out of it and up your arm, warm as a summer morning. {m} drops {m.his} tea. Every tin Excalibur on the rack rattles, embarrassed.\n\nThe sword hums one clear note, and you simply know: it has chosen you.`,
      choices:[
        {label:'Pay {m} fairly anyway.', req:s=>s.gold>=100, reqText:'Needs 100 gold', t:'You hand over a hundred gold. {m} stares at the coins, then the sword, then you. "Nobody\'s ever been honest with me," {m.he} says. "Huh."', fx:{gold:-100, cha:1, npc:{m:3}, seed:{k:'owed', npc:'m'}, flag:'holySword'}, log:'Found the holy sword in a junk stall, and paid fairly for it.', go:'END'},
        {label:'"Fifteen gold, as agreed."', t:'A deal is a deal. {m} is still staring at the light as you walk away. You suspect {m.he} will tell this story bitterly for years.', fx:{gold:-15, luck:1, npc:{m:-3}, seed:{k:'grudge', npc:'m'}, flag:'holySword'}, log:'Bought the holy sword for fifteen gold.', go:'END'}
      ]},
    deep:{ scene:'dungeon', text:(s,v)=>`Floor ten: skeletons. Floor twenty-five: things that used to be knights. Floor forty: a hydra built entirely of bones, coiled around a stair that glows white.\n\nYour torch is burning low. The way back up is very, very long.`+(v.gamer?`\n\nYou would bet your second life there is a secret passage. There always is.`:''),
      choices:[
        {label:'Fight through the hydra.', check:{stat:'combat', dc:20},
          win:{t:'It takes everything you have. When the last skull shatters you are shaking, bleeding, and standing at the top of the white stair.', fx:{str:2, hp:-8}, go:'bottom'},
          lose:{t:'The hydra wins the argument. You retreat with your life and not much else.', fx:{hp:-18}, go:'retreat'}},
        {label:'Look for the hidden path.', check:{stat:'wit', dc:18, job:{gamer:4}},
          win:{t:'A loose stone, a draft, a crawlspace behind a statue. The hydra never even sees you.', fx:{wit:2}, go:'bottom'},
          lose:{t:'The hidden path is a pit. You climb out, battered, and now the hydra has noticed.', fx:{hp:-12}, go:'retreat'}},
        {label:'Fight it side by side with {top}.', show:s=>!!topComp(), check:{stat:'combat', dc:18, extra:()=>[['Fighting together',3]]},
          win:{t:'{top} draws its heads, you break its spine. You make it to the white stair together, laughing a little hysterically.', fx:{str:1, relTop:2}, go:'bottom'},
          lose:{t:'You drag each other back up, both bleeding, both alive.', fx:{hp:-14, relTop:1}, go:'retreat'}}
      ]},
    bottom:{ scene:'shrine', text:`The last stair ends in a chamber of white stone. A sword stands in an altar at its center, and the light it gives off is not light, exactly. It is closer to being *seen*.\n\nA voice, clear as a bell and without any sound: *Many came for me. Tell me why you did.*`,
      choices:[
        {label:'"To protect people."', t:'*A good answer. Old, but good.* The sword slides free as if it has been waiting.', fx:{fame:2, str:1, flag:'holySword'}, log:'Drew the holy sword from the bottom of the Abyss.', go:'END'},
        {label:'"To end the war. Not win it."', show:s=>!!(s.flags.malBond||s.flags.lore), t:'A long silence. *It has been three hundred years since anyone wanted that,* the voice says. *Yes. You will do.*', fx:{wit:1, cha:1, flag:'holySword'}, log:'The holy sword chose you, to end the war rather than win it.', go:'END'},
        {label:'"Honestly? I just wanted to see you."', t:'*...Oh.* The light flickers, flustered. *No one has ever said that.* It chooses you anyway. Maybe because of it.', fx:{luck:2, flag:'holySword'}, log:'Drew the holy sword. It was flustered.', go:'END'},
        {label:'"Stay asleep. I don\'t need you."', t:'You climb back up empty-handed. On floor ten you find the skeletons were guarding a sack of old coins. The universe has a sense of humor.', fx:{gold:200, wit:1}, log:'Reached the bottom of the Abyss and left the sword where it was.', go:'END'}
      ]},
    retreat:{ scene:'ruins', text:`You crawl out of the crypt at dawn with three floors' worth of loot in your pack and a long, ugly gash where your confidence used to be.\n\nThe sword is still down there. You can feel it faintly, like someone humming in another room.`,
      choices:[
        {label:'Sell the loot.', t:'Old armor, cursed rings, one surprisingly nice teapot. It adds up.', fx:{gold:150}, go:'END'},
        {label:'Map it for the guild.', t:s=>s.path==='adv'?'The guild pays for every floor you charted and pins your map in the hall. Other parties start calling it "the safe route." It is not.':'Your map ends up pinned in the guild hall. Strangers start buying you drinks.', fx:{wit:1, fame:2, gold:60}, go:'END'}
      ]}
  }
},

/* ---------------------------------------------------------
   9. THE BLACK SUN (echo: needs 2+ clues)
   --------------------------------------------------------- */
{
  id:'w_black_sun', stage:'adult', minAge:18, maxAge:24, echo:true,
  cond:s=>clues()>=2,
  title:'Under the Bone Moon',
  blurb:'Your clues finally fit together. Tonight, under the Bone Moon, the Black Sun means to wake the Demon Lord years early.',
  scene:'night',
  cast:{ cu:{seed:'grudge', role:'cultist'} },
  init:(s,v,c)=>{ v.known = c.cu.metAge!=null && c.cu.metAge < s.age; },
  start:'a',
  beats:{
    a:{ scene:'night', text:(s)=>`Your clues cover the table: a black sun stamped in wax, a ring, a ledger, a map of the old aqueduct with tonight's date circled.\n\nIt fits. The Black Sun means to wake Malgrave tonight, under the Bone Moon, years before anyone is ready. No army, no defenses, no chance at peace.\n\nYou have until moonrise.`+PF(s,{
        crown:` The Order would need a week to approve a raid. You do not have a week.`,
        shop:` You flip the sign on {place} to CLOSED.`,
        adv:` No guild quest pays for this. You go anyway.`}),
      choices:[
        {label:'Steal a robe. Walk right in.', t:'The robe smells of incense and somebody else\'s sweat. Nobody looks twice.', go:'inside'},
        {label:'Gather everyone I trust.', t:'You knock on every door you have ever been welcome at.', go:'ambush'},
        {label:'Take the evidence to the palace.', t:'You run for the palace with the ledger under your arm.', go:'expose'}
      ]},
    inside:{ scene:'ruins', text:`The aqueduct is full of robed figures chanting in a dead language. Nobody checks faces. You chant along, half a beat behind.\n\nThen a hand on your shoulder. A cultist with a lantern: "Brother? Sister? Whatever. What's the word for the third gate?"`,
      choices:[
        {label:'Bluff.', check:{stat:'wit', dc:18},
          win:{t:'"The sun is black," you say, with total confidence. It is not the word. He nods anyway. Nobody down here knows the words.', fx:{wit:1}, go:'twist'},
          lose:{t:'"...That\'s not it." Lanterns turn. Hoods drop. Knives come out.', fx:{hp:-10}, go:'fight'}},
        {label:'Knock him out. Quietly.', check:{stat:'str', dc:16},
          win:{t:'He folds without a sound. You prop him in an alcove and keep chanting.', fx:{str:1}, go:'twist'},
          lose:{t:'He folds with a *lot* of sound.', fx:{hp:-10}, go:'fight'}},
        {label:'Read his status.', show:s=>s.cheat==='appraise', t:'*Cultist (junior). Password: "Marmalade." Status: Regrets joining.* "Marmalade," you say. He sighs with relief and waves you through.', fx:{wit:1}, go:'twist'}
      ]},
    ambush:{ scene:'night', text:(s)=>{ const n=allyCount(); const t=topComp(); return `By moonset you are crouched on the aqueduct roof, watching robed figures file in below.`+(t?` {top} is beside you, jaw set.`:'')+(n?` Behind you, ${n>1?n+' people who owe you nothing came anyway':'one friend who owes you nothing came anyway'}.`:` Nobody else came. It is just you.`)+`\n\nBelow, black fire is already climbing the aqueduct walls, and the chanting is getting faster. Whatever you are going to do, it has to be now.`; },
      choices:[
        {label:'Strike now, all together.', check:{stat:'combat', dc:19, extra:s=>{ const t=topComp(); const b=Math.min(allyCount()*2,6)+(t&&rel(t)>=5?2:0); return b?[['Allies',b]]:[]; }},
          win:{t:'You drop on them like a falling roof. Robes scatter, torches gutter, and you fight your way to the altar.', fx:{str:1, relAll:1}, go:'twist'},
          lose:{t:'They were expecting you. Someone talked.', fx:{hp:-14}, go:'fight'}},
        {label:(s,v)=>`Signal ${owedName(v)}. Favor's due.`, show:s=>hasSeed('owed'),
          t:(s,v)=>`${owedName(v)} brings friends, and the friends bring crossbows. The outer guard surrenders in a minute flat.`, fx:s=>merge(useOwed(), {cha:1}), go:'twist'},
        {label:'Wait for the perfect moment.', check:{stat:'luck', dc:16},
          win:{t:'The guards change shifts. The door is unwatched for nine seconds. Nine is plenty.', fx:{luck:1}, go:'twist'},
          lose:{t:'The perfect moment never comes. The chanting reaches a crescendo, and you go in anyway.', fx:{hp:-8}, go:'fight'}}
      ]},
    expose:{ scene:'palace', text:`The Hall of Council, an hour before moonrise. You lay out everything: the jar, the ring, the ledger.\n\nTwelve lords and ladies regard your evidence with the faces of people who would very much like to be at dinner. One of them, Lord Velmont, keeps smoothing his left glove.`,
      choices:[
        {label:'Make them listen.', check:{stat:'cha', dc:18, extra:s=>[].concat(s.flags.princess?[['Aria\'s friend',3]]:[], s.path==='crown'?[['Royal Order',2]]:[])},
          win:{t:'The Lord Marshal stands. "Guards," he says. "All of them." The palace empties toward the aqueduct, and you lead the way.', fx:{cha:1, fame:2}, go:'twist'},
          lose:{t:'"Fascinating," says Lord Velmont. The council votes to review it next season. You go alone.', go:'fight'}},
        {label:'Send for Princess Aria.', show:s=>!!s.flags.princess, t:'Aria arrives in her nightgown, reads two pages, and says one word to the captain of the guard. It is an impressive word.', fx:{fame:2}, go:'twist'},
        {label:'Watch Lord Velmont\'s glove.', check:{stat:'wit', dc:17},
          win:{t:'He smooths it once too often. Under the leather, the edge of a black ring. You point. He runs. That is all the proof the council needs.', fx:{wit:2, fame:2}, go:'twist'},
          lose:{t:'You stare at the glove so hard you miss Velmont signaling a servant. By the time you reach the aqueduct, they know you are coming.', fx:{hp:-8}, go:'fight'}}
      ]},
    twist:{ scene:'ruins', text:(s,v,c)=>(v.known?`At the altar, the high priest lowers {cu.his} hood, and your stomach drops.\n\nIt is {cu}. Older, thinner, {cu.look}, lit from below by black fire. "You remember me," {cu.he} says. "I remember you, {name}. Every single day."`+(c.cu.att>=2?` {cu.His} voice cracks. "I'm sorry it's you."`:''):`At the altar, the high priest lowers {cu.his} hood: {cu}, a {cu.trait} stranger {cu.look}, smiling like {cu.he} has been expecting you. "The hero, right on cue. You're too late, you know."`)+`\n\nThe circle is half lit. Frost crawls out from its center, and somewhere far to the north, something stirs in its sleep.`,
      choices:[
        {label:'Talk {cu} down.', check:{stat:'cha', dc:20, npc:'cu'},
          win:{t:(s,v)=>v.known?'"Whatever I did to you," you say, "this isn\'t how you get even. This ends everyone." {cu} looks at the fire, then at you, and steps out of the circle. It dies without {cu.him}.':'"Do you even know what you\'re waking?" you ask. {cu} opens {cu.his} mouth, and nothing comes out. {cu.He} steps back. The circle dies.',
            fx:(s,v)=>merge({cha:2, flag:'cultStopped', useSeed:[{k:'clue'}].concat(v.known?[{k:'grudge', npc:'cu'}]:[]), seed:{k:'spared', npc:'cu'}, npc:{cu:3}}), log:'Talked {cu} out of waking the Demon Lord. Stopped the Black Sun.', go:'END'},
          lose:{t:'{cu} only laughs and feeds the fire.', go:'fight'}},
        {label:'Shatter the circle.', check:{stat:'mag', dc:19},
          win:{t:'You pour everything you have into the stone. The circle cracks, flares and dies. The frost retreats like a tide going out. {cu} flees into the dark.', fx:{mag:2, fame:3, flag:'cultStopped', useSeed:'clue'}, log:'Shattered the Black Sun\'s ritual circle.', go:'END'},
          lose:{t:'The circle drinks your magic and burns brighter.', fx:{hp:-10}, go:'fight'}},
        {label:'"Mal doesn\'t want this."', show:s=>!!s.flags.malBond, check:{stat:'cha', dc:15, npc:'cu'},
          win:{t:'"Who?" "I fed him dinner," you say. "He cried over soup. He is *not* in a hurry to start a war." {cu}\'s certainty cracks, and so does the circle.', fx:{cha:2, npc:{cu:2}, flag:'cultStopped', useSeed:'clue'}, log:'Stopped the Black Sun by telling them the truth about Mal.', go:'END'},
          lose:{t:'"Lies!" {cu} shrieks, and the fire roars.', go:'fight'}},
        {label:'Strike {cu} down.', check:{stat:'combat', dc:18, npc:'cu'},
          win:{t:'One clean blow. {cu} falls, and with no one to feed it, the circle gutters out.', fx:{str:2, fame:3, npc:{cu:-3}, flag:'cultStopped', useSeed:'clue'}, log:'Struck down the Black Sun\'s high priest at the altar.', go:'END'},
          lose:{t:'{cu} is faster than {cu.he} looks.', fx:{hp:-12}, go:'fight'}}
      ]},
    fight:{ scene:'battlefield', text:`Everything goes wrong at once. Robes, knives, black fire roaring up the walls as {cu} chants faster and faster. The circle is almost closed. The frost is at your ankles, then your knees, and you can no longer feel your fingers.\n\nFar to the north, a mountain of ice groans. One chance left.`,
      choices:[
        {label:'Dive into the circle.', check:{stat:'combat', dc:20},
          win:{t:'You land at its center, and the black fire comes for you instead of the sky. It hurts more than anything has ever hurt. Then it goes out.', fx:{hp:-12, str:2, fame:4, flag:'cultStopped', useSeed:'clue'}, log:'Broke the Black Sun ritual with your own body.', go:'END'},
          lose:{t:'The fire throws you clear. The circle closes. Far to the north, under a mountain of ice, something opens its eyes years too early.', fx:{hp:-16, flag:'cultWon', omen:2}, log:'Failed to stop the Black Sun. The north woke early.', go:'END'}},
        {label:'Smash the focus crystal.', check:{stat:'luck', dc:18},
          win:{t:'One desperate throw. The crystal shatters, the fire collapses inward, and the chanting turns to screaming, then silence.', fx:{luck:2, fame:3, flag:'cultStopped', useSeed:'clue'}, log:'Smashed the Black Sun\'s focus crystal at the last second.', go:'END'},
          lose:{t:'You miss by a hand\'s width. The circle closes. In the far north, the ice groans and cracks open.', fx:{hp:-12, flag:'cultWon', omen:2}, log:'Failed to stop the Black Sun. The north woke early.', go:'END'}},
        {label:'Shout for {top}!', show:s=>!!topComp() && rel(topComp())>=5, check:{stat:'combat', dc:16, extra:()=>[['Together',3]]},
          win:{t:'{top} hits the circle from one side, you from the other. It breaks like ice in spring. Afterward you sit in the ruins, holding each other up.', fx:{relTop:2, fame:3, flag:'cultStopped', useSeed:'clue'}, log:'Stopped the Black Sun ritual with {top}.', go:'END'},
          lose:{t:'Together isn\'t enough. The circle closes, and you drag each other out as the ceiling falls. Far to the north, something wakes.', fx:{hp:-14, relTop:1, flag:'cultWon', omen:2}, log:'Failed to stop the Black Sun. The north woke early.', go:'END'}}
      ]}
  }
},

/* ---------------------------------------------------------
   10. THE SATISFACTION SURVEY (Lumi)
   --------------------------------------------------------- */
{
  id:'w_lumi', stage:'adult', minAge:17, maxAge:24,
  title:'Customer Satisfaction',
  blurb:'Mid-sneeze, the world stops. A pigeon hangs in the air. Somewhere, a door opens that was not there before.',
  scene:'shrine',
  start:'a',
  beats:{
    a:{ scene:'shrine', text:`Mid-sneeze, the world stops. A pigeon hangs in the air beside you. A dropped coin hovers an inch above the cobbles.\n\nThen a door that was not there opens, and Goddess Lumi bustles out with a clipboard, a pencil behind her ear, and a sheet of gold star stickers.\n\n"Hi! Annual Reincarnation Satisfaction Survey! Takes five minutes." She checks. "Ten. Question one: on a scale of one to five, how would you rate your rebirth?"`,
      choices:[
        {label:'"Five. Honestly? Five."', t:'Lumi beams so hard the frozen pigeon starts to glow. "Nobody ever says five!"', fx:{cha:1}, go:'q2'},
        {label:'"Two. Still waiting on that apology."', t:'"I said {apology}!" She checks her notes. "...In my head. I said it in my head." She writes a very small 2.', fx:{wit:1, set:{grumpy:true}}, go:'q2'},
        {label:'"Do you have this in triplicate?"', show:s=>s.job==='office', t:'Lumi gasps. "A *professional*." She hands you three copies and a better pen. You finish in record time, out of pure muscle memory.', fx:{wit:1}, go:'q2'},
        {label:'"Four out of five. Needs a balance patch."', show:s=>s.job==='gamer', t:'"Everyone says that." She sighs and adds it to a very long list labeled PATCH NOTES (NEVER).', fx:{luck:1}, go:'q2'}
      ]},
    q2:{ scene:'shrine', text:`"Question seven." Lumi flips a page. "Any feedback on our Demon Lord? We're getting complaints. Well. Screaming, mostly."\n\nShe glances over her shoulder, as if heaven has an HR department, and lowers the clipboard.\n\n"Off the record? Mal's a sweetheart. He got a raw deal. The famine, the king who ignored his letters... and nobody upstairs did anything either." She chews her pencil. "Including me."`,
      choices:[

  function draw(sp){

    if(!sp.hood) backHairOver(b,st,H);
    b.rect(13,23,19,28,K[1]); b.rect(13,23,19,25,K[2]);
    if(sp.ears!=='elf' && !sp.hood) [8,23].forEach(x=>{ b.rect(x,15,x+1,19,K[1]); b.set(x,16,K[2]); b.set(x,17,K[2]); });

function npcArt(n){
  const r = PX.rngF(PX.hash(n.id));
  const pick = a => a[Math.floor(r()*a.length)];
  const natural = ['black','brown','brown','chestnut','blonde','ginger','black','grey'];
  const fancy = ['pink','silver','blue','mint','lilac','crimson','white'];
  let hair = r()<.72 ? pick(natural) : pick(fancy);
  if(/silver-streaked/.test(n.look)) hair='silver';
  const style = n.g==='m' ? pick(['messy','short','spiky','short','messy','bald','long']) : pick(['bob','long','pony','twin','hime','bun','long']);
  let eye = pick(['blue','green','amber','violet','brown','gold','ice','grey']);
  if(/green eyes/.test(n.look)) eye='green';
  const T = n.trait;
  const eyes = ['cunning','suspicious','proud','hotheaded'].includes(T) ? 'sharp' : ['lazy','gloomy'].includes(T) ? 'sleepy' : ['cheerful','timid','kind'].includes(T) ? 'round' : 'normal';
  let mouth = ['cheerful','kind'].includes(T) ? 'smile' : T==='hotheaded' ? 'grin' : ['gloomy','suspicious'].includes(T) ? 'frown' : T==='proud'||T==='cunning' ? 'smirk' : 'neutral';
  if(/never quite smiles/.test(n.look)) mouth='neutral';
  if(/laugh|missing front tooth/.test(n.look)) mouth='grin';
  const rc = ROLE_CLOTHES[n.role] || ROLE_CLOTHES.adventurer;
  const randCloth = ()=>{ const h=Math.floor(r()*360); const c=(l)=>{ const k=(n)=>(n+h/30)%12, a=.55*Math.min(l,1-l); const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)))).toString(16).padStart(2,'0'); return '#'+f(0)+f(8)+f(4); }; return [c(.7),c(.5),c(.32)]; };
  const sp = {skin: Math.floor(r()*5), hair, style, eye, eyes, mouth, clothes: rc[0], cloth: rc[1]||randCloth(), accent: rc[2]||'#f3c96e', acc:[]};
  if(n.role==='mage' && r()<.6) sp.acc.push('wizard');
  if(n.role==='scholar') sp.acc.push('glasses');
  if(n.role==='bandit') sp.acc.push('bandana');
  if(n.role==='smith') sp.acc.push('headband');
  if(n.role==='farmer' && r()<.5) sp.acc.push('straw');
  if(n.role==='noble' && n.g==='f' && r()<.5) sp.acc.push('tiara');
  if((n.role==='cultist') || (n.role==='thief' && r()<.4)) sp.hood=sp.cloth;
  if(n.g==='m' && style!=='spiky' && r()<.18) sp.acc.push('beard');
  if(/scar/.test(n.look)) sp.acc.push('scar');
  if(/rings/.test(n.look)) sp.acc.push('earring');
  if(n.g==='f' && r()<.25) sp.acc.push(pick(['ribbon','flower','earring']));
  if(T==='timid' || (T==='cheerful' && r()<.5)) sp.acc.push('blush');
  if(r()<.12) sp.acc.push('freckles');
  if(r()<.1 && n.role!=='cultist') sp.ears='elf';
  if(r()<.08) sp.animal = pick(['fox','wolf']);
  if(sp.animal) sp.hood=null;
  return sp;
}
function presentChars(texts, castMap, arcId){
  const all = texts.join('\n');
  const found = [];
  const add = (key, idx, name, spec)=>{ if(idx>=0 && !found.some(f=>f.key===key)) found.push({key, idx, name, spec}); };
  CHAR_FIND.forEach(([k,re])=>{ const m=all.match(re); if(m) add(k, m.index, CHAR_NAMES[k], CHAR_ART[k]); });
  if(arcId==='finale'){ const i=all.search(/Malgrave/); if(i>=0) add('mal', i, 'Malgrave', CHAR_ART.mal); }
  for(const role in (castMap||{})){ const n=S.npcs[castMap[role]]; if(!n) continue; const i=all.search(new RegExp('\\b'+n.name+'\\b')); add('npc:'+n.id, i, n.name, npcArt(n)); }
  return found.sort((a,b)=>a.idx-b.idx).slice(0,3);
}
