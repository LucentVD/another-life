    warn:{ scene:'night', text:`Seraphine stands alone on the balcony, frost spreading from her fingertips across the railing.\n\n"I know," she says before you speak. "He'll accuse me of pushing that girl down the stairs. Of poisoning her tea. Father says I should endure it with dignity." Her voice doesn't shake. Her hands do. "Everyone has always decided I'm the villain, {name}. I'm so tired."`, choices:[
      {label:'"Then let\'s ruin his script."', t:`A slow, dangerous smile. "Fine. But if this goes wrong, I'm blaming you."`, fx:{rel:{sera:1}}, go:'dig'},
      {label:'"You were never the villain. Not once."', t:`She stares at you. "Don't say things like that right before a battle. It's distracting." Her ears are very red.`, fx:{rel:{sera:2}, cha:1}, go:'scene'},
      {label:'"Leave with me. Right now."', show:s=>rel('sera')>=6||s.dream==='free', t:`For one long second she almost says yes. "Von Eisenreichs don't run," she says at last. "But... ask me again some other night."`, fx:{rel:{sera:2}}, go:'scene'}
    ]},
    dig:{ scene:'palace', text:`The ballroom is a crime scene with a string quartet. You need proof before midnight, when {f} plans his big speech.\n\n{f} is {f.trait}, and keeps glancing at a man from the Moneylenders' Guild. The "victim" checks her reflection between rehearsed swoons. Somewhere in this palace the truth is written down. Nobles love writing things down.`, choices:[
      {label:'Read the debt ledgers.', check:{stat:'wit', dc:17, npc:'f', job:{office:5}},
        win:{t:`{f} owes forty thousand gold. The Eisenreich dowry would cover it exactly, unless he breaks the match with "cause" and claims damages. There's a signed contract to prove it.`, fx:{wit:1, set:{proof:1}}, go:'scene'},
        lose:{t:`A duchess corners you for forty minutes about her hedges. When you escape, the ledger room is locked.`, fx:{cha:1}, go:'scene'}},
      {label:'Appraise the "poisoned" teacup.', show:s=>s.cheat==='appraise', t:`[Teacup. Contents: chamomile, honey, guilt.] Underneath, in the saucer's shadow, a note in {f}'s hand: *Faint at midnight. You'll get half.*`, fx:{wit:1, set:{proof:1}}, go:'scene'},
      {label:'Ask Princess Aria for help.', show:s=>s.flags.princess, t:`Aria listens, grins, and returns ten minutes later with {f}'s letters to the baron's daughter. "I *love* a scandal," she whispers.`, fx:{cha:1, set:{proof:1}}, go:'scene'},
      {label:'Get the "victim" to confess.', check:{stat:'cha', dc:15},
        win:{t:`She's terrified of {f} and grateful for a way out. She hands you his letters with shaking hands.`, fx:{cha:1, set:{proof:1}}, go:'scene'},
        lose:{t:`She faints. For real this time. A crowd gathers, and you slip away before anyone asks questions.`, go:'scene'}}
    ]},
    scene:{ scene:'palace', text:`Midnight. The music stops. Lord {f} climbs the grand staircase and flings out an arm.\n\n"Seraphine von Eisenreich! For your cruelty, your jealousy, and the poisoning of sweet Lady Clarette, I hereby break our engagement!"\n\nThree hundred nobles inhale at once. Seraphine stands perfectly still, chin up, every inch the villainess they expect. Then her eyes find yours.`, choices:[
      {label:'Present the receipts.', show:(s,v)=>v.proof, t:`You read his debts aloud, then his letters. Lady Clarette bursts into honest tears. {f} turns the color of old porridge, and the room turns on him like a tide.`, fx:{fame:3, rel:{sera:2}, npc:{f:-3}, seed:{k:'grudge', npc:'f'}}, log:'Exposed Lord {f}\'s fake scandal at the Winter Ball.', go:'after'},
      {label:'Make him retract. Keep the letters.', show:(s,v)=>v.proof, t:`You hold up one letter, just high enough for him to see. {f} clears his throat and announces he "misspoke." He'll owe you for the rest of his life, and he knows it.`, fx:{wit:1, rel:{sera:1}, npc:{f:1}, seed:{k:'secret', npc:'f'}}, go:'after'},
      {label:'"Objection!" Loudly. With feeling.', check:{stat:'cha', dc:18, npc:'f'},
        win:{t:`You give a speech so fiery the candles flicker. By the end, the nobles are booing {f}, and nobody can remember why they believed him.`, fx:{fame:2, cha:1, rel:{sera:2}, npc:{f:-3}, seed:{k:'grudge', npc:'f'}}, go:'after'},
        lose:{t:`Guards escort you out mid-sentence. Seraphine follows you, in front of everyone, which causes a bigger scandal than anything {f} said.`, fx:{fame:-2, rel:{sera:2}}, go:'after'}},
      {label:'Trust her. Just nod.', t:`Seraphine raises one hand. The champagne fountain freezes. Then the staircase. Then {f}'s boots, to the staircase. "Prove a single word," she says. Nobody can.`, fx:{rel:{sera:2}, mag:1}, go:'after'}
    ]},
    after:{ scene:'night', text:`Later, in the palace garden, Seraphine sits on the rim of a frozen fountain with her shoes in one hand.\n\n"The engagement is off. Father is furious. I have never felt so light in my life." She doesn't look at you. "It's not as if I *needed* you there. I just... wanted you there. There's a difference. Don't make that face."`, choices:[
      {label:'Ask her to dance. For real.', show:s=>rel('sera')>=5, t:`There's no music. She dances anyway, perfectly, and only steps on your foot once, on purpose. When it ends she doesn't let go.`, fx:{flag:'seraRomance', rel:{sera:3}}, log:'Danced with Seraphine in a frozen garden. Not a date. Obviously.', go:'END'},
      {label:'"So you *wanted* me there?"', t:`The fountain refreezes, with you partly in it. She is smiling, though. You both pretend she isn't.`, fx:{rel:{sera:1}, cha:1, hp:-8}, go:'END'},
      {label:'"You\'ll never stand alone again."', t:`Seraphine is quiet for a long time. "That's a reckless promise," she says. "I'm holding you to it."`, fx:{rel:{sera:2}, str:1}, log:'Promised Seraphine she would never stand alone again.', go:'END'}
    ]}
  }
},

/* ---------------- 3. ROOK ---------------- */
{
  id:'d_rook', stage:'adult', title:'The Howl at Midnight',
  blurb:'Rook is on your doorstep at midnight, soaked and bleeding. Slavers took three pups from his clan.',
  scene:'night', minAge:17,
  cond: s=>rel('rook')>=4,
  cast:{ s:{role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'night', text:`Someone hammers on your door at midnight. It's Rook, soaked with rain, knuckles split, ears flat to his skull.\n\n"Slavers hit my clan's camp outside the walls," he says. "Took three pups. The youngest is six." His voice is very calm, which is how you know how scared he is. "Trail goes to the docks. A ship called the *Gilded Hen*. Owner's a 'merchant' named {s}."\n\nHe hasn't asked for help. He wouldn't. He's just waiting to see if you'll come.`, choices:[
      {label:'Grab your gear. We go now.', t:`He doesn't say thank you. He just falls into step beside you, close enough that your shoulders touch.`, fx:{rel:{rook:1}}, go:'docks'},
      {label:'"Wait. We need a plan."', t:`Rook growls, then nods. "Fast plan."`, go:'plan'},
      {label:'Requisition a squad from the Order.', show:s=>s.path==='crown', t:`Your commander hears the word "slavers" and signs the order without reading it. Six knights are waiting at the docks within the hour.`, fx:{set:{squad:1}, fame:1}, go:'docks'},
      {label:'Follow the scent with him.', show:s=>s.race==='beast'||s.race==='dragon', t:`You drop your head beside his and catch it too: fear, tar, cheap perfume. Rook looks at you like you've given him something precious.`, fx:{rel:{rook:2}, set:{scent:1}}, go:'docks'}
    ]},
    plan:{ scene:'tavern', text:`The Rusty Anchor smells of tar and bad decisions. Everyone here knows something about the *Gilded Hen*, and nobody wants to say it while Rook looms in the doorway like a thundercloud with teeth.\n\nThe tide turns at dawn. After that, the ship is gone.`, choices:[
      {label:'Read the harbor records.', check:{stat:'wit', dc:16, job:{office:5}},
        win:{t:`The *Gilded Hen* declared "forty crates of tea." Tea doesn't need air holes. Aft hold, behind the crates.`, fx:{wit:1, set:{manifest:1}}, go:'docks'},
        lose:{t:`The records are forged so badly they're almost art. You learn nothing but the ship's berth number.`, go:'docks'}},
      {label:'Buy the dockmaster\'s silence. And map.', req:s=>s.gold>=60, reqText:'Needs 60 gold', t:`Sixty gold buys a hand-drawn map of the ship and the guard rotation.`, fx:{gold:-60, set:{manifest:1}}, go:'docks'},
      {label:s=>`Call in ${owedName()}'s favor.`, show:s=>hasSeed('owed'), t:s=>`${owedName()} knows a bosun on the *Gilded Hen*. Within the hour you have the hold layout, the guard count, and an unlocked porthole.`, fx:s=>Object.assign({set:{manifest:1}}, owedUse()), go:'docks'},
      {label:'Let Rook ask nicely.', check:{stat:'str', dc:15},
        win:{t:`Rook puts one hand flat on the bar. The bar cracks. Everyone in the tavern suddenly remembers everything.`, fx:{rel:{rook:1}, str:1, set:{manifest:1}}, go:'docks'},
        lose:{t:`It turns into a brawl. You win, technically, with a black eye and no information.`, fx:{hp:-8}, go:'docks'}}
    ]},
    docks:{ scene:'coast', text:(s,v)=>`The *Gilded Hen* sits low in the black water, lanterns hooded, crew moving fast. ${v.manifest?'You know exactly where the pups are: aft hold, behind the "tea."':'Somewhere in that hull are three children.'}${v.squad?' Six knights of the Order wait in the shadows behind you.':''}\n\nRook's breathing is ragged. "Whatever we do," he says, "we do it now."`, choices:[
      {label:'Sneak aboard up the anchor chain.', check:{stat:'luck', dc:(s,v)=>v.manifest?15:18, extra:(s,v)=>v.scent?[['Scent trail',3]]:[]},
        win:{t:`You slip over the rail unseen and straight down to the hold.`, fx:{luck:1, set:{quiet:1}}, go:'deck'},
        lose:{t:`The chain clanks. A boot finds your ribs before you find your footing.`, fx:{hp:-10}, go:'deck'}},
      {label:'Storm the gangplank.', check:{stat:'combat', dc:(s,v)=>v.squad?14:18},
        win:{t:`You hit the deck like a storm. Rook hits it like a bigger storm. The crew scatters.`, fx:{str:1}, go:'deck'},
        lose:{t:`They were ready. You fight through, but it costs blood.`, fx:{hp:-14}, go:'deck'}},
      {label:'Ask the harbor rats to chew the ropes.', show:s=>s.cheat==='tamer', t:`A hundred rats pour up the mooring lines. The ship drifts gently into the harbor wall while the crew chases squeaking shadows.`, fx:{cha:1, set:{quiet:1}}, go:'deck'}
    ]},
    deck:{ scene:'coast', text:`In the hold: three wolf pups in a cage, the smallest asleep on the other two. Rook makes a sound you will remember for the rest of your life.\n\nA lantern swings up. {s}, {s.look}, stands on the stairs with a crossbow and two hired swords. {s.He} is {s.trait}, and {s.he} is doing sums. "Beastkin fetch good coin down south," {s} says. "So would whatever you are."`, choices:[
      {label:'Talk {s} down.', check:{stat:'cha', dc:17, npc:'s'},
        win:{t:`You lay out exactly how many years in prison slaving carries. {s} lowers the crossbow, then runs. You let {s.him} go. The pups matter more.`, fx:{cha:1, seed:{k:'spared', npc:'s'}}, go:'home'},
        lose:{t:`The bolt takes you in the shoulder. Rook tears the cage door off its hinges while {s} flees into the night.`, fx:{hp:-12, seed:{k:'grudge', npc:'s'}}, go:'home'}},
      {label:'Hit {s} before {s.he} shoots.', check:{stat:'combat', dc:18, npc:'s'},
        win:{t:`{s} goes down hard. Rook stops your last blow: "Not in front of the pups." The harbor watch drags {s.him} away in chains.`, fx:{str:1, fame:2, npc:{s:-3}, seed:{k:'grudge', npc:'s'}}, log:'Broke a slaving ring on the Asterhold docks.', go:'home'},
        lose:{t:`The hired swords are better than they look. You win, barely, bleeding, and {s} escapes in the confusion.`, fx:{hp:-15}, go:'home'}},
      {label:'Buy the pups back. Then report him.', req:s=>s.gold>=150, reqText:'Needs 150 gold', t:`{s} counts your 150 gold twice and hands over the key. The harbor watch arrests {s.him} an hour later, still counting.`, fx:{gold:-150, wit:1, npc:{s:-2}, seed:{k:'grudge', npc:'s'}}, go:'home'}
    ]},
    home:{ scene:'camp', text:`By dawn the pups are home, tumbling over each other in the clan's camp while their mother sobs into Rook's chest. The clan elder presses a carved wolf tooth into your palm without a word.\n\nRook walks you back toward the city in silence. Halfway there, he stops. "I couldn't have done it alone." A long pause. "I don't... want to do things alone anymore. Is that weird?"`, choices:[
      {label:'Lean on his shoulder. Say nothing.', show:s=>rel('rook')>=5, t:`You sit together on a fence rail and watch the sun come up. His tail thumps the post once, twice. Neither of you says a word. Neither of you needs to.`, fx:{flag:'rookRomance', rel:{rook:3}}, log:'Watched the sunrise with Rook. Neither of you said a word.', go:'END'},
      {label:'"Not weird. That\'s called friends, idiot."', t:`Rook laughs, a big rough sound that startles birds out of the hedges. "Friends," he repeats, like he's tasting the word.`, fx:{rel:{rook:2}, cha:1}, go:'END'},
      {label:'"Then we train together. Every morning."', t:`He grins with far too many teeth. "Every morning" turns out to mean four a.m. You have never been stronger or more tired.`, fx:{rel:{rook:2}, str:2, maxhp:3}, go:'END'}
    ]}
  }
},

/* ---------------- 4. NIMUE ---------------- */
{
  id:'d_nimue', stage:'adult', title:'Four Hundred Years Overdue',
  blurb:'Nimue has an overdue notice from the Sunken Library. The fine is one soul or nine thousand gold. She would like a bodyguard who carries snacks.',
  scene:'library', minAge:17, dream:'mage',
  cond: s=>rel('nimue')>=4,
  cast:{ l:{role:'scholar'} },
  start:'a',
  beats:{
    a:{ scene:'library', text:`Nimue shuffles into your life holding a letter and a half-eaten cream puff.\n\n"The Sunken Library has sent me an overdue notice," she says, "for a book I borrowed four hundred years ago. The fine is one soul or nine thousand gold." She yawns. "I'd like to return it. In person. With a bodyguard who carries snacks."\n\nThe book is wrapped in chains. She doesn't let you see the title.`, choices:[
      {label:'Dive in through the lake.', t:`You pack a bag with three days of sweets. Nimue approves of the ratio.`, go:'lake'},
      {label:'Take the old aqueduct tunnels.', t:`"Ah, the tunnels," Nimue murmurs. "I remember those. Fondly? No. Not fondly."`, go:'tunnels'},
      {label:'Bake her bribe-grade pastries first.', show:s=>s.cheat==='cook'||s.job==='chef', t:`She eats seven, cries a little, and offers you tenure. Then she climbs onto your back for the walk to the lake.`, fx:{rel:{nimue:2}, cha:1}, go:'lake'}
    ]},
    lake:{ scene:'river', text:`The Sunken Library rests at the bottom of Lake Ondine, a stone dome glimmering under forty feet of green water. Nimue is asleep on your back before you reach the shore.\n\nYou need a way down. Old spellbooks mention an air-bubble charm. The local fish mention nothing; they are fish.`, choices:[
      {label:'Cast the air-bubble charm.', check:{stat:'mag', dc:17, race:{elf:3}},
        win:{t:`A shimmering bubble wraps you both. You walk down the lakebed like it's a garden path.`, fx:{mag:1}, go:'stacks'},
        lose:{t:`The bubble pops halfway down. You arrive coughing up lake, with an elf still asleep on your back.`, fx:{hp:-10}, go:'stacks'}},
      {label:'Ask the giant catfish for a lift.', show:s=>s.cheat==='tamer', t:`The catfish is very old and very polite. It carries you down and asks Nimue to sign its fin. She does, asleep.`, fx:{cha:1, luck:1}, go:'stacks'},
      {label:'Wake Nimue. Politely.', check:{stat:'luck', dc:15},
        win:{t:`She snaps her fingers. The entire lake parts like a curtain. She is asleep again before it closes behind you.`, fx:{luck:1}, go:'stacks'},
        lose:{t:`She casts it half-asleep. You arrive at the library upside down, slightly drowned, and covered in pondweed.`, fx:{hp:-8, mag:1}, go:'stacks'}}
    ]},
    tunnels:{ scene:'dungeon', text:`The aqueduct tunnels run under the lake, slick with moss and older than the kingdom. Every few steps, something clicks.\n\n"Traps," Nimue murmurs from your back. "I installed some of them. I don't remember which ones." She falls asleep again mid-word.`, choices:[
      {label:'Find the pattern in the traps.', check:{stat:'wit', dc:16, job:{gamer:4}},
        win:{t:`Every trap sits on a tile with a chipped corner. It's the laziest dungeon design you've ever seen. Nimue mumbles, "Rude."`, fx:{wit:1}, go:'stacks'},
        lose:{t:`You find the pattern by stepping on it. Several times.`, fx:{hp:-12}, go:'stacks'}},
      {label:'Run. Fast. Don\'t stop.', check:{stat:'luck', dc:16},
        win:{t:`Blades swing a hair behind you all the way down. You arrive breathless and unscratched.`, fx:{luck:1}, go:'stacks'},
        lose:{t:`A swinging log catches you square in the back. Nimue doesn't wake up.`, fx:{hp:-10, str:1}, go:'stacks'}},
      {label:'Use the archmage\'s old ward trick.', show:s=>s.flags.mentor, t:`You trace the sign the old archmage taught you in {home}. Every trap in the tunnel sighs and goes still. Nimue opens one eye. "...Who taught you that?"`, fx:{mag:1, rel:{nimue:1}}, go:'stacks'}
    ]},
    stacks:{ scene:'library', text:`The library is dry, silent, and lit by drowned stars. At the desk waits its warden, {l}, {l.look}, whose family has guarded these shelves for twelve generations. {l.He} is {l.trait} about it.\n\n"Professor Nimue. Four hundred and three years overdue."\n\nNimue unchains the book. The title reads: *Grain Accounts of the Northern Provinces, Year of the Long Winter.* Her hands are not quite steady.`, choices:[
      {label:'Read it together before returning it.', t:`Columns of numbers. Full granaries in the south. Requests for aid from the north, refused, refused, refused. Then the north came south with swords. The Demon War did not begin with a demon. It began with hunger.`, fx:{flag:'lore', wit:2, rel:{nimue:1}}, log:'Learned the Demon War began with a northern famine.', go:'end'},
      {label:'Negotiate the fine down.', check:{stat:'cha', dc:17, npc:'l'},
        win:{t:`{l} waives the soul and settles for a library card in your name. "You may read it here," {l.he} adds. You do. The war began with a famine the old kingdom ignored.`, fx:{cha:1, flag:'lore', npc:{l:2}}, log:'Learned the Demon War began with a northern famine.', go:'end'},
        lose:{t:`{l} will not budge on principle. You pay 80 gold in "processing fees" and are escorted out before you can open the book.`, fx:{gold:-80, npc:{l:-1}}, go:'end'}},
      {label:'Bribe the warden with dessert.', show:s=>s.cheat==='cook'||s.job==='chef'||s.dream==='rich', t:`{l} eats one éclair and weeps for twelve generations of lonely shifts. {l.He} waives everything and becomes your friend for life.`, fx:{npc:{l:3}, seed:{k:'friend', npc:'l'}, cha:1}, go:'end'}
    ]},
    end:{ scene:'night', text:`Back on the shore, Nimue sits wrapped in your coat, wide awake for once, watching stars on the water.\n\n"I fought in that war," she says. "I was very good at it. Many of the people I fought were only hungry." She tucks her knees up. "I borrowed the book so no one would read it and pity them. That was cowardly. I'm eight hundred years old, and I'm still learning not to be a coward."`, choices:[
      {label:'"I\'d wait centuries for you."', show:s=>rel('nimue')>=5, t:`Nimue looks at you for a long moment. "Please don't. Waiting is extremely boring. I've tried it." Then she kisses your cheek and falls asleep on your shoulder, which in elf, you're fairly sure, means yes.`, fx:{flag:'nimueRomance', rel:{nimue:3}}, log:'Nimue fell asleep on your shoulder. In elf, that means yes.', go:'END'},
      {label:'Ask her what the book said.', show:s=>!s.flags.lore, t:`She tells you, slowly, every refused letter. The war began with a famine the old kingdom let happen.`, fx:{flag:'lore', wit:1, rel:{nimue:1}}, log:'Learned the Demon War began with a northern famine.', go:'END'},
      {label:'"This time, it ends differently."', t:`"You sound like a hero in a very long book," Nimue says. "I'll read it. Even the boring parts."`, fx:{rel:{nimue:2}, mag:1}, log:'Promised Nimue this war would end differently.', go:'END'},
      {label:'Offer her the last cream puff.', t:`She accepts it with both hands, like a sacred relic, and eats it in silence. It's the closest you've ever seen her come to crying.`, fx:{rel:{nimue:2}, luck:1}, go:'END'}
    ]}
  }
},

/* ---------------- 5. GUILD EXAM (adv) ---------------- */
{
  id:'d_guild_exam', stage:'adult', title:'The S-Rank Exam',
  blurb:'Your name is called for the S-Rank promotion exam. Only four people have passed in ten years. The test is in the Whispering Forest.',
  scene:'forest', minAge:18, dream:'hero',
  cond: s=>s.path==='adv',
  cast:{ e:{role:'adventurer'}, p:{role:'adventurer'} },
  start:'a',
  beats:{
    a:{ scene:'tavern', text:`The guild hall goes quiet when your name is called. Only four people have passed the S-Rank exam in the last decade.\n\nThe examiner, {e}, {e.look}, explains it in one breath: "Whispering Forest. Find the Heartwood. Bring back a leaf. The trees will talk to you. Don't listen."\n\n{e.He} nods at the other candidate, {p}, a {p.trait} adventurer {p.look}. "You may work together. Most who do, regret it."`, choices:[
      {label:'Team up with {p}.', t:`{p} shakes your hand a little too hard. "Don't slow me down." "You either."`, fx:{npc:{p:1}, set:{team:1}}, go:'forest'},
      {label:'Go in alone.', t:`You walk into the trees without looking back. {p} mutters something unflattering.`, fx:{str:1}, go:'forest'},
      {label:'Ask about the hidden scoring criteria.', show:s=>s.job==='gamer'||s.job==='student', t:`{e} blinks. "Nobody has ever asked that." A pause. "Points for saving others. Penalties for setting the forest on fire. Last year was... a problem."`, fx:{wit:1, set:{tip:1}}, go:'forest'}
    ]},
    forest:{ scene:'forest', text:`The trees lean in, and their voices are ones you know.\n\nYour boss from your first life, asking why the report isn't done. Your mother, from a world you'll never see again, asking why you never called. A voice exactly like {top}'s, saying they'd be better off without you.\n\nThe path splits. The whispers get louder down both forks.`, choices:[
      {label:'Answer them. Honestly.', check:{stat:'cha', dc:17},
        win:{t:`You tell your mother you're sorry. You tell {top} you're staying anyway. The voices go quiet, one by one, like candles.`, fx:{cha:2}, go:'core'},
        lose:{t:`You argue with the voices until you're hoarse and hopelessly lost.`, fx:{hp:-8}, go:'lost'}},
      {label:'Cover your ears and push on.', check:{stat:'str', dc:16},
        win:{t:`You march straight through the whispering until the trees give up on you.`, fx:{str:1}, go:'core'},
        lose:{t:`The whispers get under your skin anyway. You stumble off the path and fall into a hollow.`, fx:{hp:-10}, go:'lost'}},
      {label:'Tell your old boss: "I quit."', show:s=>s.job==='office', t:`It is the most satisfying sentence you have said in two lifetimes. The tree it came from actually flinches. The path clears.`, fx:{wit:1, cha:1}, go:'core'},
      {label:'Grab {p}\'s hand and walk.', show:(s,v)=>v.team, check:{stat:'luck', dc:14},
        win:{t:`Neither of you listens to the trees. You listen to each other's terrible jokes instead. It works.`, fx:{luck:1, npc:{p:2}}, go:'core'},
        lose:{t:`A voice speaks {p}'s name, and {p.he} lets go of your hand.`, go:'lost'}}
    ]},
    lost:{ scene:'forest', text:`In a hollow where the whispers pool like fog, you find {p}, tangled in roots that are slowly pulling {p.him} into the earth. {p.His} eyes are glazed. {p.He}'s talking to someone who isn't there.\n\nThe path out is right behind you. {e} did say most who work together regret it.`, choices:[
      {label:'Tear the roots apart.', check:{stat:'str', dc:17},
        win:{t:`The roots snap like bowstrings. {p} gasps awake, clinging to your arm. "I owe you," {p.he} rasps.`, fx:{str:1, npc:{p:3}, seed:{k:'owed', npc:'p'}}, go:'core'},
        lose:{t:`The roots fight back, hard. You get {p} free, bleeding from a dozen cuts.`, fx:{hp:-12, npc:{p:3}, seed:{k:'owed', npc:'p'}}, go:'core'}},
      {label:'Wake {p} with the truth.', check:{stat:'cha', dc:16, npc:'p'},
        win:{t:`"Whoever it is, they're not here. I am." {p}'s eyes clear. The roots let go.`, fx:{cha:1, npc:{p:3}, seed:{k:'friend', npc:'p'}}, go:'core'},
        lose:{t:`{p} doesn't hear you. You end up cutting {p.him} loose with a dagger and a lot of swearing.`, fx:{hp:-8, npc:{p:1}}, go:'core'}},
      {label:'Leave {p}. It\'s an exam.', t:`You walk away. Behind you, the roots creak. Later you learn the proctors pulled {p} out alive, and furious.`, fx:{npc:{p:-4}, seed:{k:'grudge', npc:'p'}, set:{left:1}}, go:'core'}
    ]},
    core:{ scene:'forest', text:`At the forest's heart stands the Heartwood: a tree so old its bark has faces, and every face is crying. A guardian uncoils from its roots, a stag of twisted wood wearing a crown of thorns.\n\nIt doesn't attack. It waits, the way exam proctors wait.`, choices:[
      {label:'Fight the guardian.', check:{stat:'combat', dc:19},
        win:{t:`It's a brutal, beautiful fight. When the stag kneels, it offers you a leaf with its own mouth. {e} is waiting at the forest edge: "S-Rank. Welcome."`, fx:(s,v)=>({str:2, fame:4, gold:150+(v.tip?50:0)}), log:'Passed the S-Rank exam by besting the Heartwood guardian.', go:'END'},
        lose:{t:`You get your leaf, along with three cracked ribs. "A-Rank," {e} says, not unkindly. "Come back next year."`, fx:{hp:-16, gold:50, fame:1}, go:'END'}},
      {label:'Listen to why the tree is crying.', check:{stat:'mag', dc:17, race:{elf:3}},
        win:{t:`It weeps for everyone the whispers have swallowed. You promise to come back and clear the paths. The tree drops a single golden leaf into your hand.`, fx:(s,v)=>({mag:2, fame:4, gold:v.tip?150:100}), log:'Passed the S-Rank exam by listening to a weeping tree.', go:'END'},
        lose:{t:`The grief is too much. You come to outside the forest with a plain green leaf and a pounding head. "A-Rank," says {e}.`, fx:{hp:-8, gold:50}, go:'END'}},
      {label:'Befriend the guardian stag.', show:s=>s.cheat==='tamer', t:`The stag sniffs you, sighs, and rests its thorny crown in your lap. {e} watches the whole thing with {e.his} mouth open. "That's... not in the rubric. S-Rank."`, fx:{cha:2, fame:4, gold:120}, log:'Passed the S-Rank exam by befriending the Heartwood guardian.', go:'END'},
      {label:'Face it together with {p}.', show:(s,v)=>!v.left, check:{stat:'combat', dc:16},
        win:{t:`Back to back, you and {p} bring the guardian to its knees. Two S-Ranks in one year. The guild throws a party that lasts three days.`, fx:{str:1, fame:3, gold:120, npc:{p:2}, seed:{k:'rival', npc:'p'}}, log:'Passed the S-Rank exam alongside {p}.', go:'END'},
        lose:{t:`The guardian scatters you both. You crawl out together, A-Rank and laughing about it. "Next year," {p} says. "I'll beat you next year."`, fx:{hp:-10, gold:50, seed:{k:'rival', npc:'p'}}, go:'END'}}
    ]}
  }
},

/* ---------------- 6. CAFÉ RIVAL (shop) ---------------- */
{
  id:'d_cafe_rival', stage:'adult', title:'The Café Across the Street',
  blurb:'A gaudy golden café opens across Lantern Street. It has a twelve-voice choir that sings every order. Your regulars are drifting.',
  scene:'cafe', dream:'rich',
  cond: s=>s.path==='shop',
  cast:{ b:{role:'noble', g:'m'} },
  start:'a',
  beats:{
    a:{ scene:'cafe', text:`One morning a café opens directly across Lantern Street. It is gold. It is enormous. It is called *Café Magnifique*, and it has a twelve-voice choir that sings every order.\n\n"ONE. ICED. LAAAATTEEEE," the choir harmonizes. Your regulars drift toward the noise like moths.\n\nIts owner, Baron {b}, {b.look}, tips his hat at you through the window. He is {b.trait}, and he is very, very rich.`, choices:[
      {label:'Spy on his kitchen tonight.', t:`You wait for dark, wearing your least suspicious apron.`, go:'spy'},
      {label:'Launch loyalty cards.', check:{stat:'wit', dc:16}, auto:s=>s.job==='office',
        win:{t:`Buy nine coffees, get the tenth free. In this world, it's basically witchcraft. Your regulars come back with their little stamped cards like holy relics.`, fx:{wit:1, gold:60, set:{cards:1}}, go:'duel'},
        lose:{t:`The cards are counterfeited within a week. You have given away four hundred free coffees.`, fx:{gold:-50}, go:'duel'}},
      {label:'Challenge him to a cook-off.', t:`The Baron accepts so fast he must have been planning it. "Before the Duchess herself," he purrs.`, fx:{fame:1}, go:'duel'}
    ]},
    spy:{ scene:'night', text:`At midnight you creep into the alley behind Café Magnifique. The back door is propped open with a sack of flour.\n\nInside: the Baron's "artisan pastries" are bought day-old from a bakery across town. The choir sleeps in the storeroom and hasn't been paid in two months. And on his desk, a letter promising the city inspector a "generous gift" if your café fails its next inspection.`, choices:[
      {label:'Pocket the bribe letter.', check:{stat:'luck', dc:16},
        win:{t:`You're out the door with the letter before the guard dog finishes yawning.`, fx:{luck:1, set:{dirt:1}}, go:'duel'},
        lose:{t:`The guard dog does not finish yawning. You leave without the letter and with fewer trousers.`, fx:{hp:-8}, go:'duel'}},
      {label:'Talk to the unpaid choir.', check:{stat:'cha', dc:15},
        win:{t:`Twelve exhausted singers listen to your offer: fair wages, real beds, one day off a week. They exchange glances. "We'll be in touch," whispers the alto.`, fx:{cha:1, set:{choir:1}}, go:'duel'},
        lose:{t:`They're too scared of the Baron to even meet your eyes. The soprano gives you a cookie, though.`, go:'duel'}},
      {label:'Appraise the "artisan" pastries.', show:s=>s.cheat==='appraise', t:`[Croissant. Baked: four days ago. Origin: Dunmore's Discount Bakery. Markup: 900%.] You take one as evidence. It's stale.`, fx:{wit:1, set:{dirt:1}}, go:'duel'}
    ]},
    duel:{ scene:'market', text:`The Baron challenges you to a public cook-off. The judge: Duchess Amalthea, the most feared palate in {capital}. Half the city turns up.\n\nHis table glitters with gold leaf, and his choir is warming up. Your table has your knives, your ingredients, and whatever you remember from a life where dinner came from a convenience store.`, choices:[
      {label:'Cook your past-life comfort food.', check:{stat:'cha', dc:18, cheat:{cook:6}, job:{chef:4}},
        win:{t:`You make curry rice. The Duchess takes one bite, sets down her spoon, and weeps openly. "My mother," she whispers. "It tastes like my mother." It does not. It tastes like Japan.`, fx:{cha:2, fame:3, gold:150, set:{won:1}}, log:'Made a Duchess weep with curry rice. Won the cook-off.', go:'end'},
        lose:{t:`The Duchess calls it "charming." In her mouth, charming is a death sentence. The Baron wins by a whisker.`, fx:{fame:-1}, go:'end'}},
      {label:'Reveal the store-bought pastries.', show:(s,v)=>v.dirt, t:`You set the receipt beside his tart. The Duchess reads it, then looks at the Baron the way a hawk looks at a mouse. He is disqualified on the spot.`, fx:{wit:1, fame:2, gold:80, set:{won:1, exposed:1}}, go:'end'},
      {label:'Signal the choir.', show:(s,v)=>v.choir, t:`Mid-verse, all twelve singers walk across the square and stand behind your table. "ONE. CURRY. RIIICE." The crowd goes wild.`, fx:{cha:1, fame:3, gold:100, set:{won:1}}, go:'end'},
      {label:'Out-showboat him. Flaming dessert.', check:{stat:'luck', dc:17},
        win:{t:`The flames leap exactly as high as you hoped. The crowd gasps. The Duchess applauds. Your eyebrows survive.`, fx:{luck:1, gold:100, fame:2, set:{won:1}}, go:'end'},
        lose:{t:`The flames leap much higher than you hoped. You lose the cook-off and both eyebrows.`, fx:{hp:-8}, go:'end'}}
    ]},
    end:{ scene:'cafe', text:(s,v)=>`${v.won?`Within a month, Café Magnifique's choir is down to a duet. The Baron stands alone in his golden room, looking smaller than his hat.`:`The Baron won the day, but somehow his customers keep sneaking across the street to you when they think he isn't looking.`}\n\nOne evening, after closing, he knocks on your door. He takes off the hat. "How," he asks, sincerely, "do you make people *come back*?"`, choices:[
      {label:'Offer him a partnership.', check:{stat:'cha', dc:16, npc:'b'},
        win:{t:`The Baron's money and your cooking. Café Magnifique becomes your second branch, and the choir finally gets paid.`, fx:s=>({npc:{b:3}, seed:hasSeed('business')?{k:'friend', npc:'b'}:[{k:'business'},{k:'friend', npc:'b'}], income:hasSeed('business')?15:20, cha:1}), log:'Turned a rival Baron into a business partner.', go:'END'},
        lose:{t:`He takes it as an insult to his ancestors. "Partners? With a *commoner*?" He storms out, vowing revenge.`, fx:{npc:{b:-3}, seed:{k:'grudge', npc:'b'}}, go:'END'}},
      {label:'"Close shop. Leave my street."', t:`He goes. On the way out, he sells you his espresso machine at a humiliating discount. You will never forget the look on his face. Neither will he.`, fx:{gold:80, fame:1, npc:{b:-3}, seed:{k:'grudge', npc:'b'}}, go:'END'},
      {label:'Hire his choir.', req:s=>s.gold>=80, reqText:'Needs 80 gold', t:`The choir moves in that weekend. Every order at your café is now sung, slightly off-key and much happier. Business doubles.`, fx:{gold:-80, income:15, cha:1, npc:{b:-1}}, go:'END'},
      {label:'"Remember their names. That\'s all."', show:s=>s.dream==='love'||s.job==='chef'||s.job==='nurse', t:`The Baron stares at you like you've handed him the secret of the universe. Next week, he learns the name of his first regular. He nearly cries.`, fx:{npc:{b:4}, seed:{k:'friend', npc:'b'}, cha:1}, go:'END'}
    ]}
  }
},

/* ---------------- 7. COURT (crown) ---------------- */
{
  id:'d_court', stage:'adult', title:'The Traitor at the Table',
  blurb:'Your patrol routes turned up in a captured demon dispatch. Someone on the Royal Council is selling secrets to the north.',
  scene:'palace',
  cond: s=>s.path==='crown',
  cast:{ a:{role:'noble'}, b:{role:'noble'} },
  init:(s,v)=>{ v.t = Math.random()<.5 ? 'a' : 'b'; v.h = v.t==='a' ? 'b' : 'a'; },
  start:'a',
  beats:{
    a:{ scene:'palace', text:`Your commander shuts the war-room door and drops a captured demon dispatch on the table. It holds *your* patrol routes, copied word for word.\n\n"Someone on the Royal Council is selling us to the north," she says. "Only two had access: Treasurer {a}, {a.look}, and Marshal {b}, {b.look}. Find out which. Quietly. If you accuse the wrong one, we're both finished."`, choices:[
      {label:'Audit the treasury ledgers.', t:`You requisition three floors of paperwork. Your commander looks at you with pity.`, go:'ledger'},
      {label:'Tail them both at night.', t:`You borrow a dark cloak and a darker hat.`, go:'tail'},
      {label:'Ask Princess Aria to bait a trap.', show:s=>s.flags.princess, t:`Aria's eyes light up. "Fake battle plans? Two different versions? Oh, I've *always* wanted to do this."`, go:'trap'}
    ]},
    ledger:{ scene:'library', text:`The treasury archive is three floors of paper and one exhausted clerk who hasn't seen daylight since spring.\n\nSomewhere in here, money moves where it shouldn't. Treasurers have expenses. Marshals have expenses. Traitors have *interesting* expenses.\n\nThe clerk offers you tea, a lamp, and a look of deep sympathy.`, choices:[
      {label:'Follow the money.', check:{stat:'wit', dc:17, job:{office:5}}, auto:s=>s.cheat==='appraise',
        win:{t:(s,v,c)=>`Every month, five hundred gold flows from ${c[v.t].name}'s accounts to a charity called the Children of Eventide. Its wax seal is a black sun.`, fx:{wit:2, set:{proof:1}, seed:'clue'}, log:'Traced a councillor\'s gold to a Black Sun front.', go:'accuse'},
        lose:{t:`Six hours later you've found nothing but a thirty-year-old receipt for a royal pony. Time for the night shift.`, fx:{hp:-8}, go:'tail'}},
      {label:'Bribe the clerk for gossip.', req:s=>s.gold>=80, reqText:'Needs 80 gold', t:(s,v,c)=>`For 80 gold, the clerk whispers that ${c[v.t].name} comes to the archive at night, alone, and always leaves with copies.`, fx:{gold:-80, set:{hint:1}}, go:'tail'}
    ]},
    tail:{ scene:'night', text:(s,v,c)=>`You shadow both councillors through {capital}'s night. ${c[v.h].name} goes to a gambling den and loses a truly impressive amount of money: suspicious, and completely irrelevant.\n\n${c[v.t].name} goes to a cellar under a closed chapel. Through the cracked door: candles, robed figures, a black sun painted on the wall. ${c[v.t].name} hands over a scroll case.`, choices:[
      {label:'Sneak in and grab the scroll.', check:{stat:'luck', dc:(s,v)=>v.hint?15:17},
        win:{t:`You swap the scroll case for an empty one in the dark. Inside: the Order's winter deployments, and a list of names.`, fx:{luck:1, set:{proof:1}, seed:'clue'}, go:'accuse'},
        lose:{t:`A cultist spots you. You escape through a window, bleeding, empty-handed but very sure who you're after.`, fx:{hp:-12}, go:'accuse'}},
      {label:'Memorize the robed faces.', check:{stat:'wit', dc:16},
        win:{t:`You can't prove anything yet, but you'll know these faces anywhere: a baker, a priest, a royal tutor. The Black Sun is closer to the throne than anyone thinks.`, fx:{wit:1, seed:'clue'}, go:'accuse'},
        lose:{t:`Hoods and candlelight. You get nothing but the certainty of who walked in.`, go:'accuse'}},
      {label:'Walk in. You look like you belong.', show:s=>s.race==='demon', t:`The cultists take one look at your red eyes and bow. You walk out with the scroll case, a pamphlet, and an invitation to next month's meeting.`, fx:{cha:1, set:{proof:1}, seed:'clue'}, log:'Infiltrated a Black Sun meeting. They bowed to you.', go:'accuse'}
    ]},
    trap:{ scene:'palace', text:(s,v,c)=>`Aria writes two fake battle plans herself. One says the army will march through the Frostgate; the other, through the Weeping Pass. Treasurer {a} gets one, Marshal {b} the other.\n\nThree days later, demon scouts swarm the ${v.t==='a'?'Frostgate':'Weeping Pass'}. Aria slides the copy across the table to you. "Well," she says. "That's rather conclusive."`, choices:[
      {label:'Arrest the traitor at dawn.', t:`Aria insists on coming. She brings snacks.`, fx:{set:{proof:1}}, go:'accuse'},
      {label:'Watch who they meet first.', check:{stat:'wit', dc:16},
        win:{t:(s,v,c)=>`${c[v.t].name} meets a robed figure who wears a black sun ring. Now you know who's buying.`, fx:{wit:1, set:{proof:1}, seed:'clue'}, go:'accuse'},
        lose:{t:`They meet no one. Either they're careful or they're spooked. You still have the copy.`, fx:{set:{proof:1}}, go:'accuse'}}
    ]},
    accuse:{ scene:'palace', text:(s,v,c)=>`The Royal Council convenes. King Aldric looks tired. Treasurer {a} and Marshal {b} sit across from each other, both very carefully not looking at you.\n\n"You asked for this session," the King says. "Speak."${v.proof?`\n\nThe proof against ${c[v.t].name} sits in your folder like a loaded crossbow.`:''}`, choices:[
      {label:'Lay out the proof.', show:(s,v)=>v.proof, t:(s,v,c)=>`You lay it all down: the gold, the copies, the black sun. ${c[v.t].name} goes white. The guards don't wait for the King's nod.`, fx:{fame:3, set:{caught:1}}, go:'verdict'},
      {label:s=>`Accuse ${castObj().a.name}. Bluff the rest.`, show:(s,v)=>!v.proof, check:{stat:'cha', dc:17, npc:'a'},
        win:{t:(s,v,c)=>v.t==='a'?`You talk like you have a mountain of evidence. ${c.a.name} cracks and confesses.`:`${c.a.name} breaks down, but only to confess gambling debts. ${c.b.name}, the real traitor, slips out that night.`, fx:(s,v)=>v.t==='a'?{fame:3, cha:1, set:{caught:1}}:{fame:-2, npc:{a:-3, b:-1}, seed:{k:'grudge', npc:'a'}, omen:1}, go:(s,v)=>v.t==='a'?'verdict':'END'},
        lose:{t:(s,v,c)=>`${c.a.name} demolishes your bluff with a raised eyebrow.${v.t==='a'?' The traitor walks free, smiling.':' And the real traitor, you later realize, never even had to speak.'}`, fx:{fame:-2, npc:{a:-3}, seed:{k:'grudge', npc:'a'}, omen:1}, go:'END'}},
      {label:s=>`Accuse ${castObj().b.name}. Bluff the rest.`, show:(s,v)=>!v.proof, check:{stat:'cha', dc:17, npc:'b'},
        win:{t:(s,v,c)=>v.t==='b'?`You talk like you have a mountain of evidence. ${c.b.name} cracks and confesses.`:`${c.b.name} breaks down, but only to confess gambling debts. ${c.a.name}, the real traitor, slips out that night.`, fx:(s,v)=>v.t==='b'?{fame:3, cha:1, set:{caught:1}}:{fame:-2, npc:{b:-3, a:-1}, seed:{k:'grudge', npc:'b'}, omen:1}, go:(s,v)=>v.t==='b'?'verdict':'END'},
        lose:{t:(s,v,c)=>`${c.b.name} demolishes your bluff with a raised eyebrow.${v.t==='b'?' The traitor walks free, smiling.':' And the real traitor, you later realize, never even had to speak.'}`, fx:{fame:-2, npc:{b:-3}, seed:{k:'grudge', npc:'b'}, omen:1}, go:'END'}},
      {label:'Say nothing yet. Keep watching.', t:`You ask for more time. The King grants it, wearily. The leaks continue all winter, and the north grows bolder.`, fx:{omen:1, wit:1}, go:'END'}
    ]},
    verdict:{ scene:'palace', text:(s,v,c)=>`${c[v.t].name} sits in chains in the King's private study, looking older than an hour ago.\n\n"They promised the war would be quick," ${he(c[v.t])} says. "That when Malgrave woke, the ones who helped would be spared. I have grandchildren." ${He(c[v.t])} looks at you. "What happens to me is your recommendation, apparently."`, choices:[
      {label:'Hand them to the King\'s justice.', t:(s,v,c)=>`${c[v.t].name} is stripped of rank and sent to the Glass Tower for life. You get a medal and a very long handshake from the King.`, fx:(s,v)=>({fame:3, gold:200, npc:{[v.t]:-4}, seed:{k:'grudge', npc:v.t}, str:1}), log:'Unmasked a traitor on the Royal Council.', go:'END'},
      {label:'Turn them into a double agent.', check:{stat:'wit', dc:17},
        win:{t:(s,v,c)=>`${c[v.t].name} keeps their seat and feeds false plans north for the rest of the war. The demon scouts start getting lost.`, fx:(s,v)=>({wit:2, omen:-1, npc:{[v.t]:1}, seed:{k:'secret', npc:v.t}}), log:'Turned a traitorous councillor into a double agent.', go:'END'},
        lose:{t:(s,v,c)=>`${c[v.t].name} agrees, then vanishes north within the week. The Black Sun takes the loss personally.`, fx:(s,v)=>({hp:-10, omen:1, seed:{k:'grudge', npc:v.t}}), go:'END'}},
      {label:'"Tell me everything about the Black Sun."', t:(s,v,c)=>`${c[v.t].name} talks until dawn: safehouses, passwords, a ritual planned for "the night the north wakes." You take notes until your hand cramps.`, fx:(s,v)=>({wit:1, fame:1, seed:'clue', useSeed:{k:'grudge', npc:v.t}}), log:'Learned the Black Sun\'s plans from a captured traitor.', go:'END'}
    ]}
  }
},

/* ---------------- 8. BANDIT KING (echo: spared) ---------------- */
{
  id:'d_bandit_king', stage:'adult', title:'The Bandit King of the Thornwood',
  blurb:'A Bandit King has united every gang in the Thornwood. The face on the wanted poster is one you spared a long time ago.',
  scene:'forest', echo:true,
  cond: s=>hasSeed('spared'),
  cast:{ k:{seed:'spared', role:'bandit'} },
  start:'a',
  beats:{
    a:{ scene:'forest', text:(s,v,c)=>`Merchants won't use the Thornwood road anymore. A Bandit King has united every gang in the forest, and the wanted poster in the market shows a face you know, older and harder now: {k}, the one you let go all those years ago.\n\n${c.k.att>=2?`Pinned under the poster, in clumsy handwriting addressed to you: *If you come, come alone. I haven't forgotten.*`:c.k.att<=-1?`Someone has carved your name into the poster board, then stabbed a knife through it.`:`The bounty is 250 gold. Nobody has collected it, and several people have tried.`}`, choices:[
      {label:'Go to the Thornwood alone.', t:`You leave your weapons sheathed and your hands where they can be seen.`, go:'camp'},
      {label:'Lead the hunt with soldiers.', t:`Twenty soldiers, two trackers, one plan. It should be enough.`, fx:{fame:1}, go:'ambush'},
      {label:'Carry a royal pardon in your pocket.', show:s=>s.path==='crown'||s.flags.princess, t:`It takes a week and every ounce of influence you have, but you ride out with a pardon bearing the royal seal and a blank space for a name.`, fx:{set:{pardon:1}}, go:'camp'}
    ]},
    camp:{ scene:'camp', text:(s,v,c)=>`{k}'s camp isn't a robbers' den. It's a village: tents, cookfires, children chasing chickens. Farmers from the north whose fields froze three winters running. Deserters. Orphans.\n\n${c.k.att>=2?`{k} sees you and laughs out loud, then pulls you into a crushing hug. "You came!"`:c.k.att<=-1?`{k} meets you with a drawn blade. "You spared me once to feel good about yourself. What do you want now?"`:`{k} watches you from the biggest tent, arms folded, unreadable.`}`, choices:[
      {label:'Offer them honest work.', check:{stat:'cha', dc:17, npc:'k', extra:(s,v)=>v.pardon?[['Royal pardon',4]]:[]},
        win:{t:(s,v,c)=>`${s.path==='shop'?'Café jobs, delivery routes, kitchen work.':s.path==='crown'?'Pardons, border patrols, a uniform.':'Guild contracts, real pay, real names.'} {k} looks at the children, and slowly nods.`, fx:{cha:1, npc:{k:2}}, go:'deal'},
        lose:{t:`{k} shakes {k.his} head. "Words are cheap. You want us to trust you? Bandit rules."`, go:'duel'}},
      {label:'Settle it with a duel.', t:`The camp goes quiet. {k} grins slowly. "Now you're talking my language."`, go:'duel'},
      {label:'Cook for the whole camp.', show:s=>s.path==='shop'||s.cheat==='cook', t:`You cook until midnight. Two hundred people eat their first hot meal in weeks. The old grandmothers start calling you "the child." {k} sits beside you, very quiet.`, fx:{npc:{k:3}, cha:1, relAll:1}, go:'deal'}
    ]},
    duel:{ scene:'forest', text:`{k} draws two hooked knives. The camp forms a ring of torches.\n\n"Bandit rules," {k.he} says. "You win, we listen. I win, you walk out with your boots and nothing else." {k.He} is {k.trait}, and {k.he} fights like someone who learned on an empty stomach.`, choices:[
      {label:'Fight fair.', check:{stat:'combat', dc:18, npc:'k'},
        win:{t:`You disarm {k} with the move you've practiced a thousand times. The camp roars. {k} laughs from the dirt. "Fine. We listen."`, fx:{str:1, npc:{k:1}}, go:'deal'},
        lose:{t:`{k} puts you on your back in three moves. "Go home," {k.he} says, almost kindly. "We're even now."`, fx:{hp:-14, npc:{k:1}}, go:'END'}},
      {label:'Fight dirty. Bandit rules, right?', check:{stat:'wit', dc:16, npc:'k'},
        win:{t:`A fistful of dirt, a kicked torch, a knife at the throat. {k} stares, then cackles. "You *learned*!"`, fx:{wit:1, npc:{k:2}}, go:'deal'},
        lose:{t:`{k} invented every dirty trick you know. You limp out of the Thornwood with your boots and a lesson.`, fx:{hp:-10}, go:'END'}},
      {label:'Put down your sword. "Your call."', t:(s,v,c)=>c.k.att>=0?`{k} looks at your empty hands for a long moment, then sheathes {k.his} knives. "You're still an idiot," {k.he} says. "Fine."`:`{k} kicks you in the chest and leaves you lying there. "Mercy is a rich person's game."`, fx:(s,v,c)=>c.k.att>=0?{npc:{k:2}, luck:1}:{hp:-8, npc:{k:-1}}, go:(s,v,c)=>c.k.att>=0?'deal':'END'}
    ]},
    ambush:{ scene:'forest', text:`Your soldiers spring the trap at dawn. The bandits fight like people with nothing to lose, because they have nothing to lose.\n\nIn the smoke, you come face to face with {k}. {k.He} knows you instantly. For a heartbeat, neither of you moves.`, choices:[
      {label:'Take {k} prisoner.', check:{stat:'combat', dc:17, npc:'k'},
        win:{t:`It's quick and ugly. {k} ends up face-down in the mud with your knee in {k.his} back.`, fx:{str:1}, go:'judge'},
        lose:{t:`{k} slips your grip and vanishes into the trees, leaving you with a knife wound and a smoking camp.`, fx:{hp:-15, npc:{k:-2}}, go:'END'}},
      {label:'"Hold! Ceasefire!" Talk instead.', check:{stat:'cha', dc:16, npc:'k'},
        win:{t:`Both sides lower their weapons, slowly. {k} jerks {k.his} head toward the camp. "Talk, then."`, fx:{cha:1}, go:'camp'},
        lose:{t:`An arrow takes you in the leg before anyone hears you. But {k} hears, and screams at {k.his} people to stop.`, fx:{hp:-10}, go:'camp'}}
    ]},
    judge:{ scene:'capital', text:`{k} sits in chains in the garrison cell, looking younger than the poster.\n\nThe magistrate wants your recommendation. Hanging is traditional for bandit kings. Outside the window, two of {k}'s camp children are waiting by the gate, and have been since dawn.`, choices:[
      {label:'Hand {k} to the magistrate.', t:`The bounty is paid in full. {k} doesn't look at you as they take {k.him} away. The children are still at the gate when you leave.`, fx:{gold:200, fame:3, npc:{k:-4}, useSeed:{k:'spared', npc:'k'}, seed:{k:'grudge', npc:'k'}}, log:'Collected the bounty on the Bandit King, {k}.', go:'END'},
      {label:'Recruit {k}\'s band for the war.', check:{stat:'cha', dc:16, npc:'k'},
        win:{t:`"You'd trust us?" {k} says. "With the north coming?" You nod. {k} holds out {k.his} chained hands to shake. "Then we'll come when you call."`, fx:{flag:'banditAlly', useSeed:{k:'spared', npc:'k'}, seed:{k:'friend', npc:'k'}, npc:{k:3}}, log:'The Thornwood band swore to fight for you.', go:'END'},
        lose:{t:`{k} spits on the floor. "Ask me when I'm not in chains." The magistrate's patience runs out, and so does yours.`, fx:{fame:1, gold:100, useSeed:{k:'spared', npc:'k'}, seed:{k:'grudge', npc:'k'}}, go:'END'}},
      {label:'Let {k} go. Again.', t:`You unlock the door. "Twice," {k} says. "That's twice." {k.He} walks out to the children at the gate and doesn't look back. You think {k.he} is crying.`, fx:{npc:{k:3}, luck:2, fame:-1}, go:'END'}
    ]},
    deal:{ scene:'camp', text:`{k} walks you to the edge of camp, past children playing "Bandit King and the Hero" with sticks. Both sides are winning.\n\n"When you let me go," {k} says, "I was a starving kid and I thought you were an idiot. I've thought about it every day since." {k.He} holds out a hand. "Whatever's coming from the north... if you call, we come."`, choices:[
      {label:'Shake on it.', t:`{k}'s grip is all calluses and old scars. "Don't make me regret it." "You either."`, fx:{flag:'banditAlly', useSeed:{k:'spared', npc:'k'}, seed:{k:'friend', npc:'k'}, npc:{k:2}, cha:1}, log:'The Bandit King of the Thornwood swore to answer your call.', go:'END'},
      {label:'Make them official: the Thornwood Rangers.', show:s=>s.path==='crown'||s.path==='adv', t:`Within a season, the bandits wear green cloaks and guard the very road they used to rob. {k} insists on keeping the crown, a bent tin thing, for ceremonies.`, fx:{flag:'banditAlly', useSeed:{k:'spared', npc:'k'}, seed:{k:'friend', npc:'k'}, npcSet:{k:{role:'guard'}}, fame:3}, log:'Turned the Thornwood bandits into the Thornwood Rangers.', go:'END'},
      {label:'Hire them as café delivery runners.', show:s=>s.path==='shop', t:`Nobody robs your deliveries, ever. They arrive hot, on time, and occasionally with a surprise gift of someone else's cheese.`, fx:{flag:'banditAlly', useSeed:{k:'spared', npc:'k'}, seed:{k:'friend', npc:'k'}, income:10, gold:50}, log:'Hired the Thornwood bandits as café delivery runners.', go:'END'}
    ]}
  }
},

/* ---------------- 9. FRAMED (echo: grudge) ---------------- */
{
  id:'d_framed', stage:'adult', title:'The Star Sapphire Affair',
  blurb:'Guards kick down your door at dawn. You are under arrest for a theft you did not commit, and the witness is someone who has hated you for years.',
  scene:'capital', echo:true,
  cond: s=>hasSeed('grudge'),
  cast:{ g:{seed:'grudge', role:'noble'}, i:{role:'guard'} },
  start:'a',
  beats:{
    a:{ scene:'capital', text:(s,v,c)=>`Guards kick down your door at dawn. "{name}, you are under arrest for the theft of the Duchess Ilvane's Star Sapphire."\n\nThe sapphire is in your coat pocket. You've never seen it before in your life.\n\nBehind the guards stands {g}, {g.look}. ${c.g.att>=1?`{g.He} won't quite meet your eyes. There's guilt in it. Or fear.`:`{g.He} is smiling. "Hello, {name}. I told you I'd remember."`}`, choices:[
      {label:'Go quietly. Demand a trial.', t:`You hold out your wrists. If {g} wants a fight, you'll have it in a courtroom.`, go:'trial'},
      {label:'Bolt out the window.', check:{stat:'luck', dc:16},
        win:{t:`You land in a hay cart, which only happens in stories, and you're three streets away before the guards reach the stairs.`, fx:{luck:1}, go:'hunt'},
        lose:{t:`You land on the cobbles, not the hay cart. The guards collect you, groaning.`, fx:{hp:-10}, go:'trial'}},
      {label:'Shout for {top}.', show:s=>!!topComp(), t:`{top} arrives at a dead run and "accidentally" tangles up three guards. You slip out the back.`, fx:{relTop:1}, go:'hunt'}
    ]},
    hunt:{ scene:'night', text:`On the run, you work backwards. A stolen sapphire has to come from somewhere, and fences talk.\n\nBy midnight you're in a pawnshop that smells of mothballs and lies, facing an old fence who very clearly recognizes the description of "a noble {g.look}." The fence is pretending not to.`, choices:[
      {label:'Pay the fence for the truth.', req:s=>s.gold>=80, reqText:'Needs 80 gold', t:`Eighty gold buys a signed receipt: the "stolen" sapphire was pawned by {g}, then swapped for a replica.`, fx:{gold:-80, set:{proof:1}}, go:'trial'},
      {label:'Lean on the fence.', check:{stat:'str', dc:15},
        win:{t:`One hand on the counter is enough. The fence produces the pawn ticket, signed by {g}.`, fx:{str:1, set:{proof:1}}, go:'trial'},
        lose:{t:`The fence has a bodyguard. The bodyguard has opinions. You flee with nothing.`, fx:{hp:-10}, go:'trial'}},
      {label:'Appraise the sapphire in your pocket.', show:s=>s.cheat==='appraise', t:`[Star Sapphire (replica). Glass. Original pawned by: {g}.] You laugh out loud. The fence edges away.`, fx:{wit:1, set:{proof:1}}, go:'trial'},
      {label:'Check the pawn ledger\'s dates.', show:s=>s.job==='office', t:`The ledger is a mess, but you've reconciled worse. The original was pawned two days before the "theft," under {g}'s family seal.`, fx:{wit:1, set:{proof:1}}, go:'trial'}
    ]},
    trial:{ scene:'palace', text:`The courtroom is packed. Investigator {i}, {i.trait} and {i.look}, presides. {g} testifies with tears in {g.his} eyes about seeing you creep from the Duchess's chambers. The crowd murmurs. The Duchess fans herself so hard her wig shifts.\n\n"Well?" {i} asks. "Any defense?"`, choices:[
      {label:'Present the evidence.', show:(s,v)=>v.proof, t:`You lay the receipt on the bench. {i} reads it twice, then turns slowly to look at {g}.`, fx:{fame:2, set:{won:1}}, go:'verdict'},
      {label:'"Objection!" Cross-examine {g}.', check:{stat:'wit', dc:18, npc:'g', job:{gamer:3, student:3}},
        win:{t:`You catch {g} in three contradictions and a wrong day of the week. {g.His} story falls apart like wet bread. Somewhere, dramatic music should be playing.`, fx:{wit:1, fame:2, set:{won:1}}, go:'verdict'},
        lose:{t:`{g} has rehearsed this. Every question you ask makes you look guiltier.`, go:'verdict'}},
      {label:'Call your friends as character witnesses.', show:s=>allyCount()>=1||rel(topComp()||'lina')>=5, check:{stat:'cha', dc:16, extra:s=>[['Friends',Math.min(4,allyCount()+(topComp()&&rel(topComp())>=6?2:0))]]},
        win:{t:`{top} speaks first, then others. By the end, half the courtroom is vouching for you, and {g} is sweating.`, fx:{cha:1, relTop:1, set:{won:1}}, go:'verdict'},
        lose:{t:`Your friends are heartfelt and completely unconvincing. {i} thanks them for their "enthusiasm."`, fx:{relTop:1}, go:'verdict'}}
    ]},
    verdict:{ scene:'palace', text:(s,v,c)=>v.won?`The courtroom turns on {g} like weather. {i} orders the real sapphire recovered and {g} held.\n\n${c.g.att>=1?`{g} looks at you, and for once there's no venom in it. Just exhaustion.`:`{g} glares at you from between two guards, shaking with fury.`} What happens now is, apparently, up to you.`:`Guilty. Even {i} looks unsure saying it. A fine of 150 gold, and your name in every scandal sheet in {capital}.\n\n{g} smiles at you across the courtroom. Then the smile slips, just for a second, as if {g.he} expected to feel better than this.`, choices:[
      {label:'Demand the full penalty.', show:(s,v)=>v.won, t:`{g} is stripped of title and exiled south. The grudge ends because there's no one left in {capital} to hold it.`, fx:{fame:2, npc:{g:-2}, useSeed:{k:'grudge', npc:'g'}, str:1}, log:'Exposed {g}\'s frame-up. {g} was exiled.', go:'END'},
      {label:'Ask {g} why. Really ask.', show:(s,v)=>v.won, check:{stat:'cha', dc:16, npc:'g'},
        win:{t:`It all comes out: a family in ruin, years of being compared to you, a hatred that was easier than grief. You drop the charges. {g} cries for a long time. Then {g.he} shakes your hand.`, fx:{cha:2, npc:{g:6}, useSeed:{k:'grudge', npc:'g'}, seed:{k:'friend', npc:'g'}}, log:'Turned an old enemy, {g}, into something like a friend.', go:'END'},
        lose:{t:`{g} won't say a word. {g.He} goes to prison still hating you, and you go home still not understanding why.`, fx:{cha:1, fame:1}, go:'END'}},
      {label:'Drop the charges. Keep the receipt.', show:(s,v)=>v.won, t:`You hand {g} a copy of the evidence. You keep the original. {g} understands perfectly: one wrong move, ever, and it goes to the Duchess.`, fx:{wit:1, npc:{g:1}, useSeed:{k:'grudge', npc:'g'}, seed:{k:'secret', npc:'g'}}, go:'END'},
      {label:'Pay the fine. Plan the comeback.', show:(s,v)=>!v.won, t:`You pay. You smile. You start keeping a very detailed notebook.`, fx:{gold:-150, fame:-2, wit:1, npc:{g:-1}}, log:'Was convicted of a theft you did not commit.', go:'END'},
      {label:'Confront {g} outside the court.', show:(s,v)=>!v.won, check:{stat:'cha', dc:17, npc:'g'},
        win:{t:`{g} breaks. "I didn't think they'd actually convict you." That night, {g.he} confesses to {i}. Your name is cleared by morning.`, fx:{cha:1, npc:{g:3}, useSeed:{k:'grudge', npc:'g'}}, log:'Got {g} to confess to framing you.', go:'END'},
        lose:{t:`{g}'s bodyguards step in before you reach {g.him}. You pay the fine with a black eye.`, fx:{gold:-150, hp:-10, fame:-2}, go:'END'}}
    ]}
  }
},

/* ---------------- 10. RIVAL RETURNS (echo: rival) ---------------- */
{
  id:'d_rival_return', stage:'adult', title:'The Rival Returns',
  blurb:'Your old academy rival is back in the capital, better than ever, and once again standing exactly where you wanted to be.',
  scene:'capital', echo:true,
  cond: s=>hasSeed('rival'),
  cast:{ r:{seed:'rival', role:'adventurer'} },
  init:(s,v,c)=>{ v.kind = s.path==='shop' ? 'chef' : s.path==='crown' ? 'knight' : 'adventurer'; c.r.role = v.kind; },
  start:'a',
  beats:{
    a:{ scene:'capital', text:(s,v,c)=>`${s.path==='shop'?`A food stall opens at the end of Lantern Street, and its line is longer than yours. Behind the grill, flipping skewers: {r}, your old academy rival.`:s.path==='crown'?`The Order names a new knight-captain for the eastern wall, the post you were promised. Its holder: {r}, your old academy rival, in shining new armor.`:`The wyvern bounty you'd tracked for a month is claimed the morning you set out. The name on the receipt: {r}, your old academy rival.`}\n\n${c.r.att>=2?`{r} grins like no time has passed. "Miss me?"`:c.r.att<=-1?`{r} smiles, but there's an edge in it now. "Still chasing my shadow?"`:`{r} gives you a curt nod. "Thought I'd find you here."`} Then: "Prove it. Same as always."`, choices:[
      {label:'Accept. Winner takes all.', t:`{r}'s eyes light up. Some things never change.`, go:'contest'},
      {label:'Propose a team-up instead.', check:{stat:'cha', dc:16, npc:'r'},
        win:{t:`{r} stares at you like you've grown a second head. Then: "...Fine. But I'm in charge." "You are absolutely not."`, fx:{cha:1, npc:{r:1}}, go:'team'},
        lose:{t:`"Team up? With *you*?" {r} laughs. "Contest. Tomorrow."`, go:'contest'}},
      {label:'"Remember the academy roof?"', show:(s,v,c)=>c.r.att>=2, t:`{r} snorts, then laughs until {r.he} has to lean on a wall. "We nearly died." "We nearly won." "...Want to nearly win again?"`, fx:{npc:{r:1}, luck:1}, go:'team'}
    ]},
    contest:{ scene:'battlefield', text:s=>`${s.path==='shop'?`The cook-off is held in the market square. Same ingredients, one hour, and the whole street votes with their forks.`:s.path==='crown'?`The duel is held in the barracks yard at dawn, with blunted steel and half the Order watching from the walls.`:`A griffin has been terrorizing the coast road. First one to bring back a feather wins. You both start running.`}\n\n{r} is good. {r.He} was always good. That was the problem.`, choices:[
      {label:'Go all out.', show:s=>s.path!=='shop', check:{stat:'combat', dc:18, npc:'r'},
        win:{t:`It's close, closer than it's ever been, but you finish on your feet and {r} finishes in the dust, laughing.`, fx:{str:2, fame:2, set:{won:1}}, go:'after'},
        lose:{t:`{r} wins by a hair and an elbow to the ribs.`, fx:{hp:-12, str:1}, go:'after'}},
      {label:'Cook from the heart.', show:s=>s.path==='shop', check:{stat:'cha', dc:18, cheat:{cook:6}, job:{chef:4}},
        win:{t:`Your dish wins by forty forks. {r} tastes it, swears, and asks for the recipe.`, fx:{cha:2, fame:2, gold:80, set:{won:1}}, go:'after'},
        lose:{t:`{r}'s skewers win the crowd. Yours win three old ladies and a dog.`, fx:{cha:1}, go:'after'}},
      {label:'Outthink {r}.', check:{stat:'wit', dc:17, npc:'r'},
        win:{t:`You let {r} get ahead, then use the shortcut {r.he} was too proud to take. Classic.`, fx:{wit:2, fame:1, set:{won:1}}, go:'after'},
        lose:{t:`{r} saw it coming. {r.He} always does. "Same trick as second year," {r.he} says. "Really?"`, fx:{wit:1}, go:'after'}},
      {label:'Play dirty.', check:{stat:'luck', dc:15},
        win:{t:`You win. {r} knows exactly how. {r.He} doesn't say anything, which is worse.`, fx:{luck:1, gold:60, npc:{r:-2}, set:{won:1}}, go:'after'},
        lose:{t:`The trick backfires spectacularly, in front of everyone.`, fx:{hp:-8, fame:-1, npc:{r:-1}}, go:'after'}}
    ]},
    team:{ scene:'forest', text:s=>`${s.path==='shop'?`Together you cater a duke's wedding for four hundred guests. Halfway through, the kitchen catches fire.`:s.path==='crown'?`Your joint patrol walks straight into a demon scouting party. Twelve of them, two of you.`:`The wyvern turns out to be a mother guarding eggs, and very much not in the mood.`}\n\n{r} looks at you. You look at {r}. For the first time in years, you're on the same side.`, choices:[
      {label:'Cover {r}\'s back.', check:{stat:'combat', dc:17},
        win:{t:`You move like you've practiced together for years. In a way, you have: every fight you ever had was practice for this one.`, fx:{str:1, fame:2, gold:100, npc:{r:2}}, go:'after'},
        lose:{t:`You take a hit meant for {r}. {r.He} drags you out, cursing your name the whole way.`, fx:{hp:-14, npc:{r:3}}, go:'after'}},
      {label:'Follow {r}\'s lead.', check:{stat:'luck', dc:15},
        win:{t:`{r}'s plan is insane. It works anyway. {r.He} is unbearable about it.`, fx:{luck:1, gold:80, npc:{r:2}}, go:'after'},
        lose:{t:`{r}'s plan is insane. It does not work. You both escape, singed and laughing.`, fx:{hp:-8, npc:{r:1}}, go:'after'}},
      {label:'Treat the wounded while {r} holds the line.', show:s=>s.job==='nurse'||s.cheat==='cook', t:`You triage like you're back on night shift. Nobody dies. {r} watches you work and says nothing, which from {r}, is a standing ovation.`, fx:{wit:1, fame:2, npc:{r:2}}, go:'after'}
    ]},
    after:{ scene:'tavern', text:(s,v,c)=>`That night, {r} buys the first round at {place}. ${v.won?`"You got lucky," {r.he} says. You both know you didn't.`:`"Told you," {r.he} says. You both know it was close.`}\n\n${c.r.att>=2?`{r} turns the mug in {r.his} hands. "You know you're the only reason I got this good? I hated you for years. Then I just... wanted you to see me."`:`{r} drinks in silence for a while. "Every time I got better, you were already there. It's exhausting, you know."`}`, choices:[
      {label:'"To friendship. Finally."', req:(s,v,c)=>c.r.att>=1, reqText:'Needs more trust', t:`{r} clinks your mug so hard it cracks. "Don't make it weird." It's already weird. It's also great.`, fx:{npc:{r:2}, useSeed:{k:'rival', npc:'r'}, seed:{k:'friend', npc:'r'}, cha:1}, log:'Your old rival, {r}, became a true friend.', go:'END'},
      {label:'"Same time next year?"', t:`{r} grins, all teeth. "You're on." Some rivalries are better than friendships.`, fx:{npc:{r:1}, luck:1, fame:1}, go:'END'},
      {label:'"Let\'s stop competing. Go separate ways."', t:`{r} nods slowly. Something in both of you unclenches. You shake hands like strangers, and part almost as friends.`, fx:{useSeed:{k:'rival', npc:'r'}, cha:1, heal:1}, go:'END'},
      {label:'Rub it in. Gently.', show:(s,v)=>v.won, t:`You order the most expensive drink in the house and make {r} pay. {r} pays. {r} will remember this.`, fx:{fame:1, cha:1, gold:50, npc:{r:-1}}, go:'END'}
    ]}
  }
},

/* ---------------- 11. EMPIRE (echo: business) ---------------- */
{
  id:'d_empire', stage:'adult', title:'Empire or Buyout',
  blurb:'Your business has grown big enough to be noticed. The Golden Ledger Consortium wants to buy it, or bury it.',
  scene:'market', echo:true, dream:'rich',
  cond: s=>hasSeed('business'),
  cast:{ i:{role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'market', text:`The Golden Ledger Consortium owns half the shops in {capital} and swallows the rest. Now they've noticed you.\n\nTheir envoy, {i}, {i.look}, slides a contract across your table. {i.He} is {i.trait} and smells of expensive ink. "Sell to us for two hundred and fifty gold. Or we open a copy of your business beside every branch you'll ever have." {i.He} smiles. "Your choice."`, choices:[
      {label:'Take the money.', t:`You sign. {i} takes your pen as a souvenir.`, fx:s=>Object.assign({gold:250, useSeed:{k:'business'}}, s.income>0?{income:-Math.min(s.income,30)}:{}), log:'Sold your business to the Golden Ledger Consortium.', go:'sold'},
      {label:'"No. I\'ll expand faster than you."', t:`{i} laughs, genuinely delighted. "Oh, I *like* you. This will be fun to watch."`, fx:{npc:{i:1}}, go:'expand'},
      {label:'Negotiate a partnership.', check:{stat:'cha', dc:17, npc:'i'},
        win:{t:`By midnight you've hammered out a deal: their money and supply lines, your name and recipes, and a contract clause your past self would be proud of.`, fx:{cha:1, income:25, npc:{i:2}, seed:{k:'friend', npc:'i'}}, log:'Partnered with the Golden Ledger Consortium on your own terms.', go:'END'},
        lose:{t:`{i} hears you out, then tears the contract in half. "That was your one chance."`, fx:{npc:{i:-2}}, go:'war'}}
    ]},
    expand:{ scene:'capital', text:`Expansion means three new branches, fifty new staff, and a mountain of paperwork that would make your past self weep with recognition.\n\nYou have about a season before the Consortium makes its move. {i} has already been seen dining with your suppliers. Spend the time well.`, choices:[
      {label:'Build a proper franchise system.', check:{stat:'wit', dc:17, job:{office:5}},
        win:{t:`Manuals. Training. Quality control. A logo. Your past self's corporate trauma finally pays dividends.`, fx:{wit:2, income:15}, go:'war'},
        lose:{t:`Two branches open. One burns down. The third is run by a man who insists on calling everything "synergy."`, fx:{gold:-80}, go:'war'}},
      {label:'Hire the people nobody else will.', t:`Orphans, retired adventurers, a reformed pickpocket, a nervous troll. They are the most loyal staff in {capital}.`, fx:{cha:1, set:{loyal:1}}, go:'war'},
      {label:s=>`Call in ${owedName()}'s favor.`, show:s=>hasSeed('owed'), t:s=>`${owedName()} shows up with a wagon of supplies and a cousin in every market town. "We're even now," they say, grinning.`, fx:s=>Object.assign({gold:100, set:{loyal:1}}, owedUse()), go:'war'}
    ]},
    war:{ scene:'market', text:`The Consortium strikes. Copycat shops open beside every branch, selling everything at half your price. Your suppliers suddenly "can't fill orders." A health inspector visits four times in one week.\n\n{i} sends a single black rose and a note: *Last chance.*`, choices:[
      {label:'Outlast them.', check:{stat:'luck', dc:17, extra:(s,v)=>v.loyal?[['Loyal staff',3]]:[]},
        win:{t:`The copycats bleed money faster than you do. One by one they close. {capital} starts calling your business "the one that beat the Ledger."`, fx:{luck:1, income:25, fame:3}, log:'Built a business empire that beat the Golden Ledger Consortium.', go:'END'},
        lose:{t:`You run out of money before they do. The Consortium takes your business for a fraction of its worth.`, fx:s=>Object.assign({gold:100, useSeed:{k:'business'}}, s.income>0?{income:-Math.min(s.income,30)}:{}), log:'Lost your business to the Golden Ledger Consortium.', go:'sold'}},
      {label:'Expose their price-fixing.', check:{stat:'wit', dc:18, npc:'i'},
        win:{t:`You trace the losses back to Consortium accounts and hand them to the Royal Magistrate. The Consortium is fined into oblivion. {i} keeps {i.his} job only because you know where the bodies are buried.`, fx:{wit:1, income:20, fame:2, seed:{k:'secret', npc:'i'}}, log:'Broke the Golden Ledger Consortium\'s price-fixing ring.', go:'END'},
        lose:{t:`They sue you for slander. You win, eventually, but the lawyers eat 150 gold and most of your spring.`, fx:{gold:-150, npc:{i:-2}, seed:{k:'grudge', npc:'i'}}, go:'END'}},
      {label:'Let the food do the talking.', show:s=>s.cheat==='cook'||s.job==='chef'||s.path==='shop', check:{stat:'cha', dc:15, cheat:{cook:6}},
        win:{t:`Their copycats can copy your menu, but not your hands. The lines outside your doors only get longer.`, fx:{cha:2, income:30}, log:'Out-cooked the Golden Ledger Consortium.', go:'END'},
        lose:{t:`Half your customers stay loyal. Half is enough to survive, not to win.`, fx:{income:5}, go:'END'}}
    ]},
    sold:{ scene:'night', text:`It's more money than you've ever held at once. You count it twice. Then a third time.\n\nThe next morning your sign comes down and a Consortium sign goes up. Your old regulars wave at you, a little sadly, through someone else's window. It's quieter now. You're not sure yet if that's good.`, choices:[
      {label:'Invest in {top}\'s dream.', show:s=>!!topComp(), t:`{top} stares at the purse, then at you. "Are you insane?" Then a hug that lifts you off the ground.`, fx:{gold:-100, relTop:3}, go:'END'},
      {label:'Start over, smaller. Just for love.', t:`A tiny stall, one product, your own two hands. It's the happiest you've been in years.`, fx:{gold:-100, seed:{k:'business'}, income:10, cha:1}, log:'Started a new, smaller business from scratch.', go:'END'},
      {label:'Take a long, lazy vacation.', t:`Hot springs. Naps. A shocking amount of mayonnaise. You come back rested and quietly wiser.`, fx:{gold:-50, heal:1, luck:2}, go:'END'}
    ]}
  }
},

/* ---------------- 12. FAVOR (echo: owed) ---------------- */
{
  id:'d_favor', stage:'adult', title:'A Favor Comes Due',
  blurb:'Someone who owes you a favor turns up at your door. They need help instead, and they are being followed.',
  scene:'tavern', echo:true,
  cond: s=>hasSeed('owed'),
  cast:{ o:{seed:'owed', role:'merchant'}, x:{role:'thief'} },
  start:'a',
  beats:{
    a:{ scene:'tavern', text:(s,v,c)=>`${c.o.att>=2?`{o} finds you at {place}, pale and apologetic. "I came to repay my debt to you," {o.he} says. "Instead I have to ask for another favor. I'm so sorry."`:`{o} slides into the seat across from you with a strained smile. "About that favor I owe you," {o.he} says. "I've found a way to pay it. It's not, strictly speaking, legal."`}\n\nBy the door lounges {x}, {x.look}, a debt collector for the Velvet Hand, who very obviously followed {o} here.`, choices:[
      {label:'"Debts can wait. Who\'s that?"', t:`{o} sags with relief. "I owe the Velvet Hand two hundred gold. It was for my sister's medicine. It doesn't matter why."`, fx:{npc:{o:1}}, go:'collect'},
      {label:'Hear the not-legal offer.', t:`{o} glances at the door, then pulls a folded paper from {o.his} sleeve.`, go:'offer'},
      {label:'Flash your Order badge at {x}.', show:s=>s.path==='crown', t:`{x} sees the badge and loses some of the swagger. Not all of it.`, fx:{set:{badge:1}}, go:'collect'}
    ]},
    offer:{ scene:'night', text:`"I've been hauling crates for some people in robes," {o} whispers. "They pay too well, and they never say what's inside. But I copied their delivery list."\n\nThe list names a dozen safehouses across {capital}. In the corner, someone has doodled a black sun.\n\n"It's yours," {o} says. "Debt paid. Just... I can't stop working for them. They'd know."`, choices:[
      {label:'Take the list. Call it even.', t:`You pocket the list. {o} leaves looking lighter, and more frightened.`, fx:{seed:'clue', useSeed:{k:'owed', npc:'o'}, wit:1}, log:'Got a list of Black Sun safehouses from {o}.', go:'after'},
      {label:'"Then I\'ll get you out."', t:`{o} stares at you. "Nobody gets out." "Watch me." You'll need to deal with that collector first.`, fx:{seed:'clue', npc:{o:2}}, go:'collect'},
      {label:'Turn {o} in to the guard.', t:`The guard thanks you. {o} looks at you from behind the bars like you've stabbed {o.him}. Maybe you have.`, fx:{fame:2, seed:['clue', {k:'grudge', npc:'o'}], useSeed:{k:'owed', npc:'o'}, npc:{o:-4}}, go:'END'}
    ]},
    collect:{ scene:'market', text:`{x} meets you behind the fish market, flanked by two very large friends. {x.He} is {x.trait} and bored.\n\n"{o} owes us two hundred," {x} says. "Plus interest. Plus the inconvenience of walking all the way here. I'm not unreasonable. Somebody pays, or somebody bleeds."`, choices:[
      {label:'Pay part. Negotiate the rest.', req:s=>s.gold>=120, reqText:'Needs 120 gold', t:`{x} counts your 120 gold, sighs, and tears up {o}'s note. "Pleasure doing business."`, fx:{gold:-120, npc:{o:3}}, go:'after'},
      {label:'Make {x} reconsider.', check:{stat:'str', dc:17, npc:'x', extra:(s,v)=>v.badge?[['Order badge',4]]:[]},
        win:{t:`You take the first big friend out before he finishes cracking his knuckles. {x} raises both hands. "Debt forgiven. Wow. Okay."`, fx:{str:1, npc:{o:2, x:-2}}, go:'after'},
        lose:{t:`The big friends are bigger than they looked. You crawl home, and the debt stands.`, fx:{hp:-12, set:{fail:1}}, go:'after'}},
      {label:'Bet the debt on a game of dice.', check:{stat:'wit', dc:16, npc:'x'},
        win:{t:`You spot {x}'s loaded dice on the second throw and switch them on the third. {x} loses the debt, and 80 gold.`, fx:{wit:1, gold:80, npc:{o:2}}, go:'after'},
        lose:{t:`{x}'s dice are loaded, and better than yours. You lose 80 gold, and the debt stands.`, fx:{gold:-80, set:{fail:1}}, go:'after'}}
    ]},
    after:{ scene:'tavern', text:(s,v,c)=>`${v.fail?`{o} patches your pride and your purse as best {o.he} can. "It's not your fault. They'll come again, but... you tried. Nobody's ever tried for me."`:`{o} turns up at your door a week later with a basket of bread and wet eyes. "I keep owing you. That's not how favors are supposed to work."`}\n\nBehind {o.him}, the street is quiet. For now.`, choices:[
      {label:'"Forget the favor. Just be my friend."', t:`{o} laughs, wipes {o.his} eyes, and agrees. It's the best trade you've ever made.`, fx:{useSeed:{k:'owed', npc:'o'}, seed:{k:'friend', npc:'o'}, npc:{o:2}, cha:1}, log:'Turned a debt into a friendship with {o}.', go:'END'},
      {label:'"You still owe me. I\'ll collect later."', show:(s,v,c)=>hasSeed('owed', x=>x.npc===c.o.id), t:`{o} nods solemnly. "When you call, I come." You believe {o.him}.`, fx:{luck:1, npc:{o:1}}, go:'END'},
      {label:'Ask {o} to teach you the trade.', t:`For a month {o} teaches you how merchants really think: margins, routes, who lies and how. You'll never haggle the same way again.`, fx:{wit:2, gold:50}, go:'END'}
    ]}
  }
},

/* ---------------- 13. ODD JOBS (filler) ---------------- */
{
  id:'d_odd_jobs', stage:'adult', title:'Odd Jobs', filler:true, repeat:true,
  blurb:'The notice board in the market is a museum of desperation. A few of the jobs actually pay.',
  scene:'market',
  cast:{ m:{role:'bard'} },
  start:'a',
  beats:{
    a:{ scene:'market', text:`The notice board in the {capital} market is mostly nonsense. A few jobs actually pay:\n\n*LOST: one (1) cat, extremely valuable, answers to Lord Fluffington.*\n*WANTED: brave soul to clear cellar of "noises."*\n*ESCORT needed for nervous poet's first public reading.* That one is signed by {m}, {m.look}.`, choices:[
      {label:'Find Lord Fluffington.', t:`The reward is listed as "a generous sum." Nobles always say that.`, fx:{set:{job:'cat'}}, go:'cat'},
      {label:'Clear the cellar of "noises."', t:`The innkeeper won't go past the top step. That's never a good sign.`, fx:{set:{job:'cellar'}}, go:'cellar'},
      {label:'Escort the nervous poet.', t:`{m} shakes your hand with both of {m.his} damp ones. "Thank you. Thank you. I might throw up."`, fx:{set:{job:'poet'}}, go:'poet'}
    ]},
    cat:{ scene:'capital', text:`Lord Fluffington is a fat white cat with the soul of a mountain goat. You spot him on the roof of the cathedral, three stories up, looking down at you with open contempt.\n\nA crowd gathers. Somebody starts taking bets.`, choices:[
      {label:'Climb after him.', check:{stat:'str', dc:15},
        win:{t:`You reach the roof, grab the cat, and only slip once. The crowd cheers. Lord Fluffington bites you, as a formality.`, fx:{str:1}, go:'pay'},
        lose:{t:`You slip twice. The cat comes down on his own, looking smug, the moment you hit the ground.`, fx:{hp:-8, set:{half:1}}, go:'pay'}},
      {label:'Lure him with fish.', check:{stat:'luck', dc:14},
        win:{t:`Lord Fluffington descends like royalty to claim his tribute.`, fx:{luck:1}, go:'pay'},
        lose:{t:`Six other cats arrive for the fish. Lord Fluffington does not.`, fx:{set:{half:1}}, go:'pay'}},
      {label:'Ask him nicely, as a fellow beast.', show:s=>s.cheat==='tamer'||s.race==='beast', t:`You meow something respectful. Lord Fluffington considers it, then hops down into your arms like it was his idea.`, fx:{cha:1}, go:'pay'}
    ]},
    cellar:{ scene:'dungeon', text:`The cellar under the Copper Kettle inn is dark, damp, and full of noises. Scratching. Chittering. Something large and wet moving behind the ale barrels.\n\nThe innkeeper hands you a lantern and locks the door behind you, "for safety."\n\nTwo glowing eyes. Then twelve more.`, choices:[
      {label:'Draw steel and go in.', check:{stat:'combat', dc:15},
        win:{t:`Giant rats, a dozen of them. You clear them out in a flurry of steel and squeaking.`, fx:{str:1}, go:'pay'},
        lose:{t:`The rats win the first round. You win the second, covered in bites and ale.`, fx:{hp:-10, set:{half:1}}, go:'pay'}},
      {label:'Find where they\'re getting in.', check:{stat:'wit', dc:15},
        win:{t:`A cracked drain. You seal it, and the rats lose interest by morning. The innkeeper's never seen anything so clever.`, fx:{wit:1}, go:'pay'},
        lose:{t:`You find three holes. There were seven.`, fx:{hp:-8, set:{half:1}}, go:'pay'}},
