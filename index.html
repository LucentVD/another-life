<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Another Life</title>
<meta name="theme-color" content="#0a0d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Another Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 16-bit JRPG on a phone. Framed blue windows, a pixel scene per chapter with character
   sprites standing in it, a menu cursor on choices. One dark theme by choice. */
:root{
  --night:#0a0d1f;
  --win-a:#1d2c6e;
  --win-b:#111a46;
  --raise:#24357e;
  --frame:#e4e8ff;
  --edge:#05071a;
  --ink:#f2f4ff;
  --soft:#c9d0f2;
  --muted:#8f99c8;
  --sakura:#ff8fb6;
  --gold:#ffd166;
  --good:#7cf0a4;
  --bad:#ff7a7a;
  --pixel:'DotGothic16', 'MS Gothic', 'Osaka-Mono', ui-monospace, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--pixel);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:none;letter-spacing:.02em}
img{image-rendering:pixelated;image-rendering:crisp-edges}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;letter-spacing:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:13px;line-height:1.6}
h1,h2,h3{font-family:var(--pixel);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:20px} h3{font-size:18px}

/* the JRPG window */
.win{position:relative;background:linear-gradient(180deg,var(--win-a),var(--win-b));border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame),inset 0 0 0 4px var(--edge),inset 0 6px 0 4px rgba(255,255,255,.06);
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.notch{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}

/* status bar */
.bar{flex:none;padding:max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));background:var(--edge);border-bottom:3px solid #2a3a8a;z-index:2}
.bar-top{display:flex;align-items:center;gap:10px}
.face{width:52px;height:56px;flex:none;background:linear-gradient(#3a4ea8,#22307a);border:3px solid var(--frame);outline:2px solid var(--edge);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.face .head{width:48px;height:52px}
.who{flex:1;min-width:0;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.who b{font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.purse{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.purse .g{color:var(--gold)} .purse .f{color:var(--sakura)}
.icon-btn{background:var(--raise);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame);width:44px;height:44px;display:grid;place-items:center;flex:none;font-size:22px;line-height:1}
.hp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.hp-k{color:var(--gold)}
.hp-track{flex:1;height:10px;background:var(--edge);border:2px solid #44508a;position:relative}
.hp-fill{height:100%;background:repeating-linear-gradient(90deg,#7cf0a4 0 6px,#4cc07a 6px 8px)}
.hp.low .hp-fill{background:repeating-linear-gradient(90deg,#ff7a7a 0 6px,#c84a4a 6px 8px)}

main{flex:1;overflow-y:auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}

/* scene banner with sprites */
.banner{position:relative;flex:none;border:3px solid var(--edge);outline:2px solid var(--frame);outline-offset:-5px;background:#000;overflow:hidden;line-height:0}
.scene{display:block;width:100%;height:auto}
.cast{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:0;padding:0 6px}
.cast.n1{justify-content:flex-end;padding-right:12px}
.sprite{margin:0;position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}
.sprite img{width:96px;height:96px;display:block}
.sprite.small img{width:64px;height:64px}
.sprite.big img{width:128px;height:128px}
.sprite figcaption{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;line-height:1;padding:3px 5px;background:var(--edge);color:var(--ink);border:2px solid var(--frame)}
.sprite.speak figcaption{color:var(--gold)}
.chips > .chip{flex:none;align-self:center;height:auto}
.banner-over{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;line-height:1.2}
.arc-title{font-size:17px;color:#fff;background:rgba(5,7,26,.82);border:2px solid var(--frame);padding:4px 8px;max-width:75%;text-wrap:balance}
.arc-step{font-size:10px;letter-spacing:2px;color:var(--gold);background:rgba(5,7,26,.82);padding:4px 6px;border:2px solid var(--frame);white-space:nowrap}
.arc-step span{color:rgba(255,255,255,.4)}
.age-box{display:flex;flex-direction:column;align-items:center;background:rgba(5,7,26,.82);border:2px solid var(--frame);padding:4px 10px 6px}
.age-k{font-size:10px;color:var(--gold);letter-spacing:.2em}
.age-num{font-size:40px;line-height:1;color:#fff}
.age-sub{font-size:12px;color:#fff;background:rgba(5,7,26,.82);border:2px solid var(--frame);padding:4px 8px;text-align:right}

.card{margin-top:-3px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gold)}
.eyebrow::before{content:"◆ "}
.story{color:var(--soft)}
.story p{margin:0 0 .8em}
.story p:last-child{margin-bottom:0}
.story em{color:var(--gold);font-style:normal}
.story .say{color:#fff}
.main-text{font-size:16px;color:var(--ink)}
.main-text .say{color:#ffe0ec}

.result{background:rgba(5,7,26,.45);border-left:4px solid var(--muted);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.result.ok{border-color:var(--good)} .result.no{border-color:var(--bad)}
.you-chose{font-size:13px;color:var(--muted)}
.you-chose::before{content:"▶ "}
.result .story{font-size:15px}
.roll{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.roll summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.roll summary::-webkit-details-marker{display:none}
.roll:not(details){display:flex;align-items:center;gap:8px}
.die{display:inline-grid;place-items:center;min-width:28px;height:28px;font-size:14px;border:2px solid currentColor;background:var(--edge)}
.die.ok{color:var(--good)} .die.no{color:var(--bad)}
.roll-parts{margin-top:6px;font-size:12px;background:var(--edge);padding:6px 8px;border:2px solid #34408a}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(5,7,26,.4);border:2px solid #3a4a9a;padding:10px 12px 10px 8px;min-height:52px;transition:background .1s}
.choice .cursor{color:var(--gold);opacity:0;flex:none;width:14px;margin-top:1px}
.choice:hover,.choice:focus-visible{background:rgba(255,255,255,.08);border-color:var(--frame)}
.choice:hover .cursor,.choice:focus-visible .cursor{opacity:1;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.choice:active{transform:translateY(2px)}
.choice.special{border-color:var(--gold);background:rgba(255,209,102,.08)}
.choice.special .cursor{opacity:.6}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.choice .lbl{line-height:1.5}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);line-height:1.3}
.ck{white-space:nowrap}
.pill{display:inline-block;padding:2px 6px;font-size:11px;line-height:1.2;border:2px solid currentColor;white-space:nowrap}
.pill.easy{color:var(--good)} .pill.fair{color:var(--gold)} .pill.risky{color:#ffb070} .pill.desp{color:var(--bad)} .pill.sure{color:var(--sakura)}
.pill.special{border:none;color:var(--gold);padding-left:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips.inline{display:inline-flex;vertical-align:middle;margin-left:4px}
.chip{display:inline-block;font-size:12px;line-height:1.3;padding:2px 7px;background:var(--edge);border:2px solid #3a4a9a;white-space:nowrap}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)} .chip.heart{color:var(--sakura)} .chip.seed{color:var(--gold);border-color:#8a7430}

.note{font-size:14px;color:var(--soft);background:rgba(5,7,26,.45);border:2px solid #3a4a9a;padding:8px 10px;line-height:1.6}
.note-k{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.news{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.news li{font-size:14px;color:var(--soft);padding-left:18px;position:relative;line-height:1.6}
.news li::before{content:"✦";position:absolute;left:0;color:var(--sakura)}
.leads{display:flex;flex-direction:column;gap:12px}
.lead{display:flex;flex-direction:column;text-align:left;padding:0;background:rgba(5,7,26,.4);border:3px solid #3a4a9a;overflow:hidden}
.lead:hover,.lead:focus-visible{border-color:var(--frame)}
.lead:active{transform:translateY(2px)}
.lead-art{height:84px;position:relative;overflow:hidden;line-height:0;border-bottom:3px solid var(--edge)}
.lead-art .scene{width:100%;height:100%;object-fit:cover;object-position:center 70%}
.lead-who{position:absolute;right:8px;bottom:0;width:80px;height:80px}
.lead-body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px}
.lead-body b{font-weight:400;font-size:17px;color:#fff;line-height:1.4}
.lead-body > span{font-size:14px;color:var(--soft);line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:1px 6px;border:2px solid var(--muted);color:var(--soft);line-height:1.3}
.tag.echo{border-color:var(--gold);color:var(--gold)}
.tag.main{border-color:var(--sakura);color:var(--sakura)}
.tag.dream{border-color:#8ad0ff;color:#bfe4ff}

.planted{display:flex;flex-direction:column;gap:6px}
.thread{font-size:14px;color:var(--gold);border:2px dashed #8a7430;padding:6px 10px;line-height:1.5}
.thread::before{content:"✿ "}
.downs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.down{display:flex;flex-direction:column;gap:3px;text-align:left;background:rgba(5,7,26,.4);border:2px solid #3a4a9a;padding:10px;min-height:74px}
.down:hover{border-color:var(--frame)}
.down b{font-weight:400;font-size:14px;line-height:1.4}
.down span{font-size:12px;color:var(--muted);line-height:1.4}
.down.ctx{border-color:var(--gold)}
.down.ctx b::before{content:"✧ ";color:var(--gold)}

.btn{min-height:50px;padding:10px 16px;font-size:16px;border:3px solid var(--edge);position:relative}
.btn.primary{background:var(--sakura);color:#2a0b1a;box-shadow:inset -3px -3px 0 #c8577f,inset 3px 3px 0 #ffc4da}
.btn.primary:active{box-shadow:inset 3px 3px 0 #c8577f;transform:translateY(1px)}
.btn.primary small{opacity:.75;margin-left:6px}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--raise);color:var(--ink);box-shadow:inset -3px -3px 0 #16205a,inset 3px 3px 0 #3c50a8}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}

/* title */
.title-main{justify-content:center;padding-top:max(12px, env(safe-area-inset-top))}
.title-wrap{display:flex;flex-direction:column;gap:14px;padding:6px 0}
.title-banner .scene{min-height:150px;object-fit:cover}
.logo{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px}
.logo .kanji{color:var(--sakura);font-size:13px;letter-spacing:.3em}
.logo h1{font-size:40px;line-height:1.1;color:#fff;text-shadow:3px 3px 0 var(--edge)}
.logo p{color:var(--soft);margin:0;font-size:15px}
.menu{display:flex;flex-direction:column;gap:10px}
.cloud{font-size:12px;color:var(--muted);text-align:center}

/* creation */
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:rgba(5,7,26,.4);border:2px solid #3a4a9a;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.opt.sel{border-color:var(--sakura);background:rgba(255,143,182,.12)}
.opt.sel b::before{content:"▶ ";color:var(--sakura)}
.opt b{font-weight:400;font-size:15.5px;color:#fff}
.opt span{font-size:13px;color:var(--soft);line-height:1.5}
.opt i{font-style:normal;font-size:12px;color:var(--gold)}
.dialog{display:flex;gap:10px;align-items:flex-start;background:#fff;color:#20183a;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #ffb8d0;padding:10px}
.dialog-face{flex:none;width:52px;height:56px;background:#ffe4ef;border:2px solid #ffb8d0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.dialog-face .head{width:48px;height:52px}
.dialog-name{color:#d6457a;font-size:12px;letter-spacing:.2em}
.dialog p{margin:0;font-size:15px;line-height:1.6}
.dialog .say{color:#20183a}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--edge);border:3px solid #3a4a9a;padding:10px 12px;color:var(--ink);font:inherit;font-size:18px}
.steps{display:flex;gap:4px}
.steps span{height:8px;flex:1;background:var(--edge);border:2px solid #3a4a9a}
.steps span.on{background:var(--sakura)}
.looker{display:flex;flex-direction:column;gap:12px}
.preview{display:flex;align-items:flex-end;justify-content:center;gap:8px;background:linear-gradient(#3a4ea8,#1d2c6e);border:3px solid var(--edge);padding:8px 0 0}
.preview .sprite figcaption{bottom:-2px}
.look-k{font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font-size:13px;padding:6px 8px;background:rgba(5,7,26,.4);border:2px solid #3a4a9a;min-height:36px}
.segb.on{border-color:var(--sakura);color:var(--sakura)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swb{width:34px;height:34px;background:var(--c);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.swb.on{outline:3px solid var(--gold);outline-offset:1px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:5;background:rgba(3,4,14,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;padding:14px 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:4px}
.tabs button{border:2px solid #3a4a9a;background:rgba(5,7,26,.4);padding:6px 10px;font-size:14px;color:var(--muted);min-height:40px}
.tabs button.on{border-color:var(--frame);color:#fff}
.tabs button.on::before{content:"▶";color:var(--gold);margin-right:4px}
.id-card{display:flex;gap:14px;align-items:center}
.id-card b{font-weight:400;font-size:20px}
.frame{background:linear-gradient(#3a4ea8,#22307a);border:3px solid var(--frame);outline:2px solid var(--edge);line-height:0}
.cheat-box{background:rgba(255,209,102,.08);border:2px solid #8a7430;padding:8px 10px;display:flex;flex-direction:column;line-height:1.5}
.cheat-box b{font-weight:400;color:var(--gold)} .cheat-box span{font-size:13px;color:var(--soft)}
.stats{display:flex;flex-direction:column;gap:8px}
.statrow{display:grid;grid-template-columns:42px 1fr 30px;align-items:center;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.statrow .t{height:12px;background:var(--edge);border:2px solid #3a4a9a}
.statrow .f{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#c89a34 6px 8px)}
.statrow span:first-child{color:var(--gold)}
.statrow span:last-child{text-align:right}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv div{background:var(--edge);border:2px solid #3a4a9a;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums;line-height:1.4}
.kv span{font-size:10px;color:var(--muted)} .kv b{font-weight:400;font-size:14px}
.person{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dotted #34408a}
.person:last-child{border-bottom:none}
.person .head{width:42px;height:46px;flex:none;background:linear-gradient(#3a4ea8,#22307a);border:2px solid var(--edge)}
.p-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.p-main b{font-weight:400;font-size:15px} .p-main span{font-size:12px;color:var(--muted)}
.hearts{color:var(--sakura);font-size:12px;white-space:nowrap}
.hearts i{font-style:normal;opacity:.25}
.mood{font-size:12px;color:var(--muted)} .mood.good{color:var(--good)} .mood.bad{color:var(--bad)}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeline div{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--soft);line-height:1.5}
.timeline b{font-weight:400;color:var(--sakura);text-align:right}
.ending-title{font-size:26px;color:var(--gold);text-shadow:2px 2px 0 var(--edge)}
.epilogue{border-top:2px dotted #34408a;padding-top:14px;font-size:15px}
.rank-row{display:flex;align-items:center;gap:16px}
.rank-box{display:flex;flex-direction:column;align-items:center;border:3px solid var(--gold);padding:4px 14px;background:var(--edge)}
.rank{font-size:48px;line-height:1;color:var(--gold)}
.hall-item{background:rgba(5,7,26,.4);border:2px solid #3a4a9a;padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.5}
.hall-item b{display:block;font-weight:400;font-size:15px}
.hall-item span{color:var(--muted);font-size:12px}
.hall-item .r{font-size:26px;color:var(--gold)}
@media (prefers-reduced-motion: reduce){ .choice:hover .cursor{animation:none} }
@media (max-width:360px){ .downs{grid-template-columns:1fr} .sprite img{width:80px;height:80px} }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app"></div>
<div id="overlay-root"></div>
<script>
/* =========================================================
   ANOTHER LIFE v2 — core data
   ========================================================= */
const STATS = {
  str:{name:'Strength', short:'STR', ic:'⚔'},
  mag:{name:'Magic', short:'MAG', ic:'✦'},
  wit:{name:'Wits', short:'WIT', ic:'❖'},
  cha:{name:'Charm', short:'CHA', ic:'❀'},
  luck:{name:'Luck', short:'LUK', ic:'☘'}
};
const COMP = {
  lina:{name:'Lina', role:'Childhood friend · archer', color:'#7fd18b'},

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pick = arr => arr[Math.floor(R()*arr.length)];

/* ---------- small queries arcs can use ---------- */
function rel(k){ return (S.rel[k]||0); }
function met(k){ return rel(k) > 0; }
function topComp(){ let best=null, v=0; for(const k in COMP){ if(rel(k) > v){ v=rel(k); best=k; } } return best; }
function seeds(k, f){ return S.seeds.filter(x=>x.k===k && (!x.npc || (S.npcs[x.npc] && S.npcs[x.npc].alive!==false)) && (!f || f(x, x.npc?S.npcs[x.npc]:null))); }
function hasSeed(k, f){ return seeds(k,f).length>0; }
function seedNpc(k, f){ const l=seeds(k,f).filter(x=>x.npc); return l.length ? S.npcs[l[l.length-1].npc] : null; }
function clues(){ return seeds('clue').length; }
function people(f){ return Object.values(S.npcs).filter(n=>n.met && n.alive!==false && (!f || f(n))); }
function allyCount(){ return people(n=>n.att>=4).length; }

/* ---------- people ---------- */
function makeNpc(spec={}){
  const g = spec.g || (R()<.5?'m':'f');
  const used = new Set(Object.values(S.npcs).map(n=>n.name));
  let name, tries=0;
  do { name = pick(NPC_NAMES[g]); tries++; } while(used.has(name) && tries<30);
  const n = {
    id: uid(), name, sur: pick(SURNAMES), g,
    role: spec.role || 'adventurer',
    trait: spec.trait || pick(Object.keys(TRAITS)),
    look: spec.look || pick(LOOKS),
    att: spec.att || 0, alive: true, met: false, metAge: null, notes: []
  };
  if(spec.name) n.name = spec.name;
  S.npcs[n.id] = n;
  return n;
}
function castFor(arc){
  const cast = {};
  for(const role in (arc.cast||{})){
    const c = arc.cast[role];
    let n = null;
    if(c.seed){ n = seedNpc(c.seed, c.where); }
    if(!n && c.find){ const l = people(x=>c.find(x,S)); if(l.length) n = pick(l); }
    if(!n && c.npc){ n = S.npcs[c.npc]; }
    if(!n) n = makeNpc(c);
    cast[role] = n.id;
  }
  return cast;
}

/* ---------- text ---------- */
const PRON = {m:{he:'he',him:'him',his:'his',hers:'his'}, f:{he:'she',him:'her',his:'her',hers:'hers'}};
function fmt(t, ctx){
  if(typeof t === 'function') t = t(S, ctxVars(ctx), castObj(ctx));
  if(t==null) return '';
  return String(t).replace(/\{(\w+)(?:\.(\w+))?\}/g, (m,k,sub)=>{
    if(!sub){
      if(k==='name') return esc(S.name);
      if(k==='jobA') return JOBS[S.job].a;
      if(k==='apology') return DEATHS[S.death].apology;
      if(k==='cheat') return CHEATS[S.cheat].name;
      if(k==='race') return RACES[S.race].name;
      if(k==='top'){ const c=topComp(); return c ? COMP[c].name : 'a friend'; }
      if(k==='home') return 'Mirebrook';
      if(k==='capital') return 'Asterhold';
      if(k==='dream') return S.dream ? DREAMS[S.dream].line : 'to live well';
      if(k==='place') return S.path==='shop' ? 'your café' : 'the tavern';
      if(COMP[k]) return COMP[k].name;
    }
    const cast = ctxCast(ctx);
    if(cast && cast[k]){
      const n = S.npcs[cast[k]]; if(!n) return m;
      if(!sub) return n.name;
      const P = PRON[n.g];
      const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
      if(sub==='full') return `${n.name} ${n.sur}`;
      if(sub==='sur') return n.sur;
      if(sub==='role') return NPC_ROLES[n.role]||n.role;
      if(sub==='trait') return TRAITS[n.trait].adj;
      if(sub==='look') return n.look;
      if(P[sub]) return P[sub];
      if(P[sub.toLowerCase()]) return cap(P[sub.toLowerCase()]);
      return m;
    }
    if(k==='v' && sub){ const v=ctxVars(ctx); return v && v[sub]!=null ? v[sub] : ''; }
    return m;
  });
}
function ctxCast(ctx){ return ctx ? ctx.cast : (S && S.year && S.year.arc ? S.year.arc.cast : null); }
function ctxVars(ctx){ return ctx ? ctx.vars : (S && S.year && S.year.arc ? S.year.arc.vars : {}); }
function castObj(ctx){ const c=ctxCast(ctx)||{}; const o={}; for(const k in c) o[k]=S.npcs[c[k]]; return o; }

/* ---------- effects ---------- */
function applyFx(fx, ctx){
  const chips = [];
  if(!fx) return chips;
  if(typeof fx === 'function') fx = fx(S, ctxVars(ctx), castObj(ctx));
  const cast = ctxCast(ctx)||{};
  const npcOf = r => S.npcs[cast[r]] || S.npcs[r];
  for(const k in fx){
    const v = fx[k];
    if(STATS[k]){ if(!v) continue; S.st[k] = clamp(S.st[k]+v, 0, 99); chips.push([`${v>0?'+':''}${v} ${STATS[k].short}`, v>0?'up':'down']); }
    else if(k==='hp'){ const b=S.hp; S.hp = clamp(S.hp+v, 0, S.maxhp); const d=S.hp-b; if(d) chips.push([`${d>0?'+':''}${d} HP`, d>0?'up':'down']); }
    else if(k==='heal'){ const d=S.maxhp-S.hp; S.hp=S.maxhp; if(d) chips.push(['HP restored','up']); }
    else if(k==='maxhp'){ S.maxhp+=v; S.hp=clamp(S.hp+v,0,S.maxhp); chips.push([`${v>0?'+':''}${v} Max HP`, v>0?'up':'down']); }
    else if(k==='gold'){ let g=v; if(g>0 && S.cheat==='cook') g=Math.round(g*1.5); if(g<0) g=Math.max(g,-S.gold); S.gold+=g; if(g) chips.push([`${g>0?'+':''}${g} gold`, g>0?'up':'down']); }
    else if(k==='fame'){ if(!v) continue; S.fame=Math.max(0,S.fame+v); chips.push([`${v>0?'+':''}${v} Fame`, v>0?'up':'down']); }
    else if(k==='omen'){ S.omen=Math.max(0,S.omen+v); if(v>0) chips.push(['The north stirs','down']); }
    else if(k==='income'){ S.income=Math.max(0,S.income+v); chips.push([`${v>0?'+':''}${v} gold / year`, v>0?'up':'down']); }
    else if(k==='rel'){ for(const c in v){ if(!v[c]) continue; S.rel[c]=clamp(rel(c)+v[c],0,10); chips.push([`${COMP[c].name} ${v[c]>0?'♥+'+v[c]:'♥'+v[c]}`, v[c]>0?'heart':'down']); } }
    else if(k==='relAll'){ let any=false; for(const c in COMP){ if(met(c)){ S.rel[c]=clamp(S.rel[c]+v,0,10); any=true; } } if(any) chips.push([`Friends ♥+${v}`,'heart']); }
    else if(k==='relTop'){ const c=topComp(); if(c){ S.rel[c]=clamp(S.rel[c]+v,0,10); chips.push([`${COMP[c].name} ♥+${v}`,'heart']); } }
    else if(k==='npc'){ for(const r in v){ const n=npcOf(r); if(!n||!v[r]) continue; n.att=clamp(n.att+v[r],-5,5); chips.push([`${n.name} ${v[r]>0?'trust +'+v[r]:'trust '+v[r]}`, v[r]>0?'heart':'down']); } }
    else if(k==='npcSet'){ for(const r in v){ const n=npcOf(r); if(n) Object.assign(n, v[r]); } }
    else if(k==='note'){ for(const r in v){ const n=npcOf(r); if(n) n.notes.push({age:S.age, t:fmt(v[r], ctx)}); } }
    else if(k==='kill'){ [].concat(v).forEach(r=>{ const n=npcOf(r); if(n){ n.alive=false; chips.push([`${n.name} is gone`,'down']); } }); }
    else if(k==='flag'){ [].concat(v).forEach(f=>{ if(!S.flags[f]){ S.flags[f]=true; if(FLAG_NAMES[f]) chips.push([FLAG_NAMES[f],'seed']); } }); }
    else if(k==='unflag'){ [].concat(v).forEach(f=>{ delete S.flags[f]; }); }
    else if(k==='path'){ S.path=v; chips.push([`Path: ${PATH_NAME[v]}`,'seed']); }
    else if(k==='finale'){ S.finale=v; }
    else if(k==='dream'){ S.dream=v; chips.push([`Dream: ${DREAMS[v].name}`,'seed']); }
    else if(k==='set'){ const vars=ctxVars(ctx); if(vars) Object.assign(vars, v); }
    else if(k==='seed'){
      [].concat(v).forEach(sd=>{
        if(typeof sd==='string') sd={k:sd};
        const n = sd.npc ? npcOf(sd.npc) : null;
        const entry = {k:sd.k, npc: n?n.id:null, age:S.age, label: sd.label ? fmt(sd.label, ctx) : null};
        S.seeds.push(entry);
        chips.push(['🌱 '+seedLabel(entry),'seed']);
      });
    }
    else if(k==='useSeed'){
      [].concat(v).forEach(sd=>{
        if(typeof sd==='string') sd={k:sd};
        const n = sd.npc ? npcOf(sd.npc) : null;
        const i = S.seeds.findIndex(x=>x.k===sd.k && (!n || x.npc===n.id));
        if(i>=0) S.seeds.splice(i,1);
      });
    }
  }
  return chips;
}
function seedLabel(sd){
  if(sd.label) return sd.label;
  const n = sd.npc ? S.npcs[sd.npc] : null;
  const f = SEED_LABEL[sd.k];
  return f ? f(n||{name:'someone'}) : sd.k;
}

/* ---------- checks ---------- */
function statParts(k){
  const parts=[[STATS[k].short, S.st[k]]];
  const b = CHEATS[S.cheat].boost;
  if(b && b[k]) parts.push([CHEATS[S.cheat].name, b[k]]);
  return parts;
}
function checkParts(c, ctx){
  let parts;
  const sum = p=>p.reduce((x,y)=>x+y[1],0);
  if(c.stat==='combat'){
    const a=statParts('str'), b=statParts('mag');
    parts = sum(a)>=sum(b) ? a : b;
    if(S.flags.puru) parts.push(['Puru',2]);
    if(S.flags.holySword) parts.push(['Holy sword',3]);
  } else parts = statParts(c.stat);
  if(c.job && c.job[S.job]) parts.push([JOBS[S.job].name, c.job[S.job]]);
  if(c.race && c.race[S.race]) parts.push([RACES[S.race].name, c.race[S.race]]);
  if(c.cheat && typeof c.cheat[S.cheat]==='number') parts.push([CHEATS[S.cheat].name, c.cheat[S.cheat]]);
  if(c.npc){
    const n = S.npcs[(ctxCast(ctx)||{})[c.npc]];
    if(n){
      const st = c.stat==='combat' ? 'str' : c.stat;
      const m = (TRAITS[n.trait].mod||{})[st];
      if(m) parts.push([`${n.name} is ${TRAITS[n.trait].adj}`, m]);
      if(n.att>=3 && (st==='cha')) parts.push([`${n.name} trusts you`, 2]);
      if(n.att<=-3 && (st==='cha')) parts.push([`${n.name} resents you`, -3]);
    }
  }
  if(c.extra) parts = parts.concat(c.extra(S, ctxVars(ctx), castObj(ctx)) || []);
  return parts;
}
function odds(c, ctx){
  const parts = checkParts(c, ctx);
  const bonus = parts.reduce((x,y)=>x+y[1],0);
  const dc = typeof c.dc==='function' ? c.dc(S, ctxVars(ctx), castObj(ctx)) : c.dc;
  let p = clamp((21-(dc-bonus))/20, 0.05, 0.95);
  if(S.cheat==='luck') p = 1-(1-p)*(1-p);
  return {p, bonus, dc, parts};
}
function rollCheck(c, ctx){
  const {bonus, dc, parts} = odds(c, ctx);
  const once = ()=>{ const r=1+Math.floor(R()*20); return {r, ok: r===20 || (r!==1 && r+bonus>=dc)}; };
  let a = once(), reroll=null;
  if(!a.ok && S.cheat==='luck'){ reroll=a.r; a=once(); }
  return {roll:a.r, ok:a.ok, bonus, dc, parts, reroll};
}
function difficulty(p){
  if(p>=.85) return ['easy','Easy']; if(p>=.6) return ['fair','Fair']; if(p>=.35) return ['risky','Risky']; return ['desp','Long shot'];
}

/* ---------- allies (siege & finale) ---------- */
function allies(){
  const a=[];
  if(rel('lina')>=6 || S.flags.linaRomance) a.push(['Lina',2]);
  if(rel('sera')>=6 || S.flags.seraRomance) a.push(['Seraphine',2]);
  if(rel('rook')>=6 || S.flags.rookRomance) a.push(['Rook',2]);
  if(rel('nimue')>=6 || S.flags.nimueRomance) a.push(['Nimue',2]);
  if(S.flags.dragonFriend) a.push(['a red dragon',3]);
  if(S.flags.princess) a.push(['the royal army',2]);
  if(S.flags.kenjiAlly) a.push(['Hero Kenji',2]);
  if(S.flags.banditAlly) a.push(['the Thornwood band',1]);
  if(S.flags.mentor) a.push(['the old archmage',2]);
  const friends = people(n=>n.att>=4).slice(0,3);
  friends.forEach(n=>a.push([n.name,1]));
  return a;
}
function peaceScore(){ return ['lore','demonKid','malBond','vexaTruce'].filter(f=>S.flags[f]).length; }

/* =========================================================
   LIFE FLOW
   phases: open (pick a lead) -> beat (scenes) -> done (arc result) -> yearend (downtime) -> next chapter
   ========================================================= */
function newLife(c){
  S = {v:2, id:uid(), name:c.name, death:c.death, race:c.race, job:c.job, cheat:c.cheat, dream:null, look:c.look||null,
       age:5, ch:0, st:{str:2, mag:2, wit:2, cha:2, luck:2}, hp:RACES[c.race].hp, maxhp:RACES[c.race].hp,
       gold:0, fame:0, omen:0, income:0, path:null, rel:{}, flags:{}, npcs:{}, seeds:[], seen:{},
       log:[], year:null, finale:null, ending:null, ts:Date.now()};
  [DEATHS[c.death].fx, RACES[c.race].fx, JOBS[c.job].fx, CHEATS[c.cheat].fx].forEach(fx=>applyFx(fx));
  S.hp = S.maxhp;
  if(c.cheat==='tamer') S.flags.puru = true;
  chronicle(`Died: ${DEATHS[c.death].name.toLowerCase()}. Reborn as a ${RACES[c.race].name} with ${CHEATS[c.cheat].name}.`, 0);
  startYear(null);
}
function chronicle(t, age){ S.log.push({age: age==null?S.age:age, t}); }

function startYear(downNote){
  // purge people who were offered in leads but never met
  for(const id in S.npcs){ if(!S.npcs[id].met) delete S.npcs[id]; }
  const main = MAIN_AT[S.age];
  const leads = [];
  if(main && ARC[main] && !S.seen[main]){
    leads.push({id:main, cast:castFor(ARC[main])});
  } else {
    pickLeads().forEach(a=>leads.push({id:a.id, cast:castFor(a)}));
  }
  S.year = {age:S.age, season: SEASONS[Math.floor(R()*4)], phase:'open', leads, arc:null, chips:[], down:downNote||null, news:yearNews(), opts:null};
  HOOKS.save();
}
function arcWeight(a){
  let w = a.weight ? a.weight(S) : 1;
  if(a.echo) w *= 3;
  if(a.dream && a.dream===S.dream) w *= 1.6;
  return w;
}
function eligible(stage){
  return ARCS.filter(a=>!a.main && a.stage===stage && (a.repeat || !S.seen[a.id]) && (!a.cond || a.cond(S)) && (!a.minAge || S.age>=a.minAge) && (!a.maxAge || S.age<=a.maxAge));
}
function pickLeads(){
  const st = stageOf(S.age);
  let pool = eligible(st).filter(a=>!a.filler);
  const out = [];
  // guarantee a follow-up story when one is waiting
  const echoes = pool.filter(a=>a.echo);
  if(echoes.length){ const e = weighted(echoes); out.push(e); pool = pool.filter(a=>a!==e); }
  while(out.length<3 && pool.length){ const a = weighted(pool); out.push(a); pool = pool.filter(x=>x!==a); }
  if(out.length<2){ eligible(st).filter(a=>a.filler && !out.includes(a)).slice(0, 3-out.length).forEach(a=>out.push(a)); }
  return out;
}
function weighted(list){
  const ws = list.map(arcWeight); let t = ws.reduce((a,b)=>a+b,0), r = R()*t;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function chooseLead(i){
  const L = S.year.leads[i]; if(!L) return;
  const arc = ARC[L.id];
  for(const r in L.cast){ const n=S.npcs[L.cast[r]]; if(n && !n.met){ n.met=true; n.metAge=S.age; } }
  S.seen[arc.id] = true;
  const vars = {};
  S.year.arc = {id:arc.id, cast:L.cast, vars, beat:null, prev:null, path:[]};
  if(arc.init) arc.init(S, vars, castObj());
  const start = typeof arc.start==='function' ? arc.start(S, vars, castObj()) : (arc.start || Object.keys(arc.beats)[0]);
  enterBeat(start);
  S.year.phase = 'beat';
  HOOKS.save();
}
function enterBeat(id){
  const arc = ARC[S.year.arc.id];
  const b = arc.beats[id];
  if(!b) throw new Error(`Arc ${arc.id}: missing beat "${id}"`);
  S.year.arc.beat = id;
  S.year.arc.path.push(id);
  if(b.fx){ const ch = applyFx(b.fx); S.year.chips.push(...ch); S.year.arc.enterChips = ch; } else S.year.arc.enterChips = null;
}
function curBeat(){ const a=S.year.arc; return ARC[a.id].beats[a.beat]; }
function choices(){
  const b = curBeat();
  return (b.choices||[]).filter(c=>!c.show || c.show(S, ctxVars(), castObj()));
}
function choiceState(c){
  const blocked = c.req && !c.req(S, ctxVars(), castObj());
  let check = null;
  if(c.check){
    if(c.auto && c.auto(S, ctxVars(), castObj())) check = {auto:true};
    else { const o = odds(c.check); check = {p:o.p, diff:difficulty(o.p), stat:c.check.stat}; }
  }
  return {blocked, check};
}
function choose(i){
  const c = choices()[i]; if(!c) return;
  if(c.req && !c.req(S, ctxVars(), castObj())) return;
  const arc = ARC[S.year.arc.id];
  let br, roll=null;
  if(c.check){
    if(c.auto && c.auto(S, ctxVars(), castObj())){ br = c.win; roll={auto:true, ok:true}; }
    else { roll = rollCheck(c.check); br = roll.ok ? c.win : c.lose; }
  } else br = c;
  const label = fmt(c.label);
  const text = fmt(br.t);
  const chips = applyFx(br.fx);
  S.year.chips.push(...chips);
  if(br.log || c.log) chronicle(fmt(br.log || c.log));
  let go = typeof br.go==='function' ? br.go(S, ctxVars(), castObj()) : br.go;
  if(!go) go = 'END';
  S.year.arc.prev = {label, text, chips, roll: roll ? {roll:roll.roll, ok:roll.ok, bonus:roll.bonus, dc:roll.dc, parts:roll.parts, reroll:roll.reroll, auto:roll.auto} : null};
  if(S.hp<=0 && !arc.final){ S.year.phase='done'; S.year.dead=true; HOOKS.save(); return; }
  if(go==='END'){ S.year.phase='done'; if(arc.onEnd) arc.onEnd(S, ctxVars(), castObj()); }
  else enterBeat(go);
  HOOKS.save();
}
function finishArc(){
  if(S.year.dead || (S.hp<=0 && !S.finale)) return finish('death');
  if(S.finale) return finish(S.finale);
  const arc = ARC[S.year.arc.id];
  S.year.arc.title = fmt(arc.title);
  // passive year effects
  const extra = [];
  if(S.income>0){ extra.push(...applyFx({gold:S.income})); }
  S.year.chips.push(...extra);
  S.year.opts = downtimeOptions().map(d=>d.id);
  S.year.phase = 'yearend';
  HOOKS.save();
}
function downtimeOptions(){
  const ctxl = DOWNTIME.filter(d=>d.ctx && (!d.cond || d.cond(S)));
  const basic = DOWNTIME.filter(d=>!d.ctx && (!d.cond || d.cond(S)));
  const out = [];
  if(S.hp < S.maxhp*0.5){ const r = DOWNTIME.find(d=>d.id==='recover'); if(r) out.push(r); }
  shuffle(ctxl).forEach(d=>{ if(out.length<2 && !out.includes(d)) out.push(d); });
  shuffle(basic).forEach(d=>{ if(out.length<4 && !out.includes(d)) out.push(d); });
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function chooseDowntime(id){
  const d = DOWNTIME.find(x=>x.id===id); if(!d) return;
  const chips = applyFx(d.fx);
  const note = {t: fmt(d.t), chips};
  // advance
  S.ch += 1;
  const next = CHAPTERS[S.ch];
  if(next==null) return finish('stayed');
  const gap = next - S.age;
  S.age = next;
  S.hp = clamp(S.hp + Math.round(S.maxhp*0.3*gap), 0, S.maxhp);
  startYear(note);
}

/* ---------- world news shown at the start of a year ---------- */
function yearNews(){
  const out = [];
  const st = stageOf(S.age);
  if(S.omen>=3 && st!=='child') out.push('Frost came early in the north again. Travelers whisper about horned shapes in the snow.');
  else if(S.omen>=1 && st==='adult') out.push('The northern border has been quiet. Too quiet, the soldiers say.');
  const owed = seeds('owed'); if(owed.length && R()<.5){ const n=S.npcs[owed[owed.length-1].npc]; if(n) out.push(`A letter arrives from ${n.name}: "If you ever need anything, I haven't forgotten."`); }
  const grudge = seeds('grudge'); if(grudge.length && R()<.5){ const n=S.npcs[grudge[grudge.length-1].npc]; if(n) out.push(`You hear ${n.name}'s name in the market. Nobody says it kindly, and neither, apparently, does ${n.name} say yours.`); }
  if(S.income>0) out.push(`Your business keeps paying: ${S.income} gold a year.`);
  if(clues()>=2 && !S.flags.cultStopped) out.push('Black sun symbols have started appearing on walls around the capital.');
  const t = topComp(); if(t && st!=='child' && R()<.4) out.push({lina:'Lina sends a sack of apples and a letter mostly about how she is better than you at archery.', sera:'Seraphine sends a letter. It is two lines long and somehow both are insults. You read it four times.', rook:'Rook shows up unannounced, eats everything in your kitchen, and leaves. It is a sign of affection.', nimue:'Nimue falls asleep on your doorstep. Again.'}[t]);
  return out.slice(0,3);
}

/* =========================================================
   ENDINGS
   ========================================================= */
function finish(kind){
  const path = S.path;
  let title, body;
  if(kind==='death'){ title='An Unfinished Life'; body=`You fall at ${S.age}, far too soon. The world goes white, and you are back in the endless office.\n\nGoddess Lumi looks up from her paperwork, eyes wet. "Oh, {name}. That was a good one, though. Want to try again?"`; }
  else if(kind==='fallen'){ title='The Hero Who Fell'; body=`You fall on the Plains of Asterhold. But the people you gathered finish what you started, and the shadow army breaks at sunset.\n\nThey build a statue of you in the capital square. Every year on the anniversary, someone leaves a bowl of food at its feet.`; }
  else if(kind==='slain'){
    title = path==='shop' ? 'The Café Owner Who Saved the World' : path==='crown' ? 'Champion of the Crown' : 'Hero of Asterhold';
    body = path==='shop' ? `You defeat the Demon Lord, then go straight back to work. Your café has a two-year waiting list. Above the counter hangs your sword, next to a sign: PLEASE DO NOT ASK ABOUT THE SWORD.` :
           path==='crown' ? `King Aldric names you Lord Protector of the Realm. You still get far too much paperwork, but now you have people to hand it to.` :
           `The guild invents a new rank just for you. Children play "{name} and the Demon Lord" in the streets, and you are always the one who wins.`;
  }
  else if(kind==='peace'){ title='The Demon Lord\'s Friend'; body=`There is no final blow. There is a treaty, signed on the plains where the battle should have been. The northern lands open, the famine ends, and for the first time in three hundred years, humans and demons share a border without a war.\n\nOnce a month, a pale man in a hood comes to dinner. He always brings dessert.`; }
  else if(kind==='repelled'){ title='The Long Watch'; body=`You survive, and so does he. Malgrave retreats north, wounded but not defeated. The war is not over.\n\nYou spend the years that follow on the northern wall, training the next generation and waiting. Some days you wonder if there was another way.`; }
  else { title = S.gold>=500 ? 'The Café Empire' : 'A Quiet Life on Lantern Street';
    body = S.gold>=500 ? `The Demon Lord falls to other heroes. You barely notice: you are opening your ninth café. Nobles queue around the block. Your mayonnaise recipe is a state secret.` :
           `The Demon Lord falls to other heroes. Your little café stays exactly as it is: warm, slightly cluttered, and full of regulars who know your name. It is everything your first life never had.`; }

  const lines = [];
  const romance = ['lina','sera','rook','nimue'].find(k=>S.flags[k+'Romance']);
  const t = topComp();
  const close = romance || (t && rel(t)>=7 ? t : null);
  const EPI = {
    lina: romance==='lina' ? 'You and Lina marry under the old oak tree in Mirebrook. She still beats you in every race. You have stopped pretending to let her.' : 'Lina stays your best friend for life, and keeps beating you at every race.',
    sera: romance==='sera' ? 'You marry Seraphine von Eisenreich in a ceremony the capital talks about for years. She still insists it is not like she loves you. She insists it every morning.' : 'Seraphine visits often, always to "check you haven\'t embarrassed yourself."',
    rook: romance==='rook' ? 'Rook builds you a house with his own hands, next to his clan\'s den. He growls at anyone who knocks before noon.' : 'Rook\'s clan names a pup after you. He pretends it was their idea.',
    nimue: romance==='nimue' ? 'Nimue tells you, half asleep, that she has waited eight hundred years to be this bored with someone. You decide that is the most romantic thing anyone has ever said.' : 'Nimue naps on your porch most afternoons. She says your home has "good mana."'
  };
  if(close) lines.push(EPI[close]);
  people(n=>n.att>=4).slice(0,2).forEach(n=>lines.push(`${n.name}, the ${NPC_ROLES[n.role]||n.role} you met at ${n.metAge}, remains a friend for life.`));
  people(n=>n.att<=-3).slice(0,1).forEach(n=>lines.push(`${n.name} never forgives you. Some stories do not get a happy ending.`));
  if(S.flags.puru) lines.push('Puru grows to the size of a sofa, and is now functionally a sofa.');
  if(S.flags.princess) lines.push('Queen Aria still sneaks out to visit in disguise. The disguise has not improved.');
  if(S.flags.dragonFriend) lines.push('A red dragon sometimes lands in your yard to ask for snacks.');
  if(S.dream){
    const done = {hero:S.fame>=30, mage:S.st.mag>=20, rich:S.gold>=600, love:Object.values(S.rel).filter(v=>v>=7).length>=2 || !!romance, free:kind==='stayed'||kind==='peace'}[S.dream];
    lines.push(done ? `As a child, you dreamed ${DREAMS[S.dream].line}. You did it.` : `As a child, you dreamed ${DREAMS[S.dream].line}. Life had other plans, and that was all right too.`);
  }
  if(kind!=='death') lines.push('Somewhere in an endless white office, Goddess Lumi stamps your file and draws a little heart on it.');

  const statSum = Object.values(S.st).reduce((a,b)=>a+b,0);
  const bonus = {slain:40, peace:50, repelled:15, stayed:20, fallen:25, death:0}[kind]||0;
  const score = S.fame*3 + Math.floor(S.gold/25) + statSum + bonus + people(n=>n.att>=4).length*5 + Object.values(S.rel).reduce((a,b)=>a+b,0);
  const rank = score>=260?'S':score>=200?'A':score>=145?'B':score>=90?'C':'D';
  S.ending = {kind, title, body: fmt(body, {cast:{}, vars:{}}), lines, rank, score};
  S.year && (S.year.phase = 'ending');
  HALL.unshift({id:S.id, name:S.name, race:RACES[S.race].name, cheat:CHEATS[S.cheat].name, title, rank, age:S.age, when:Date.now()});
  HALL = HALL.slice(0,30);
  HOOKS.save();
}

        {label:'Turn your business into the café.', show:s=>hasSeed('business'), t:'Your childhood invention money pays the lease outright. Your products line the shelves on opening day.', fx:{path:'shop', gold:80, income:10}, log:'Opened a café on Lantern Street with your business savings.', go:'shop'},
        {label:'Answer the royal summons.', t:'You kneel before King Aldric in the throne room. "Rise, and serve the crown."', fx:{path:'crown', fame:2, gold:40}, log:'Swore into the Royal Order.', go:'crown'},
        {label:'Accept Seraphine\'s father\'s sponsorship.', show:s=>rel('sera')>=5, t:'Duke von Eisenreich sponsors your knighthood "at my daughter\'s insistence, which she denies." Seraphine refuses to look at you for a week.', fx:{path:'crown', fame:3, gold:60, rel:{sera:1}}, log:'Joined the Royal Order with the Eisenreich sponsorship.', go:'crown'}
      ]},
    adv:{ scene:'tavern', text:`The guild receptionist hands you a registration crystal. It flickers, then shows "???" where your rank should be. Her smile freezes. "I'll... get the guildmaster."\n\nThe guildmaster, a one-armed giant named Holt, looks at the crystal, then at you. "Rules are rules. You start at F-rank like everyone else." He pauses. "Show me why that's a mistake."`,
      choices:[
        {label:'Take the hardest F-rank job.', check:{stat:'combat', dc:13},
          win:{t:'"Clear the sewer rats" turns out to mean a rat king the size of a horse. You bring back its crown. Holt promotes you to D-rank on the spot.', fx:{fame:2, str:1, gold:40}, go:'END'},
          lose:{t:'The rat king wins round one. You win round two. Holt grunts, which is high praise.', fx:{hp:-8, str:1, gold:20}, go:'END'}},
        {label:'Read every quest on the board first.', t:'Half of them are scams. You flag them for the guild. Holt starts handing you the paperwork nobody else can read.', fx:{wit:2, fame:1}, go:'END'}
      ]},
    shop:{ scene:'cafe', text:`Your café on Lantern Street has four tables, one window, and a cat that lives on the roof. Opening day. The street is full of people who walk right past.\n\nYou have one chance to make a first impression on {capital}.`,
      choices:[
        {label:'Hand out free samples in the street.', check:{stat:'cha', dc:13, job:{chef:3}, cheat:{cook:5}},
          win:{t:'By noon there is a line. By evening you have sold out of everything, including, somehow, a chair.', fx:{gold:80, cha:1, fame:1}, go:'END'},
          lose:{t:'Three customers. One of them is the cat. It is a start.', fx:{gold:15, cha:1}, go:'END'}},
        {label:'Put up a menu nobody has ever seen.', t:'Pudding. Curry. Sandwiches with the crusts cut off. Word spreads slowly, then all at once.', fx:{wit:1, gold:40}, go:'END'}
      ]},
    crown:{ scene:'palace', text:`Your first assignment in the Royal Order: guard duty at a council meeting. You stand at attention for six hours while nobles argue about grain taxes.\n\nThen a minister drops a letter. The seal is a black sun.`,
      choices:[
        {label:'Pocket the letter and investigate.', check:{stat:'wit', dc:13},
          win:{t:'It is half a message: "...the sleeper must wake before the twenty-fifth winter." You keep it hidden.', fx:{seed:'clue', wit:1}, log:'Found a letter sealed with a black sun.', go:'END'},
          lose:{t:'The minister snatches it back with a thin smile. You remember his face.', fx:{wit:1}, go:'END'}},
        {label:'Return it, and stay perfectly still.', t:'"Thank you, knight." Your captain notes your discipline. You get promoted early.', fx:{fame:2, str:1}, go:'END'}
      ]}
  }},

/* ---------------- AGE 20: SIEGE OF ASTERHOLD ---------------- */
{ id:'siege', main:true, stage:'adult', scene:'battlefield',
  title:'The Siege of Asterhold',
  blurb:'The sky goes black at noon. The bells will not stop ringing.',
  start:'a',
  beats:{
    a:{ scene:'battlefield', text:s=>`The sky goes black at noon. Demon General Vexa leads a legion over the walls of the capital: horns, a crimson cloak, a spear like a sliver of night.${s.flags.metVexa?' You know her. The masked girl from the clocktower, grown up and terrible.':''}\n\nThe bells will not stop ringing. ${s.path==='shop'?'Your café is three streets from the breach.':s.path==='crown'?'Your captain is shouting your name.':'The guild horn is calling every adventurer to the walls.'}`,
      choices:[
        {label:'Run for the walls.', t:'You take the stairs three at a time.', go:'walls'},
        {label:'Get people to safety first.', t:'You turn against the flow of soldiers, toward the screaming.', go:'evac'},
        {label:'Turn the café into a shelter.', show:s=>s.path==='shop', t:'You throw the doors open and start shouting. Within an hour, sixty people are huddled among your tables.', fx:{cha:1, fame:1}, go:'evac'},
        {label:'Find the old archmage.', show:s=>s.flags.mentor, t:'He is on the bell tower, exactly where you knew he would be, beard singed. "There you are. Shall we?"', fx:{mag:2}, go:'walls'}
      ]},
    evac:{ scene:'capital', text:`Smoke fills the lower city. A crowd is jammed at the river tunnels, panicking. A child has lost her mother. A wagon is on fire across the only bridge.`,
      choices:[
        {label:'Take command of the crowd.', check:{stat:'cha', dc:15},
          win:{t:'Calm voice, clear orders. Ten thousand people through the tunnels and not one lost. Long after the siege, that is what the city remembers.', fx:{fame:3, cha:2}, log:'Evacuated the lower city during the siege.', go:'vexa'},
          lose:{t:'It is chaos, but most of them get out. You carry the last child yourself, through fire.', fx:{hp:-10, fame:1, cha:1}, go:'vexa'}},
        {label:'Triage the wounded.', show:s=>s.job==='nurse', t:'Your hands remember everything. You save forty people in an hour. Someone starts calling you the Saint of the Tunnels.', fx:{fame:3, wit:1}, go:'vexa'},
        {label:'Call in a favor.', show:s=>hasSeed('owed'), t:s=>{ const n=seedNpc('owed'); return `You find ${n?n.name:'an old friend'} in the crowd. They do not hesitate: wagons, people, a path out. "I said I would never forget," ${n&&n.g==='f'?'she':'he'} says.`; }, fx:s=>{ const n=seedNpc('owed'); return n?{useSeed:{k:'owed', npc:n.id}, fame:2, npc:{[n.id]:1}}:{fame:2}; }, go:'vexa'}
      ]},
    walls:{ scene:'battlefield', text:`The wall is a storm of steel and shadow. Soldiers fall back from a breach where something enormous is climbing through.`,
      choices:[
        {label:'Hold the breach.', check:{stat:'combat', dc:17},
          win:{t:'You hold it. When the thing finally falls back, the soldiers behind you start chanting your name.', fx:{fame:3, str:1}, go:'vexa'},
          lose:{t:'You hold it, barely, and pay for every second.', fx:{hp:-14, str:1}, go:'vexa'}},
        {label:'Collapse the breach with magic.', check:{stat:'mag', dc:17},
          win:{t:'The stones fold shut like a closing book. The siege towers topple backward.', fx:{fame:3, mag:1}, go:'vexa'},
          lose:{t:'Half the wall comes down. Mostly on the enemy.', fx:{hp:-10, mag:1}, go:'vexa'}},
        {label:'Signal your friends.', show:s=>allies().length>=2, t:s=>`They come. ${allies().slice(0,3).map(a=>a[0]).join(', ')}. Together, you close the breach without a single loss.`, fx:{fame:2, relAll:1}, go:'vexa'}
      ]},
    vexa:{ scene:'battlefield', text:s=>`And then she is in front of you. General Vexa lands on the street in a spray of cobblestones, spear leveled at your heart.\n\n"So you're the anomaly the Black Sun keeps whining about."${s.flags.cultStopped?' She smirks. "You made them very angry. I liked that."':''}`,
      choices:[
        {label:'Fight her.', check:{stat:'combat', dc:20, extra:s=>allies().slice(0,2).map(a=>[a[0],1])},
          win:{t:'You snap her spear in two. She lands hard, then laughs in disbelief, and sounds the retreat.', fx:{fame:5, flag:'beatVexa'}, log:'Defeated General Vexa in the siege.', go:'END'},
          lose:{t:'She leaves you in the rubble. "Not bad, anomaly. Next time, be better." The walls hold, but not because of you.', fx:{hp:-18, fame:2}, go:'END'}},
        {label:'"Why are you doing this?"', show:s=>s.flags.metVexa||s.flags.lore||s.flags.demonKid, check:{stat:'cha', dc:17, extra:s=>s.flags.demonKid?[['You saved Pia',4]]:[]},
          win:{t:s=>`She hesitates. "The North is dying. The ice spreads every year. Our children are starving."${s.flags.demonKid?' Her eyes narrow. "My niece says a human saved her in an alley. That was you, wasn\'t it."':''} She calls the retreat. "Find an answer, anomaly. Before he fully wakes."`, fx:{flag:'vexaTruce', omen:-1}, log:'Talked General Vexa into retreating.', go:'END'},
          lose:{t:'"Words," she spits. "Your kind is good with words." The fight that follows is long and ugly.', fx:{hp:-12}, go:'END'}},
        {label:'Show her the black sun letter.', show:s=>clues()>=2 && !s.flags.cultStopped, t:'She reads it. Her face goes still. "The Black Sun told us your king ordered this famine." A long pause. "They lied to both of us." She withdraws her legion within the hour.', fx:{flag:'vexaTruce', omen:-1, wit:1}, log:'Showed Vexa proof the Black Sun deceived both sides.', go:'END'}
      ]}
  }},

/* ---------------- AGE 25: THE DEMON LORD ---------------- */
{ id:'finale', main:true, final:true, stage:'adult', scene:'north',
  title:'The Demon Lord',
  blurb:'Malgrave has awakened. Everything you have built comes down to this.',
  init:(s,v)=>{ v.bonus=0; v.peace=0; },
  start:'a',
  beats:{
    a:{ scene:'north', text:s=>{
        let t=`Malgrave has awakened. The northern sky splits open and an army of shadow marches south. The king calls every hero, adventurer and line cook to the Plains of {capital}.`;
        if(s.flags.cultWon) t+=`\n\nThe Black Sun's ritual woke him at full strength. The snow itself seems afraid.`;
        if(s.flags.cultStopped) t+=`\n\nBecause you stopped the Black Sun, he woke early and weak. Even so, he is enough.`;
        const a=allies(); t+= a.length ? `\n\nStanding with you: ${a.map(x=>x[0]).join(', ')}.` : `\n\nYou stand almost alone.`;
        return t+`\n\nIt is the night before the battle.`; },
      choices:[
        {label:'Rally the army with a speech.', check:{stat:'cha', dc:18},
          win:{t:'You do not talk about glory. You talk about bread, and home, and the people waiting for them. When you finish, ten thousand soldiers are on their feet.', fx:{set:{bonus:4}, fame:2}, go:'battle'},
          lose:{t:'Your voice cracks halfway through. But they saw you try, and they stay.', fx:{set:{bonus:1}}, go:'battle'}},
        {label:'Call in every favor you are owed.', show:s=>seeds('owed').length+seeds('friend').length>=2, t:s=>`Letters go out to everyone who ever owed you anything. They come: ${[...seeds('owed'),...seeds('friend')].map(x=>s.npcs[x.npc]).filter(Boolean).slice(0,4).map(n=>n.name).join(', ')}. They bring others.`, fx:s=>({set:{bonus:2+Math.min(4,seeds('owed').length+seeds('friend').length)}}), go:'battle'},
        {label:'Walk alone to the enemy camp.', show:s=>s.flags.malBond, t:'You leave your sword in your tent and walk into the snow.', go:'tent'},
        {label:'Sharpen your sword and sleep.', t:'You sleep better than you expected.', fx:{heal:1}, go:'battle'},
        {label:'Stay behind and keep the café open.', show:s=>s.path==='shop', t:'Someone has to feed the refugees. You stay. The battle on the plains is won by others. You find out from the first soldier through the door, who orders a coffee and cries.', fx:{finale:'stayed', gold:60}, go:'END'}
      ]},
    tent:{ scene:'night', text:`His tent is plain. He is sitting alone with a cup of tea that has gone cold. He does not look surprised.\n\n"I wondered if you would come," says Mal, the Demon Lord Malgrave. "You were the only one who ever asked me what I wanted."`,
      choices:[
        {label:'"Then tell me. What do you want?"', check:{stat:'cha', dc:16, extra:s=>[['Every truth you learned', 2*peaceScore()]]},
          win:{t:'"For my people not to starve. For it not to be a crime to be born in the north." He looks at you. "Can you give me that?" You think, maybe, you can.', fx:{set:{peace:6}}, go:'battle'},
          lose:{t:'"I have heard promises before," he says gently. "Go back to your army, {name}."', fx:{set:{peace:2}}, go:'battle'}},
        {label:'Share one last meal with him.', show:s=>s.cheat==='cook'||s.job==='chef', t:'You cook on his little brazier. He eats slowly. When he finishes, he says, "If tomorrow goes badly, thank you for this." You realize he is as frightened as you are.', fx:{set:{peace:5}, heal:1}, go:'battle'}
      ]},
    battle:{ scene:'battlefield', text:s=>`Dawn. The armies meet on the snowy plain, and the world becomes noise. Somehow you cut through all of it until you stand before him.\n\nMalgrave, Demon Lord, the reason for three hundred years of fear.${s.flags.malBond?' He looks so tired.':''}`,
      choices:[
        {label:'Fight with everything you have.', check:{stat:'combat', dc:s=>30+(s.flags.cultWon?3:0)-(s.flags.cultStopped?3:0), extra:(s,v)=>allies().concat(v.bonus?[['Your army',v.bonus]]:[])},
          win:{t:'The battle lasts from dawn until dusk. When it ends, Malgrave is on one knee in the snow, and the shadow army is fading like smoke.', fx:{fame:10}, go:'victory'},
          lose:{t:'You give everything. It is not quite enough.', fx:{hp:-30}, go:'fall'}},
        {label:'Lower your weapon and talk to him.', show:(s,v)=>peaceScore()>0||v.peace>0, check:{stat:'cha', dc:(s,v)=>27-3*peaceScore()-v.peace, extra:(s,v)=>v.bonus?[['They believe in you', Math.floor(v.bonus/2)]]:[]},
          win:{t:s=>`You walk across the battlefield empty-handed. You talk about the famine, the ice, the land the old kingdom refused to share.${s.flags.malBond?' About a quiet corner, and what warmth tastes like.':''}\n\nFor a long time he says nothing. Then Malgrave lowers his hand, and the shadow army kneels.`, fx:{fame:10, finale:'peace'}, log:'Made peace with the Demon Lord Malgrave.', go:'END'},
          lose:{t:'"I tried words once," he says. "Three hundred years ago." He raises his hand.', fx:{hp:-24}, go:'fall'}}
      ]},
    victory:{ scene:'north', text:`Malgrave looks up at you through the falling snow. His voice is very quiet.\n\n"Finish it, then. That is how these stories end."`,
      choices:[
        {label:'End it.', t:'You do. The sky clears for the first time in a year. You do not feel the way the stories said you would.', fx:{finale:'slain'}, log:'Defeated the Demon Lord Malgrave.', go:'END'},
        {label:'"No. Tell me why you came south."', show:s=>peaceScore()>0, t:'He tells you about the famine. You listen. Then you offer him your hand, and, unbelievably, he takes it.', fx:{finale:'peace'}, log:'Spared the Demon Lord and offered peace.', go:'END'},
        {label:'Seal him away again.', check:{stat:'mag', dc:20}, win:{t:'Light pours from your hands and the ice closes over him. Maybe, in three hundred years, someone will do better.', fx:{finale:'slain', mag:1}, log:'Sealed the Demon Lord beneath the ice.', go:'END'}, lose:{t:'The seal cracks. He escapes north, wounded.', fx:{finale:'repelled'}, go:'END'}}
      ]},
    fall:{ scene:'battlefield', text:s=> s.hp>0 ? `You are on your back in the snow, bleeding. Malgrave stands over you, then turns away. His army is already withdrawing north.\n\n"Not today," he says.` : `The world goes quiet. The snow is soft. Somewhere far away, people are calling your name.`,
      choices:[
        {label:s=>s.hp>0?'Get up.':'Let go.', t:s=>s.hp>0?'You get up. You will always get up.':'You let go.', fx:s=>({finale: s.hp>0?'repelled':'fallen'}), go:'END'}
      ]}
  }}
);

/* ---------------- YEAR'S END ACTIVITIES ----------------
   ctx:true = contextual (offered first when its cond holds) */
DOWNTIME.push(
  {id:'train', label:s=>stageOf(s.age)==='child'?'Run wild in the hills':'Train your body', desc:'+1 STR, +3 Max HP', fx:{str:1, maxhp:3}, t:'You trained until your muscles stopped complaining.'},
  {id:'magic', label:s=>stageOf(s.age)==='child'?'Practice secret magic':'Study magic', desc:'+1 MAG', fx:{mag:1}, t:'You filled a notebook with spell diagrams.'},
  {id:'books', label:s=>stageOf(s.age)==='child'?'Read every book in the village':'Hit the books', desc:'+1 WIT', fx:{wit:1}, t:'You read until the candles ran out.'},
  {id:'friends', label:'Spend time with friends', desc:'+1 CHA, friends ♥+1', fx:{cha:1, relAll:1}, t:'You spent the quiet months with the people you love.'},
  {id:'rest', label:'Rest and wander', desc:'Full HP, +1 LUK', fx:{heal:1, luck:1}, t:'You rested, wandered, and let the world surprise you.'},
  {id:'work', label:s=>{ const st=stageOf(s.age); return st==='child'?'Help Papa in the workshop':st==='academy'?'Take a part-time job':s.path==='adv'?'Take extra guild quests':s.path==='shop'?'Work extra shifts at the café':'Volunteer for extra patrols'; },
    desc:s=>{ const st=stageOf(s.age); return st==='child'?'+10 gold, +1 STR':st==='academy'?'+35 gold':s.path==='shop'?'+90 gold':s.path==='adv'?'+70 gold, +1 Fame':'+50 gold, +1 Fame'; },
    fx:s=>{ const st=stageOf(s.age); return st==='child'?{gold:10, str:1}:st==='academy'?{gold:35}:s.path==='shop'?{gold:90}:s.path==='adv'?{gold:70, fame:1}:{gold:50, fame:1}; },
    t:'You worked hard and saved what you could.'},
  // contextual
  {id:'recover', ctx:true, cond:s=>s.hp<s.maxhp*0.5, label:'Recover from your wounds', desc:'Full HP, +1 WIT', fx:{heal:1, wit:1}, t:'You spent the season healing, and thinking.'},
  {id:'mentor', ctx:true, cond:s=>s.flags.mentor, label:'Practice the archmage\'s lessons', desc:'+2 MAG', fx:{mag:2}, t:'You practiced the old archmage\'s exercises until the moon answered back.'},
  {id:'puru', ctx:true, cond:s=>s.flags.puru, label:'Train with Puru', desc:'+1 STR, +1 LUK', fx:{str:1, luck:1}, t:'Puru learned to bounce on command. You learned to dodge Puru.'},
  {id:'letters', ctx:true, cond:s=>!!topComp() && stageOf(s.age)!=='child', label:s=>`Write letters to ${COMP[topComp()].name}`, desc:'Closest friend ♥+2', fx:{relTop:2}, t:'Your letters got longer as the year went on. So did the replies.'},
  {id:'gear', ctx:true, cond:s=>s.gold>=120 && stageOf(s.age)==='adult', label:'Buy a masterwork weapon', desc:'−100 gold, +2 STR', fx:{gold:-100, str:2}, t:'The smith said it was the best blade she had ever made. You believe her.'},
  {id:'tomes', ctx:true, cond:s=>s.gold>=120 && stageOf(s.age)!=='child', label:'Buy rare spellbooks', desc:'−100 gold, +2 MAG', fx:{gold:-100, mag:2}, t:'You spent a fortune on books older than the kingdom. Worth it.'},
  {id:'expand', ctx:true, cond:s=>hasSeed('business') && s.gold>=150, label:'Expand your business', desc:'−150 gold, +25 gold / year', fx:{gold:-150, income:25}, t:'A second workshop, three new hires, and a sign with your name on it.'},
  {id:'invest', ctx:true, cond:s=>!hasSeed('business') && s.gold>=200 && stageOf(s.age)==='adult', label:'Invest in a trading company', desc:'−180 gold, +20 gold / year', fx:{gold:-180, income:20}, t:'You bought shares in a merchant fleet. Your old-world instincts said it was a good idea.'},
  {id:'visit', ctx:true, cond:s=>people(n=>n.att>=2).length>0, label:s=>{ const n=people(n=>n.att>=2).sort((a,b)=>b.att-a.att)[0]; return `Have dinner with ${n.name}`; }, desc:'Their trust +1, +1 CHA',
    fx:s=>{ const n=people(n=>n.att>=2).sort((a,b)=>b.att-a.att)[0]; return {npc:{[n.id]:1}, cha:1}; }, t:'You laughed more than you had in months.'},
  {id:'mend', ctx:true, cond:s=>people(n=>n.att<=-2).length>0 && stageOf(s.age)!=='child', label:s=>{ const n=people(n=>n.att<=-2)[0]; return `Try to make peace with ${n.name}`; }, desc:'Their resentment eases',
    fx:s=>{ const n=people(n=>n.att<=-2)[0]; return {npc:{[n.id]:2}}; }, t:'It was awkward and painful. It was also a start.'},
  {id:'clues', ctx:true, cond:s=>clues()>=1 && !s.flags.cultStopped, label:'Study your Black Sun clues', desc:'+1 WIT, +1 LUK', fx:{wit:1, luck:1}, t:'You pinned every clue to your wall and connected them with string, like a detective in a drama from your old world.'},
  {id:'shrine', ctx:true, cond:s=>s.omen>=2, label:'Pray at Lumi\'s shrine', desc:'+2 LUK', fx:{luck:2}, t:'You left an offering at Lumi\'s shrine. The next morning, a sticker appeared on your door.'}
);

;
/* =========================================================
   ANOTHER LIFE v2 — childhood arcs (ages 7–11, Mirebrook)
   ========================================================= */
const BAD_PARTNER = n => n && ['greedy','cunning'].includes(n.trait);
const LIAR = n => n && ['cunning','greedy','suspicious'].includes(n.trait);

ARCS.push(

/* ---------------------------------------------------------
   1. The Overdue Caravan
   --------------------------------------------------------- */
{
  id:'c_caravan', stage:'child', title:'The Overdue Caravan', scene:'forest', dream:'hero', minAge:7,
  blurb:'{m}, the merchant who sells ribbons and gossip, is three days late. Someone saw smoke on the forest road.',
  cast:{ m:{role:'merchant'} },
  start:'a',
  beats:{
    a:{ scene:'village', text:`{m}, the merchant {m.look}, is three days late. {m.He} is never late. {m.He} would arrive during a flood to sell you a ribbon.\n\nThe village meeting has decided to "send someone tomorrow." It decided that yesterday, too.\n\nYou are small, but you have attended enough useless meetings in your last life to know how this ends.`, choices:[
      {label:'Sneak out to the forest road alone.', t:'You leave a note on your pillow. It says "back for dinner" in suspiciously neat handwriting for a child.', go:'road'},
      {label:'Knock on Lina\'s window.', show:s=>met('lina'), t:'Lina has her bow on before you finish the word "goblins."', fx:{rel:{lina:1}, set:{lina:true}}, go:'road'},
      {label:'"Respectfully, this meeting is a waste of time."', check:{stat:'cha', dc:11},
        win:{t:'Silence. Then Papa Bram stands up, grabs his biggest mallet, and two farmers follow him. You are allowed to come "to carry the lantern."', fx:{cha:1, set:{adults:true}}, go:'road'},
        lose:{t:'Everyone laughs and someone pats your head. You sneak out after bedtime instead, fuming.', go:'road'}}
    ]},
    road:{ text:(s,v)=>`The wagon lies on its side in a ditch. Ribbons hang from the brambles like sad flags. Small, three-toed footprints lead off the road and into the trees.\n\nNo {m}. But there is a dropped boot, and it points the same way as the tracks.${v.adults?' Papa Bram swallows hard and grips his mallet tighter.':''}`, choices:[
      {label:'Follow the goblin tracks.', check:{stat:'wit', dc:10},
        win:{t:'Bent ferns, a chewed apple core, a smear of mud. You read the trail like a spreadsheet.', fx:{wit:1}, go:'camp'},
        lose:{t:'The tracks loop, split and vanish. By the time you realize you are lost, the sun is gone.', fx:{hp:-3}, go:'night'}},
      {label:'Monster Tamer: ask a crow for directions.', show:s=>s.cheat==='tamer', t:'The crow is extremely rude about it, but it leads you straight there.', fx:{luck:1}, go:'camp'},
      {label:'Gamer: check the bushes for quest items.', show:s=>s.job==='gamer', t:'Every tutorial forest has loot in the bushes. This one has {m}\'s coin purse, dropped on a very obvious trail.', fx:{luck:1, gold:5}, go:'camp'}
    ]},
    night:{ text:`The forest at night is not the forest at all. It is a different, larger place, full of breathing.\n\nSomewhere to the left, a wolf howls. Somewhere to the right, very faintly, you smell burnt turnip stew and hear someone arguing in a squeaky voice.`, choices:[
      {label:'Climb a tree and wait for dawn.', check:{stat:'str', dc:9},
        win:{t:'You sleep in a fork of branches like a cat. At dawn, you see smoke rising from a hollow nearby.', fx:{str:1}, go:'camp'},
        lose:{t:'You fall out of the tree twice, but the second time you land facing the smoke.', fx:{hp:-3}, go:'camp'}},
      {label:'Follow the smell of bad stew.', check:{stat:'luck', dc:10},
        win:{t:'Your nose has never steered you wrong. Well, once. That was a different life.', fx:{luck:1}, go:'camp'},
        lose:{t:'You follow it straight through a thornbush. It was the right direction, at least.', fx:{hp:-4}, go:'camp'}}
    ]},
    camp:{ text:(s,v)=>`In a hollow, four goblins squabble over a pot. They are green, knobbly, and roughly your height, which is less comforting than it sounds.\n\n{m} is tied to a tree, gagged with {m.his} own ribbon. {m.His} eyes go wide when {m.he} sees you, then wider when {m.he} realizes how small you are.${v.lina?' Beside you, Lina nocks an arrow and grins.':''}`, choices:[
      {label:'Charge in screaming.', check:{stat:'combat', dc:11},
        win:{t:'You burst out of the ferns like a tiny war god. The goblins scatter in four directions, one of them still holding the pot.', fx:{str:1}, go:'free'},
        lose:{t:'A goblin bonks you with a ladle. Then your scream startles all of them into fleeing anyway.', fx:{hp:-7}, go:'free'}},
      {label:'Trade the ribbons for {m}.', check:{stat:'cha', dc:10},
        win:{t:'Goblins, it turns out, love ribbons. You leave them looking extremely festive.', fx:{cha:1}, go:'free'},
        lose:{t:'They take the ribbons and then try to take you too. You bite one. Everyone flees.', fx:{hp:-4}, go:'free'}},
      {label:'Signal Lina to shoot the pot.', show:(s,v)=>v.lina, t:'*Thwack.* The pot spins off its hook and dumps stew on the biggest goblin. In the chaos, you cut {m} loose.', fx:{rel:{lina:2}}, go:'free'},
      {label:'Divine Cooking: fix their stew.', show:s=>s.cheat==='cook', t:'You add wild garlic and salt. One goblin tastes it and bursts into tears. They untie {m} and offer you a job.', fx:{cha:1, set:{fed:true}}, go:'free'},
      {label:'Let Papa Bram handle this.', show:(s,v)=>v.adults, t:'Papa Bram roars like a bear that has had a long week. The goblins are gone before he finishes.', fx:{str:1}, go:'free'}
    ]},
    free:{ text:`{m} spits out the ribbon and hugs you so hard your ribs creak.\n\n"Three days! Three days I sat there listening to them argue about salt! Nobody came, and then a *child* came!" {m.He} wipes {m.his} eyes on {m.his} sleeve. "Name it. Anything. I'll never forget this."`, choices:[
      {label:'"Just buy me a ribbon."', t:'{m.He} buys you twelve. Then {m.he} tells everyone in three towns about you.', fx:{npc:{m:3}, seed:{k:'owed', npc:'m'}, cha:1}, log:'Rescued {m} the merchant from goblins.', go:'END'},
      {label:'"Hazard pay. Thirty gold."', t:'{m} blinks, then laughs and counts it out. "A merchant\'s heart in a child\'s body. We\'re square, kid."', fx:{gold:30, npc:{m:1}, wit:1}, log:'Rescued {m} the merchant, for a fee.', go:'END'},
      {label:'"A cut of your next trip."', check:{stat:'cha', dc:12, npc:'m'},
        win:{t:'{m} stares at you for a long moment, then shakes your hand like an equal. "Partner. I owe you more than coin."', fx:{gold:15, npc:{m:2}, seed:{k:'owed', npc:'m'}, wit:1}, log:'Rescued {m} and negotiated a cut of the caravan.', go:'END'},
        lose:{t:'{m} laughs so hard {m.he} has to sit down. "Gods, you\'re tiny. Here, have five gold and a ribbon."', fx:{gold:5, npc:{m:1}}, go:'END'}}
    ]}
  }
},

/* ---------------------------------------------------------
   2. Bandits in the Barn
   --------------------------------------------------------- */
{
  id:'c_bandits', stage:'child', title:'Bandits in the Barn', scene:'village', dream:'hero', minAge:9,
  blurb:'Torches on the hill road. The Thornwood bandits are coming to Mirebrook, and one of them is no taller than you.',
  cast:{ b:{role:'bandit'} },
  start:'a',
  beats:{
    a:{ scene:'night', text:`The bell never rings. The first you know of the raid is hoofbeats and Mama Hilde shoving you into the root cellar. "Not one sound."\n\nThrough the slats you watch torches pass. Then a small figure slips into your family's barn: a kid your age, {b.look}, holding a knife that is far too big for them.`, choices:[
      {label:'Slip out after the kid.', t:'You ease the cellar door open. You are an adult in here, technically. Adults handle things.', go:'barn'},
      {label:'Run for the bell rope.', check:{stat:'luck', dc:10},
        win:{t:'You dart between two horses and nobody even sees you. You hang off the bell rope with your whole body.', fx:{luck:1}, go:'raid'},
        lose:{t:'A bandit\'s boot catches you on the way. You reach the rope anyway, bruised and furious.', fx:{hp:-5}, go:'raid'}},
      {label:'Let your eyes glow in the dark.', show:s=>['demon','dragon'].includes(s.race), t:'You step into the barn doorway and let your eyes catch the torchlight. The kid makes a noise like a stepped-on cat.', fx:{set:{scared:true}}, go:'barn'}
    ]},
    barn:{ text:(s,v)=>`{b} is stuffing your hens into a sack with shaking hands. {b.He} spins around and points the knife at you.\n\n"D-don't come closer! I'll do it! I'll—"\n\n${v.scared?'The knife is wobbling so hard it might fall out on its own. ':''}Up close, {b} is all elbows and hunger. {b.His} wrist is wrapped in a dirty rag, and the rag is soaked through.`, choices:[
      {label:'Tackle {b}.', check:{stat:'combat', dc:10, npc:'b'},
        win:{t:'You hit {b} in the middle and you both go down in the straw. The knife skitters away. Farmers come running at the noise.', fx:{str:1}, go:'caught'},
        lose:{t:'{b} is wiry and desperate. You end up flat on your back with a knee on your chest, and neither of you knows what happens next.', fx:{hp:-5}, go:'talk'}},
      {label:'"You\'re hungry, aren\'t you?"', check:{stat:'cha', dc:10, npc:'b'},
        win:{t:'The knife drops an inch. Then another. {b.His} stomach answers for {b.him}.', fx:{cha:1, npc:{b:1}}, go:'talk'},
        lose:{t:'"Shut up!" {b} bolts for the door and runs right into Farmer Oskar\'s pitchfork. Well, the blunt end.', go:'caught'}},
      {label:'Nurse: "That cut needs cleaning. Now."', show:s=>s.job==='nurse', t:'You use your night-shift voice. {b} sits down on a hay bale before {b.he} realizes {b.he} obeyed you.', fx:{npc:{b:2}, wit:1}, go:'talk'},
      {label:'Divine Cooking: offer the stew you hid.', show:s=>s.cheat==='cook', t:'You always keep a pot in the cellar. {b} eats it with both hands, crying a little.', fx:{npc:{b:2}}, go:'talk'}
    ]},
    raid:{ text:`The bell wakes the whole valley. Lamps flare in every window. Papa Bram comes out swinging a carpenter's mallet, followed by half the village armed with rakes and a very angry goose.\n\nThe bandits did not come for a fight. They wheel their horses and flee up the hill road. One of them doesn't make it: a kid {b.look}, who trips in the mud and is grabbed by Farmer Oskar.`, choices:[
      {label:'Help Papa hold the gate.', check:{stat:'combat', dc:12},
        win:{t:'One straggler tries the gate. You and Papa slam it on his fingers. He leaves in a hurry, shouting about splinters.', fx:{str:1, fame:1}, go:'caught'},
        lose:{t:'The gate kicks back and smacks you in the face. Papa carries you over his shoulder for the rest of the night.', fx:{hp:-5}, go:'caught'}},
      {label:'Herd the little kids to the chapel.', t:'You count heads like a fire warden. Nobody is missing. The priest looks at you oddly.', fx:{cha:1, fame:1}, go:'caught'}
    ]},
    talk:{ text:`It comes out in pieces. {b}'s parents died of the cough two winters ago. The Thornwood band took {b.him} in. If {b.he} goes back empty-handed, the boss doesn't feed {b.him}. If {b.he} goes back at all, {b.he}'ll have to do this again next week.\n\n"I'm not a bandit," {b} whispers. "I'm just *with* the bandits."\n\nOutside, the hoofbeats are fading.`, choices:[
      {label:'Give {b} bread and the back path.', t:'You pack the bread, the cheese, and your own winter scarf. At the edge of the woods, {b} looks back once and doesn\'t say thank you. {b.His} face says it.', fx:{npc:{b:3}, seed:{k:'spared', npc:'b'}, cha:1}, log:'Let {b}, a kid bandit, go free with food.', go:'END'},
      {label:'"Go to the temple in the capital."', t:'You draw a map in the dirt and tell {b} the priests take in orphans. {b.He} memorizes it like it is a spell.', fx:{npc:{b:2}, seed:{k:'spared', npc:'b'}, wit:1}, log:'Sent {b}, a kid bandit, toward the capital.', go:'END'},
      {label:'"I\'m sorry. I have to call someone."', t:'{b} stares at you like you stabbed {b.him}. Then you shout, and the farmers come.', fx:{npc:{b:-2}}, go:'caught'}
    ]},
    caught:{ text:`{b} sits in the square with {b.his} hands tied, glaring at everyone, {b.his} chin trembling. The headman says the baron's guards pay a bounty for Thornwood bandits. Kids too. Hard labor in the quarries.\n\nEveryone is looking at you, for some reason. Probably because you are the one who started all this.`, choices:[
      {label:'Turn {b} in.', t:'The guards come at noon. {b} doesn\'t struggle. {b.He} just looks at you over the cart\'s tailgate, memorizing your face.', fx:{npc:{b:-4}, seed:{k:'grudge', npc:'b'}, gold:20, fame:1, wit:1}, log:'Turned {b}, a kid bandit, over to the baron\'s guards.', go:'END'},
      {label:'"They\'re a child. Let me handle this."', check:{stat:'cha', dc:12},
        win:{t:'Somehow the headman agrees. You walk {b} to the forest edge and cut the rope. "Don\'t come back," you say. {b} rubs {b.his} wrists. "...Thanks, I guess."', fx:{npc:{b:1}, seed:{k:'spared', npc:'b'}, cha:1}, log:'Talked the headman into letting {b} go.', go:'END'},
        lose:{t:'"You\'re a child," says the headman, and that is that. The cart takes {b} away. {b.He} heard you try. You are not sure that makes it better.', fx:{npc:{b:-1}, seed:{k:'grudge', npc:'b'}}, go:'END'}},
      {label:'Loosen the knots after dark.', check:{stat:'luck', dc:11},
        win:{t:'You creep out at midnight. The knots are bad; Farmer Oskar ties them like shoelaces. {b} vanishes into the dark without a sound.', fx:{npc:{b:2}, seed:{k:'spared', npc:'b'}, luck:1}, log:'Secretly freed {b}, a kid bandit.', go:'END'},
        lose:{t:'Mama Hilde catches you with your hands on the rope. In the shouting, {b} slips free anyway. You scrub pots for a month.', fx:{npc:{b:2}, seed:{k:'spared', npc:'b'}, str:1}, log:'Got caught freeing {b}. Worth it.', go:'END'}}
    ]}
  }
},

/* ---------------------------------------------------------
   3. Modern Knowledge, Ancient Greed
   --------------------------------------------------------- */
{
  id:'c_invent', stage:'child', title:'A Brilliant Idea', scene:'village', dream:'rich',
  blurb:'Your old world had a thing that would change everything here. You are eight. How hard can it be?',
  cast:{ p:{role:'innkeeper'}, g:{role:'merchant', trait:'greedy'} },
  start:'a',
  beats:{
    a:{ text:`Every reincarnated person has this moment. You have been waiting for yours since you were five.\n\nThe village has no mayonnaise. The well bucket takes three adults to haul. On rainy evenings, the inn is so boring that {p}, the innkeeper {p.look}, has started counting the flies out loud.\n\nYou have *ideas*.`, choices:[
      {label:'Mayonnaise. Obviously.', t:'Eggs, oil, vinegar, and the forearms of a god. You know the sacred texts.', fx:{set:{inv:'mayonnaise'}}, go:'test'},
      {label:'A hand pump for the well.', t:'You draw it on a slate: a piston, a valve, a handle. Papa Bram squints at it for an hour.', fx:{set:{inv:'hand pump'}}, go:'test'},
      {label:'A board game. Reversi, in carved wood.', t:'Black on one side, white on the other. Simple to learn. Ruins friendships forever.', fx:{set:{inv:'board game'}}, go:'test'},
      {label:'Nurse: real soap. Please, gods.', show:s=>s.job==='nurse', t:'Lye, fat, ash, and the memory of a hospital that smelled like this. Hand hygiene is coming to Mirebrook.', fx:{set:{inv:'soap'}}, go:'test'}
    ]},
