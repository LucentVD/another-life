    test:{ text:`The first {v.inv} is a disaster. So is the second. The kitchen looks like a crime scene and Mama Hilde has started sighing in a specific way.\n\nModern knowledge, it turns out, is mostly knowing that something *can* work. Making it work is a different skill entirely.`, choices:[
      {label:'Trial and error until it works.', check:{stat:'wit', dc:11, cheat:{cook:4}, job:{chef:3}},
        win:{t:'Attempt nine is perfect. You hold it up like a holy relic. Mama Hilde stops sighing.', fx:{wit:1}, go:'hit'},
        lose:{t:'Attempt fourteen works, mostly. You have burns on two fingers and a new respect for factories.', fx:{hp:-3, set:{shoddy:true}}, go:'hit'}},
      {label:'Get Papa Bram to help build it.', check:{stat:'cha', dc:9},
        win:{t:'Papa Bram gets *very* into it. You hold things while he hammers. By the end you can lift a beam by yourself.', fx:{str:1}, go:'hit'},
        lose:{t:'Papa helps, but he keeps "improving" it. The final version has a decorative duck on it. It works anyway.', fx:{luck:1}, go:'hit'}}
    ]},
    hit:{ text:(s,v)=>`{p} tries the ${v.inv} at the inn, and within a week the whole valley is talking about it.${v.shoddy?' Even the slightly wonky first batch.':''}\n\nThen someone in a velvet coat arrives: {g}, {g.look}, from the Merchants' Guild. {g.He} lays a contract on the table. "Sign the rights over, child. Twenty gold. Or we register it ourselves and you get nothing."`, choices:[
      {label:'Take the money and run.', t:'You sign. You are a child; forty gold, after haggling, is a fortune. Three months later the guild sells it in every city in the kingdom.', fx:{gold:40, wit:1}, log:'Sold the rights to your invention to the Merchants\' Guild.', go:'END'},
      {label:'"No. I\'m going into business with {p}."', t:'{g} smiles a thin smile. "We\'ll see how long that lasts." {p} looks at you, then at the contract, and pours you a celebratory milk.', go:'partner'},
      {label:'Read the contract\'s fine print aloud.', check:{stat:'wit', dc:12, npc:'g', job:{office:4}},
        win:{t:'Clause nine: the guild cannot register an invention already in "public use with a named originator." You point at the inn\'s chalkboard, which has your name on it. {g} goes very pale.', fx:{wit:2, seed:'business', income:25, fame:1, npc:{g:-2}}, log:'Out-lawyered the Merchants\' Guild as a child.', go:'END'},
        lose:{t:'The contract is forty pages of tiny script in three languages. {g} pats your head and walks out with a copy of your design.', go:'stolen'}},
      {label:s=>{ const n=seedNpc('owed'); return `Ask ${n?n.name:'an old friend'} to back you.`; }, show:s=>hasSeed('owed'),
        t:s=>{ const n=seedNpc('owed'); return `${n?n.name:'Your friend'} arrives two days later, reads the contract, and tears it in half in front of {g}. "This child is under my protection." You have a backer, and the guild has a problem.`; },
        fx:s=>{ const n=seedNpc('owed'); return n?{useSeed:{k:'owed', npc:n.id}, npc:{[n.id]:1, g:-2}, seed:'business', income:30, cha:1}:{seed:'business', income:20}; },
        log:'Called in a favor to protect your invention.', go:'END'}
    ]},
    partner:{ text:`{p} sits across from you at the inn table, wiping a mug that is already clean.\n\n"Here's how I see it. I've got the room, the customers, and a cart to the market. You've got the head on your shoulders. Half and half?"\n\n{p} seems {p.trait}. Whether that is good news, you can't quite tell.`, choices:[
      {label:'Shake on it. Half and half.',
        t:(s,v,c)=>BAD_PARTNER(c.p)?'You shake. {p}\'s hand is warm and a little damp. For a few months, everything is wonderful.':'You shake. {p} hangs a sign over the bar with your name on it, slightly misspelled. Business booms.',
        fx:(s,v,c)=>BAD_PARTNER(c.p)?{npc:{p:1}}:{seed:'business', income:15, npc:{p:2}, cha:1},
        log:'Went into business with {p} the innkeeper.',
        go:(s,v,c)=>BAD_PARTNER(c.p)?'skim':'END'},
      {label:'Write up a proper contract first.', check:{stat:'wit', dc:10, npc:'p', job:{office:3}},
        win:{t:'You draft it on the back of a menu: profits, books, inspection rights. {p} signs, a bit impressed and a bit nervous.', fx:{seed:'business', income:20, wit:1}, log:'Started a business with an ironclad menu-contract.', go:'END'},
        lose:{t:'You write a contract. It has a hole in it the size of a wagon, which you will discover later.', fx:{npc:{p:1}}, go:'skim'}},
      {label:'Appraisal: read {p}\'s status first.', show:s=>s.cheat==='appraise',
        t:(s,v,c)=>BAD_PARTNER(c.p)?'Status: {p.trait}. Plans to skim. You smile sweetly and insist on keeping the books yourself.':'Status: {p.trait}. Honest about money. You shake hands with total confidence.',
        fx:(s,v,c)=>BAD_PARTNER(c.p)?{seed:'business', income:20, wit:1}:{seed:'business', income:20, npc:{p:3}, cha:1},
        log:'Started a business with {p}, after reading {p.his} soul.', go:'END'}
    ]},
    skim:{ text:`Half a year later, you finally get a look at the ledger. You were an adult once; you know what a ledger is supposed to look like.\n\nThis one looks like a poem. Sales are up. Your half is down. There is a new copper roof on {p}'s house.`, choices:[
      {label:'Confront {p} in front of everyone.', check:{stat:'cha', dc:11, npc:'p'},
        win:{t:'You read the numbers out loud at the inn on market day. {p} turns purple and pays back every coin. You buy {p.him} out. {p.He} will not forget it.', fx:{seed:[{k:'business'}, {k:'grudge', npc:'p'}], income:20, npc:{p:-3}, fame:1, cha:1}, log:'Exposed {p}\'s skimming and took over the business.', go:'END'},
        lose:{t:'{p} cries, the crowd takes {p.his} side, and you end up with a small "settlement" and a bad reputation at the inn.', fx:{gold:15, seed:{k:'grudge', npc:'p'}, npc:{p:-2}}, log:'Lost a business dispute with {p}.', go:'END'}},
      {label:'Quietly fix the books yourself.', t:'You start keeping a second ledger. {p} notices, and the skimming stops. Neither of you ever mentions it.', fx:{seed:'business', income:15, wit:1}, go:'END'}
    ]},
    stolen:{ text:`A month later, a guild stall in the market town is selling your {v.inv}. The sign says GUILD ORIGINAL. {g} waves at you from behind it.\n\nYou are a child. You cannot sue anyone. But you remember how your old world worked: whoever is first is not always whoever wins.`, choices:[
      {label:'Build a better version, faster.', check:{stat:'wit', dc:11},
        win:{t:'Version two is cheaper, sturdier, and has a little duck on it. Customers love the duck. {g}\'s stall closes by winter.', fx:{seed:'business', income:15, wit:1, npc:{g:-2}}, log:'Beat the Merchants\' Guild with a better product.', go:'END'},
        lose:{t:'Version two is better, but the guild has more carts. You make a little money and learn a lot.', fx:{gold:15, wit:1}, go:'END'}},
      {label:'Tell everyone who really made it.', check:{stat:'cha', dc:10},
        win:{t:'The village rallies. Nobody buys "guild originals" in this valley ever again, and {p} sells yours instead.', fx:{seed:'business', income:15, fame:1, cha:1, npc:{p:1, g:-3}}, go:'END'},
        lose:{t:'People feel bad for you and buy you pastries. It is not a business model, but it is nice.', fx:{cha:1, npc:{g:-1}}, go:'END'}}
    ]}
  }
},

/* ---------------------------------------------------------
   4. The Archmage in the Haystack
   --------------------------------------------------------- */
{
  id:'c_mage', stage:'child', title:'The Archmage in the Haystack', scene:'fields', dream:'mage', minAge:7,
  blurb:'A shabby old man is asleep in the Hendricks\' haystack. When you walk past, he opens one eye and says, "Kid. Your mana is leaking."',
  cast:{ w:{role:'mage', g:'m'} },
  start:'a',
  beats:{
    a:{ text:`The man in the haystack wears a robe that is more patch than robe and smells of cheap wine and ozone. His beard has a twig in it. Possibly a bird.\n\n"Kid," he says, without opening his eyes. "Your mana is leaking all over my nap."\n\nEvery light novel you ever read is screaming at you. This is *him*. The wandering archmage.`, choices:[
      {label:'Bring him breakfast and ask questions.', t:'He eats your bread, your cheese, and your apple, and introduces himself as {w}. "Just {w}. Titles are for people with pensions."', fx:{npc:{w:1}}, go:'teach'},
      {label:'Tell Mama there\'s a vagrant in the hay.', t:'Mama Hilde marches out with a broom and marches back in with a dinner guest.', go:'hilde'},
      {label:'Infinite Mana: stop holding it in.', show:s=>s.cheat==='mana', t:'You let your mana breathe for one second. The haystack lifts six inches off the ground. {w} sits up, very sober, very fast.', fx:{npc:{w:2}, mag:1, set:{wow:true}}, go:'teach'},
      {label:'Appraisal: read his status window.', show:s=>s.cheat==='appraise', t:'NAME: {w}. CLASS: Archmage (retired). STATUS: Hungover. Hidden. Hunted? He opens one eye. "Rude."', fx:{wit:1, npc:{w:1}}, go:'teach'}
    ]},
    hilde:{ scene:'village', text:`{w} eats four bowls of stew, compliments Papa Bram's chairs at length, and then, without seeming to notice, floats every dirty dish into the washtub with a flick of one finger.\n\nPapa Bram drops his spoon. Mama Hilde narrows her eyes. You kick {w} under the table and mouth: *teach me.*`, choices:[
      {label:'"Please. I\'ll do anything."', check:{stat:'cha', dc:10, npc:'w'},
        win:{t:'"Anything? Good. Start by doing my laundry." It is not glamorous. It is the best day of your life.', fx:{cha:1, npc:{w:1}}, go:'teach'},
        lose:{t:'"No," he says, then sighs. "One test. Tomorrow. Fail it, and I was never here."', go:'test'}},
      {label:'Make him an offer: room and board.', t:'Mama Hilde agrees on the condition he fixes the roof. With magic. He grumbles, fixes it in a minute, and stays three weeks.', fx:{npc:{w:2}, luck:1}, go:'teach'}
    ]},
    teach:{ text:(s,v)=>`Training is not what you expected. You carry water. You sit in the field breathing for hours. You fetch his wine.${v.wow?' He keeps glancing at you like you are a lit fuse.':''}\n\nOne evening, half asleep by the fire, {w} mutters something that does not sound like a lesson: "...black sun... they'll try again, the fools... they always try again..."`, choices:[
      {label:'Do the boring drills perfectly.', check:{stat:'mag', dc:10, job:{office:3}},
        win:{t:'You have survived quarterly reviews. Breathing exercises are nothing. On day twelve, a spark jumps from your fingertip.', fx:{mag:1}, go:'test'},
        lose:{t:'You fidget. You hum. {w} throws a pinecone at you. You still learn something, mostly about pinecones.', go:'test'}},
      {label:'Ask what the black sun is.', t:'He goes quiet for a long time. "A cult. They want something in the north to wake up early. I stopped them once." He pokes the fire. "Forget I said that."', fx:{seed:'clue', wit:1, set:{clue:true}}, log:'Heard the old archmage speak of the Black Sun.', go:'test'},
      {label:'Gamer: grind the drills all night.', show:s=>s.job==='gamer', t:'You treat it like XP farming. By dawn you can feel the mana stat ticking up. You can also feel nothing in your legs.', fx:{mag:2, hp:-3}, go:'test'}
    ]},
    test:{ text:`{w} holds up a dry oak leaf and drops it in the middle of the hay field.\n\n"Make it float to my hand," he says. "Without setting it on fire. Or the field. Or me, ideally."\n\nThe harvest is three days off. Every farmer in the valley would murder you. He knows this. He looks delighted.`, choices:[
      {label:'Focus. Breathe. Float it.', check:{stat:'mag', dc:12, npc:'w'},
        win:{t:'The leaf rises, wobbles, and lands in his palm like a tired butterfly. {w} is quiet for a long moment. "Huh," he says. "Huh."', fx:{mag:2, flag:'mentor', npc:{w:2}, set:{mentor:true}}, log:'Passed the wandering archmage\'s test.', go:'farewell'},
        lose:{t:'The leaf floats. Then it ignites. Then a *very* small part of the field does. {w} puts it out with a sigh.', fx:{hp:-4}, go:'farewell'}},
      {label:'Cheat: blow it up with warm air.', check:{stat:'wit', dc:11},
        win:{t:'You heat the air under it and the leaf drifts up on the draft. {w} laughs until he wheezes. "Wrong, but correct! That\'s the whole secret, kid."', fx:{wit:1, mag:1, flag:'mentor', npc:{w:2}, set:{mentor:true}}, log:'Passed the wandering archmage\'s test, sort of.', go:'farewell'},
        lose:{t:'The draft takes the leaf straight into the next field. {w} watches it go. "Creative. Useless, but creative."', fx:{wit:1}, go:'farewell'}}
    ]},
    farewell:{ scene:'village', text:(s,v)=>v.mentor
      ? `At dawn, {w} is gone. On your pillow there is a battered notebook full of exercises and a note in spiky handwriting:\n\n"You'll do. When the sky goes dark over the capital, look up. I'll be there. Practice, brat."\n\nYou read it until you have it memorized. Then you read it again.`
      : `At dawn, {w} is packing his things. He ruffles your hair.\n\n"Not bad for a squirt. Not ready, either." He drops a battered notebook in your hands. "Exercises. Do them every day and maybe, in another ten years, you'll be worth teaching."`, choices:[
      {label:'"You\'ll come back, right? Promise."', t:(s,v)=>v.mentor?'He does not answer, but he smiles. It is enough.':'"I don\'t make promises," he says, then winks. "But I do keep an eye on things."', fx:(s,v)=>v.mentor?{npc:{w:2}, cha:1}:{npc:{w:1}, mag:1}, go:'END'},
      {label:'"Tell me more about the Black Sun."', show:(s,v)=>!v.clue, t:'He sighs. "Fine. If you ever see a black sun with eight rays, run. Then tell someone important. Then run again."', fx:{seed:'clue', npc:{w:1}}, log:'Learned the sign of the Black Sun from the archmage.', go:'END'},
      {label:'Practice until the notebook falls apart.', t:'You do the exercises every morning for a year. By winter, you can light a candle without burning the house down. Usually.', fx:{mag:1, wit:1}, go:'END'}
    ]}
  }
},

/* ---------------------------------------------------------
   5. The Hollow Hill
   --------------------------------------------------------- */
{
  id:'c_ruins', stage:'child', title:'The Hollow Hill', scene:'forest', dream:'hero',
  blurb:'Lina found a secret. "It\'s a hole," she says. "A big one. With stairs. You have to see it."',
  cast:{ x:{role:'cultist'} },
  start:'a',
  beats:{
    a:{ text:`Lina drags you past the old oak, through the brambles, to a spot where a storm has torn up a dead tree by the roots. Underneath: stone steps, going down.\n\n"I found it," she whispers. "Mine. But you can come."\n\nOn the way here you saw someone else in the woods: a robed stranger, {x.look}, walking very fast away from this exact spot.`, choices:[
      {label:'"Race you down!"', t:'Lina is down the stairs before you finish the word "race." Of course she is.', fx:{rel:{lina:1}, str:1}, go:'hall'},
      {label:'"Lantern and rope first. Trust me."', check:{stat:'wit', dc:9},
        win:{t:'You run home and back. Lina rolls her eyes, but she\'s glad of the light.', fx:{wit:1, set:{prepared:true}}, go:'hall'},
        lose:{t:'You bring a lantern. You forget the oil. Lina laughs at you all the way down.', fx:{rel:{lina:1}}, go:'hall'}},
      {label:'"Wait. Let\'s follow that stranger."', t:'Lina\'s eyes light up. Spying is the only thing she likes more than holes.', fx:{rel:{lina:1}}, go:'stranger'}
    ]},
    stranger:{ text:`You tail {x} through the trees, Lina silent as a fox beside you. {x.He} doesn't meet anyone. {x.He} just kneels by a mossy stone, digs, buries a little bundle, and scratches a mark on the rock.\n\nIt's a circle with eight spikes around it. A sun, painted black.\n\nThen {x} stands and looks around, and you both stop breathing.`, choices:[
      {label:'Wait, then dig it up.', check:{stat:'luck', dc:10},
        win:{t:'{x} leaves. The bundle holds a letter sealed with a black sun: "...the old hall must stay hidden until the sleeper wakes." You keep it.', fx:{seed:'clue', luck:1}, log:'Found a black sun letter buried in the woods.', go:'hall'},
        lose:{t:'You dig too soon. {x} hears and comes back. You drop the letter and run, but you saw enough: "the old hall," "the sleeper."', fx:{seed:'clue', hp:-3}, go:'hall'}},
      {label:'Step out and say hello.', check:{stat:'cha', dc:12, npc:'x'},
        win:{t:'"Nice tattoo," you say, pointing at {x.his} wrist. {x.He} yanks down {x.his} sleeve, stammers about mushroom picking, and hurries off. You know something {x.he} doesn\'t want known.', fx:{seed:[{k:'secret', npc:'x'}, 'clue'], cha:1}, log:'Caught a robed stranger burying something marked with a black sun.', go:'hall'},
        lose:{t:'{x} grabs your collar, very hard. Lina\'s arrow pins {x.his} sleeve to a tree. {x.He} tears free and runs, and you know {x.he}\'ll remember your face.', fx:{seed:{k:'grudge', npc:'x'}, hp:-5, rel:{lina:1}}, go:'hall'}}
    ]},
    hall:{ scene:'ruins', text:(s,v)=>`The steps lead to a long hall carved from bedrock. ${v.prepared?'Your lantern shows':'In the gloom you make out'} pillars, broken pots, and on the far wall a huge black sun with eight rays, melted wax pooled beneath it.\n\nSomething shifts in the dark. A shape of stone and moss, twice your height, unfolds itself from a pillar. One eye glows dim green.\n\nLina grabs your hand. She has never grabbed your hand before.`, choices:[
      {label:'Run!', check:{stat:'luck', dc:10},
        win:{t:'You both make the stairs with the golem\'s footsteps thudding behind you. It stops at the threshold, as if it isn\'t allowed past.', fx:{luck:1}, go:'out'},
        lose:{t:'You trip on the stairs and the golem\'s hand clips your shoulder. Lina hauls you up by the collar and out into daylight.', fx:{hp:-6, rel:{lina:1}}, go:'out'}},
      {label:'"Hello? We\'re not here to steal."', check:{stat:'cha', dc:11},
        win:{t:'The golem stops. Its eye flickers. Then it steps aside and points one mossy finger at a wall you hadn\'t noticed.', fx:{cha:1}, go:'deep'},
        lose:{t:'It does not care about your intentions. It swats. You fly. Lina drags you out.', fx:{hp:-5}, go:'out'}},
      {label:'Fight it, with Lina covering you.', check:{stat:'combat', dc:12},
        win:{t:'Lina puts an arrow in its eye and you smash the cracked knee with a fallen pillar stone. It sinks down, almost gently, and goes still.', fx:{str:1, rel:{lina:2}}, go:'deep'},
        lose:{t:'Moss and stone hit like a cart. You are outside before you know it, coughing, with Lina pressing her sleeve to your head.', fx:{hp:-7, rel:{lina:1}}, go:'out'}},
      {label:'Monster Tamer: hold out your hand.', show:s=>s.cheat==='tamer', t:'The golem kneels. It presses its huge forehead to your tiny palm and hums. Then it leads you to a wall in the back.', fx:{luck:1}, go:'deep'},
      {label:'Read the runes on its chest.', show:s=>s.race==='elf'||s.st.mag>=8, t:'Old script, older than the kingdom: GUARDIAN. REMEMBER. You say "remember" aloud, and the golem steps aside.', fx:{mag:1}, go:'deep'}
    ]},
    deep:{ scene:'ruins', text:`Behind the black sun, under the soot, there is an older painting. A frozen land in the north. Thin, horned people holding out empty bowls. A king in gold turning his back. Then fire, armies, a horned figure crowned in shadow.\n\nSomeone painted the black sun over it later, to hide it.\n\nLina's voice is very small. "That's not how they tell it in the stories."`, choices:[
      {label:'Copy the mural into your notebook.', t:'You copy every line by lantern light while Lina keeps watch with an arrow on the string. The golem watches too. It seems to approve.', fx:{flag:'lore', seed:'clue', wit:1, rel:{lina:1}}, log:'Found a hidden mural: the Demon War began with a famine.', go:'END'},
      {label:'Pinky-swear Lina to secrecy.', t:'"Until we\'re grown up," she says, hooking your little finger with hers. "Then we tell everyone. Together." She doesn\'t let go for a while.', fx:{flag:'lore', seed:'clue', rel:{lina:3}, cha:1}, log:'Swore Lina to secrecy about the hidden mural.', go:'END'}
    ]},
    out:{ scene:'forest', text:`You burst out into the sunset, gasping, scratched, alive. Lina is laughing and crying at the same time, which you didn't know people actually did.\n\n"That," she says, "was the *best day ever*." Then she punches your arm. "Don't ever trip again."\n\nBehind you, the black sun stays in your mind like an afterimage.`, choices:[
      {label:'Walk home holding her hand.', t:'Neither of you mentions it. Neither of you lets go until the village fence.', fx:{rel:{lina:2}, cha:1, seed:'clue'}, log:'Escaped the ruins under the hollow hill with Lina.', go:'END'},
      {label:'Report the black sun to the elder.', t:'The elder goes pale and sends a letter to the capital. A week later, the hole has collapsed. Nobody says how.', fx:{seed:'clue', fame:1, wit:1}, log:'Reported a black sun shrine under the forest.', go:'END'}
    ]}
  }
},

/* ---------------------------------------------------------
   6. The Cabbage Thief
   --------------------------------------------------------- */
{
  id:'c_slime', stage:'child', title:'The Cabbage Thief', scene:'fields', dream:'free',
  cond:s=>!s.flags.puru,
  blurb:'Something is eating holes in Farmer {f}\'s cabbages. Small holes. Round holes. Slightly sticky holes.',
  cast:{ f:{role:'farmer'} },
  start:'a',
  beats:{
    a:{ text:`{f}, the farmer {f.look}, is standing in the cabbage patch with a hoe raised over {f.his} head like an executioner.\n\n"Slime! I know you're in here! I'll mash you into jelly!"\n\nYou see it before {f.he} does: a blue blob the size of a bread roll, wedged under a leaf. It is gray around the edges. It wheezes. It looks at you with no eyes at all, and somehow you know it is scared.`, choices:[
      {label:'Hide it in your shirt.', check:{stat:'luck', dc:10},
        win:{t:'It is cold and wobbly against your stomach. {f} stomps right past you. You walk home very, very casually.', fx:{luck:1}, go:'home'},
        lose:{t:'It squelches. Loudly. {f} spins around. "You!"', go:'plead'}},
      {label:'"Wait! Let me deal with it."', check:{stat:'cha', dc:10, npc:'f'},
        win:{t:'{f} grumbles, but lowers the hoe. "Fine. But if I see it in my patch again, it\'s jam."', fx:{cha:1, npc:{f:1}}, go:'home'},
        lose:{t:'"Deal with it? I\'ll deal with it!" The hoe goes back up.', go:'plead'}},
      {label:'Help {f} catch it.', t:'You grab the slime with both hands. It doesn\'t fight. It just goes limp, and you feel it shiver.', go:'smash'}
    ]},
    smash:{ text:`{f} holds out a sack. "Good catch. In here. I'll take it to the river."\n\nThe slime is cold and trembling in your hands. It's so light. It's sick, you realize. It wasn't stealing for fun. It was starving.\n\nYou remember being small and sick once, in another life, and nobody coming.`, choices:[
      {label:'Drop it in the sack.', t:'{f} pays you three coppers and a cabbage. You don\'t eat the cabbage. You don\'t sleep well, either.', fx:{gold:5, npc:{f:2}, str:1}, log:'Helped Farmer {f} get rid of a slime.', go:'END'},
      {label:'Run.', t:'You bolt with the slime clutched to your chest. {f} shouts something about your parents. You don\'t stop until you\'re home.', fx:{npc:{f:-2}, str:1}, go:'home'}
    ]},
    plead:{ text:`{f} raises the hoe. The slime trembles in your hands, a little puddle of sky.\n\n"Hand it over, {name}. That thing has eaten nine cabbages. *Nine.* Do you know what a cabbage costs?"\n\nYou do, actually. You've seen the market prices. You've also seen how {f} looks at the slime, and it's the way your old boss looked at a typo.`, choices:[
      {label:'Stand between {f} and the slime.', t:'The hoe stops an inch from your head. {f} stares at you, then throws it down. "Fine! Fine. Your problem now."', fx:{hp:-3, npc:{f:-1}, cha:1}, go:'home'},
      {label:'"I\'ll pay for the cabbages."', req:s=>s.gold>=10, reqText:'Needs 10 gold', t:'You count out ten gold from your savings. {f} is so surprised {f.he} gives you a cabbage back for the slime.', fx:{gold:-10, npc:{f:2}}, go:'home'},
      {label:'Nurse: "It\'s contagious. Don\'t touch it."', show:s=>s.job==='nurse', t:'You use the voice. The *infection control* voice. {f} drops the hoe and goes to wash {f.his} hands for ten minutes.', fx:{wit:1}, go:'home'}
    ]},
    home:{ scene:'village', text:`The slime lives in a bucket under your bed. It is getting worse: grayer, smaller, barely moving. When you touch it, it leans against your finger.\n\nPapa Bram looks in, sighs, and says nothing. Mama Hilde leaves a bowl of water by the bucket without a word.\n\nYou can't let it die. Not this one.`, choices:[
      {label:'Nurse: check its vitals. Somehow.', show:s=>s.job==='nurse', t:'Sluggish, shrinking, cloudy. Severe dehydration. You mix salt and honey in clean water: a field rehydration solution. By midnight it is blue again.', fx:{wit:1, set:{healed:true}}, go:'name'},
      {label:'Divine Cooking: make it soup.', show:s=>s.cheat==='cook', t:'You make a broth from cabbage scraps and moonlight. The slime drinks the whole bowl and turns the color of a summer sky.', fx:{cha:1, set:{healed:true}}, go:'name'},
      {label:'Sing to it, feed it, don\'t give up.', check:{stat:'luck', dc:11},
        win:{t:'You stay up all night, singing every song you remember from Earth. By dawn, it is wobbling along to the chorus.', fx:{luck:1, set:{healed:true}}, go:'name'},
        lose:{t:'It drinks a little, but it keeps fading. It needs something you can\'t give it. Maybe it needs its family.', go:'pond'}},
      {label:'Take it to the forest pond.', t:'The old stories say slimes live in the pond past the mill. Maybe it has family.', go:'pond'}
    ]},
    pond:{ scene:'river', text:`The forest pond is quiet. Too quiet. There are hunter's stakes in the mud and old nets in the reeds.\n\nThen you see it: a huge slime, the size of a wheelbarrow, tangled in a net near the water's edge. It is barely moving. The little slime in your arms starts bouncing so hard you nearly drop it.\n\nIt found its mother.`, choices:[
      {label:'Tear the net apart.', check:{stat:'str', dc:11},
        win:{t:'The old rope snaps. The big slime pours into the water, and the little one leaps after it. They glow together for a long, long time.', fx:{str:1, set:{freed:true}}, go:'name'},
        lose:{t:'You cut your hands on the rope, but you keep pulling until it gives. The big slime oozes free and wraps around both of you, warm as a bath.', fx:{hp:-5, set:{freed:true}}, go:'name'}},
      {label:'Let the little slime help.', t:'You set the little slime down. It squeezes into the knot and dissolves it from the inside, the clever thing. The mother slime pours free.', fx:{luck:1, set:{freed:true}}, go:'name'}
    ]},
    name:{ scene:'village', text:(s,v)=>v.freed
      ? `The mother slime nudges the little one toward the water. The little one looks at the pond. Then it looks at you.\n\nIt bounces back into your arms and refuses to leave. The mother slime ripples, which you choose to interpret as a blessing.\n\nSo. You have a slime.`
      : `By morning, the slime is fat and bright and bouncing off your ceiling. It sleeps on your pillow. It follows you to the privy. It has decided, clearly and permanently, that it belongs to you.\n\nMama Hilde sighs. "It needs a name, then."`, choices:[
      {label:'"Your name is Puru."', t:'"Puru!" it says. It cannot talk. It says it anyway. Lumi, somewhere, giggles.', fx:{flag:'puru', cha:1}, log:'Adopted a slime named Puru.', go:'END'},
      {label:'"Your name is Mayonnaise."', t:'It refuses to answer to Mayonnaise. It only bounces when you say "Puru," which you said once, by accident. Fine. Puru it is.', fx:{flag:'puru', luck:1}, log:'Adopted a slime. It named itself Puru.', go:'END'},
      {label:'"You should go home. Be free."', t:'It wobbles sadly and goes. A week later you find a jar of shimmering slime-jelly on your windowsill. It sells for a small fortune.', fx:{gold:25, luck:2}, log:'Nursed a slime back to health and set it free.', go:'END'}
    ]}
  }
},

/* ---------------------------------------------------------
   7. Mama's Fever
   --------------------------------------------------------- */
{
  id:'c_fever', stage:'child', title:'Mama\'s Fever', scene:'village', dream:'love', minAge:7,
  blurb:'Mama Hilde collapses at the washtub. The healer says there is one cure, and it grows on the north cliffs.',
  cast:{ h:{role:'healer'} },
  start:'a',
  beats:{
    a:{ text:`Mama Hilde collapses at the washtub on a Tuesday. By Wednesday her skin is burning and she calls you by a name you don't recognize.\n\nPapa Bram is carving a chair nobody needs, his hands shaking. {h}, the village healer {h.look}, comes out of the bedroom and shakes {h.his} head.\n\n"Moonpetal, from the north cliffs. Or we pray." {h.He} doesn't sound hopeful about either.`, choices:[
      {label:'Climb the cliffs for moonpetal. Tonight.', t:'You take a rope, a lantern, and Papa\'s good knife. Nobody stops you, because nobody notices you leave.', go:'cliffs'},
      {label:'Nurse: "Let me see her. I know this."', show:s=>s.job==='nurse', t:'You walk past {h} and into the room. Your hands know what to do before your head catches up.', fx:{npc:{h:1}}, go:'nurse'},
      {label:'Remember what doctors did on Earth.', check:{stat:'wit', dc:11, npc:'h'},
        win:{t:'Fluids. Cool cloths. Boiled water. Willow bark. {h} stares at the list you scribble. "Where did you learn this?"', fx:{wit:1}, go:'nurse'},
        lose:{t:'You remember a commercial for cough syrup and nothing else. {h} sends you out. You go for the cliffs instead.', go:'cliffs'}},
      {label:'Pray to Lumi at the shrine.', t:'You run to the little shrine at the crossroads. If anyone owes you a favor, it\'s her.', go:'shrine'}
    ]},
    nurse:{ text:`You take her pulse with two fingers, count her breaths, feel the heat. It's an infection. You have no antibiotics, no IV, no monitors. You have water, honey, willow bark and salt.\n\nIt will have to be enough.\n\n{h} watches you from the doorway with {h.his} arms crossed, then slowly uncrossed.`, choices:[
      {label:'Teach {h} everything you know.', check:{stat:'wit', dc:10, job:{nurse:5}, npc:'h'},
        win:{t:'Fluids every hour. Fever down with willow and cool cloths. {h} writes everything down, eyes shining. Near dawn, Mama Hilde\'s fever breaks.', fx:{wit:1, npc:{h:3}, seed:{k:'friend', npc:'h'}}, log:'Treated Mama Hilde\'s fever with modern medicine.', go:'dawn'},
        lose:{t:'It helps. It isn\'t enough. She needs the moonpetal too. You grab the rope.', fx:{npc:{h:1}}, go:'cliffs'}},
      {label:'Sit with her all night.', t:'You change the cloths, spoon in water, hold her hand. You don\'t sleep. Neither does Papa. Somewhere around four, she squeezes back.', fx:{cha:1, hp:-3}, go:'dawn'}
    ]},
    shrine:{ scene:'shrine', text:`The shrine is a stone the size of a dog, with a dented offering bowl and a carving of a woman who looks suspiciously like she's laughing.\n\nYou kneel. You haven't prayed since your first life, and that was mostly before exams.\n\n"Lumi. Goddess. You *owe* me. Please."`, choices:[
      {label:'Pray honestly, with your whole heart.', check:{stat:'luck', dc:10},
        win:{t:'A breeze. A sound like a pen dropping. In the bowl: one glowing moonpetal and a note. "Sorry sorry sorry! Also, {apology}. Go! — L"', fx:{luck:1, set:{lumi:true}}, log:'Lumi answered a prayer. She left a note.', go:'dawn'},
        lose:{t:'Nothing. Then a scrap of paper drifts down. "Can\'t interfere directly, rules!! North cliffs, left ledge. Also, {apology}. — L"', fx:{luck:1}, go:'cliffs'}},
      {label:'Complain about your whole afterlife.', t:'A bucket of cold water appears from nowhere and drenches you. Then a note: "RUDE. But fair. {apology}. Cliffs, left ledge, hurry. — L"', fx:{cha:1, hp:-3}, go:'cliffs'}
    ]},
    cliffs:{ scene:'cliffs', text:`The north cliffs are black and wet in the moonlight. Far above, on a narrow ledge, something glows soft blue: moonpetal, a single cluster of it.\n\nBelow, the drop goes down into dark you can't see the bottom of.\n\nYou are a child. Your arms are short. You are not, technically, allowed out after dark. None of that matters right now.`, choices:[
      {label:'Climb.', check:{stat:'str', dc:11},
        win:{t:'Hand over hand, toes in cracks, not looking down. You pluck the petals with your teeth and climb back the same way.', fx:{str:1}, go:'dawn'},
        lose:{t:'You slip twice. The second time you scrape half the skin off your arm. But you get it.', fx:{hp:-8}, go:'dawn'}},
      {label:'Get Lina to shoot the stem.', show:s=>met('lina'), t:'You run for Lina. She doesn\'t ask a single question. One arrow, one perfect shot, and the moonpetal falls into your hands.', fx:{rel:{lina:2}}, log:'Lina shot down the moonpetal that saved Mama.', go:'dawn'},
      {label:'Puru, stretch!', show:s=>s.flags.puru, t:'Puru stretches up the cliff like a blue rope, wraps around the flowers, and snaps back into your arms, very proud.', fx:{luck:1}, go:'dawn'},
      {label:'Wait for the wind to help.', check:{stat:'luck', dc:12},
        win:{t:'A gust shakes the ledge. One flower tumbles down, end over end, right into your lap. Somewhere, a goddess high-fives herself.', fx:{luck:1}, go:'dawn'},
        lose:{t:'You wait until dawn, freezing. Then you climb anyway, half-numb, and get it.', fx:{hp:-5, str:1}, go:'dawn'}}
    ]},
    dawn:{ text:`The fever breaks at sunrise. Mama Hilde opens her eyes, sees you asleep sitting up beside her bed, and pulls you under the blanket like you're five again.\n\n"My clever little one," she whispers. "Where did you come from?"\n\nYou have an answer to that question. You've never told anyone. You hold her hand and, for once, you just let yourself be her child.\n\nPapa Bram cries into his half-finished chair.`, choices:[
      {label:'Thank {h} properly.', t:'{h} waves it off, then hugs you, then pretends {h.he} didn\'t. "Come by the clinic sometime. I want to hear the rest of what you know."', fx:{seed:{k:'friend', npc:'h'}, npc:{h:2}, cha:1}, log:'Mama Hilde recovered. {h} the healer became a friend.', go:'END'},
      {label:'Fall asleep right there.', t:'You sleep for fourteen hours. When you wake, there is soup, and both your parents are watching you like you are a miracle.', fx:{heal:1, maxhp:2}, log:'Saved Mama Hilde from the fever.', go:'END'},
      {label:'Write it all down for the village.', t:'You write the treatment on the chapel door. Next winter, nobody in Mirebrook dies of fever. People start calling you "the little doctor."', fx:{wit:1, fame:2, npc:{h:1}}, log:'Wrote down fever treatment for all of Mirebrook.', go:'END'}
    ]}
  }
},

/* ---------------------------------------------------------
   8. The Stuck Carriage
   --------------------------------------------------------- */
{
  id:'c_carriage', stage:'child', title:'The Girl in the Carriage', scene:'river', dream:'love', minAge:7,
  blurb:'A carriage with a frost-blue crest is stuck in the ford. The girl inside is glaring at the whole world.',
  cast:{ k:{role:'knight'} },
  start:'a',
  beats:{
    a:{ text:`A gleaming black carriage is stuck axle-deep in the ford, a frost-blue eagle painted on the door. The escort knight, {k}, {k.look}, is shouting at the horses as if that has ever worked.\n\nA window slides open. A girl your age with silver hair and eyes like a winter lake looks down at you.\n\n"Are you going to help," she says, "or just *stare*, peasant?"`, choices:[
      {label:'"Give me a log. I know levers."', check:{stat:'wit', dc:10},
        win:{t:'You wedge a log under the wheel and lean on it. Archimedes would be proud. With a sucking pop, the carriage lurches free.', fx:{wit:1}, go:'girl'},
        lose:{t:'The log slips. You go face-first into the mud. All of you.', go:'mud'}},
      {label:'Put your shoulder into the wheel.', check:{stat:'str', dc:11},
        win:{t:'You shove, the horses pull, and the carriage rolls up the bank. {k} looks at you like you\'re a very small ox.', fx:{str:1}, go:'girl'},
        lose:{t:'The wheel spins and paints you brown from head to toe.', go:'mud'}},
      {label:'Lift the wheel yourself.', show:s=>['dragon','beast'].includes(s.race), t:'You squat, grab the axle, and lift. The carriage rises a foot. The girl\'s mouth falls open, and she shuts it very fast.', fx:{str:1}, go:'girl'},
      {label:'"Sir Knight, the horses need guiding."', check:{stat:'cha', dc:11, npc:'k'},
        win:{t:'{k} hesitates, then hands you a bridle. You lead the horses up the shallow side. Every village child knows the shallow side.', fx:{cha:1, npc:{k:1}}, go:'girl'},
        lose:{t:'"Begone, urchin," {k} says, and gives you a shove. Directly into the mud.', fx:{npc:{k:-1}}, go:'mud'}}
    ]},
    mud:{ text:`You sit up in the ford, dripping, a frog on your head.\n\nThe girl laughs, a real laugh, bright and surprised. Then she clamps a hand over her mouth, horrified.\n\nShe climbs out, against {k}'s protests, stretches one small hand toward the ford, and the mud freezes solid in a crackle of frost. The carriage rolls straight out over the ice.\n\nShe looks furious at herself. "You didn't see that."`, choices:[
      {label:'"That was *amazing*!"', t:'She turns pink to the ears. "It was adequate." She keeps glancing at you, as if checking you still think so.', fx:{rel:{sera:2}, cha:1}, go:'farewell'},
      {label:'"I had it under control."', t:'"You absolutely did not." But she\'s fighting a smile, and she loses.', fx:{rel:{sera:1}, wit:1}, go:'farewell'}
    ]},
    girl:{ text:`The girl steps down, carefully avoiding the mud. "Seraphine von Eisenreich," she says, as if it costs her. "You may forget it immediately."\n\nShe is going to the capital, alone except for {k}. Her hands are clenched. Up close, she looks less like a princess and more like someone who has never been allowed to be tired.\n\n"Why do you talk like a grown-up?" she asks suddenly.`, choices:[
      {label:'"Honestly? I\'m secretly thirty-four."', t:'She stares. Then she laughs so hard she has to hold the carriage door. "Ridiculous. You\'re ridiculous." She looks happier than when she arrived.', fx:{rel:{sera:2}, cha:1}, go:'farewell'},
      {label:'Divine Cooking: share your honey cake.', show:s=>s.cheat==='cook', t:'She takes one bite and goes very still. "This is," she says, "acceptable." She eats three. {k} eats two when she isn\'t looking.', fx:{rel:{sera:2}, npc:{k:1}}, go:'farewell'},
      {label:'Appraisal: read her status window.', show:s=>s.cheat==='appraise', t:'SERAPHINE VON EISENREICH. Ice affinity: extraordinary. Hidden status: lonely. You say, "You don\'t have to be perfect, you know." She looks at you like you slapped her, then like you hugged her.', fx:{rel:{sera:2}, wit:1}, go:'farewell'},
      {label:'Bow like a noble.', check:{stat:'cha', dc:10},
        win:{t:'You bow, sweep an invisible hat, and say "My lady." She is so startled she curtsies back. Then she glares at you for making her do it.', fx:{rel:{sera:2}, cha:1}, go:'farewell'},
        lose:{t:'You bow too low and fall over. "You are hopeless," she says, and helps you up. Her glove gets muddy. She doesn\'t seem to mind.', fx:{rel:{sera:1}}, go:'farewell'}}
    ]},
    farewell:{ text:`{k} clears {k.his} throat. "My lady. We'll be late."\n\nSeraphine climbs back in. At the last moment she leans out and tosses you a handkerchief embroidered with the frost-blue eagle.\n\n"For your face. Don't return it. I have *dozens*."\n\nThe carriage rolls off toward the capital. The handkerchief smells like snow.`, choices:[
      {label:'Keep the handkerchief. Forever.', t:'You keep it folded under your pillow. You tell yourself it\'s because it\'s good fabric.', fx:{rel:{sera:1}, luck:1}, log:'Met Seraphine von Eisenreich at the ford.', go:'END'},
      {label:'"See you at the Academy!"', t:'She sticks her head out. "As if a village child could ever—" The carriage turns the bend. You\'re fairly sure she was smiling.', fx:{rel:{sera:1}, cha:1}, log:'Promised to see Seraphine at the Academy.', go:'END'},
      {label:'Ask {k} for a reward.', check:{stat:'cha', dc:10, npc:'k'},
        win:{t:'{k} snorts and tosses you a pouch. "For services rendered, urchin." Seraphine\'s voice drifts from the carriage: "*Mercenary.*"', fx:{gold:20, npc:{k:1}}, log:'Got paid for freeing a noble carriage.', go:'END'},
        lose:{t:'{k} ignores you. Seraphine, however, throws a silver coin out the window and hits you in the forehead with it.', fx:{gold:5, hp:-3}, go:'END'}}
    ]}
  }
},

/* ---------------------------------------------------------
   9. The Harvest Festival
   --------------------------------------------------------- */
{
  id:'c_festival', stage:'child', title:'The Harvest Festival', scene:'village', dream:'love',
  cond:s=>met('lina'),
  blurb:'Lanterns, pies, a bonfire, and Lina in a dress. She has threatened to kill anyone who mentions the dress.',
  cast:{ t:{role:'thief'} },
  start:'a',
  beats:{
    a:{ text:`The whole valley has come for the harvest festival. There are lanterns in the apple trees, a pie table that sags in the middle, and a man with a lute who knows exactly one song.\n\nLina meets you at the gate in a borrowed green dress and a scowl that could curdle milk.\n\n"Don't. Say. *Anything.*"`, choices:[
      {label:'"You look nice."', t:'Lina punches your arm. Hard. Then she walks next to you all evening and doesn\'t stop smiling.', fx:{rel:{lina:2}}, go:'games'},
      {label:'"Race you to the archery booth!"', t:'She hitches up the dress and is gone. You follow her, laughing.', fx:{rel:{lina:1}}, go:'games'},
      {label:'Enter the pie contest.', t:'"You can *cook*?" Lina says. "You\'re going to embarrass yourself. I\'m coming to watch."', go:'pie'}
    ]},
    games:{ text:`The archery booth has a straw target, a prize ribbon, and a long line of farm boys missing by a mile.\n\nLina hits the center three times without looking. Then she turns and holds out the bow to you with a terrible, beautiful grin.\n\n"Your turn. Try not to hit the goat."`, choices:[
      {label:'Try to actually beat her.', check:{stat:'str', dc:12},
        win:{t:'Bullseye. Lina\'s jaw drops. "Again," she says. "Best of nine. Best of *nineteen*." She is delighted. She is furious.', fx:{str:1, rel:{lina:2}}, go:'thief'},
        lose:{t:'You hit the goat. Gently. The goat is fine. Lina has to lie down on the grass from laughing.', fx:{rel:{lina:2}, luck:1}, go:'thief'}},
      {label:'Let her win, subtly.', check:{stat:'cha', dc:10},
        win:{t:'You miss by just enough. She wins the ribbon and ties it in her hair without a word. You never tell her.', fx:{cha:1, rel:{lina:2}}, go:'thief'},
        lose:{t:'"Did you just *let me win*?" She makes you shoot again. You lose for real this time. She is satisfied.', fx:{rel:{lina:1}}, go:'thief'}},
      {label:'Gamer: read the wind like a sniper.', show:s=>s.job==='gamer', t:'Ten thousand hours of shooter games. You read the flags, adjust, and split her arrow. The whole booth goes silent.', fx:{luck:1, gold:10, rel:{lina:1}}, go:'thief'}
    ]},
    pie:{ text:`The pie judge is the village headman, a man who has eaten every pie in Mirebrook for thirty years and loved none of them.\n\nYou have a borrowed oven, a crate of apples, and the memory of a cinnamon roll from a train station in another world. Lina is in the front row, eating someone else's pie, waiting for you to fail.`, choices:[
      {label:'Divine Cooking: just cook.', show:s=>s.cheat==='cook', t:'The headman takes one bite, puts his fork down, and weeps openly. You win. You also win next year\'s contest in advance.', fx:{gold:30, fame:2, rel:{lina:1}}, log:'Won the harvest pie contest with divine cooking.', go:'thief'},
      {label:'Make an Earth recipe.', check:{stat:'wit', dc:11, job:{chef:5}},
        win:{t:'A crumb topping. Nobody here has ever seen a crumb topping. Second place, and a crowd asking for the recipe.', fx:{wit:1, gold:10, rel:{lina:1}}, go:'thief'},
        lose:{t:'It is mostly charcoal. Lina eats it anyway, loudly, and says it\'s the best she\'s ever had.', fx:{rel:{lina:2}}, go:'thief'}}
    ]},
    thief:{ text:`In the crush by the cider barrel, someone bumps you. Lina gasps: her coin pouch is gone, the one with her whole year's archery winnings.\n\nYou see the culprit: {t}, a skinny kid {t.look}, ducking between legs toward the dark end of the market.`, choices:[
      {label:'Chase {t}.', check:{stat:'str', dc:10, npc:'t'},
        win:{t:'You weave through the crowd and grab {t} by the back of the shirt behind the cider tent.', fx:{str:1}, go:'caught'},
        lose:{t:'You crash into the pie table. {t} trips over you trying to dodge. You both land in the custard.', fx:{hp:-3}, go:'caught'}},
      {label:'"Lina. The ribbon post."', t:'Lina doesn\'t even need the bow from the booth; she throws a tent peg. It pins {t}\'s sleeve to the ribbon post.', fx:{rel:{lina:1}}, go:'caught'},
      {label:'Let it go. It\'s a festival.', t:'"Are you *serious*?" Lina says. She stomps off after {t} herself. She comes back with the pouch and a bruise, and does not speak to you for a whole song.', fx:{luck:1}, go:'dance'}
    ]},
    caught:{ text:`{t} is shaking. Up close {t.he} is younger than you thought, with sticky custard on {t.his} cheek.\n\n"I-it's for my little sister," {t.he} says. "She's got the cough. The healer wants silver."\n\nLina has her pouch back in her fist. She looks at you. This is, apparently, your call.`, choices:[
      {label:'"Are you lying to me?"', check:{stat:'wit', dc:11, npc:'t'},
        win:{
          t:(s,v,c)=>LIAR(c.t)?'{t.His} eyes slide sideways. There\'s no sister. {t.He} confesses everything, then promises to stop. You almost believe {t.him}.':'{t.He} isn\'t lying. You can tell. There really is a sister, and she really is sick.',
          fx:(s,v,c)=>LIAR(c.t)?{wit:1, npc:{t:1}}:{wit:1, npc:{t:2}},
          go:(s,v,c)=>LIAR(c.t)?'dance':'help'},
        lose:{t:'You can\'t tell. {t.His} face gives you nothing at all.', go:'help'}},
      {label:'Appraisal: check the truth.', show:s=>s.cheat==='appraise', t:(s,v,c)=>LIAR(c.t)?'STATUS: Lying. Gambling debt. You raise an eyebrow, and {t} deflates.':'STATUS: Telling the truth. Sister: sick. Your heart sinks.', fx:{wit:1}, go:(s,v,c)=>LIAR(c.t)?'dance':'help'},
      {label:'Hand {t} over to the watch.', t:'The watch takes {t} away by the collar. The headman gives you a festival coin for your trouble. {t} looks back at you the whole way.', fx:{gold:10, fame:1, npc:{t:-3}, seed:{k:'grudge', npc:'t'}}, go:'dance'}
    ]},
    help:{ text:`Lina chews her lip for a long time. Then she opens the pouch, the one with her whole year's winnings, and looks at you.\n\n"How much does the healer want?"\n\n{t} blinks at her like nobody has ever asked {t.him} that before. The sound of the festival seems very far away.`, choices:[
      {label:'Pay for the medicine together.', t:'You both empty your pockets. {t} runs off with the coins, then runs back, hugs you both, and runs off again. "I won\'t forget! I won\'t!"', fx:{gold:-10, npc:{t:4}, seed:{k:'owed', npc:'t'}, rel:{lina:2}, cha:1}, log:'Paid for a festival thief\'s sister\'s medicine with Lina.', go:'dance'},
      {label:'Walk {t} to the healer yourself.', t:'You leave the festival to walk {t} across the village. The healer, it turns out, takes payment in sweeping. You and {t} sweep until midnight.', fx:{npc:{t:3}, seed:{k:'friend', npc:'t'}, str:1}, go:'dance'}
    ]},
    dance:{ scene:'night', text:`The bonfire is roaring. The lute man has found a second song. Couples spin across the grass, and the little kids chase sparks.\n\nLina is standing next to you with her hands behind her back, staring very hard at the fire.\n\n"So," she says, to the fire. "Are you going to ask me or not?"`, choices:[
      {label:'Dance. You have two left feet.', check:{stat:'luck', dc:9},
        win:{t:'Somehow you don\'t trip. Somehow she doesn\'t either. You spin until you\'re dizzy and fall over in the grass, laughing at the stars.', fx:{rel:{lina:3}, cha:1}, log:'Danced with Lina at the harvest festival.', go:'END'},
        lose:{t:'You step on her foot four times. She steps on yours five, on purpose. It is still the best dance of your life.', fx:{rel:{lina:2}, hp:-3}, log:'Danced with Lina at the harvest festival, badly.', go:'END'}},
      {label:'"Let\'s watch the stars instead."', t:'You lie on the hill by the old oak and name the constellations. Yours are all wrong, from another sky. She doesn\'t correct you. She just listens.', fx:{rel:{lina:2}, wit:1}, go:'END'},
      {label:'Spin her like in the movies.', check:{stat:'cha', dc:11},
        win:{t:'You twirl her out and back in, and the whole bonfire cheers. Lina is red to the ears. "Where did you *learn* that?" Another life, you think.', fx:{rel:{lina:3}, cha:1}, log:'Danced with Lina at the harvest festival.', go:'END'},
        lose:{t:'You spin her straight into the cider barrel. She comes up dripping and absolutely furious, and then she laughs until she cries.', fx:{rel:{lina:1}, hp:-3}, go:'END'}}
    ]}
  }
},

/* ---------------------------------------------------------
   10. An Ordinary Year (filler)
   --------------------------------------------------------- */
{
  id:'c_chores', stage:'child', title:'An Ordinary Year', scene:'village', filler:true, repeat:true,
  blurb:'No goblins, no bandits, no goddesses. Just chores, mud, and a very long summer.',
  start:'a',
  beats:{
    a:{ text:`Some years, nothing happens. Your first life was made almost entirely of years like that, and you hated them.\n\nThis one is different. The sun is warm, the bread is fresh, and nobody is asking you for a report by Friday.\n\nThere is, however, a list of chores on the kitchen table. Mama Hilde has underlined it twice.`, choices:[
      {label:'Help Papa in the workshop.', t:'Papa Bram hands you a plane and points at a plank. "Smooth. Like a baby\'s cheek."', go:'shop'},
      {label:'Weed Mama\'s garden.', t:'The garden is enormous. The weeds are winning. You roll up your sleeves.', go:'garden'},
      {label:'Do your letters with the priest.', t:'The priest teaches reading on Tuesdays. You already read three languages, but nobody needs to know that.', go:'study'}
    ]},
    shop:{ text:`The workshop smells of pine and sawdust. Papa Bram hums while he works, the same three notes, over and over.\n\nHe shows you how to read the grain, how to listen to the wood before you cut it. You realize this is the first time in two lives that anyone has taught you a craft just because they love you.`, choices:[
      {label:'Build a stool all by yourself.', check:{stat:'str', dc:9},
        win:{t:'It wobbles only slightly. Papa puts it by the fire and refuses to let anyone else sit on it.', fx:{str:1}, go:'evening'},
        lose:{t:'It has three legs of different lengths. Papa calls it "modern art" and keeps it anyway.', fx:{luck:1}, go:'evening'}},
      {label:'Suggest a better joint design.', t:'You draw a dovetail joint. Papa stares at it for a long time. "Where do you *get* these ideas?" He sells six chests that winter.', fx:{wit:1, gold:10}, go:'evening'}
    ]},
    garden:{ text:`The garden is a battlefield. You fight the bindweed, the beetles, and a single malicious rabbit you have named "Kachou," after your old section chief.\n\nBy noon your knees are green and your hands are blistered, and you are, unexpectedly, very happy.`, choices:[
      {label:'Win the war against Kachou.', check:{stat:'wit', dc:10},
        win:{t:'You build a fence. Kachou tunnels under it. You build a better fence. Kachou retires to the neighbor\'s garden. Victory.', fx:{wit:1}, go:'evening'},
        lose:{t:'Kachou eats every carrot. You grudgingly respect Kachou.', fx:{luck:1}, go:'evening'}},
      {label:'Let Puru eat the weeds.', show:s=>s.flags.puru, t:'Puru eats every weed in the garden in an hour and then, regrettably, also the fence. Mama Hilde decides this is a net positive.', fx:{luck:1, str:1}, go:'evening'},
      {label:'Just weed. Honest work.', t:'Row after row, until the sun goes red. Your back aches in a satisfying way.', fx:{str:1}, go:'evening'}
    ]},
    study:{ scene:'shrine', text:`The priest is old and kind and smells of candle wax. He teaches you letters, then numbers, then, when he realizes you are bored, history.\n\n"Three hundred years ago," he says, "the Demon Lord came out of the north, and nobody knows why." He pauses. "Well. Somebody knows. But they're not telling."`, choices:[
      {label:'Ask him who "somebody" is.', check:{stat:'cha', dc:10},
        win:{t:'"The old royal archives," he murmurs. "Ask there, when you\'re grown. And don\'t say I told you."', fx:{cha:1, wit:1}, go:'evening'},
        lose:{t:'He just smiles and gives you more homework.', fx:{wit:1}, go:'evening'}},
      {label:'Read every book he owns.', t:'There are eleven. You read them all in a month, including a deeply boring one about sheep. The priest is delighted.', fx:{wit:1}, go:'evening'}
    ]},
    evening:{ text:`At the end of the day, you sit on the fence and watch the sun go down over Mirebrook. Smoke rises from the chimneys. Somewhere a dog is barking at nothing.\n\nIt is an ordinary day. You had about ten thousand of those in your last life, and you didn't notice a single one.\n\nYou notice this one.`, choices:[
      {label:'Find Lina and race to the oak.', show:s=>met('lina'), t:'She wins. She always wins. You lie in the grass under the oak and argue about clouds until the stars come out.', fx:{rel:{lina:1}, str:1}, go:'END'},
      {label:'Help Mama with supper.', t:'You chop, she stirs, Papa sets the table badly. It is the best stew in the world, and you tell her so.', fx:{cha:1, heal:1}, go:'END'},
      {label:'Practice magic in secret.', t:'You sit behind the barn and coax a spark into a flame, then a flame into a small, warm sun in your palm.', fx:{mag:1}, go:'END'}
    ]}
  }
}

);

;
/* =========================================================
   ANOTHER LIFE — Academy arcs (ages 13–15, Royal Academy, Asterhold)
   ids: a_*   stage: 'academy'
   ========================================================= */
(function(){

/* ---------------------------------------------------------
   a_duel — Seraphine's challenge
   --------------------------------------------------------- */
ARCS.push({
  id:'a_duel', stage:'academy', title:'A Glove in the Soup', scene:'academy', dream:'hero',
  blurb:`Seraphine von Eisenreich throws a glove at you across the dining hall. It lands in your soup. Two hundred students stop chewing.`,
  start:'a',
  beats:{
    a:{ scene:'academy', text:s=> met('sera')
      ? `Lunch, second week of term. A white glove sails across the dining hall and lands in your soup with a *plop*.\n\nSeraphine von Eisenreich stands over you, silver hair perfect, cheeks pink with fury. "Ever since that crystal shattered, people say you're the best in our year. I refuse to accept it. Training yard. Noon. Bring your *best*."\n\nTwo hundred students hold their breath.`
      : `Lunch, second week of term. A white glove sails across the dining hall and lands in your soup with a *plop*.\n\nA silver-haired girl stands over you, chin high, frost curling off her sleeves. "Seraphine von Eisenreich. Remember it. People say you're the best in our year. I refuse to accept it. Training yard. Noon."\n\nTwo hundred students hold their breath.`,
      choices:[
        {label:`"Accepted. Try not to cry."`, t:`The hall erupts. Seraphine's eye twitches. "We'll see who cries."`, fx:{cha:1}, go:'yard'},
        {label:`"How about tea instead?"`, t:`"Tea," she repeats, as if you suggested eating a frog. But she doesn't say no.`, go:'tea'},
        {label:`Faint dramatically into your soup.`, check:{stat:'luck', dc:13},
          win:{t:`Your performance is so convincing that two upperclassmen carry you to the infirmary. Seraphine looks, briefly, horrified.`, go:'infirm'},
          lose:{t:`You faint. Seraphine pours a cup of ice water down your collar. You un-faint.`, fx:{hp:-5}, go:'yard'}},
        {label:`"Didn't you promise to stop doing this?"`, show:s=>rel('sera')>=4,
          t:`"That was *different*, and I did not *promise*, I *implied*." She snatches the glove back out of your soup. "Fine. Tea. You're paying."`, fx:{rel:{sera:1}}, go:'tea'}
      ]},
    yard:{ scene:'academy', text:`Noon. Half the academy crowds the training yard, and someone is taking bets. Seraphine raises one hand and the air drops twenty degrees. Ice spears bloom around her like a crown.\n\n"Last chance to apologize," she says. "Not that I'd accept it."\n\nThe first spear is already flying.`,
      choices:[
        {label:`Meet ice with fire.`, check:{stat:'mag', dc:14},
          win:{t:`Fire hits ice and the yard vanishes in steam. When it clears you are both soaked, and nobody can say who won. Seraphine looks delighted, then furious about looking delighted.`, fx:{mag:2, set:{draw:true}}, go:'after'},
          lose:{t:`Your fireball fizzles into a sad puff. Her ice locks your boots to the ground. The crowd winces in unison.`, fx:{mag:1, hp:-7, set:{lost:true}}, go:'after'}},
        {label:`Close the distance, blade first.`, check:{stat:'combat', dc:15},
          win:{t:`You cut through three spears and stop your practice blade an inch from her collar. Silence. Then the whole yard screams.`, fx:{str:2, fame:2, set:{won:true}}, go:'after'},
          lose:{t:`A spear catches you in the ribs mid-charge. You slide across the yard on your back, very gracefully, into a bucket.`, fx:{hp:-9, str:1, set:{lost:true}}, go:'after'}},
        {label:`Watch her footwork. Dodge everything.`, auto:s=>s.cheat==='appraise', check:{stat:'wit', dc:13},
          win:{t:`She shifts her left foot before every cast. You dodge, and dodge, and dodge, until she runs out of mana and sits down hard. "That's... cheating," she pants. It isn't.`, fx:{wit:2, set:{won:true}}, go:'after'},
          lose:{t:`You read her perfectly for nine spears. The tenth one you read as it hit you.`, fx:{wit:1, hp:-6, set:{lost:true}}, go:'after'}},
        {label:`"Puru, she's all yours."`, show:s=>!!s.flags.puru,
          t:`Puru bounces into the line of fire and swallows an ice spear whole, then gets brain freeze and wobbles in circles. Seraphine laughs, a real laugh, before she can stop herself. The duel is declared "postponed for slime reasons."`, fx:{luck:1, rel:{sera:1}, set:{draw:true}}, go:'after'}
      ]},
    after:{ scene:'academy', text:(s,v)=> v.won
      ? `Behind the gymnasium, Seraphine finds you. She is not crying. Her eyes are just wet from the ice.\n\n"Again," she says. "Not today. But again. Next time I win, and you will *not* hold back, and I will *know* if you do."\n\nShe hasn't left yet. She seems to be waiting for something.`
      : v.lost
      ? `In the infirmary, a shadow falls across your bed. Seraphine, holding a get-well bouquet like a weapon.\n\n"You were *terrible*," she says. A pause. "...Does it hurt?"\n\nShe puts the flowers down very carefully, as if they might break, and doesn't leave.`
      : `At the fountain afterward, Seraphine sits down beside you, both of you still dripping.\n\n"That wasn't a loss," she says, staring straight ahead. "For either of us. Don't read into that."\n\nYou read into it. She can tell, and turns faintly pink.`,
      choices:[
        {label:`"Same time next week?"`, t:`"Obviously," she says, too fast. "I mean. If you insist." She has already written it into her planner, in ink.`, fx:{rel:{sera:2}, cha:1}, log:'Dueled Seraphine and booked a rematch, apparently forever.'},
        {label:`"I didn't want to hurt you."`, check:{stat:'cha', dc:14},
          win:{t:`Her ears go red. "Idiot. As if you could." A long pause. "...Thank you. Everyone always wants to *beat* the Eisenreich girl. Nobody ever held back."`, fx:{rel:{sera:3}, cha:1}, log:'Seraphine said thank you. Once. Quietly.'},
          lose:{t:`"*Pity?*" The temperature plummets and she storms off. Later you find a cough drop in your desk, with no note.`, fx:{rel:{sera:1}, wit:1}}},
        {label:`Let Rook carry you both to dinner.`, show:s=>met('rook'),
          t:`Rook appears, says "Hn," and picks you both up, one under each arm. Seraphine protests all the way to the dining hall, then eats two dinners.`, fx:{rel:{rook:1, sera:2}, str:1}}
      ]},
    infirm:{ scene:'academy', text:`The infirmary is quiet and smells of mint. You lie very still, being tragically unconscious.\n\nThe door opens. Seraphine slips in with a basket of fruit, checks nobody is watching, and sits by your bed. "It's not like I was worried," she tells your face. "I just won't have people saying I knocked you out with a *glove*."\n\nShe starts peeling an apple. Badly.`,
      choices:[
        {label:`Keep pretending. Free apple.`, check:{stat:'luck', dc:14},
          win:{t:`She carves the apple into lopsided little rabbits and lines them up on your pillow. You will take this secret to your grave.`, fx:{luck:1, rel:{sera:2}}, go:'tea2'},
          lose:{t:`You twitch at a rabbit-shaped apple. She sees. Your blanket freezes solid, with you inside it. "Training yard," she says. "*Now*."`, fx:{hp:-5, rel:{sera:1}}, go:'yard'}},
        {label:`Open one eye. "Are those rabbits?"`, t:`She drops the knife. "You were AWAKE?" Then, impossibly, she starts laughing, and can't stop.`, fx:{cha:1, rel:{sera:2}}, go:'tea2'},
        {label:`Nurse instinct: reorganize the bandage shelf.`, show:s=>s.job==='nurse',
          t:`You sit up and fix the triage shelf before you remember you are supposed to be unconscious. Seraphine stares. "Who *are* you?" "Night shift," you say, which explains nothing to her.`, fx:{wit:1, rel:{sera:1}}, go:'tea2'}
      ]},
    tea:{ scene:'academy', text:`You set a table under the cherry trees behind the east dorm: two cups, one chipped. Seraphine arrives exactly on time, sits like a judge at a trial, and stares at the teapot.\n\n"If this is a trick," she says, "I will freeze you to that chair."\n\nCherry petals keep landing in her hair. She keeps not noticing.`,
      choices:[
        {label:`Pour your very best brew.`, check:{stat:'cha', dc:14, job:{chef:4}, cheat:{cook:6}},
          win:{t:`She takes one sip and the frost on her sleeves quietly melts. "...Acceptable," she says, and holds out her cup for more.`, fx:{cha:1, rel:{sera:2}}, go:'tea2'},
          lose:{t:`Far too strong. "Peasant tea," she declares, and drinks the entire pot.`, fx:{rel:{sera:1}, luck:1}, go:'tea2'}},
        {label:`Divine Cooking: bring out the cake.`, show:s=>s.cheat==='cook',
          t:`One bite. Her frosty aura visibly melts, leaving a small puddle under her chair. She eats three slices with immense dignity.`, fx:{cha:2, rel:{sera:3}}, go:'tea2'},
        {label:`"Fine. One duel. After tea."`, t:`"Finally, sense." She drains her cup in one gulp and stands. "Training yard. Now."`, go:'yard'}
      ]},
    tea2:{ scene:'academy', text:`For a while neither of you says anything. Then, staring into her cup: "My father writes every week. Every letter asks the same thing. *Were you first?*"\n\nShe smooths her skirt. "When the crystal shattered for you and not for me, he didn't write for a month."\n\nShe glares at you, daring you to pity her.`,
      choices:[
        {label:`"You don't have to be first to matter."`, t:`She looks at you for a long moment. "That's a stupid thing to say," she says quietly, and doesn't let go of the cup until it's cold.`, fx:{rel:{sera:3}, cha:1}, log:'Told Seraphine she mattered, first place or not.'},
        {label:`"Then beat me properly. We'll train."`, t:`"You'll regret that." She is smiling. You regret it every morning at five a.m. for a year, and your magic has never been better.`, fx:{rel:{sera:2}, mag:2}, log:'Started training with Seraphine at dawn.'},
        {label:`Recognize that look. You wore it for years.`, show:s=>s.job==='office',
          t:`"I had a boss like your father," you say. "I worked myself to death for a man who never learned my name." She doesn't understand half of it. She understands enough.`, fx:{rel:{sera:3}, wit:1}, log:'Told Seraphine about a boss from another life.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_rook — the wolf who won't bite
   --------------------------------------------------------- */
ARCS.push({
  id:'a_rook', stage:'academy', title:'The Wolf Who Wouldn\'t Bite', scene:'academy', dream:'love',
  blurb:`{n}, a noble first-year, keeps throwing the new wolf-beastkin student's lunch into the fountain. The wolf is seven feet tall, and just takes it.`,
  cast:{ n:{role:'noble'} },
  start:'a',
  beats:{
    a:{ scene:'academy', text:s=> (met('rook')
      ? `Rook's lunch is in the fountain again. You know Rook: seven feet of grey fur and gruff silence, the only wolf beastkin in your year.`
      : `There's a new transfer student: a wolf beastkin, seven feet tall, grey-furred, a notch bitten out of one ear. Rook, someone whispers. His lunch is in the fountain.`)
      + `\n\n{n}, a {n.trait} noble {n.look}, is now pouring a jug of water over Rook's textbook. Rook stands there, fists shaking, ears flat. Everyone knows the rule: a commoner who strikes a noble is expelled.`,
      choices:[
        {label:`Step between them.`, t:`You're moving before you've decided to. Rook's ears come up in surprise.`, fx:{str:1}, go:'confront'},
        {label:`Wait. Follow Rook afterward.`, t:`You let it play out, burning, and slip after Rook when he leaves.`, fx:{wit:1}, go:'follow'},
        {label:`Fetch a teacher.`, check:{stat:'cha', dc:13},
          win:{t:`Professor Albright breaks it up with one look. {n} slinks off, smirking. It won't stop {n.him} for long.`, fx:{cha:1, npc:{n:-1}}, go:'follow'},
          lose:{t:`The nearest teacher turns out to be {n}'s uncle. "High spirits," he says, and keeps walking.`, fx:{wit:1}, go:'follow'}},
        {label:`Get Seraphine. Nobles outrank nobles.`, show:s=>met('sera'),
          t:`Seraphine sweeps in like a winter storm. "Von Eisenreich outranks your entire family tree. Shoo." {n} goes white and leaves. "Don't thank me," she tells Rook. "I just hate noise."`, fx:{rel:{sera:1, rook:1}, npc:{n:-1}}, go:'follow'}
      ]},
    confront:{ scene:'academy', text:`{n} looks you up and down. "Oh, look. The commoner prodigy. Do you know who my father is?"\n\nBehind you, Rook growls, very low. "Don't. Not for me."\n\nA crowd is gathering. Somebody at the back is already chanting "fight."`,
      choices:[
        {label:`Take {n.him} apart with words.`, check:{stat:'wit', dc:13, npc:'n'},
          win:{t:`You list, in loving detail, every exam {n} has failed this term. The courtyard howls. {n} leaves red-faced, and looks back once, memorizing you.`, fx:{wit:2, rel:{rook:2}, npc:{n:-3}, seed:{k:'grudge', npc:'n'}}, log:'Humiliated {n}, a noble bully. {n.He} will remember.', go:'talk'},
          lose:{t:`You stammer. {n} laughs and wanders off, bored. Rook pats you on the head. It's humiliating, and very kind.`, fx:{rel:{rook:1}, cha:1}, go:'talk'}},
        {label:`Shove {n.him} into the fountain.`, check:{stat:'str', dc:12, npc:'n'},
          win:{t:`{n} goes in backwards with a magnificent splash. The courtyard cheers. Then a prefect appears, writing your name down.`, fx:{str:1, fame:1, npc:{n:-4}, seed:{k:'grudge', npc:'n'}}, log:'Threw {n}, a noble bully, into the fountain.', go:'office'},
          lose:{t:`{n} sidesteps and you go into the fountain alone. The prefect writes your name down anyway.`, fx:{hp:-5, npc:{n:-2}, seed:{k:'grudge', npc:'n'}}, go:'office'}},
        {label:`Charm {n.him} into dropping it.`, check:{stat:'cha', dc:14, npc:'n'},
          win:{t:`You flatter, you joke, you somehow make {n} laugh. "Fine. The dog's boring anyway." {n.He} leaves. Rook stares at you as if you did magic.`, fx:{cha:2, npc:{n:2}}, go:'talk'},
          lose:{t:`{n} smiles thinly. "Cute." Then {n.he} kicks Rook's bag into the fountain too, just to make a point.`, fx:{npc:{n:-1}, wit:1}, go:'talk'}},
        {label:`Loom. {n.He} looks ready to bolt.`, show:(s,v,c)=>c.n.trait==='timid',
          t:`You take one step forward. {n} takes six, backwards, then turns and runs. You didn't even say anything.`, fx:{str:1, npc:{n:-1}, rel:{rook:1}}, go:'talk'},
        {label:`Pay {n.him} to leave Rook alone.`, show:(s,v,c)=>c.n.trait==='greedy', req:s=>s.gold>=30, reqText:'Needs 30 gold',
          t:`{n} pockets the coins without a flicker of shame. "Pleasure doing business." Rook looks at you like you're insane.`, fx:{gold:-30, npc:{n:1}, rel:{rook:1}, wit:1}, go:'talk'}
      ]},
    follow:{ scene:'village', text:`You find Rook behind the stables, carefully peeling wet pages apart and laying them in the sun. It's a battered children's primer.\n\n"My mother's," he says without turning. "She scrubbed these floors for twenty years so I could sit in the classrooms."\n\nFootsteps. {n} again, with two friends and a bucket.`,
      choices:[
        {label:`Stand next to Rook. Say nothing.`, t:`You plant your feet beside him. {n} hesitates. It's harder to bully two.`, go:'confront'},
        {label:`Yell "FIRE!" and point.`, check:{stat:'luck', dc:13},
          win:{t:`Everyone, {n} included, sprints for the stables. Rook watches them go. "There's no fire." "There's no fire," you agree.`, fx:{luck:1, rel:{rook:1}}, go:'talk'},
          lose:{t:`A prefect hears you. False alarm, a noble, a beastkin, a bucket: you're all marched to the vice-principal.`, fx:{npc:{n:-1}}, go:'office'}},
        {label:`Bare your teeth. Beastkin to beastkin.`, show:s=>s.race==='beast',
          t:`You and Rook growl at exactly the same moment, in harmony. {n}'s friends drop the bucket and flee. {n} follows, slower, glaring at you.`, fx:{str:1, rel:{rook:2}, npc:{n:-2}, seed:{k:'grudge', npc:'n'}}, go:'talk'}
      ]},
    office:{ scene:'academy', text:`Vice-Principal Grimsby's office smells of ink and disappointment. {n} sits across from you, looking deeply wronged.\n\n"Brawling with a noble heir," Grimsby says. "The charter is very clear about commoners who—"\n\nThe door bangs open. Rook ducks under the frame. "It was me," he says.\n\nIt wasn't.`,
      choices:[
        {label:`"No. It was me. I'd do it again."`, check:{stat:'cha', dc:15},
          win:{t:`Grimsby studies you both for a long time. "Two weeks kitchen duty. Both of you. And {n}: a week, for starting it." {n} sputters. Rook's tail moves, just once.`, fx:{cha:1, rel:{rook:2}, npc:{n:-1}}, go:'talk'},
          lose:{t:`A month of kitchen duty and a forty-gold fine. Rook pays half. You don't argue; you couldn't.`, fx:{gold:-40, rel:{rook:2}, str:1}, go:'talk'}},
        {label:`Let Rook take the blame.`, t:`You say nothing. Rook is suspended for a week. He never mentions it afterward. Somehow, that's worse.`, fx:{rel:{rook:-1}, wit:1}, go:'talk'},
        {label:`Cite the academy charter, clause by clause.`, show:s=>s.job==='office', check:{stat:'wit', dc:12, job:{office:4}},
          win:{t:`"Article Nine, subsection four: disputes arising from provocation by the injured party." Grimsby stares. Nobody has read the charter in a century. Case dismissed.`, fx:{wit:2, rel:{rook:2}}, go:'talk'},
          lose:{t:`You cite the wrong clause, with total confidence. Kitchen duty.`, fx:{wit:1, rel:{rook:1}}, go:'talk'}}
      ]},
    talk:{ scene:'night', text:`That evening you share the dorm roof with Rook. The capital glitters below.\n\n"First of my clan to come here," he says at last. "If I'm expelled, the scholarship goes. My little brothers don't get to come." His big hands are scraped raw from holding them still. "So I don't bite. Ever."\n\nA long quiet. "You didn't have to."`,
      choices:[
        {label:`"Then I'll bite for both of us."`, t:`Rook makes a low rumbling sound you later learn is a laugh. "Small teeth," he says. But he leans his shoulder against yours.`, fx:{rel:{rook:3}, str:1}, log:'Promised Rook you would bite for both of you.'},
        {label:`Teach him to fight with words.`, t:`Every night that month you teach him comebacks. His delivery is terrible. His timing, it turns out, is perfect.`, fx:{rel:{rook:2}, wit:1}},
        {label:`Share your dinner. He's been skipping meals.`, t:`He's been sending his allowance home. He eats your dinner in four bites, looks embarrassed, and you go and get him another.`, fx:{rel:{rook:3}, cha:1}},
        {label:`Cook him a real meal, clan-style.`, show:s=>s.cheat==='cook'||s.job==='chef',
          t:`You roast meat the way the wolf clans do, from scraps of memory and instinct. Rook takes one bite and has to look away for a while.`, fx:{rel:{rook:4}, cha:1}, log:'Cooked Rook a meal that tasted like home.'}
      ]}
  }
});

/* ---------------------------------------------------------
   a_nimue — lessons for sweets
   --------------------------------------------------------- */
ARCS.push({
  id:'a_nimue', stage:'academy', title:'Lessons for Sweets', scene:'academy', dream:'mage',
  blurb:`The elf professor who sleeps through her own lectures has noticed you. She'll teach you real magic. Her fee is cake.`,
  start:'a',
  beats:{
    a:{ scene:'academy', text:s=> (met('nimue')
      ? `Professor Nimue is asleep on her desk again, cheek on a lecture eight hundred years in the making.`
      : `The elf who teaches Ancient Magic Theory is called Nimue. She looks twenty. She is eight hundred and three. She has slept through every one of her own lectures this term, and nobody dares wake her.`)
      + `\n\nToday one eye cracks open as you pass. "You. Your mana's *loud*. Like a drum in a library." A yawn. "I'll teach you to be quiet. Private lessons. My fee is sweets. Good ones."`,
      choices:[
        {label:`Bake something from scratch.`, check:{stat:'cha', dc:13, job:{chef:4}, cheat:{cook:6}},
          win:{t:`You bring a honey tart, still warm. Nimue wakes up completely, for the first time in living memory.`, fx:{cha:1, rel:{nimue:2}}, go:'lesson'},
          lose:{t:`The tart collapses into a sort of tart-adjacent puddle. Nimue eats it with a spoon. "Acceptable."`, fx:{rel:{nimue:1}}, go:'lesson'}},
        {label:`Buy the capital's fanciest pastries.`, req:s=>s.gold>=30, reqText:'Needs 30 gold',
          t:`A ribboned box from Duchess Street. Nimue opens it, inhales, and says "Oh," very softly.`, fx:{gold:-30, rel:{nimue:2}}, go:'lesson'},
        {label:`Ask about the medal on her desk.`, t:`A tarnished silver star on a faded ribbon, half under her pillow. Nimue's eyes open all the way. "Ah. That." A long pause. "Sit."`, fx:{wit:1}, go:'war'}
      ]},
    lesson:{ scene:'academy', text:`Lessons happen under the old ash tree in the courtyard, mostly with Nimue lying in the grass. "Mana isn't a fire hose," she murmurs. "It's breath. You're holding yours. Let it out slowly... slower... slower than that..."\n\nShe's asleep. No: one finger twitches, and every leaf on the tree turns to face you.`,
      choices:[
        {label:`Breathe slow. Focus until it hurts.`, check:{stat:'mag', dc:14},
          win:{t:`Your mana goes still, like a pond. For one second you can hear every heartbeat in the courtyard. Nimue smiles without opening her eyes.`, fx:{mag:2, rel:{nimue:1}}, go:'war'},
          lose:{t:`Your nose bleeds. Nimue hands you a handkerchief without looking. "Again. Tomorrow."`, fx:{mag:1, hp:-5}, go:'war'}},
        {label:`Elf: hum the old cadence.`, show:s=>s.race==='elf',
          t:`You hum something you didn't know you knew. Nimue sits up. "Where did you learn that?" You didn't. Your blood did.`, fx:{mag:2, rel:{nimue:2}}, go:'war'},
        {label:`Infinite Mana: let it all out.`, show:s=>s.cheat==='mana', check:{stat:'mag', dc:15},
          win:{t:`The ash tree bursts into blossom, in autumn. The whole academy comes to stare. Nimue says "Show-off," and is clearly delighted.`, fx:{mag:2, fame:1}, go:'war'},
          lose:{t:`The ash tree drops every leaf at once, then most of its bark. Nimue laughs until she has to sit up.`, fx:{hp:-7, mag:1, rel:{nimue:1}}, go:'war'}},
        {label:`Ask her to show you first.`, t:`She sighs, lifts a hand, and the air hums a chord older than the kingdom. Then she's asleep again. You think about that chord for a week.`, fx:{mag:1, wit:1}, go:'war'}
      ]},
    war:{ scene:'night', text:`Weeks later, a lesson runs past dusk. Nimue is half asleep, talking to the stars more than to you.\n\n"The books say the demons came south to conquer," she murmurs. "I was there. They came south *hungry*. We had full granaries, and we..."\n\nHer voice stops. She pulls her hood over her face. "Mm. I'm asleep. Go away."`,
      choices:[
        {label:`"Please. Tell me the rest."`, check:{stat:'cha', dc:15},
          win:{t:`She's quiet so long you think she's really asleep. Then she pushes back the hood.`, fx:{rel:{nimue:1}}, go:'truth'},
          lose:{t:`Real snoring, this time. Whatever she was going to say, she has put it back wherever she keeps it.`, fx:{wit:1}, go:'quiet'}},
        {label:`Tuck your coat over her. Let her sleep.`, t:`You drape your coat over her and sit with her until all the stars are out. In the morning it's folded on your desk, a candied plum on top.`, fx:{rel:{nimue:3}}, go:'quiet'},
        {label:`"The northern famine. I already know."`, show:s=>!!s.flags.lore,
          t:`Nimue's eyes open fully, for the first time since you've known her. "Who told you?" Then, very quietly: "Good. Someone should know."`, fx:{rel:{nimue:2}}, go:'truth'}
      ]},
    truth:{ scene:'night', text:`"Three winters without a harvest in the north," Nimue says. "Their envoys came to Asterhold to beg. The old king sent them home with nothing, and called what came after an *invasion*."\n\nShe plucks at the grass. "I carried a sword in that war. I was proud of it for a hundred years. Then I went north, after. I saw the graves."`,
      choices:[
        {label:`Promise to remember what really happened.`, t:`"Remembering is easy," she says. "Doing something different next time: that's the hard part." She falls asleep on your shoulder.`, fx:{flag:'lore', wit:2, rel:{nimue:1}}, log:'Nimue told you the truth about the Demon War.'},
        {label:`"Is it going to happen again?"`, t:`She looks north for a long time. "It never ended," she says. "It's only been sleeping." It's the first time she has ever sounded awake.`, fx:{flag:'lore', mag:1, wit:1}, log:'Nimue told you the truth about the Demon War.'},
        {label:`Hold her hand. Say nothing.`, t:`Her hand is cool, and very old, and very small. "Eight hundred years," she murmurs, "and I've never told a student."`, fx:{flag:'lore', rel:{nimue:3}}, log:'Held Nimue\'s hand while she told you about the war.'}
      ]},
    quiet:{ scene:'library', text:`Nimue sleeps. Her spellbook lies open beside her, older than the academy, its margins crowded with tiny elvish notes in faded ink.\n\nThe page under her hand is a ward against frost. In the margin someone, long ago, has drawn a small careful sketch: a sheaf of wheat, and a crown, crossed out.`,
      choices:[
        {label:`Puzzle out the margin notes.`, check:{stat:'wit', dc:14, race:{elf:4}},
          win:{t:`The script is archaic, but you work it out: *They asked for grain. We gave them war.* Your hands are cold for the rest of the night.`, fx:{wit:2, flag:'lore'}, log:'Read the truth of the Demon War in Nimue\'s margins.'},
          lose:{t:`The elvish is eight centuries too old for you. You copy the shapes anyway, to ask about someday.`, fx:{wit:1}}},
        {label:`Practice the frost ward beside her.`, t:`By midnight you can hold the ward for a full minute. Nimue, still asleep, gives you a thumbs-up.`, fx:{mag:2, rel:{nimue:1}}},
