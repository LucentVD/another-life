<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0915">
<title>Card Combat Lab · Another Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jersey+10&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--night:#0b0915;--win-a:#241e3c;--win-b:#130f22;--raise:#2d2648;--frame:#cfa552;--frame-hi:#f6dc94;--frame-lo:#7a5a24;--edge:#07050d;--line:#4a3f68;--ink:#f4ead4;--soft:#d6cab0;--muted:#9a8fab;--sakura:#ff8fb6;--gold:#f2cd6e;--teal:#66dccb;--good:#7ee8a0;--bad:#ff7d72;--poison:#a8e05f;
  --display:'Jersey 10',var(--pixel);--label:'Silkscreen',var(--pixel);--pixel:'DotGothic16','MS Gothic',ui-monospace,monospace;
  --rc:#b9b0c8;--ru:#66dccb;--rr:#f2cd6e;--rl:#ff8fb6;color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,#1d1636 0%,var(--night) 60%);color:var(--ink);font-family:var(--pixel);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;touch-action:manipulation}
img{image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:none;padding:0}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100dvh}
.muted{color:var(--muted)} .small{font-size:12.5px;line-height:1.55} .gold{color:var(--gold)} .teal{color:var(--teal)} .center{text-align:center}
.up{color:var(--good)} .dn{color:var(--bad)}
.win{position:relative;background:linear-gradient(180deg,var(--win-a),var(--win-b));border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame),inset 0 0 0 4px var(--edge),0 4px 0 rgba(0,0,0,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;font-family:var(--label);font-size:12px;letter-spacing:.04em;background:var(--raise);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame-lo),0 3px 0 rgba(0,0,0,.45);color:var(--ink)}
.btn small{font-family:var(--pixel);font-size:11px;color:var(--soft);letter-spacing:0}
.btn.primary{background:linear-gradient(#f6dc94,#cfa552);color:#2a1a08;box-shadow:inset 0 0 0 2px #fff3c4,0 3px 0 rgba(0,0,0,.45)}
.btn.primary small{color:#5a3d12}
.btn.primary:disabled{filter:grayscale(.8) brightness(.6)}
.btn.ghost{background:rgba(45,38,72,.7)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:4px 10px}
.btn.on{color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal),0 3px 0 rgba(0,0,0,.45)}
.btn.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px #fff3c4,0 0 18px rgba(242,205,110,.55),0 3px 0 rgba(0,0,0,.45)}}
.row{padding:0 12px;margin:10px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.eyebrow{font-family:var(--label);font-size:11px;letter-spacing:.12em;color:var(--frame);margin:2px 0 8px;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:5px;background:var(--sakura);color:#2a0a18;font-size:11px;font-style:normal;font-family:var(--label);border:2px solid var(--edge)}
/* top bar */
.screen{display:flex;flex-direction:column;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 12px)}
.topbar{margin:0 10px 8px;padding:8px 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{padding:7px 4px;font-family:var(--label);font-size:12px;color:var(--soft);background:rgba(7,5,13,.5);border:2px solid var(--line)}
.tabs button.on{color:var(--gold);border-color:var(--frame)}
.plvl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.plvl span{font-family:var(--label);font-size:11px;color:var(--gold);white-space:nowrap}
.plvl small{color:var(--muted);font-size:11px;white-space:nowrap}
.xpbar{flex:1;height:8px;background:var(--edge);border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#a8f5ea);transition:width .5s}
.body{padding:0 10px}
.panel{padding:14px;margin-bottom:10px}
/* party chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.chip{position:relative;display:flex;align-items:center;gap:6px;padding:5px;background:rgba(7,5,13,.55);border:2px solid var(--line);text-align:left;font-size:13px;line-height:1.2}
.chip small{display:block;font-size:10.5px;color:var(--muted)}
.chip.on{border-color:var(--teal);background:rgba(102,220,203,.08)}
.chip .badge{position:absolute;top:-8px;right:-6px;margin:0}
.chip-art{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--edge);border:1px solid var(--line)}
/* the character card */
.cardwrap{display:flex;justify-content:center}
.ccard{width:min(100%,370px);background:linear-gradient(180deg,#2a2244,#15102a);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--frame),inset 0 0 0 5px var(--edge),0 6px 0 rgba(0,0,0,.5),0 0 30px rgba(242,205,110,.08);padding:9px;display:flex;flex-direction:column;gap:7px}
.ccard.flash{animation:cflash 1.2s ease-out}
@keyframes cflash{0%{box-shadow:inset 0 0 0 3px #fff3c4,inset 0 0 0 5px var(--edge),0 0 40px rgba(242,205,110,.9)}100%{}}
.cc-top{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px;background:rgba(7,5,13,.55);border:2px solid var(--frame-lo)}
.cc-name{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold)}
.cc-lv{font-family:var(--label);font-size:11px;color:var(--teal)}
.cc-art{height:clamp(150px,26vh,210px);display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:linear-gradient(#3a2e5c,#1b1533);border:2px solid var(--frame-lo)}
.cc-art img{flex:none;max-width:none}
.cc-type{font-size:12px;color:var(--soft);padding:0 4px}
.cc-type span{color:var(--muted)}
.cc-text{background:rgba(244,234,212,.06);border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:5px;max-height:34vh;overflow-y:auto}
.cc-trait{font-size:11.5px;color:var(--muted);font-style:italic;border-top:1px dashed var(--line);padding-top:5px}
.abl{display:flex;gap:7px;font-size:12.5px;line-height:1.45}
.abl b{color:var(--ink)}
.abl .lv{font-style:normal;font-family:var(--label);font-size:10px;color:var(--gold);margin-left:2px}
.abl .abt{display:block;color:var(--soft)}
.abl .abg{flex:none;width:16px;text-align:center;color:var(--frame)}
.abl.k-spell .abg,.abl.k-spell b{color:var(--teal)}
.abl.k-trig .abg{color:var(--sakura)}
.abl .cd{margin-left:6px;font-family:var(--label);font-size:9.5px;color:var(--teal);border:1px solid rgba(102,220,203,.5);padding:0 3px}
.abl.new{animation:newline 1.6s ease-out;background:rgba(242,205,110,.12);outline:1px solid rgba(242,205,110,.5)}
@keyframes newline{0%{background:rgba(242,205,110,.5)}}
.cc-stats{display:flex;align-items:center;justify-content:space-between;gap:6px}
.gem{position:relative;display:flex;align-items:center;gap:5px;padding:2px 10px 2px 8px;min-width:76px;background:var(--edge);border:2px solid var(--frame)}
.gem i{font-style:normal;font-size:16px}
.gem b{font-family:var(--display);font-size:32px;line-height:1}
.gem.atk i,.gem.atk b{color:#ffb38a} .gem.res i,.gem.res b{color:#9fd8ff}
.gem.res{justify-content:flex-end}
.gem em{position:absolute;top:-16px;right:4px;font-style:normal;font-family:var(--display);font-size:22px;animation:rise 1.6s ease-out forwards}
.gem.pop{animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.pips{flex:1;display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.pips i{width:7px;height:9px;border:1px solid var(--edge)}
.r-c{--r:var(--rc)} .r-u{--r:var(--ru)} .r-r{--r:var(--rr)} .r-l{--r:var(--rl)}
.pips i{background:var(--r)}
details.sandbox{margin:14px 2px;padding:8px 10px;border:2px dashed var(--line)}
details.sandbox summary{font-family:var(--label);font-size:11px;color:var(--muted);cursor:pointer}
/* overlays */
#layer:empty{display:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,3,12,.86);display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.sheet{width:min(100%,420px);padding:14px;display:flex;flex-direction:column;gap:8px}
.sh-head{display:flex;align-items:center;gap:8px;font-size:17px}
.sh-head .x{margin-left:auto;width:32px;height:32px;border:2px solid var(--line)}
.sh-stats{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--soft)}
/* packs */
.pack-ov{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 14px)}
.pack-stage{width:min(100%,440px);display:flex;flex-direction:column;align-items:stretch;gap:10px}
.pack{align-self:center;margin-top:12vh;width:200px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(45deg,#3d2a63 0 10px,#33235a 10px 20px);border:4px solid var(--edge);box-shadow:inset 0 0 0 4px var(--frame),inset 0 0 0 7px var(--edge),0 0 40px rgba(242,205,110,.25),0 8px 0 rgba(0,0,0,.5);animation:hover 2.4s ease-in-out infinite}
.pack .pk-top{font-size:46px;color:var(--gold);line-height:1;text-shadow:0 0 12px rgba(242,205,110,.7)}
.pack .pk-name{font-family:var(--display);font-size:28px;color:var(--ink)}
.pack .pk-sub{font-size:12px;color:var(--soft)}
.pack .pk-tap{margin-top:14px;font-family:var(--label);font-size:11px;color:var(--teal);animation:blink 1.2s steps(2) infinite}
.pack.burst{animation:burst .5s ease-in forwards}
@keyframes hover{50%{transform:translateY(-6px) rotate(-1deg)}}
@keyframes burst{30%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.5);opacity:0;filter:brightness(3)}}
@keyframes blink{50%{opacity:.3}}
.pk-head{text-align:center;font-size:14px;color:var(--soft)}
.pk-head b{color:var(--gold)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid.n3 .pcard:last-child{grid-column:1/3;justify-self:center;width:calc(50% - 4px)}
.pcard{position:relative;min-height:236px;perspective:900px;text-align:left;transition:transform .25s,opacity .25s}
.pcard .pc-back,.pcard .pc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.pcard .pc-back{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#3d2a63 0 8px,#33235a 8px 16px);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px var(--frame-lo);font-size:30px;color:var(--frame)}
.pcard .pc-face{transform:rotateY(180deg);display:flex;flex-direction:column;gap:4px;padding:8px;background:linear-gradient(180deg,#2a2244,#15102a);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--r),inset 0 0 0 4px var(--edge)}
.pcard.flip .pc-back{transform:rotateY(-180deg)}
.pcard.flip .pc-face{transform:rotateY(0)}
.pcard.r-l .pc-face{animation:legend 2.2s linear infinite}
@keyframes legend{50%{box-shadow:inset 0 0 0 2px #ffd1e3,inset 0 0 0 4px var(--edge),0 0 18px rgba(255,143,182,.6)}}
.pcard.sel{transform:translateY(-6px)}
.pcard.sel .pc-face{box-shadow:inset 0 0 0 2px var(--r),inset 0 0 0 4px var(--edge),0 0 0 3px var(--gold),0 0 22px rgba(242,205,110,.6)}
.pcard.dim{opacity:.55}
.pcard.absorbing{animation:absorb .52s ease-in forwards;z-index:3}
@keyframes absorb{40%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(160px) scale(.2);opacity:0;filter:brightness(2.5)}}
.pc-rar{font-family:var(--label);font-size:9.5px;letter-spacing:.08em;color:var(--r)}
.pc-name{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
.pc-art{display:flex;align-items:center;justify-content:center;height:44px;font-size:30px;color:var(--r);background:rgba(7,5,13,.5);border:1px solid var(--line)}
.pc-stats{display:flex;gap:6px;flex-wrap:wrap}
.pd{font-family:var(--label);font-size:11px;padding:1px 4px;border:1px solid currentColor}
.pd.a.up{color:#ffb38a} .pd.r.up{color:#9fd8ff} .pd.zero{color:var(--muted)}
.pc-ab{font-size:11.5px;line-height:1.4;color:var(--soft)}
.pc-ab b{display:block;color:var(--teal);font-size:12.5px}
.pc-ab .stack{display:block;font-size:10.5px;color:var(--gold)}
.pc-ab .kindtag{display:block;font-size:10px;color:var(--muted)}
.pc-ab .abt{display:block;margin-top:2px}
.pc-flav{margin-top:auto;font-size:10.5px;color:var(--muted);font-style:italic}
.pk-preview{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:24px;font-size:14px}
/* fight menu */
.stepper{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;align-items:center;text-align:center;margin-bottom:10px}
.stepper b{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold)}
.stepper small{display:block;font-size:11.5px;color:var(--muted)}
.panel .btn+.btn{margin-top:8px}
.party-mini{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pm{display:flex;gap:8px;align-items:center;padding:6px;background:rgba(7,5,13,.5);border:2px solid var(--line)}
.pm small{color:var(--muted)}
/* combat */
.combat{gap:8px;padding-left:8px;padding-right:8px}
.cbar{display:flex;align-items:center;gap:8px}
.ctitle{flex:1;text-align:center;font-family:var(--label);font-size:12px;color:var(--gold)}
.row-e,.row-p{display:flex;justify-content:center;gap:6px}
.row-e .mc,.row-p .mc{flex:0 1 calc((100% - 12px)/3);min-width:0}
.mc{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:5px;min-height:150px;background:linear-gradient(180deg,#2a2244,#15102a);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--frame-lo);text-align:left;transition:transform .18s,opacity .3s,filter .3s}
.mc.s-e{box-shadow:inset 0 0 0 2px #7a3a4a}
.mc.boss{box-shadow:inset 0 0 0 2px var(--sakura),0 0 16px rgba(255,143,182,.3)}
.mc-art{height:clamp(62px,9.5vh,100px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(7,5,13,.55);border:1px solid var(--line)}
.mc-art img{flex:none;max-width:none}
.glyph{font-size:36px;line-height:1;color:#ff9a8a;text-shadow:0 0 10px rgba(255,90,90,.35)}
.boss .glyph{color:var(--sakura);font-size:42px}
.mc-name{font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-stats{display:flex;justify-content:space-between;font-family:var(--display);font-size:21px;line-height:1}
.mc-stats .a{color:#ffb38a} .mc-stats .r{color:#9fd8ff} .mc-stats small{font-size:14px;color:var(--muted)}
.hpbar{height:6px;background:var(--edge);border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .35s}
.hpbar i.low{background:var(--bad)}
.mc-st{display:flex;gap:4px;flex-wrap:wrap;min-height:14px;font-size:11px;line-height:1.2}
.mc-st i{font-style:normal}
.s-g{color:var(--gold)} .s-w{color:#9fd8ff} .s-a{color:var(--soft)} .s-p{color:var(--poison)}
.mc.dead{opacity:.28;filter:grayscale(1)}
.mc.done{opacity:.6}
.mc.actor{box-shadow:inset 0 0 0 2px var(--teal),0 0 0 2px var(--teal),0 0 16px rgba(102,220,203,.45);transform:translateY(-4px);opacity:1}
.mc.tgt{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px var(--gold);animation:tgt 1s ease-in-out infinite}
@keyframes tgt{50%{box-shadow:inset 0 0 0 2px #fff3c4,0 0 0 2px var(--gold),0 0 18px rgba(242,205,110,.6)}}
.mc.lunge-up{animation:lungeup .32s ease-out}
.mc.lunge-dn{animation:lungedn .32s ease-out}
.mc.hit{animation:hit .3s ease-out}
.mc.casting{animation:cast .5s ease-out}
@keyframes lungeup{40%{transform:translateY(-16px)}}
@keyframes lungedn{40%{transform:translateY(16px)}}
@keyframes hit{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes cast{40%{filter:brightness(1.8) drop-shadow(0 0 8px var(--teal))}}
.clog{min-height:58px;flex:1 1 auto;padding:4px 6px;font-size:12px;line-height:1.5;color:var(--soft);display:flex;flex-direction:column;justify-content:flex-end}
.clog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clog div:not(:last-child){opacity:.55}
.clog .good{color:var(--good)} .clog .bad{color:var(--bad)} .clog .gold{color:var(--gold)} .clog .spell{color:var(--teal)}
.actbar{padding:8px;margin-top:auto;min-height:118px}
.ab-head{font-size:13px;margin-bottom:6px}
.ab-head b{color:var(--teal)}
.ab-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{display:flex;flex-direction:column;align-items:flex-start;padding:6px 8px;min-height:44px;font-size:13px;line-height:1.25;text-align:left;background:var(--raise);border:2px solid var(--line)}
.act small{font-size:10.5px;color:var(--muted)}
.act.on{border-color:var(--gold);color:var(--gold)}
.act.sp{color:var(--teal)}
.act.sp.on{border-color:var(--teal);background:rgba(102,220,203,.12)}
.act:disabled{opacity:.4}
.act.ghost{background:rgba(7,5,13,.5);color:var(--soft)}
.waiting{display:flex;align-items:center;justify-content:center;height:100px;color:var(--muted);font-size:13px;text-align:center}
.float{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,0);font-family:var(--display);font-size:24px;line-height:1;text-shadow:0 2px 0 #000,0 0 6px #000;animation:float 1.1s ease-out forwards;white-space:nowrap}
.f-dmg{color:#ff6b5e} .f-heal{color:var(--good)} .f-ward{color:#9fd8ff} .f-buff{color:var(--gold)} .f-poison{color:var(--poison)} .f-spell{color:var(--teal);font-size:18px}
@keyframes float{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px)}}
/* results */
.result{width:min(100%,340px);padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px}
.res-big{font-family:var(--display);font-size:56px;line-height:1;color:var(--gold)}
.lost .res-big{color:var(--bad)}
.lvlup{color:var(--teal);font-size:14px}
/* lab */
.lres{text-align:center;margin-top:10px}
.bigpct{font-family:var(--display);font-size:52px;line-height:1}
.bigpct.good{color:var(--good)} .bigpct.mid{color:var(--gold)} .bigpct.bad{color:var(--bad)}
.mat{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;text-align:center}
.mat th{font-family:var(--label);font-size:9px;color:var(--muted);font-weight:normal;padding:3px 1px}
.mat td{padding:4px 1px;border:1px solid var(--edge)}
.mat td:first-child{color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.seg button{padding:5px 8px;font-size:11.5px;border:2px solid var(--line);background:rgba(7,5,13,.5)}
.seg button.on{border-color:var(--teal);color:var(--teal)}
.libc{padding:6px 8px;margin-bottom:5px;border-left:4px solid var(--r);background:rgba(7,5,13,.45)}
.libc b{font-size:13.5px}
.lib-st{float:right;font-size:12px;color:var(--soft)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
